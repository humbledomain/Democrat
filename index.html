              stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 30 30)"/>
          </svg>
          <div><b>${done} of ${links.length}</b><small>steps done</small></div>
        </div>
        <button class="mini-btn" id="bShare" style="align-self:flex-start">Share this checklist</button>
      </div>
      ${st?`<div class="card"><h5>${stateName(st)}</h5>
        <a class="mini-btn" style="text-align:left;text-decoration:none;display:block"
           href="https://www.vote.org/state/${stateSlug(st)}/" target="_blank" rel="noopener">Deadlines, ID rules and forms</a>
        <a class="mini-btn" style="text-align:left;text-decoration:none;display:block"
           href="https://www.vote.org/election-reminders/" target="_blank" rel="noopener">Get election reminders</a>
      </div>`:''}
    </aside></div>`;
  },
  init(){
    if($('bShare')) $('bShare').onclick = ()=>{
      const st=myState();
      share(st ? `Register, check your registration and see what is on your ballot in ${stateName(st)}:`
               : 'Register, check your registration, find your polling place:');
    };
    if($('bExplain')) $('bExplain').onclick = ()=>{
      const t=$('bText').value.trim();
      if(t.length<40) return toast('Paste the measure text first');
      suggest('bAi',$('bExplain'),'measure',t,{note:'AI reading of the text you pasted. Verify before you vote.'});
    };
    if(RO || GUEST()) return;
    const put = patch => mutate({
      local:db=>Object.assign(db.profile.ballot,patch),
      remote:async()=>(await sb.from('profiles').update({ballot:Object.assign({},V.ballot,patch)}).eq('id',ME.id)).error });
    $('bDate').onchange = e => put({date:e.target.value});
    document.querySelectorAll('[data-chk]').forEach(b=>b.onclick=()=>put({[b.dataset.chk]: !((V.ballot||{})[b.dataset.chk])}));
  }
};

/* -------------------------------------------------------------------- polls */
S.polls = {
  sub(){ return RO ? `Questions from @${V.handle}` : 'Ask, then listen' },
  acts(){ return tabs('polls',[['all','Everyone'],['mine','Yours']]) },
  view(){
    const mine = RO || !ONLINE || SC.polls==='mine';
    const {list, note, loading} = scoped('polls', D.polls, G.polls);
    const answered = list.filter(p=>p.voted).length;
    const busiest = [...list].sort((a,b)=>(b.total||0)-(a.total||0)).slice(0,3).filter(p=>p.total);

    return `<div class="split"><div class="main">
      ${note?`<p class="meta">${note}</p>`:''}
      ${loading ? '<div class="spin"></div>' : list.length? list.map(p=>{
        const opts=p.poll_options||[];
        return `<div class="item" data-poll="${p.id}" style="display:block">
          ${!mine && p.profiles ? who(p.profiles) : ''}
          <h3>${esc(p.question)}</h3>
          <small>${p.total||0} vote${p.total===1?'':'s'}${p.voted?'':' · tap to vote'}</small>
          <div style="margin-top:10px">${opts.map(o=>`
            <div style="margin-bottom:9px">
              <button class="opt${p.voted===o.id?' on':''}" data-opt="${o.id}">
                <span>${esc(o.text)}</span>${p.voted?`<b>${p.total?Math.round(o.v/p.total*100):0}%</b>`:''}</button>
              <div class="bar"><i style="width:${p.total&&p.voted?o.v/p.total*100:0}%"></i></div>
            </div>`).join('')}</div>
          <div class="rowacts">${act('share','Share')}${(mine&&!RO)?act('del'):''}</div>
        </div>`}).join('')
        :`<div class="empty"><b>No questions yet</b>${mine?'One good question travels further than ten posts.':'Nobody has asked anything yet.'}</div>`}
    </div>
    <aside class="side">
      ${GUEST() ? joinBar('Sign in to ask a question or vote.') : ''}
      ${(RO||GUEST())?'':`<div class="card">
        <h5>Ask a question</h5>
        <input class="inp" id="pQ" placeholder="Your question">
        <div class="ai" id="pAi" hidden></div>
        <input class="inp" id="pA" placeholder="Option 1">
        <input class="inp" id="pB" placeholder="Option 2">
        <input class="inp" id="pC" placeholder="Option 3 (optional)">
        <input class="inp" id="pD" placeholder="Option 4 (optional)">
        <div class="row">
          <button class="linkbtn" id="pCheck" hidden>Check my wording</button>
          <button class="btn" id="pAdd" style="margin-left:auto">Post</button>
        </div>
      </div>`}
      ${busiest.length?`<div class="card"><h5>Most answered</h5>
        ${busiest.map(p=>`<div class="row"><span style="flex:1">${esc(p.question)}</span><b>${p.total}</b></div>`).join('')}
      </div>`:''}
      ${!RO&&list.length?`<div class="card"><h5>You</h5>
        <div class="row"><span>Answered</span><b>${answered} of ${list.length}</b></div>
        <div class="row"><span>Asked</span><b>${D.polls.length}</b></div>
      </div>`:''}
    </aside></div>`;
  },
  init(){
    wireTabs();
    const {list} = scoped('polls', D.polls, G.polls);
    if(!RO && !GUEST()){
      const Q=$('pQ'), chk=$('pCheck');
      Q.oninput=()=>{ chk.hidden = Q.value.trim().length<12 };
      chk.onclick=()=>suggest('pAi',chk,'neutral',Q.value,{apply:o=>{Q.value=o}});
      $('pAdd').onclick=async ()=>{
        const q=Q.value.trim();
        const opts=[$('pA'),$('pB'),$('pC'),$('pD')].map(el=>el.value.trim()).filter(Boolean);
        if(!q||opts.length<2) return toast('Add a question and at least two options');
        if(!await needAuth()) return;
        mutate({
          local:db=>db.polls.unshift({id:uid(),question:q,total:0,voted:null,
            poll_options:opts.map((t,i)=>({id:uid(),text:t,v:0,ord:i}))}),
          remote:async()=>{
            const ins=await sb.from('polls').insert({author:ME.id,question:q}).select().single();
            if(ins.error) return ins.error;
            return (await sb.from('poll_options').insert(opts.map((t,i)=>({poll_id:ins.data.id,text:t,ord:i})))).error;
          }, clears:['polls'] });
      };
    }
    document.querySelectorAll('[data-poll]').forEach(el=>{
      const p=list.find(x=>x.id===el.dataset.poll); if(!p) return;
      el.addEventListener('click', async e=>{
        const o=e.target.closest('[data-opt]'), b=e.target.closest('[data-act]');
        if(b && b.dataset.act==='share') return share(p.question, p.profiles && p.profiles.handle);
        if(b && b.dataset.act==='del') return mutate({ local:db=>db.polls=db.polls.filter(x=>x.id!==p.id),
          remote:async()=>(await sb.from('polls').delete().eq('id',p.id)).error, clears:['polls'] });
        if(o && !p.voted){
          if(!await needAuth()) return;
          const oid=o.dataset.opt;
          mutate({ local:db=>{ const q=db.polls.find(x=>x.id===p.id);
              q.poll_options.find(x=>x.id===oid).v++; q.total=(q.total||0)+1; q.voted=oid },
            remote:async()=>(await sb.from('poll_votes').insert({poll_id:p.id,option_id:oid,user_id:ME.id})).error,
            clears:['polls'] });
        }
      });
    });
  }
};

/* ---------------------------------------------------------------- fundraise */
S.fundraise = {
  sub(){ return RO ? `What @${V.handle} is raising for` : 'Put money behind it' },
  view(){
    const gifts = [...D.gifts].sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
    const raised = gifts.reduce((s,g)=>s+Number(g.amount),0),
          goal = Number(V&&V.goal||0), pct = goal?Math.min(100,raised/goal*100):0,
          link = (V&&V.donate_link||'').trim(),
          href = link && !/^https?:/i.test(link) ? 'https://'+link : link,
          avg = gifts.length ? raised/gifts.length : 0;
    if(GUEST()) return `<div class="screen">${joinBar('Sign in to track what you give and set a goal.')}</div>`;
    if(RO) return `<div class="screen">${href
      ? `<a class="btn" style="text-align:center;padding:14px;max-width:320px" href="${esc(href)}" target="_blank" rel="noopener">Chip in</a>
         <p class="hint" style="text-align:left">Goes to a page @${esc(V.handle)} chose. Check it before you give.</p>`
      : `<div class="empty"><b>No link yet</b>@${esc(V.handle)} is not collecting anything.</div>`}</div>`;

    return `<div class="split"><div class="main">
      <div class="stats">
        <div><b>${money(raised)}</b><span>Given</span></div>
        <div><b>${gifts.length}</b><span>Gifts</span></div>
        <div><b>${money(avg)}</b><span>Average</span></div>
        <div><b>${goal?Math.round(pct)+'%':'—'}</b><span>Of goal</span></div>
      </div>
      ${goal?`<div><div class="bar" style="height:10px"><i style="width:${pct}%"></i></div>
        <div class="legend"><span>${money(raised)} given</span><span>${money(goal)} goal</span></div></div>`:''}
      ${gifts.length?`<div><div class="sect">What you have given</div>
        ${gifts.slice(0,20).map(g=>`<div class="gift"><span>${g.created_at?ago(g.created_at):'logged'}</span>
          <b>${money(g.amount)}</b></div>`).join('')}</div>`
        :`<div class="empty"><b>Nothing logged yet</b>Keep your own record of what you gave and to whom.</div>`}
    </div>
    <aside class="side">
      <div class="card"><h5>Log a gift</h5>
        <div class="frow"><input class="inp" id="fGift" type="number" min="1" placeholder="Amount">
          <button class="btn" id="fAdd">Add</button></div>
        <span class="ainote">Private to you. Nobody else can see this.</span>
      </div>
      <div class="card"><h5>Your goal for the year</h5>
        <input class="inp" id="fGoal" type="number" min="0" placeholder="0" value="${goal||''}" style="max-width:none">
      </div>
      <div class="card"><h5>Where others can give</h5>
        <input class="inp" id="fLink" placeholder="Paste a link" value="${esc(V&&V.donate_link)}" style="max-width:none">
        <button class="mini-btn" id="fShare" style="align-self:flex-start">Share it</button>
        <span class="ainote">This one is public, on your page.</span>
      </div>
    </aside></div>`;
  },
  init(){
    if(RO || GUEST()) return;
    let t;
    const put = patch => { clearTimeout(t); t=setTimeout(()=>{
      if(!ONLINE){ const db=localDB(); Object.assign(db.profile,patch); localSave(db); Object.assign(V,patch) }
      else sb.from('profiles').update(patch).eq('id',ME.id)
        .then(({error})=>{ error?toast(friendly(error)):Object.assign(V,patch) });
    },500) };
    $('fGoal').oninput = e=>put({goal:Number(e.target.value)||0});
    $('fLink').oninput = e=>put({donate_link:e.target.value.trim()});
    $('fAdd').onclick = async ()=>{
      const amount=Number($('fGift').value); if(!amount) return;
      if(!await needAuth()) return;
      mutate({ local:db=>db.gifts.push({id:uid(),amount,created_at:new Date().toISOString()}),
        remote:async()=>(await sb.from('gifts').insert({author:ME.id,amount})).error });
    };
    $('fShare').onclick = ()=>share(V.donate_link || 'Chip in:');
  }
};

/* -------------------------------------------------------------------- reach */
S.reach = {
  sub(){ return RO ? `@${V.handle} in numbers` : 'What is actually working' },
  view(){
    if(GUEST()) return `<div class="screen">${joinBar('Sign in to see how far your posts travel.')}</div>`;
    const likes = D.posts.reduce((s,p)=>s+(p.likes||0),0),
          votes = D.polls.reduce((s,p)=>s+(p.total||0),0),
          going = D.events.reduce((s,e)=>s+(e.going||0),0),
          top   = [...D.posts].sort((a,b)=>(b.likes||0)-(a.likes||0))[0],
          poll  = [...D.polls].sort((a,b)=>(b.total||0)-(a.total||0))[0];

    /* real activity: your posts per day over the last fortnight */
    const days = [...Array(14)].map((_,i)=>{
      const d = new Date(); d.setDate(d.getDate()-(13-i));
      const iso = d.toISOString().slice(0,10);
      return {iso, n: D.posts.filter(p=>(p.created_at||'').slice(0,10)===iso).length,
              label: d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
    });
    const peak = Math.max(1, ...days.map(d=>d.n));
    const nothing = !D.posts.length && !D.polls.length && !D.events.length;

    return `<div class="split"><div class="main">
      <div class="stats">
        <div><b>${D.shares}</b><span>Shares</span></div>
        <div><b>${D.followers}</b><span>Followers</span></div>
        <div><b>${likes}</b><span>Likes</span></div>
        <div><b>${votes}</b><span>Votes cast</span></div>
      </div>
      <div class="card">
        <h5>Your posting, last 14 days</h5>
        <div class="spark">${days.map(d=>`<i class="${d.n?'on':''}" style="height:${d.n/peak*100}%" title="${d.label}: ${d.n}"></i>`).join('')}</div>
        <div class="legend"><span>${days[0].label}</span><span>${D.posts.filter(p=>(p.created_at||'')>=days[0].iso).length} posts</span><span>${days[13].label}</span></div>
      </div>
      ${nothing?`<div class="empty"><b>Nothing to measure yet</b>Post something, then come back.</div>`:`
        ${top&&top.likes?`<div class="item"><div class="grow"><small>Most liked post</small><p>${esc(top.text)}</p>
          <div class="rowacts"><span class="iconbtn" style="pointer-events:none">${top.likes} likes</span></div></div></div>`:''}
        ${poll&&poll.total?`<div class="item"><div class="grow"><small>Most answered question</small><p>${esc(poll.question)}</p>
          <div class="rowacts"><span class="iconbtn" style="pointer-events:none">${poll.total} votes</span></div></div></div>`:''}`}
    </div>
    <aside class="side">
      <div class="card"><h5>What you have built</h5>
        <div class="row"><span>Posts</span><b>${D.posts.length}</b></div>
        <div class="row"><span>Positions</span><b>${D.issues.length}</b></div>
        <div class="row"><span>Questions asked</span><b>${D.polls.length}</b></div>
        <div class="row"><span>Events</span><b>${D.events.length}</b></div>
        <div class="row"><span>RSVPs received</span><b>${going}</b></div>
      </div>
      ${!RO?`<div class="card"><h5>Reach further</h5>
        <button class="mini-btn" id="rShare" style="text-align:left">Share your page</button>
        <button class="mini-btn" data-go="polls" style="text-align:left">Ask a question</button>
        <button class="mini-btn" data-go="issues" style="text-align:left">Take a position</button>
        <span class="ainote">Shares are counted whether or not the person signs up.</span>
      </div>`:''}
    </aside></div>`;
  },
  init(){
    const r=$('rShare');
    if(r) r.onclick=()=>share(V.name?`${V.name} on democrat.ai`:'democrat.ai');
  }
};

/* wire the action buttons inside any list */
function rows(list, fn){
  document.querySelectorAll('[data-id]').forEach(el=>{
    const item = (list||[]).find(x=>String(x.id)===el.dataset.id); if(!item) return;
    el.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) fn(item,b.dataset.act,b) });
  });
}

/* -------------------------------------------------------------------- shell */
const rail = $('rail'), panel = $('panel');

let railPainted = false;
function renderRail(){
  rail.innerHTML = APPS.map((a,i)=>{
    const n = a.id==='feed' ? D.posts.length : a.id==='endorsed' ? DMUNREAD : 0;
    return `<button class="app${a.id===current?' on':''}" data-id="${a.id}" style="animation-delay:${(i*.045+.05).toFixed(2)}s">
      <span class="tile">${icon(a)}${n?`<span class="badge">${n}</span>`:''}</span>
      <span class="label">${a.name}</span></button>`;
  }).join('');
  if(railPainted) rail.classList.add('settled');
  railPainted = true;
}
function render(){ renderRail(); if(current) open_(current, true); }

function open_(id, quiet){
  const a = APPS.find(x=>x.id===id), s = S[id]; if(!a||!s) return;
  const first = current!==id;
  current = id;
  delete panel.dataset.edit;
  document.querySelectorAll('.app').forEach(el=>el.classList.toggle('on', el.dataset.id===id));
  const sub = typeof s.sub==='function' ? s.sub() : s.sub;
  panel.innerHTML = `<header class="phead">
      <span class="hicon">${icon(a)}</span>
      <div class="grow">${s.head?s.head():`<h2>${a.name}</h2><p>${sub}</p>`}</div>
      <div class="acts">${s.acts?s.acts():''}<button class="pclose" id="pclose">&#10005;</button></div>
    </header>
    <div class="pbody">${s.view()}</div>`;
  if(id==='compose') panel.querySelector('.pbody').classList.add('chatbody');
  if(s.init) s.init();
  document.body.classList.add('open');
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open_(b.dataset.go));
  $('pclose').onclick = ()=>{ document.body.classList.remove('open'); current='';
    document.querySelectorAll('.app').forEach(x=>x.classList.remove('on')) };
  if(!quiet) renderRail();

  /* fill in everyone's content the first time a social screen opens */
  if(first && ONLINE && !RO){
    const kind = {feed:'posts', polls:'polls', townhall:'events'}[id];
    if(kind && !G[kind]) loadGlobal(kind).then(()=>{ if(current===id) open_(id,true) });
  }
}

rail.addEventListener('click', e=>{
  const b = e.target.closest('.app'); if(!b) return;
  if(b.dataset.id==='profile' && RO){ location.href = '/'; return; }  /* back to your own page */
  open_(b.dataset.id);
});

/* ---------------- live: the database tells us when anything changes -------- */
const TABLE_KIND = {posts:'posts', likes:'posts', comments:'posts', polls:'polls', poll_options:'polls',
                    poll_votes:'polls', events:'events', rsvps:'events', issues:'issues',
                    endorsements:'ends', profiles:null, messages:null};
let liveTimer;
function goLive(){
  if(!ONLINE || !sb.channel) return;
  sb.channel('everything')
    .on('postgres_changes', {event:'*', schema:'public'}, payload => {
      const kind = TABLE_KIND[payload.table];
      if(kind !== undefined) G[kind] = null;
      clearTimeout(liveTimer);
      liveTimer = setTimeout(refreshLive, 500);
    })
    .subscribe();
}
async function refreshLive(){
  const typing = ['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName);
  await load();
  const kind = {feed:'posts', polls:'polls', townhall:'events', issues:'issues', endorsed:'ends'}[current];
  if(kind) await loadGlobal(kind);
  if(!typing) render();              // never yank the page out from under someone mid-sentence
  else renderRail();
}

/* --------------------------------------------------------------------- boot */
(async function boot(){
  renderRail();
  panel.innerHTML = '<div class="spin"></div>';
  if(ONLINE){
    sb.auth.onAuthStateChange(async evt=>{
      if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'){
        chatReset(evt==='SIGNED_OUT');          /* never carry a conversation across accounts */
        Object.keys(G).forEach(k=>G[k]=null);
        MYFOLLOWS = new Set();
        await load(); render();
      }
    });
  } else { const m=$('mode'); m.hidden=false; m.textContent='Local mode'; }
  await load();
  goLive();
  if(ONLINE){
    if(myState()) ['feed','polls','townhall'].forEach(k=>SC[k]='near');   /* People stays on Everyone */
    await loadGlobal('issues');
  }
  render();
})();

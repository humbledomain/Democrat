<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>democrat.ai</title>
<meta name="description" content="A political presence, in one place.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%230a3fd6'/></svg>">
<style>
:root{
  --blue:#0A3FD6; --ink:#0b0d12; --muted:#6b7488;
  --line:rgba(10,32,90,.10); --soft:rgba(10,32,90,.05);
  --tile:clamp(52px,5.6vw,80px); --pad:clamp(20px,3.2vw,44px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);min-height:100svh;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}

.field{position:fixed;inset:0;z-index:0;pointer-events:none;background:#fff}
.rings{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-radial-gradient(circle at center,rgba(10,32,90,0) 0,rgba(10,32,90,.02) 26px,rgba(10,32,90,0) 58px);
  animation:breathe 26s ease-in-out infinite;will-change:transform}
.glow{position:absolute;inset:-25%;background:radial-gradient(38% 38% at 22% 30%,rgba(10,63,214,.05),transparent 70%);
  filter:blur(30px);animation:drift 44s ease-in-out infinite alternate}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 40%,#fff 92%)}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.16) rotate(4deg)}}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0)}100%{transform:translate3d(3%,2%,0) scale(1.08)}}

.mark{position:fixed;z-index:5;top:clamp(20px,3.4vh,38px);left:var(--pad);display:flex;align-items:center;
  gap:clamp(9px,1vw,14px);text-decoration:none;color:inherit}
.dot{width:clamp(13px,1.35vw,19px);aspect-ratio:1;border-radius:50%;background:var(--blue);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,63,214,.26)}70%{box-shadow:0 0 0 22px rgba(10,63,214,0)}100%{box-shadow:0 0 0 0 rgba(10,63,214,0)}}
.word{font-size:clamp(16px,1.7vw,24px);font-weight:590;letter-spacing:-.028em}
.word .tld{color:var(--blue)}

.stage{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:clamp(22px,3vw,52px);padding:clamp(84px,11vh,120px) var(--pad) clamp(28px,4vh,48px)}
.rail{display:grid;grid-template-columns:repeat(2,var(--tile));column-gap:calc(var(--tile)*.45);
  row-gap:calc(var(--tile)*.30);align-content:center;justify-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:calc(var(--tile)*.085);background:none;border:0;
  padding:0;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;
  opacity:0;transform:translateY(12px);animation:pop .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.tile{width:var(--tile);height:var(--tile);display:block;position:relative;
  transition:transform .22s cubic-bezier(.2,.9,.25,1),filter .18s}
.tile svg{width:100%;height:100%;display:block}
.app:hover .tile{transform:scale(1.035)}
.app:active .tile{transform:scale(.90);filter:brightness(.86);transition-duration:.09s}
.app:focus-visible{outline:none}
.app:focus-visible .tile{filter:drop-shadow(0 0 3px rgba(10,63,214,.9))}
.label{font-size:calc(var(--tile)*.175);font-weight:400;color:#1c1c1e;white-space:nowrap;line-height:1.2}
.app.on .label{font-weight:590}
.app.on::after{content:"";position:absolute;bottom:calc(var(--tile)*-.20);width:5px;height:5px;
  border-radius:50%;background:var(--blue)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--blue);color:#fff;font-size:11px;font-weight:650;display:grid;place-items:center;
  box-shadow:0 0 0 2.5px #fff}

.panel{background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:26px;
  box-shadow:0 18px 48px -20px rgba(8,26,72,.20);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.phead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
.hicon{width:34px;height:34px;flex:none;display:block}
.hicon svg{width:100%;height:100%;display:block}
.phead h2{font-size:17px;font-weight:640;letter-spacing:-.022em}
.phead p{font-size:12.5px;color:var(--muted);margin-top:1px}
.phead .grow{flex:1;min-width:0}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.pclose{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--soft);
  color:#4c5570;font-size:14px;display:none;place-items:center}
.pbody{padding:clamp(18px,3vh,30px) 20px;overflow:auto;flex:1;min-height:0;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.screen{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:590;background:var(--blue);
  color:#fff;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--soft);color:#232a3a}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;
  padding:5px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;transition:.15s;
  text-decoration:none}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn.on{color:var(--blue);font-weight:640}
.inp,.ta{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 14px;
  font-size:14.5px;line-height:1.5}
.inp::placeholder,.ta::placeholder{color:#9aa3b8}
.inp:focus,.ta:focus{outline:none;border-color:rgba(10,63,214,.5)}
.ta{resize:none;min-height:96px}
.frow{display:flex;gap:8px;align-items:center}
.frow .inp{flex:1}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;flex:none}
.seg button{border:0;background:none;cursor:pointer;font-size:13px;font-weight:560;color:var(--muted);
  padding:7px 13px;border-radius:8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(8,26,72,.12)}

.list{display:flex;flex-direction:column}
.item{padding:15px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item h3{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.item p{font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.item small,.meta{font-size:12.5px;color:var(--muted)}
.rowacts{display:flex;gap:2px;margin-top:8px;margin-left:-8px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:640;padding:4px 9px;border-radius:99px;background:var(--soft);
  color:#333d55;flex:none;border:0;font-family:inherit}
button.tag{cursor:pointer}
.tag.b{background:rgba(10,63,214,.1);color:var(--blue)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.55;padding:46px 10px}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:620;margin-bottom:5px}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;background:#fff}
.stats>div{padding:15px 6px;text-align:center;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats b{display:block;font-size:21px;font-weight:660;letter-spacing:-.02em}
.stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:12.5px;color:var(--muted);text-align:center}

.pbody.pf{display:flex;align-items:center;justify-content:center}
.pfwrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;
  gap:clamp(13px,2.2vh,20px);text-align:center}
.pfav{--s:clamp(100px,14vh,132px);width:var(--s);height:var(--s);border-radius:50%;position:relative;
  border:0;padding:0;cursor:pointer;background:rgba(10,63,214,.05);box-shadow:inset 0 0 0 2px rgba(10,63,214,.15);
  transition:transform .2s,box-shadow .2s}
.pfav[disabled]{cursor:default}
.pfav:not([disabled]):hover{transform:scale(1.02);box-shadow:inset 0 0 0 2px rgba(10,63,214,.32)}
.pfav:not([disabled]):active{transform:scale(.97)}
.pfin{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.pfin img{width:100%;height:100%;object-fit:cover;display:block}
.pfcam{position:absolute;right:1%;bottom:1%;width:31%;height:31%;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.pfcam svg{width:54%;height:54%}
.pfname{border:0;background:none;font-size:19px;font-weight:640;letter-spacing:-.024em;padding:3px 8px;
  margin:-3px -8px;border-radius:9px;width:100%;max-width:300px}
.pfname::placeholder{color:#9aa3b8;font-weight:500}
.pfhandle{display:flex;align-items:center;font-size:12.5px;color:var(--muted)}
.pfhandle input{border:0;background:none;font-size:12.5px;color:var(--muted);padding:2px 5px;margin:-2px -5px;
  border-radius:7px;width:150px}
.pfname:focus,.pfhandle input:focus{outline:none;background:rgba(10,63,214,.06)}
.panel[data-edit="1"] .pfname,.panel[data-edit="1"] .pfhandle input{background:var(--soft)}
.pfbio{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:14.5px;
  line-height:1.5;padding:12px 14px;resize:none;text-align:center}
.pfbio::placeholder{color:#9aa3b8}
.pfbio:focus{outline:none;border-color:rgba(10,63,214,.5)}
.pfbio[readonly]{border-color:transparent;background:none}

/* profile page layout */
.pbody.pf{display:block;padding:clamp(18px,2.6vh,26px) clamp(18px,2.4vw,30px)}
.pgrid{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:clamp(20px,2.4vw,34px);
  align-items:start;max-width:1100px;margin:0 auto}
.pcolL{display:flex;flex-direction:column;gap:13px;position:sticky;top:0}
.pcolR{display:flex;flex-direction:column;gap:22px;min-width:0}
.photo{width:100%;aspect-ratio:1;border-radius:22px;position:relative;border:0;padding:0;overflow:hidden;
  background:rgba(10,63,214,.05);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:block;
  transition:box-shadow .2s}
.photo[disabled]{cursor:default}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo:not([disabled]):hover{box-shadow:inset 0 0 0 2px rgba(10,63,214,.35)}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);opacity:.5}
.photo .ph svg{width:34%;height:34%}
.photo .cam{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(8,26,72,.3)}
.photo .cam svg{width:17px;height:17px}
.pfield{border:0;background:none;font-size:14.5px;padding:7px 9px;margin:0 -9px;border-radius:9px;width:calc(100% + 18px);
  line-height:1.45}
.pfield::placeholder{color:#9aa3b8}
.pfield:focus{outline:none;background:rgba(10,63,214,.06)}
.panel[data-edit="1"] .pfield{background:var(--soft)}
.panel:not([data-edit="1"]) .pfield:placeholder-shown{display:none}
.pfield.role{font-weight:640;font-size:16px;letter-spacing:-.015em}
.pfield.loc{color:var(--muted);font-size:13.5px;margin-top:-6px}
.pfield.bio{resize:none;line-height:1.55}
.pfield.link{color:var(--blue);font-size:13.5px}
.pflink{display:block;text-align:center;text-decoration:none;padding:11px;border-radius:12px;background:var(--soft);
  color:var(--blue);font-size:13.5px;font-weight:590;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;gap:8px}
.prow>*{flex:1}
.sec{display:flex;flex-direction:column;gap:2px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sechead h4{font-size:11.5px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:#8b93a8}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;font-weight:540;padding:7px 12px;border-radius:99px;background:var(--soft);color:#28304a}
.stand{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.stand:first-child{border-top:0}
.stand span{flex:1;font-size:14.5px;min-width:0}
.qpost{padding:12px 0;border-top:1px solid var(--line)}
.qpost:first-child{border-top:0}
.qpost p{font-size:14px;line-height:1.5}
.qpost small{font-size:12px;color:var(--muted)}
.next{display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:14px}
.next b{display:block;font-size:14.5px;font-weight:600}
.next small{font-size:12.5px;color:var(--muted)}
.datechip{flex:none;width:46px;text-align:center}
.datechip i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--blue)}
.datechip b{font-size:20px;font-weight:660;line-height:1.05;letter-spacing:-.02em}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.start button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;
  cursor:pointer;transition:.15s}
.start button:hover{border-color:rgba(10,63,214,.4);background:rgba(10,63,214,.03)}
.start b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.start small{font-size:12.5px;color:var(--muted);line-height:1.4}
@media (max-width:860px){
  .pgrid{grid-template-columns:1fr}
  .pcolL{position:static}
  .photo{max-width:260px;margin:0 auto}
}

/* social + AI */
.tabs{align-self:flex-start}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;text-decoration:none;color:inherit}
.whoav{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:650;
  display:grid;place-items:center;overflow:hidden;flex:none}
.whoav img{width:100%;height:100%;object-fit:cover}
.who b{font-size:13.5px;font-weight:600}
.who span{font-size:12.5px;color:var(--muted)}
.who:hover b{text-decoration:underline}
.opt{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;
  cursor:pointer;padding:0 0 5px;font-size:14px;text-align:left}
.opt b{font-weight:640;font-size:13px}
.opt.on{font-weight:640}
.linkbtn{border:0;background:none;color:var(--blue);font-size:12.5px;font-weight:590;cursor:pointer;
  padding:5px 8px;margin-left:-8px;border-radius:8px}
.linkbtn:hover{background:rgba(10,63,214,.07)}
.linkbtn:disabled{opacity:.5;cursor:default}
.ai{border:1px solid rgba(10,63,214,.22);background:rgba(10,63,214,.04);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:11px;animation:fade .25s ease}
.ai p{font-size:14px;line-height:1.55;white-space:pre-wrap}
.aiacts{display:flex;gap:8px}
.ainote{font-size:11.5px;color:var(--muted)}
.divide{height:1px;background:var(--line);margin:4px 0}
.sect{font-size:11.5px;font-weight:660;letter-spacing:.07em;text-transform:uppercase;color:#8b93a8;margin-bottom:9px}

.auth{max-width:330px;margin:auto;text-align:center;display:flex;flex-direction:column;gap:13px;padding:34px 0}
.auth h3{font-size:19px;font-weight:640;letter-spacing:-.024em}
.auth p{font-size:13.5px;color:var(--muted);line-height:1.55}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);z-index:60;background:rgba(12,18,34,.93);
  color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;
  transition:.26s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mode{position:fixed;right:var(--pad);top:clamp(20px,3.4vh,38px);z-index:5;font-size:11.5px;font-weight:600;
  color:var(--muted);background:var(--soft);padding:5px 11px;border-radius:99px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--soft);border-top-color:var(--blue);
  animation:sp .7s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:900px){
  :root{--tile:clamp(58px,16vw,78px)}
  .stage{grid-template-columns:1fr;padding-top:92px}
  .rail{grid-template-columns:repeat(4,var(--tile));justify-content:center;align-content:start}
  .panel{position:fixed;inset:auto 0 0 0;height:90svh;z-index:20;border-radius:24px 24px 0 0;
    transform:translateY(101%);transition:transform .38s cubic-bezier(.25,.9,.3,1)}
  body.open .panel{transform:none}
  .pclose{display:grid}
  .mode{display:none}
}
@media (max-width:420px){.rail{grid-template-columns:repeat(3,var(--tile))}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats>div:nth-child(3){border-left:0}
  .stats>div:nth-child(n+3){border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.rings,.glow,.dot::after{animation:none}}
</style>
</head>
<body>

<div class="field" aria-hidden="true"><div class="rings"></div><div class="glow"></div><div class="vignette"></div></div>
<a class="mark" href="?"><span class="dot"></span><span class="word">democrat<span class="tld">.ai</span></span></a>
<div class="mode" id="mode" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity=".13"/><stop offset=".5" stop-color="#fff" stop-opacity=".02"/>
  <stop offset="1" stop-color="#040C22" stop-opacity=".07"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">

</div>

function ago(ts){
  const s = (Date.now() - new Date(ts).getTime())/1e3;
  if(s<60) return 'now';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  if(s<604800) return Math.floor(s/86400)+'d';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function dfmt(d){
  const [y,m,dd] = String(d).split('-').map(Number);
  return new Date(y,m-1,dd).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}

let toastEl;
function toast(m){
  if(!toastEl){ toastEl=document.createElement('div'); toastEl.className='toast'; document.body.appendChild(toastEl); }
  toastEl.textContent=m; toastEl.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>toastEl.classList.remove('on'),2600);
}
function crop(file,size,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(img.width,img.height), c=document.createElement('canvas');
      c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      c.toBlob(b=>cb(b, c.toDataURL('image/jpeg',.88)), 'image/jpeg', .88);
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

/* --------------------------------------------------------------- Anthropic */
let AI_OK = true;                       // flips false the first time the endpoint is missing
async function ai(task, input){
  if(!AI_OK) return null;
  try{
    const r = await fetch('/api/ai', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({task, input})
    });
    if(r.status===404 || r.status===501){ AI_OK=false; toast('AI is not switched on yet'); return null; }
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ toast(d.error==='upstream' ? 'AI service is busy' : 'That did not work'); return null; }
    return (d.text||'').trim() || null;
  }catch(e){ AI_OK=false; toast('AI is not reachable here'); return null; }
}
/* one shared pattern: ask, show, let the person accept or ignore. Never overwrite silently. */
async function suggest(boxId, btn, task, input, opts){
  const box = $(boxId); if(!box) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Thinking…';
  const out = await ai(task, input);
  btn.disabled = false; btn.textContent = label;
  if(!out) return;
  box.hidden = false;
  box.innerHTML = `<p>${esc(out)}</p>
    <div class="aiacts">
      ${opts && opts.apply ? '<button class="btn" data-use>Use it</button>' : ''}
      <button class="btn ghost" data-hide>${opts && opts.apply ? 'Keep mine' : 'Close'}</button>
    </div>
    ${opts && opts.note ? `<span class="ainote">${opts.note}</span>` : ''}`;
  box.querySelector('[data-hide]').onclick = ()=>{ box.hidden = true; box.innerHTML=''; };
  const use = box.querySelector('[data-use]');
  if(use) use.onclick = ()=>{ opts.apply(out); box.hidden = true; box.innerHTML=''; };
}

async function load(){
  if(!ONLINE){

    D = Object.assign(blank(), {posts:db.posts, issues:db.issues, ends:db.ends,
        events:db.events, polls:db.polls, gifts:db.gifts, shares:db.shares||0});
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  ME = null;
  if(session){
    const { data:prof, error:perr } = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(perr){
      toast(/does not exist|schema cache/i.test(perr.message)
        ? 'The database tables are not set up yet' : perr.message);
    }
    ME = prof || null;
    if(!ME){                                   // signed in but no row yet: make one
      const ins = await sb.from('profiles').insert({id:session.user.id}).select().single();
      if(ins.error) toast(friendly(ins.error)); else ME = ins.data;
    }
  }

  const h = qHandle();
  V = h ? (await sb.from('profiles').select('*').eq('handle',h).maybeSingle()).data : ME;
  RO = !!(V && ME && V.id !== ME.id) || !!(V && !ME);
  if(V && ME && V.id === ME.id){ RO = false; V = ME; }
  D = blank();
  if(!V) return;

  const pid = V.id;
  const [posts,issues,ends,events,polls,gifts,followers,following,shares] = await Promise.all([
    sb.from('posts').select('*').eq('author',pid).order('created_at',{ascending:false}).limit(100),
    sb.from('issues').select('*').eq('author',pid).order('created_at',{ascending:false}),
    sb.from('endorsements').select('*').eq('author',pid).order('created_at',{ascending:false}),
    sb.from('events').select('*').eq('author',pid).order('date'),
    sb.from('polls').select('*, poll_options(*)').eq('author',pid).order('created_at',{ascending:false}),
    (ME && !RO) ? sb.from('gifts').select('*').eq('author',pid) : Promise.resolve({data:[]}),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('followee',pid),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('follower',pid),
    sb.from('shares').select('*',{count:'exact',head:true}).eq('profile_id',pid)
  ]);
  D.posts  = posts.data||[];  D.issues = issues.data||[]; D.ends = ends.data||[];
  D.events = events.data||[]; D.polls  = polls.data||[];  D.gifts = gifts.data||[];
  D.followers = followers.count||0; D.following = following.count||0; D.shares = shares.count||0;
  await decorate(D.posts, D.polls, D.events);

  if(ME && RO){
    const { data:f } = await sb.from('follows').select('follower')
      .eq('follower',ME.id).eq('followee',pid).maybeSingle();
    D.isFollowing = !!f;
  }
}

/* attach like counts, vote counts and rsvp counts to any set of rows */
async function decorate(posts, polls, events){
  if(!ONLINE) return;
  const jobs = [];
  const pids = (posts||[]).map(p=>p.id);
  if(pids.length) jobs.push(sb.from('likes').select('post_id,user_id').in('post_id',pids).then(({data})=>{
    posts.forEach(p=>{
      const mine=(data||[]).filter(l=>l.post_id===p.id);
      p.likes=mine.length; p.liked=!!(ME&&mine.some(l=>l.user_id===ME.id));
    });
  }));
  const qids = (polls||[]).map(p=>p.id);
  if(qids.length) jobs.push(sb.from('poll_votes').select('poll_id,option_id,user_id').in('poll_id',qids).then(({data})=>{
    polls.forEach(p=>{
      (p.poll_options||[]).sort((a,b)=>a.ord-b.ord);
      const vs=(data||[]).filter(v=>v.poll_id===p.id);
      p.total=vs.length;
      (p.poll_options||[]).forEach(o=>o.v=vs.filter(v=>v.option_id===o.id).length);
      p.voted = ME ? ((vs.find(v=>v.user_id===ME.id)||{}).option_id || null) : null;
    });
  }));
  const eids = (events||[]).map(e=>e.id);
  if(eids.length) jobs.push(sb.from('rsvps').select('event_id,user_id').in('event_id',eids).then(({data})=>{
    events.forEach(e=>{
      const mine=(data||[]).filter(r=>r.event_id===e.id);
      e.going=mine.length; e.rsvped=!!(ME&&mine.some(r=>r.user_id===ME.id));
    });
  }));
  await Promise.all(jobs);
}

/* everyone's content, loaded the first time a screen asks for it */
async function loadGlobal(kind){
  if(!ONLINE || G[kind]) return;
  if(kind==='posts'){
    const { data } = await sb.from('posts')
      .select('*, profiles!posts_author_fkey(handle,name,photo_url)')
      .order('created_at',{ascending:false}).limit(60);
    G.posts = data||[]; await decorate(G.posts);
  }
  if(kind==='polls'){
    const { data } = await sb.from('polls')
      .select('*, poll_options(*), profiles!polls_author_fkey(handle,name,photo_url)')
      .order('created_at',{ascending:false}).limit(40);
    G.polls = data||[]; await decorate(null,G.polls);
  }
  if(kind==='events'){
    const today = new Date().toISOString().slice(0,10);
    const { data } = await sb.from('events')
      .select('*, profiles!events_author_fkey(handle,name,photo_url)')
      .gte('date',today).order('date').limit(40);
    G.events = data||[]; await decorate(null,null,G.events);
  }
  if(kind==='issues'){
    const { data } = await sb.from('issues').select('title,stance').limit(2000);
    G.issues = data||[];
  }
}

/* every write goes through here: save, reload, repaint */
async function mutate(fn){
  try{
    if(!ONLINE){ const db=localDB(); fn.local && fn.local(db); localSave(db); }
    else { const err = await fn.remote(); if(err){ toast(friendly(err)); return } }
  }catch(e){ toast('Something went wrong'); return }
  if(fn.clears) fn.clears.forEach(k=>G[k]=null);
  await load(); if(fn.clears) await Promise.all(fn.clears.map(loadGlobal));
  render();
}
function friendly(e){
  const m=(e.message||'').toLowerCase();
  if(m.includes('duplicate') && m.includes('handle')) return 'That handle is taken';
  if(m.includes('handle_format')) return 'Handles are 2-20 letters, numbers or _';
  if(m.includes('row-level security')) return 'Sign in first';
  return e.message || 'Something went wrong';
}

        <textarea id="pfBio" class="pfield bio" rows="4" placeholder="Write a short bio." ${RO?'readonly':''}>${esc(V.bio)}</textarea>

        ${RO?'':`<div class="prow">
            <button class="btn ghost" id="pfCopy">Copy link</button>
            <button class="btn ghost" id="pfQR">QR code</button></div>
          ${done<5?`<div class="pfprog"><div class="bar"><i style="width:${done/5*100}%"></i></div>

        <div class="stats">

          <div><b>${D.posts.length}</b><span>Posts</span></div>
          <div><b>${D.shares}</b><span>Shares</span></div>
        </div>

        ${sec('Where '+(RO?'they stand':'I stand'), 'issues', stands)}

        ${sec('Coming up', 'townhall', soon)}
        ${sec('Backing', 'endorsed', backs && `<div class="chips">${backs}</div>`)}

        ${nothing ? (RO
          ? `<div class="empty"><b>Nothing here yet</b>@${esc(V.handle)} has not posted anything.</div>`

             <div class="start">
               <button data-go="issues"><b>Take a position</b><small>Say where you stand on one thing.</small></button>
               <button data-go="compose"><b>Write a post</b><small>Something happening where you live.</small></button>
               <button data-go="polls"><b>Ask a question</b><small>Find out what people think.</small></button>
               <button data-go="ballot"><b>Sort your ballot</b><small>Registration and your election date.</small></button>
             </div></section>`) : ''}

        ${RO ? `<p class="hint"><a href="?" style="color:var(--blue);font-weight:590">Make your own page</a></p>`
             : `<p class="hint" style="text-align:left">${V.handle?`Your page: ${publicUrl(V.handle).replace(/^https?:\/\//,'')}`:'Pick a handle to get your link'}</p>`}

  init(){
    document.querySelector('.pbody').classList.add('pf');
    if(!V){ authInit(); return; }
    $('pfShare') && ($('pfShare').onclick = ()=>share(shareLine()));

    if(RO){
      if(!$('pfFollow')) return;
      $('pfFollow').onclick = async ()=>{
        if(!await needAuth()) return;
        mutate({ remote: async ()=>{
          const q = D.isFollowing
            ? await sb.from('follows').delete().eq('follower',ME.id).eq('followee',V.id)
            : await sb.from('follows').insert({follower:ME.id, followee:V.id});
          return q.error; }});
      };
      return;
    }
    const fields = {pfName:'name', pfHandle:'handle', pfRole:'role', pfLoc:'location', pfBio:'bio', pfLink:'link'};
    const els = Object.keys(fields).map($).filter(Boolean);
    const edit = $('pfEdit'), tight = $('pfTighten');

    const setEdit = on => {
      panel.dataset.edit = on?'1':'0';
      els.forEach(el=>el.readOnly = !on);
      edit.textContent = on?'Done':'Edit'; edit.className = on?'btn':'btn ghost';
      if(tight) tight.hidden = !(on && $('pfBio').value.trim().length>60);
      if(on) $('pfName').focus();
    };
    setEdit(!V.name);
    edit.onclick = async ()=>{
      const on = panel.dataset.edit!=='1';
      if(!on){ await put(); render(); return; }
      setEdit(true);
    };
    let t;
    els.forEach(el=>el.addEventListener('input',()=>{
      clearTimeout(t); t=setTimeout(put,700);
      if(tight) tight.hidden = !(panel.dataset.edit==='1' && $('pfBio').value.trim().length>60);
    }));
    $('pfName').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); $('pfHandle').focus() } });

    if(tight) tight.onclick = ()=> suggest('pfAi', tight, 'tighten', $('pfBio').value,
      { apply: out => { $('pfBio').value = out; put(); } });

    async function put(){
      const patch = {};
      for(const [id,col] of Object.entries(fields)){
        const el = $(id); if(!el) continue;
        let v = el.value.trim();
        if(col==='handle') v = v.toLowerCase().replace(/^@/,'').replace(/[^a-z0-9_]/g,'');
        patch[col] = v || (col==='handle' ? null : '');
      }
      if(!ONLINE){ const db=localDB(); Object.assign(db.profile,patch); localSave(db); Object.assign(V,patch); return }
      const { error } = await sb.from('profiles').update(patch).eq('id',ME.id);
      if(error) return toast(friendly(error));
      Object.assign(V,patch); Object.assign(ME,patch);
    }

    $('pfCopy').onclick = async ()=>{
      if(!V.handle) return toast('Pick a handle first');
      try{ await navigator.clipboard.writeText(publicUrl(V.handle)); toast('Link copied') }
      catch(e){ toast(publicUrl(V.handle)) }
    };
    $('pfQR').onclick = ()=>{ if(!V.handle) return toast('Pick a handle first'); qrSheet(publicUrl(V.handle)) };
    $('pfOut') && ($('pfOut').onclick = async ()=>{ await sb.auth.signOut(); location.href = location.pathname });

    $('pfAv').onclick = ()=>$('pfFile').click();
    $('pfFile').onchange = e => {
      const f = e.target.files[0]; if(!f) return;
      toast('Uploading photo…');
      crop(f, 640, async (blob, dataUrl)=>{
        if(!ONLINE){ const db=localDB(); db.profile.photo_url=dataUrl; localSave(db); V.photo_url=dataUrl;
          render(); toast('Photo saved'); return; }
        const path = `${ME.id}/${Date.now()}.jpg`;
        const up = await sb.storage.from('avatars').upload(path, blob, {contentType:'image/jpeg', upsert:true});
        if(up.error) return toast(up.error.message);
        const { data:{ publicUrl:url } } = sb.storage.from('avatars').getPublicUrl(path);
        const { error } = await sb.from('profiles').update({photo_url:url}).eq('id',ME.id);
        if(error) return toast(friendly(error));
        V.photo_url = ME.photo_url = url; render(); toast('Photo saved');
      });
    };
  }
};

function shareLine(){
  const bits = [V.name || 'democrat.ai'];
  if(V.role) bits.push(V.role);
  if(V.location) bits.push(V.location);
  return bits.join(' · ');
}
function nextStep(steps){
  const labels = ['add a photo','add your name','pick a handle','write a bio','say what you care about'];
  return labels[steps.findIndex(x=>!x)] || '';
}
function authView(){
  return `<div class="auth">
    <h3>Claim your page</h3>
    <p>Your positions, your posts, the events you are going to and your ballot, on one link.</p>
    <input class="inp" id="auEmail" type="email" placeholder="you@email.com" autocomplete="email">
    <input class="inp" id="auPw" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="auGo">Continue</button>
    <button class="linkbtn" id="auLink" style="margin:0 auto">Email me a link instead</button>
  </div>`;
}
function authInit(){
  const email = () => $('auEmail').value.trim();

  const go = async ()=>{
    const e = email(), pw = $('auPw').value;
    if(!e) return toast('Enter your email');
    if(!pw) return toast('Enter a password, or use the email link');
    if(pw.length < 6) return toast('Passwords need six characters');
    $('auGo').disabled = true;

    const { error } = await sb.auth.signInWithPassword({ email:e, password:pw });
    if(!error){ $('auGo').disabled = false; return; }               // signed in

    if(/invalid login credentials/i.test(error.message)){           // no account yet: make one
      const up = await sb.auth.signUp({ email:e, password:pw });
      $('auGo').disabled = false;
      if(up.error) return toast(up.error.message);
      return toast(up.data.session ? 'Welcome' : 'Check your email to confirm');
    }
    $('auGo').disabled = false;
    toast(error.message);
  };

  const magic = async ()=>{
    const e = email();
    if(!e) return toast('Enter your email');
    $('auLink').disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email:e,
      options:{ emailRedirectTo: location.origin + location.pathname } });
    $('auLink').disabled = false;
    toast(error ? error.message : 'Check your email');
  };

  $('auGo').onclick = go;
  $('auLink').onclick = magic;
  $('auEmail').onkeydown = e => { if(e.key==='Enter') $('auPw').focus() };
  $('auPw').onkeydown    = e => { if(e.key==='Enter') go() };
}
function qrSheet(url){
  const wrap = document.createElement('div');
  wrap.className='sheet';
  wrap.innerHTML = `<div class="sheetbox">
      <h3>Your page</h3><div class="qrbox" id="qrBox"></div>
      <code>${url.replace(/^https?:\/\//,'')}</code>
      <div class="pfacts" style="width:100%">
        <button class="btn ghost" id="qrClose">Close</button>
        <button class="btn" id="qrSave">Save image</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.onclick = e=>{ if(e.target===wrap) wrap.remove() };
  $('qrClose').onclick = ()=>wrap.remove();
  const draw = ()=>{
    const c = document.createElement('canvas');
    window.QRCode.toCanvas(c, url, {width:400,margin:1,color:{dark:'#0A3FD6',light:'#FFFFFF'}}, err=>{
      if(err) return toast('Could not build the code');
      const box=$('qrBox'); box.innerHTML=''; c.style.width=c.style.height='200px'; box.appendChild(c);
      $('qrSave').onclick=()=>{ const a=document.createElement('a');
        a.download=(V.handle||'page')+'-qr.png'; a.href=c.toDataURL('image/png'); a.click(); };
    });
  };
  if(window.QRCode) return draw();
  const sc=document.createElement('script');
  sc.src='https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
  sc.onload=draw; sc.onerror=()=>toast('Could not load the QR library');
  document.head.appendChild(sc);
}

    const b = (V && V.ballot) || {};
    const left = b.date ? Math.ceil((new Date(b.date+'T00:00') - Date.now())/864e5) : null;
    return `<div class="screen">
      <div class="frow">
        <input class="inp" id="bDate" type="date" value="${b.date||''}" ${RO?'disabled':''}>
        <span class="meta" style="flex:none">${left!=null?(left>0?left+' days out':(left===0?'Election day':'Passed')):'Your election date'}</span>
      </div>
      <div class="list">${BALLOT.map(x=>`
        <div class="item"><div class="grow"><h3>${x[1]}</h3>
          <div class="rowacts"><a class="iconbtn" href="${x[2]}" target="_blank" rel="noopener">Open ${ico.share}</a></div></div>
          ${RO?'':`<button class="tag ${b[x[0]]?'b':''}" data-chk="${x[0]}">${b[x[0]]?'Done':'Mark done'}</button>`}
        </div>`).join('')}</div>

      <div class="divide"></div>
      <div>
        <div class="sect">Make sense of a measure</div>
        <textarea class="ta" id="bText" style="min-height:110px"
          placeholder="Paste the text of a ballot measure and get it in plain English."></textarea>
        <div class="frow" style="justify-content:space-between;margin-top:9px">
          <button class="btn ghost" id="bShare">Share checklist</button>
          <button class="btn" id="bExplain">Explain it</button>
        </div>
        <div class="ai" id="bAi" hidden></div>
      </div>
    </div>`;
  },
  init(){
    $('bShare').onclick = ()=>share('Register, check your registration, find your polling place:');
    $('bExplain').onclick = ()=>{
      const t=$('bText').value.trim();
      if(t.length<40) return toast('Paste the measure text first');
      suggest('bAi', $('bExplain'), 'measure', t, {note:'AI reading of the text you pasted. Verify before you vote.'});
    };
    if(RO) return;
    const put = patch => mutate({
      local:db=>Object.assign(db.profile.ballot,patch),
      remote:async()=>(await sb.from('profiles')
        .update({ballot:Object.assign({},V.ballot,patch)}).eq('id',ME.id)).error });
    $('bDate').onchange = e => put({date:e.target.value});
    document.querySelectorAll('[data-chk]').forEach(b=>b.onclick = ()=>{
      const k=b.dataset.chk; put({[k]: !((V.ballot||{})[k])});
    });
  }
};

/* -------------------------------------------------------------------- polls */
S.polls = {
  sub(){ return RO ? `Questions from @${V.handle}` : 'Ask, then listen' },
  view(){
    const mine = RO || !ONLINE || SC.polls==='mine';
    const list = mine ? D.polls : (G.polls||[]);
    return `<div class="screen">${tabs('polls',[['all','Everyone'],['mine','Yours']])}
      ${RO?'':`<div class="frow"><input class="inp" id="pQ" placeholder="Ask a question"></div>
      <div class="ai" id="pAi" hidden></div>
      <div class="frow"><input class="inp" id="pA" placeholder="Option 1"><input class="inp" id="pB" placeholder="Option 2"></div>
      <div class="frow" style="justify-content:space-between">
        <button class="linkbtn" id="pCheck" hidden>Check my wording</button>
        <button class="btn" id="pAdd">Post</button></div>`}
      ${list.length? list.map(p=>{
        const opts=p.poll_options||[];
        return `<div class="item" data-poll="${p.id}" style="display:block">
          ${!mine && p.profiles ? who(p.profiles) : ''}
          <h3>${esc(p.question)}</h3>
          <small>${p.total||0} vote${p.total===1?'':'s'}${p.voted?'':' · tap to vote'}</small>
          <div style="margin-top:10px">${opts.map(o=>`
            <div style="margin-bottom:9px">
              <button class="opt${p.voted===o.id?' on':''}" data-opt="${o.id}">
                <span>${esc(o.text)}</span>${p.voted?`<b>${p.total?Math.round(o.v/p.total*100):0}%</b>`:''}</button>
              <div class="bar"><i style="width:${p.total&&p.voted?o.v/p.total*100:0}%"></i></div>
            </div>`).join('')}</div>
          <div class="rowacts">${act('share','Share')}${(mine&&!RO)?act('del'):''}</div>
        </div>`}).join('')
        :`<div class="empty"><b>No questions yet</b>${mine?'One good question travels further than ten posts.':'Nobody has asked anything yet.'}</div>`}
    </div>`;
  },
  init(){
    wireTabs();
    const mine = RO || !ONLINE || SC.polls==='mine';
    const list = mine ? D.polls : (G.polls||[]);
    if(!RO){
      const Q=$('pQ'), chk=$('pCheck');
      Q.oninput = ()=>{ chk.hidden = Q.value.trim().length < 12 };
      chk.onclick = ()=> suggest('pAi', chk, 'neutral', Q.value, { apply:o=>{ Q.value=o } });
      $('pAdd').onclick = async ()=>{
        const q=Q.value.trim(), a=$('pA').value.trim(), b=$('pB').value.trim();
        if(!q||!a||!b) return toast('Add a question and two options');
        if(!await needAuth()) return;
        mutate({
          local:db=>db.polls.unshift({id:uid(),question:q,total:0,voted:null,
            poll_options:[{id:uid(),text:a,v:0,ord:0},{id:uid(),text:b,v:0,ord:1}]}),
          remote:async()=>{
            const ins = await sb.from('polls').insert({author:ME.id,question:q}).select().single();
            if(ins.error) return ins.error;
            return (await sb.from('poll_options').insert([
              {poll_id:ins.data.id,text:a,ord:0},{poll_id:ins.data.id,text:b,ord:1}])).error;
          }, clears:['polls'] });
      };
    }
    document.querySelectorAll('[data-poll]').forEach(el=>{
      const p = list.find(x=>x.id===el.dataset.poll); if(!p) return;
      el.addEventListener('click', async e=>{
        const o=e.target.closest('[data-opt]'), b=e.target.closest('[data-act]');
        if(b && b.dataset.act==='share') return share(p.question, p.profiles && p.profiles.handle);
        if(b && b.dataset.act==='del') return mutate({ local:db=>db.polls=db.polls.filter(x=>x.id!==p.id),
          remote:async()=>(await sb.from('polls').delete().eq('id',p.id)).error, clears:['polls'] });
        if(o && !p.voted){
          if(!await needAuth()) return;
          const oid=o.dataset.opt;
          mutate({ local:db=>{ const q=db.polls.find(x=>x.id===p.id);
              q.poll_options.find(x=>x.id===oid).v++; q.total=(q.total||0)+1; q.voted=oid },
            remote:async()=>(await sb.from('poll_votes').insert({poll_id:p.id,option_id:oid,user_id:ME.id})).error,
            clears:['polls'] });
        }
      });
    });
  }
};

/* ---------------------------------------------------------------- fundraise */
S.fundraise = {
  sub(){ return RO ? `What @${V.handle} is raising for` : 'Put money behind it' },
  view(){
    const raised = D.gifts.reduce((s,g)=>s+Number(g.amount),0),
          goal = Number(V&&V.goal||0), pct = goal?Math.min(100,raised/goal*100):0,
          link = (V&&V.donate_link||'').trim(),
          href = link && !/^https?:/i.test(link) ? 'https://'+link : link;
    if(RO) return `<div class="screen">${href
      ? `<a class="btn" style="text-align:center;padding:14px" href="${esc(href)}" target="_blank" rel="noopener">Chip in</a>
         <p class="hint">Goes to a page @${esc(V.handle)} chose. Check it before you give.</p>`
      : `<div class="empty"><b>No link yet</b>@${esc(V.handle)} is not collecting anything.</div>`}</div>`;
    return `<div class="screen">
      <div class="stats">
        <div><b>${money(raised)}</b><span>Given</span></div>
        <div><b>${D.gifts.length}</b><span>Gifts</span></div>
        <div><b>${D.gifts.length?money(raised/D.gifts.length):'$0'}</b><span>Average</span></div>
        <div><b>${goal?Math.round(pct)+'%':'—'}</b><span>Of goal</span></div>
      </div>
      ${goal?`<div class="bar" style="height:9px"><i style="width:${pct}%"></i></div>`:''}
      <div class="frow">
        <input class="inp" id="fGoal" type="number" min="0" placeholder="Goal for the year" value="${goal||''}">
        <input class="inp" id="fLink" placeholder="Link others can give through" value="${esc(V&&V.donate_link)}">
      </div>
      <div class="frow">
        <input class="inp" id="fGift" type="number" min="1" placeholder="Log what you gave">
        <button class="btn ghost" id="fAdd">Add</button>
        <button class="btn" id="fShare">Share link</button>
      </div>
      <p class="hint">What you log is private to you. The link is public.</p>
    </div>`;
  },
  init(){
    if(RO) return;
    let t;
    const put = patch => { clearTimeout(t); t=setTimeout(()=>{
      if(!ONLINE){ const db=localDB(); Object.assign(db.profile,patch); localSave(db); Object.assign(V,patch) }
      else sb.from('profiles').update(patch).eq('id',ME.id)
        .then(({error})=>{ error?toast(friendly(error)):Object.assign(V,patch) });
    },500) };
    $('fGoal').oninput = e=>put({goal:Number(e.target.value)||0});
    $('fLink').oninput = e=>put({donate_link:e.target.value.trim()});
    $('fAdd').onclick = async ()=>{
      const amount=Number($('fGift').value); if(!amount) return;
      if(!await needAuth()) return;
      mutate({ local:db=>db.gifts.push({id:uid(),amount}),
        remote:async()=>(await sb.from('gifts').insert({author:ME.id,amount})).error });
    };
    $('fShare').onclick = ()=>share((V.donate_link||'Chip in:'));
  }
};

/* -------------------------------------------------------------------- reach */
S.reach = {
  sub(){ return RO ? `@${V.handle} in numbers` : 'What is actually working' },
  view(){
    const likes = D.posts.reduce((s,p)=>s+(p.likes||0),0),
          votes = D.polls.reduce((s,p)=>s+(p.total||0),0),
          going = D.events.reduce((s,e)=>s+(e.going||0),0),
          top   = [...D.posts].sort((a,b)=>(b.likes||0)-(a.likes||0))[0],
          poll  = [...D.polls].sort((a,b)=>(b.total||0)-(a.total||0))[0];
    const nothing = !D.posts.length && !D.polls.length && !D.events.length;
    return `<div class="screen">
      <div class="stats">
        <div><b>${D.shares}</b><span>Shares</span></div>
        <div><b>${D.followers}</b><span>Followers</span></div>
        <div><b>${likes}</b><span>Likes</span></div>
        <div><b>${votes}</b><span>Votes cast</span></div>
      </div>
      <div class="stats">
        <div><b>${D.posts.length}</b><span>Posts</span></div>
        <div><b>${D.issues.length}</b><span>Positions</span></div>
        <div><b>${going}</b><span>RSVPs</span></div>
        <div><b>${D.ends.length}</b><span>Backing</span></div>
      </div>
      ${nothing ? `<div class="empty"><b>Nothing to measure yet</b>Post something, then come back.</div>` : `
        ${top&&top.likes?`<div class="item"><div class="grow"><small>Most liked post</small><p>${esc(top.text)}</p></div></div>`:''}
        ${poll&&poll.total?`<div class="item"><div class="grow"><small>Most answered question</small><p>${esc(poll.question)}</p></div></div>`:''}`}
    </div>`;
  }
};

/* wire the action buttons inside any list */
function rows(list, fn){
  document.querySelectorAll('[data-id]').forEach(el=>{
    const item = (list||[]).find(x=>String(x.id)===el.dataset.id); if(!item) return;
    el.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) fn(item,b.dataset.act,b) });
  });
}

/* -------------------------------------------------------------------- shell */
const rail = $('rail'), panel = $('panel');

function renderRail(){
  rail.innerHTML = APPS.map((a,i)=>{
    const n = a.id==='feed' ? D.posts.length : 0;
    return `<button class="app${a.id===current?' on':''}" data-id="${a.id}" style="animation-delay:${(i*.045+.05).toFixed(2)}s">
      <span class="tile">${icon(a)}${n?`<span class="badge">${n}</span>`:''}</span>
      <span class="label">${a.name}</span></button>`;
  }).join('');
}
function render(){ renderRail(); if(current) open_(current, true); }

function open_(id, quiet){
  const a = APPS.find(x=>x.id===id), s = S[id]; if(!a||!s) return;
  const first = current!==id;
  current = id;
  delete panel.dataset.edit;
  document.querySelectorAll('.app').forEach(el=>el.classList.toggle('on', el.dataset.id===id));
  const sub = typeof s.sub==='function' ? s.sub() : s.sub;
  panel.innerHTML = `<header class="phead">
      <span class="hicon">${icon(a)}</span>
      <div class="grow">${s.head?s.head():`<h2>${a.name}</h2><p>${sub}</p>`}</div>
      <div class="acts">${s.acts?s.acts():''}<button class="pclose" id="pclose">&#10005;</button></div>
    </header>
    <div class="pbody">${s.view()}</div>`;
  if(s.init) s.init();
  document.body.classList.add('open');
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open_(b.dataset.go));
  $('pclose').onclick = ()=>{ document.body.classList.remove('open'); current='';
    document.querySelectorAll('.app').forEach(x=>x.classList.remove('on')) };
  if(!quiet) renderRail();

  /* fill in everyone's content the first time a social screen opens */
  if(first && ONLINE && !RO){
    const kind = {feed:'posts', polls:'polls', townhall:'events'}[id];
    if(kind && !G[kind]) loadGlobal(kind).then(()=>{ if(current===id) open_(id,true) });
  }
}

rail.addEventListener('click', e=>{ const b=e.target.closest('.app'); if(b) open_(b.dataset.id) });

/* --------------------------------------------------------------------- boot */
(async function boot(){
  renderRail();
  panel.innerHTML = '<div class="spin"></div>';
  if(ONLINE){
    sb.auth.onAuthStateChange(async evt=>{
      if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'){ Object.keys(G).forEach(k=>G[k]=null); await load(); render(); }
    });
  } else { const m=$('mode'); m.hidden=false; m.textContent='Local mode'; }
  await load();
  if(ONLINE) await loadGlobal('issues');
  render();
})();

</script>
</body>

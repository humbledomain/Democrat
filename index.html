<style>
:root{
  --blue:#0A3FD6; --ink:#0b0d12; --muted:#6b7488;
  --line:rgba(10,32,90,.10); --soft:rgba(10,32,90,.05);
  --tile:clamp(52px,5.6vw,80px); --pad:clamp(20px,3.2vw,44px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#fff;color:var(--ink);min-height:100svh;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}

.field{position:fixed;inset:0;z-index:0;pointer-events:none;background:#fff}
.rings{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-radial-gradient(circle at center,rgba(10,32,90,0) 0,rgba(10,32,90,.02) 26px,rgba(10,32,90,0) 58px);
  animation:breathe 26s ease-in-out infinite;will-change:transform}
.glow{position:absolute;inset:-25%;background:radial-gradient(38% 38% at 22% 30%,rgba(10,63,214,.05),transparent 70%);
  filter:blur(30px);animation:drift 44s ease-in-out infinite alternate}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 40%,#fff 92%)}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.16) rotate(4deg)}}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0)}100%{transform:translate3d(3%,2%,0) scale(1.08)}}

.mark{position:fixed;z-index:5;top:clamp(20px,3.4vh,38px);left:var(--pad);display:flex;align-items:center;
  gap:clamp(9px,1vw,14px);text-decoration:none;color:inherit}
.dot{width:clamp(13px,1.35vw,19px);aspect-ratio:1;border-radius:50%;background:var(--blue);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,63,214,.26)}70%{box-shadow:0 0 0 22px rgba(10,63,214,0)}100%{box-shadow:0 0 0 0 rgba(10,63,214,0)}}
.word{font-size:clamp(16px,1.7vw,24px);font-weight:590;letter-spacing:-.028em}
.word .tld{color:var(--blue)}

.stage{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:clamp(22px,3vw,52px);padding:clamp(84px,11vh,120px) var(--pad) clamp(28px,4vh,48px)}
.rail{display:grid;grid-template-columns:repeat(2,var(--tile));column-gap:calc(var(--tile)*.45);
  row-gap:calc(var(--tile)*.30);align-content:center;justify-content:start}
.rail.settled .app{animation:none;opacity:1;transform:none}
.app{display:flex;flex-direction:column;align-items:center;gap:calc(var(--tile)*.085);background:none;border:0;
  padding:0;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;
  opacity:0;transform:translateY(12px);animation:pop .5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.tile{width:var(--tile);height:var(--tile);display:block;position:relative;
  transition:transform .22s cubic-bezier(.2,.9,.25,1),filter .18s}
.tile svg{width:100%;height:100%;display:block}
.app:hover .tile{transform:scale(1.035)}
.app:active .tile{transform:scale(.90);filter:brightness(.86);transition-duration:.09s}
.app:focus-visible{outline:none}
.app:focus-visible .tile{filter:drop-shadow(0 0 3px rgba(10,63,214,.9))}
.label{font-size:calc(var(--tile)*.175);font-weight:400;color:#1c1c1e;white-space:nowrap;line-height:1.2}
.app.on .label{font-weight:590}
.app.on::after{content:"";position:absolute;bottom:calc(var(--tile)*-.20);width:5px;height:5px;
  border-radius:50%;background:var(--blue)}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;
  background:var(--blue);color:#fff;font-size:11px;font-weight:650;display:grid;place-items:center;
  box-shadow:0 0 0 2.5px #fff}

.panel{background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:26px;
  box-shadow:0 18px 48px -20px rgba(8,26,72,.20);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.phead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
.hicon{width:34px;height:34px;flex:none;display:block}
.hicon svg{width:100%;height:100%;display:block}
.phead h2{font-size:17px;font-weight:640;letter-spacing:-.022em}
.phead p{font-size:12.5px;color:var(--muted);margin-top:1px}
.phead .grow{flex:1;min-width:0}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.pclose{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--soft);
  color:#4c5570;font-size:14px;display:none;place-items:center}
.pbody{padding:clamp(18px,3vh,30px) 20px;overflow:auto;flex:1;min-height:0;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---- wide, two-column screens ---- */
.screen{max-width:none;margin:0;display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,26%,320px);gap:clamp(18px,2.2vw,30px);
  align-items:start}
.split>.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.split>.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
@media (max-width:900px){ .split{grid-template-columns:1fr} .split>.side{position:static} }
.card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:15px;display:flex;
  flex-direction:column;gap:11px}
.card h5{font-size:11.5px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:#8b93a8}
.card .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13.5px}
.mini-btn{border:0;background:var(--soft);color:#28304a;border-radius:9px;padding:6px 10px;font-size:12.5px;
  font-weight:560;cursor:pointer}
.mini-btn:hover{background:rgba(10,63,214,.1);color:var(--blue)}
.who-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.who-row:first-of-type{border-top:0}
.who-row .whoav{width:32px;height:32px;font-size:12px}
.who-row .grow{min-width:0}
.who-row b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-row small{font-size:12px;color:var(--muted)}
/* split bar for agreement */
.splitbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft)}
.splitbar i{display:block;height:100%}
.splitbar .s{background:var(--blue)}
.splitbar .o{background:#c9d2e6}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal span{font-size:9.5px;color:var(--muted);text-align:center;padding-bottom:3px}
.cal button{aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:12px;cursor:pointer;color:#39415a}
.cal button.dim{color:#c3c9d8;cursor:default}
.cal button.has{background:rgba(10,63,214,.12);color:var(--blue);font-weight:660}
.cal button.on{background:var(--blue);color:#fff}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead b{font-size:13px;font-weight:620}
/* sparkline */
.spark{display:flex;align-items:flex-end;gap:3px;height:64px}
.spark i{flex:1;background:rgba(10,63,214,.25);border-radius:3px 3px 0 0;min-height:2px}
.spark i.on{background:var(--blue)}
.ring{display:flex;align-items:center;gap:13px}
.ring svg{flex:none}
.ring b{font-size:22px;font-weight:660;letter-spacing:-.02em;display:block}
.ring small{font-size:12px;color:var(--muted)}
/* quick composer at the top of the feed */
.quick{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:13px 15px}
.quick textarea{flex:1;border:0;resize:none;font-size:15px;line-height:1.5;min-height:26px;max-height:160px}
.quick textarea:focus{outline:none}
.gift{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.gift:first-of-type{border-top:0}

.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:590;background:var(--blue);
  color:#fff;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--soft);color:#232a3a}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;
  padding:5px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;transition:.15s;
  text-decoration:none}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn.on{color:var(--blue);font-weight:640}
.inp,.ta{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 14px;
  font-size:14.5px;line-height:1.5}
.inp::placeholder,.ta::placeholder{color:#9aa3b8}
.inp:focus,.ta:focus{outline:none;border-color:rgba(10,63,214,.5)}
.ta{resize:none;min-height:96px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .inp[type=date],.frow .inp[type=number]{max-width:190px;flex:0 1 190px}
.frow .inp{flex:1}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;flex:none}
.seg button{border:0;background:none;cursor:pointer;font-size:13px;font-weight:560;color:var(--muted);
  padding:7px 13px;border-radius:8px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(8,26,72,.12)}

.list{display:flex;flex-direction:column}
.item{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item h3{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.item p{font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.item small,.meta{font-size:12.5px;color:var(--muted)}
.rowacts{display:flex;gap:2px;margin-top:8px;margin-left:-8px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:640;padding:4px 9px;border-radius:99px;background:var(--soft);
  color:#333d55;flex:none;border:0;font-family:inherit}
button.tag{cursor:pointer}
.tag.b{background:rgba(10,63,214,.1);color:var(--blue)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.55;padding:46px 10px}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:620;margin-bottom:5px}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;background:#fff}
.stats>div{padding:15px 6px;text-align:center;border-left:1px solid var(--line)}
.stats>div:first-child{border-left:0}
.stats b{display:block;font-size:21px;font-weight:660;letter-spacing:-.02em}
.stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hint{font-size:12.5px;color:var(--muted);text-align:center}

.pbody.pf{display:flex;align-items:center;justify-content:center}
.pfwrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;
  gap:clamp(13px,2.2vh,20px);text-align:center}
.pfav{--s:clamp(100px,14vh,132px);width:var(--s);height:var(--s);border-radius:50%;position:relative;
  border:0;padding:0;cursor:pointer;background:rgba(10,63,214,.05);box-shadow:inset 0 0 0 2px rgba(10,63,214,.15);
  transition:transform .2s,box-shadow .2s}
.pfav[disabled]{cursor:default}
.pfav:not([disabled]):hover{transform:scale(1.02);box-shadow:inset 0 0 0 2px rgba(10,63,214,.32)}
.pfav:not([disabled]):active{transform:scale(.97)}
.pfin{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.pfin img{width:100%;height:100%;object-fit:cover;display:block}
.pfcam{position:absolute;right:1%;bottom:1%;width:31%;height:31%;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.pfcam svg{width:54%;height:54%}
.pfname{border:0;background:none;font-size:19px;font-weight:640;letter-spacing:-.024em;padding:3px 8px;
  margin:-3px -8px;border-radius:9px;width:100%;max-width:300px}
.pfname::placeholder{color:#9aa3b8;font-weight:500}
.pfhandle{display:flex;align-items:center;font-size:12.5px;color:var(--muted)}
.pfhandle input{border:0;background:none;font-size:12.5px;color:var(--muted);padding:2px 5px;margin:-2px -5px;
  border-radius:7px;width:150px}
.pfname:focus,.pfhandle input:focus{outline:none;background:rgba(10,63,214,.06)}
.panel[data-edit="1"] .pfname,.panel[data-edit="1"] .pfhandle input{background:var(--soft)}
.pfbio{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:14.5px;
  line-height:1.5;padding:12px 14px;resize:none;text-align:center}
.pfbio::placeholder{color:#9aa3b8}
.pfbio:focus{outline:none;border-color:rgba(10,63,214,.5)}
.pfbio[readonly]{border-color:transparent;background:none}

/* profile page layout */
.pbody.pf{display:block;padding:clamp(18px,2.6vh,26px) clamp(18px,2.4vw,30px)}
.pgrid{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:clamp(20px,2.4vw,34px);
  align-items:start;max-width:1100px;margin:0 auto}
.pcolL{display:flex;flex-direction:column;gap:13px;position:sticky;top:0}
.pcolR{display:flex;flex-direction:column;gap:22px;min-width:0}
.photo{width:100%;aspect-ratio:1;border-radius:22px;position:relative;border:0;padding:0;overflow:hidden;
  background:rgba(10,63,214,.05);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:block;
  transition:box-shadow .2s}
.photo[disabled]{cursor:default}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo:not([disabled]):hover{box-shadow:inset 0 0 0 2px rgba(10,63,214,.35)}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);opacity:.5}
.photo .ph svg{width:34%;height:34%}
.photo .cam{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(8,26,72,.3)}
.photo .cam svg{width:17px;height:17px}
.pfield{border:0;background:none;font-size:14.5px;padding:7px 9px;margin:0 -9px;border-radius:9px;width:calc(100% + 18px);
  line-height:1.45}
.pfield::placeholder{color:#9aa3b8}
.pfield:focus{outline:none;background:rgba(10,63,214,.06)}
.panel[data-edit="1"] .pfield{background:var(--soft)}
.panel:not([data-edit="1"]) .pfield:placeholder-shown{display:none}
.pfield.role{font-weight:640;font-size:16px;letter-spacing:-.015em}
.pfield.loc{color:var(--muted);font-size:13.5px;margin-top:-6px}
.pfield.bio{resize:none;line-height:1.55}
.pfield.link{color:var(--blue);font-size:13.5px}
.pflink{display:block;text-align:center;text-decoration:none;padding:11px;border-radius:12px;background:var(--soft);
  color:var(--blue);font-size:13.5px;font-weight:590;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;gap:8px}
.prow>*{flex:1}
.sec{display:flex;flex-direction:column;gap:2px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sechead h4{font-size:11.5px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:#8b93a8}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;font-weight:540;padding:7px 12px;border-radius:99px;background:var(--soft);color:#28304a}
.stand{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.stand:first-child{border-top:0}
.stand span{flex:1;font-size:14.5px;min-width:0}
.qpost{padding:12px 0;border-top:1px solid var(--line)}
.qpost:first-child{border-top:0}
.qpost p{font-size:14px;line-height:1.5}
.qpost small{font-size:12px;color:var(--muted)}
.next{display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:14px}
.next b{display:block;font-size:14.5px;font-weight:600}
.next small{font-size:12.5px;color:var(--muted)}
.datechip{flex:none;width:46px;text-align:center}
.datechip i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--blue)}
.datechip b{font-size:20px;font-weight:660;line-height:1.05;letter-spacing:-.02em}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.start button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;
  cursor:pointer;transition:.15s}
.start button:hover{border-color:rgba(10,63,214,.4);background:rgba(10,63,214,.03)}
.start b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.start small{font-size:12.5px;color:var(--muted);line-height:1.4}
@media (max-width:860px){
  .pgrid{grid-template-columns:1fr}
  .pcolL{position:static}
  .photo{max-width:260px;margin:0 auto}
}

/* header tabs */
.acts .tabs{margin-right:2px}
.acts .seg button{padding:6px 11px;font-size:12.5px}
@media (max-width:700px){
  .phead{flex-wrap:wrap}
  .acts{width:100%;margin-left:0;overflow-x:auto;padding-bottom:2px}
}
/* compose */

.blink{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.blink span{color:var(--muted);display:inline-flex;opacity:0;transition:opacity .15s}
.blink:hover h3{color:var(--blue)}
.blink:hover span{opacity:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:7px;background:#fff;transition:border-color .15s,transform .15s}
.person:hover{border-color:rgba(10,63,214,.3);transform:translateY(-2px)}
.pface{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;
  font-size:19px;font-weight:650;overflow:hidden;text-decoration:none;flex:none}
.pface img{width:100%;height:100%;object-fit:cover}
.pmeta a{text-decoration:none;color:inherit}
.pmeta b{font-size:14.5px;font-weight:620;letter-spacing:-.01em;display:block}
.pmeta a:hover b{color:var(--blue)}
.pmeta small{font-size:12.5px;color:var(--muted)}
.prole{font-size:13px;line-height:1.4;color:#39415a}
.ploc{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:#4c5570}
.pstats{font-size:11.5px;color:var(--muted)}
.pfollow{width:100%;margin-top:4px;text-align:center;text-decoration:none;display:block}


/* the first thing anyone sees */
.gate{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;
  min-height:min(70vh,600px);margin:-12px 0}
.halo{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.halo i{position:absolute;left:0;top:0;width:min(46vmin,420px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(10,63,214,.30);transform:translate(-50%,-50%) scale(.25);opacity:0;
  animation:ripple 16s cubic-bezier(.25,.5,.4,1) infinite}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.22);opacity:0}
  12%{opacity:.32}
  100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}
}
.aurora{position:absolute;inset:-20%;pointer-events:none;
  background:radial-gradient(34% 34% at 30% 34%,rgba(10,63,214,.10),transparent 70%),
             radial-gradient(30% 30% at 72% 66%,rgba(10,63,214,.07),transparent 70%);
  filter:blur(26px);animation:swim 30s ease-in-out infinite alternate}
@keyframes swim{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(3%,2%,0) scale(1.1)}}

.gatecard{position:relative;z-index:1;width:100%;max-width:392px;display:flex;flex-direction:column;
  gap:12px;text-align:center;padding:clamp(30px,4.4vw,44px) clamp(24px,3.6vw,38px) clamp(22px,3vw,30px);
  border:0;border-radius:30px;background:rgba(255,255,255,.78);
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:0 1px 2px rgba(8,26,72,.04), 0 40px 90px -40px rgba(8,26,72,.45);
  animation:rise .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.gatedot{width:38px;height:38px;border-radius:50%;background:var(--blue);margin:0 auto 6px;position:relative;
  box-shadow:0 6px 18px -6px rgba(10,63,214,.7)}
.gatedot::after{content:"";position:absolute;inset:0;border-radius:50%;
  animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
.gatecard h2{font-size:clamp(26px,3.2vw,34px);font-weight:620;letter-spacing:-.035em;margin-bottom:6px}
.gtabs{align-self:center;margin-bottom:8px;background:rgba(10,32,90,.06)}
.gtabs button{padding:9px 22px;font-size:13.5px}
.inp.big{padding:15px 17px;font-size:15.5px;border-radius:15px;text-align:left;background:rgba(255,255,255,.9)}
.btn.big{padding:15px;font-size:15px;border-radius:15px;margin-top:4px;
  box-shadow:0 10px 24px -12px rgba(10,63,214,.9);transition:transform .18s,box-shadow .18s,opacity .15s}
.btn.big:hover{transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(10,63,214,.95)}
.btn.big:active{transform:translateY(0)}
.gatecard .linkbtn{margin:2px auto 0;font-weight:520;color:var(--muted)}
.gatecard .linkbtn:hover{color:var(--blue);background:none}
@media (prefers-reduced-motion:reduce){ .halo i,.aurora,.gatecard{animation:none} .halo i{opacity:.12} }


/* chat */
.pbody.chatbody{overflow:hidden;display:flex;flex-direction:column}
.pbody.chatbody .split{flex:1;min-height:0}
.chat{display:flex;flex-direction:column;height:100%;min-height:0;gap:14px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding:8px 8px 10px 2px;scroll-behavior:smooth}
.msg{display:flex;gap:11px;animation:rise .3s ease both;max-width:100%}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--blue);color:#fff;padding:11px 15px;border-radius:18px 18px 5px 18px;
  font-size:14px;line-height:1.5;max-width:min(80%,480px);white-space:pre-wrap;word-wrap:break-word}
.say{flex:1;min-width:0;font-size:14px;line-height:1.62;color:#1b2233;max-width:620px}
.say p{margin:0 0 10px}
.say p:last-child{margin-bottom:0}
.say ul,.say ol{margin:0 0 10px;padding-left:19px;display:flex;flex-direction:column;gap:6px}
.say li{line-height:1.6}
.say li::marker{color:#93a0bd}
.say strong{font-weight:640}
.say code{background:rgba(10,32,90,.07);padding:2px 6px;border-radius:6px;font-size:13.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.typing{display:flex;gap:5px;align-items:center;padding:9px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:#a3aec7;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chatbar{display:flex;gap:9px;align-items:flex-end;border:1px solid var(--line);border-radius:22px;
  padding:7px 7px 7px 18px;background:#fff;transition:border-color .18s,box-shadow .18s;flex:none}
.chatbar:focus-within{border-color:rgba(10,63,214,.4);box-shadow:0 0 0 4px rgba(10,63,214,.07)}
.chatbar textarea{flex:1;border:0;resize:none;font-size:15px;line-height:1.55;padding:9px 0;max-height:170px;
  background:none}
.chatbar textarea:focus{outline:none}
.sendbtn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--blue);color:#fff;
  cursor:pointer;display:grid;place-items:center;transition:opacity .15s,transform .15s}
.sendbtn svg{width:17px;height:17px}
.sendbtn:disabled{opacity:.22;cursor:default}
.sendbtn:not(:disabled):hover{transform:translateY(-1px)}
.chatintro{margin:auto;text-align:center;max-width:540px;display:flex;flex-direction:column;align-items:center;
  gap:9px;padding:24px 10px}
.introdot{width:32px;height:32px;border-radius:50%;background:var(--blue);position:relative;margin-bottom:4px}
.introdot::after{content:"";position:absolute;inset:0;border-radius:50%;
  animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
.chatintro h3{font-size:21px;font-weight:640;letter-spacing:-.028em}
.chatintro p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;width:100%}
.starter{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 16px;text-align:left;
  font-size:13.5px;line-height:1.45;color:#28304a;cursor:pointer;transition:.15s}
.starter:hover{border-color:rgba(10,63,214,.4);background:rgba(10,63,214,.03);color:var(--blue)}

/* share + invite sheet */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(8,20,45,.34);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:22px;animation:fade .2s ease}
.sheetbox{background:#fff;border-radius:26px;padding:26px 26px 22px;width:100%;max-width:440px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 40px 90px -30px rgba(8,26,72,.5);
  animation:rise .3s cubic-bezier(.2,.9,.25,1) both;max-height:92vh;overflow-y:auto}
.sheetbox h3{font-size:19px;font-weight:640;letter-spacing:-.025em}
.sheetmsg{font-size:14.5px;line-height:1.55;color:#242b3d}
.msgbox{font-size:14.5px;line-height:1.55;resize:none;min-height:92px}
.urlrow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;
  font-size:12.5px;color:var(--muted)}
.urlrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:2px 0}
.net{width:42px;height:42px;border:0;border-radius:50%;background:var(--brand);color:#fff;cursor:pointer;
  display:grid;place-items:center;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 6px -2px rgba(8,26,72,.4)}
.net svg{width:19px;height:19px}
.net:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 8px 16px -6px rgba(8,26,72,.5)}
.net:active{transform:scale(.94)}
.sheetfoot{display:flex;gap:8px;flex-wrap:wrap}
.sheetfoot .btn{flex:1;min-width:110px}

.joinbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 18px;border-radius:16px;
  background:rgba(10,63,214,.05);border:1px solid rgba(10,63,214,.14)}
.joinbar span{flex:1;font-size:14px;color:#25304a;min-width:180px}
.joinbar .btn{flex:none}
.mecol{display:flex;flex-direction:column;align-items:flex-end;max-width:min(80%,480px)}
.mact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg.me .mact{justify-content:flex-end}
.mact button{border:1px solid var(--line);background:#fff;color:#4a5470;border-radius:99px;
  padding:5px 11px;font-size:12px;font-weight:540;cursor:pointer;transition:.14s;white-space:nowrap}
.mact button:hover{border-color:rgba(10,63,214,.42);color:var(--blue);background:rgba(10,63,214,.04)}.thread{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.whoav.sm{width:28px;height:28px;font-size:11px;text-decoration:none}
.cmt b{font-size:13px;font-weight:640;margin-right:6px}
.cmt span{font-size:13.5px;line-height:1.5;color:#242b3d}
.cmt small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.cmt .cdel{font-size:11.5px;padding:0;margin:0;color:var(--muted)}
.cbox{display:flex;gap:8px}
.cbox .inp{flex:1;padding:9px 13px;font-size:14px;border-radius:11px}
.prow2{display:flex;gap:6px;width:100%;margin-top:4px}
.prow2 .btn{flex:1;padding:8px 6px;font-size:12.5px}
.dmrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;cursor:pointer;
  padding:8px 0;border-top:1px solid var(--line);text-align:left}
.dmrow:first-of-type{border-top:0}
.dmrow b{display:block;font-size:13.5px;font-weight:600}
.dmrow small{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot-new{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.sheetbox.dm{max-width:460px;height:min(72vh,640px);height:min(72dvh,640px)}
.dmhead{display:flex;align-items:center;gap:11px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dmhead b{font-size:15px;font-weight:640;display:block}
.dmhead small{font-size:12.5px;color:var(--muted)}
.dmthread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.dmmsg{display:flex;flex-direction:column;align-items:flex-start;max-width:82%}
.dmmsg.mine{align-self:flex-end;align-items:flex-end}
.dmbubble{padding:10px 14px;border-radius:16px 16px 16px 5px;background:rgba(10,32,90,.06);font-size:14px;
  line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.dmmsg.mine .dmbubble{background:var(--blue);color:#fff;border-radius:16px 16px 5px 16px}
.dmwhen{font-size:11px;color:var(--muted);margin-top:3px}
.lookedat{margin-top:9px;font-size:11.5px;color:#93a0bd;letter-spacing:.01em}
.briefout{font-size:13px;line-height:1.55;color:#39415a}
.briefout p{margin:0 0 8px}
.briefout ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
.sheetbox.stand{max-width:480px}
.stq{font-size:16px;line-height:1.45;font-weight:590;letter-spacing:-.015em;margin-bottom:12px}
.standlist{display:flex;flex-direction:column;gap:2px;max-height:44vh;overflow-y:auto}
.standrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);
  cursor:pointer;text-align:left}
.standrow:first-child{border-top:0}
.standrow input{width:17px;height:17px;accent-color:var(--blue);flex:none}
.standrow b{display:block;font-size:14px;font-weight:600}
.standrow small{font-size:12.5px;color:var(--muted)}

/* social + AI */
.tahead{position:relative}
.talist{position:absolute;left:-9px;right:-9px;top:calc(100% + 5px);background:#fff;border:1px solid var(--line);
  border-radius:13px;box-shadow:0 14px 32px -14px rgba(8,26,72,.35);z-index:40;overflow:hidden;max-height:250px;
  overflow-y:auto;animation:fade .16s ease}
.talist button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 13px;
  font-size:13.5px;cursor:pointer;color:var(--ink)}
.talist button:hover,.talist button.on{background:rgba(10,63,214,.08)}
.talist small{display:block;padding:7px 13px;color:var(--muted);font-size:10.5px;border-top:1px solid var(--line)}

.tabs{align-self:flex-start}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;text-decoration:none;color:inherit}

  const s = (Date.now() - new Date(ts).getTime())/1e3;
  if(s<60) return 'now';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  if(s<604800) return Math.floor(s/86400)+'d';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function crop(file,size,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(img.width,img.height), c=document.createElement('canvas');
      c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      c.toBlob(b=>cb(b, c.toDataURL('image/jpeg',.88)), 'image/jpeg', .88);
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

let AI_OK = true;                       // flips false the first time the endpoint is missing
async function ai(task, input){
  if(!AI_OK) return null;
  try{
    const r = await fetch('/api/ai', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({task, input})

    return (d.text||'').trim() || null;
  }catch(e){ AI_OK=false; toast('AI is not reachable here'); return null; }
}
/* the model writes plain prose with the odd list — render that properly, escape everything first */
function md(t){
  let x = esc(t);
  x = x.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  x = x.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const lines = x.split('\n');
  let out = '', list = null, para = [];
  const flushP = ()=>{ if(para.length){ out += '<p>'+para.join('<br>')+'</p>'; para=[] } };
  const flushL = ()=>{ if(list){ out += `<${list.tag}>${list.items.map(i=>'<li>'+i+'</li>').join('')}</${list.tag}>`; list=null } };
  for(const raw of lines){
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(bullet || number){
      flushP();
      const tag = bullet ? 'ul' : 'ol';
      if(!list || list.tag !== tag){ flushL(); list = {tag, items:[]} }
      list.items.push((bullet||number)[1]);
    } else if(!line.trim()){
      flushP(); flushL();
    } else {
      flushL(); para.push(line);
    }
  }
  flushP(); flushL();
  return out || '<p></p>';
}

function meContext(){
  if(!V) return '';
  const bits = [];
  bits.push(`Handle: @${V.handle||'not set'}${V.name?` (${V.name})`:''}`);
  if(V.location) bits.push(`Votes in: ${V.location}`);
  if(V.role) bits.push(`Cares most about: ${V.role}`);

  if(D.posts.length) bits.push(`They have written ${D.posts.length} post${D.posts.length===1?'':'s'}. Most recent: "${D.posts[0].text.slice(0,140)}"`);
  bits.push('Use this to make answers concrete. Never repeat it back to them as a summary.');
  return bits.join('\n');
}

/* one shared pattern: ask, show, let the person accept or ignore. Never overwrite silently. */
async function suggest(boxId, btn, task, input, opts){
  const box = $(boxId); if(!box) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Thinking…';
  const out = await ai(task, input);
  btn.disabled = false; btn.textContent = label;
  if(!out) return;
  box.hidden = false;
  box.innerHTML = `<p>${esc(out)}</p>
    <div class="aiacts">
      ${opts && opts.apply ? '<button class="btn" data-use>Use it</button>' : ''}
      <button class="btn ghost" data-hide>${opts && opts.apply ? 'Keep mine' : 'Close'}</button>
    </div>
    ${opts && opts.note ? `<span class="ainote">${opts.note}</span>` : ''}`;
  box.querySelector('[data-hide]').onclick = ()=>{ box.hidden = true; box.innerHTML=''; };
  const use = box.querySelector('[data-use]');
  if(use) use.onclick = ()=>{ opts.apply(out); box.hidden = true; box.innerHTML=''; };
}

/* -------------------------------------------------------------------- data */
async function load(){
  if(!ONLINE){
    const db = localDB();
    ME = V = db.profile; RO = false;
    D = Object.assign(blank(), {posts:db.posts, issues:db.issues, ends:db.ends,
        events:db.events, polls:db.polls, gifts:db.gifts, shares:db.shares||0});
    return;
  }
  const { data:{ session } } = await sb.auth.getSession();
  ME = null;
  if(session){
    const { data:prof, error:perr } = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
    if(perr){
      toast(/does not exist|schema cache/i.test(perr.message)
        ? 'The database tables are not set up yet' : perr.message);
    }
    ME = prof || null;
    if(!ME){                                   // signed in but no row yet: make one
      const ins = await sb.from('profiles').insert({id:session.user.id}).select().single();
      if(ins.error) toast(friendly(ins.error)); else ME = ins.data;
    }
  }

  if(ME){
    const { data:f } = await sb.from('follows').select('followee').eq('follower',ME.id);
    MYFOLLOWS = new Set((f||[]).map(x=>x.followee));
  } else MYFOLLOWS = new Set();

  const h = qHandle();
  V = h ? (await sb.from('profiles').select('*').eq('handle',h).maybeSingle()).data : ME;
  RO = !!(V && ME && V.id !== ME.id) || !!(V && !ME);
  if(V && ME && V.id === ME.id){ RO = false; V = ME; }
  D = blank();
  if(!V) return;

  const pid = V.id;
  const [posts,issues,ends,events,polls,gifts,followers,following,shares] = await Promise.all([
    sb.from('posts').select('*').eq('author',pid).order('created_at',{ascending:false}).limit(100),
    sb.from('issues').select('*').eq('author',pid).order('created_at',{ascending:false}),
    sb.from('endorsements').select('*').eq('author',pid).order('created_at',{ascending:false}),
    sb.from('events').select('*').eq('author',pid).order('date'),
    sb.from('polls').select('*, poll_options(*)').eq('author',pid).order('created_at',{ascending:false}),
    (ME && !RO) ? sb.from('gifts').select('*').eq('author',pid) : Promise.resolve({data:[]}),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('followee',pid),
    sb.from('follows').select('*',{count:'exact',head:true}).eq('follower',pid),
    sb.from('shares').select('*',{count:'exact',head:true}).eq('profile_id',pid)
  ]);
  D.posts  = posts.data||[];  D.issues = issues.data||[]; D.ends = ends.data||[];
  D.events = events.data||[]; D.polls  = polls.data||[];  D.gifts = gifts.data||[];
  D.followers = followers.count||0; D.following = following.count||0; D.shares = shares.count||0;
  await decorate(D.posts, D.polls, D.events);
  await attachComments(D.posts);
  await loadDMs();

  if(ME && RO){
    const { data:f } = await sb.from('follows').select('follower')
      .eq('follower',ME.id).eq('followee',pid).maybeSingle();
    D.isFollowing = !!f;
  }
}

/* attach like counts, vote counts and rsvp counts to any set of rows */
async function decorate(posts, polls, events){
  if(!ONLINE) return;
  const jobs = [];
  const pids = (posts||[]).map(p=>p.id);
  if(pids.length) jobs.push(sb.from('likes').select('post_id,user_id').in('post_id',pids).then(({data})=>{
    posts.forEach(p=>{
      const mine=(data||[]).filter(l=>l.post_id===p.id);
      p.likes=mine.length; p.liked=!!(ME&&mine.some(l=>l.user_id===ME.id));
    });
  }));
  const qids = (polls||[]).map(p=>p.id);
  if(qids.length) jobs.push(sb.from('poll_votes').select('poll_id,option_id,user_id').in('poll_id',qids).then(({data})=>{
    polls.forEach(p=>{
      (p.poll_options||[]).sort((a,b)=>a.ord-b.ord);
      const vs=(data||[]).filter(v=>v.poll_id===p.id);
      p.total=vs.length;
      (p.poll_options||[]).forEach(o=>o.v=vs.filter(v=>v.option_id===o.id).length);
      p.voted = ME ? ((vs.find(v=>v.user_id===ME.id)||{}).option_id || null) : null;
    });
  }));
  const eids = (events||[]).map(e=>e.id);
  if(eids.length) jobs.push(sb.from('rsvps').select('event_id,user_id').in('event_id',eids).then(({data})=>{
    events.forEach(e=>{
      const mine=(data||[]).filter(r=>r.event_id===e.id);
      e.going=mine.length; e.rsvped=!!(ME&&mine.some(r=>r.user_id===ME.id));
    });
  }));
  await Promise.all(jobs);
}

/* everyone's content, loaded the first time a screen asks for it */
async function loadGlobal(kind){
  if(!ONLINE || G[kind]) return;
  try{ await loadGlobalInner(kind) }
  catch(e){ console.error(kind,e); G[kind]=[]; LOADFAIL[kind]=(e&&e.message)||'could not load'; }
}
async function loadGlobalInner(kind){
  if(kind==='posts'){
    const { data } = await sb.from('posts')
      .select('*, profiles!posts_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(60);
    G.posts = data||[]; await decorate(G.posts); await attachComments(G.posts);
  }
  if(kind==='polls'){
    const { data } = await sb.from('polls')
      .select('*, poll_options(*), profiles!polls_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(40);
    G.polls = data||[]; await decorate(null,G.polls);
  }
  if(kind==='events'){
    const today = new Date().toISOString().slice(0,10);
    const { data } = await sb.from('events')
      .select('*, profiles!events_author_fkey(handle,name,photo_url,location)')
      .gte('date',today).order('date').limit(40);
    G.events = data||[]; await decorate(null,null,G.events);
  }
  if(kind==='issues'){
    const { data } = await sb.from('issues')
      .select('*, profiles!issues_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(400);
    G.issues = data||[];
  }
  if(kind==='ends'){
    const { data } = await sb.from('endorsements')
      .select('*, profiles!endorsements_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(200);
    G.ends = data||[];
  }
}
function agree(title){
  const t=(title||'').trim().toLowerCase();
  const rows=(G.issues||[]).filter(i=>i.title.trim().toLowerCase()===t);
  return {s:rows.filter(r=>r.stance==='Support').length, o:rows.filter(r=>r.stance==='Oppose').length};
}

/* every write goes through here: save, reload, repaint */
async function mutate(fn){
  try{
    if(!ONLINE){ const db=localDB(); fn.local && fn.local(db); localSave(db); }
    else { const err = await fn.remote(); if(err){ toast(friendly(err)); return } }
  }catch(e){ toast('Something went wrong'); return }
  if(fn.clears) fn.clears.forEach(k=>G[k]=null);
  await load(); if(fn.clears) await Promise.all(fn.clears.map(loadGlobal));
  render();
}
function friendly(e){
  const m=(e.message||'').toLowerCase();
  if(m.includes('duplicate') && m.includes('handle')) return 'That handle is taken';
  if(m.includes('handle_format')) return 'Handles are 2-20 letters, numbers or _';
  if(m.includes('row-level security')) return 'Sign in first';
  return e.message || 'Something went wrong';
}

/* one sheet, used by every Share button and by Invite */
function shareSheet({title, text, url, editable, canPost}){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3>${esc(title)}</h3>
    ${editable
      ? `<textarea class="inp msgbox" id="shText" rows="3">${esc(text)}</textarea>`
      : `<p class="sheetmsg">${esc(text)}</p>`}
    <div class="urlrow"><span id="shUrl">${esc(url.replace(/^https?:\/\//,''))}</span>
      <button class="mini-btn" id="shCopy">Copy</button></div>
    <div class="nets">${NETS.map((n,i)=>`
      <button class="net" data-net="${i}" title="${n[0]}" aria-label="${n[0]}" style="--brand:${n[1]}">
        <svg viewBox="0 0 24 24" fill="currentColor">${n[2]}</svg></button>`).join('')}</div>
    <div class="sheetfoot">
      ${canPost ? `<button class="btn" id="shPost">Post it to my feed</button>` : ''}
      ${navigator.share ? `<button class="btn ghost" id="shMore">More…</button>` : ''}
      <button class="btn ghost" id="shClose">Close</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const msg = ()=> (editable ? ($('shText').value.trim() || text) : text);
  const close = ()=>wrap.remove();

  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('shClose').onclick = close;
  $('shCopy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(msg()+'\n'+url); toast('Copied'); logShare() }
    catch(e){ toast(url) }
  };
  wrap.querySelectorAll('[data-net]').forEach(b=>b.onclick=()=>{
    const enc = {t:encodeURIComponent(msg()), u:encodeURIComponent(url)};
    window.open(NETS[+b.dataset.net][3](enc), '_blank', 'noopener,width=620,height=640');
    logShare();
  });
  const more = $('shMore');
  if(more) more.onclick = async ()=>{
    try{ await navigator.share({text:msg(), url}); logShare() }catch(e){}
  };
  const post = $('shPost');
  if(post) post.onclick = async ()=>{
    if(!await needAuth()) return;
    const text = (msg()+'\n'+url).slice(0,1000);
    post.disabled = true;
    await mutate({ local:db=>db.posts.unshift({id:uid(),text,created_at:new Date().toISOString(),likes:0,liked:false}),
      remote:async()=>(await sb.from('posts').insert({author:ME.id,text})).error, clears:['posts'] });
    logShare(); close(); toast('Posted'); open_('feed');
  };
}

 Delaware:'DE','District of Columbia':'DC',Florida:'FL',Georgia:'GA',Hawaii:'HI',Idaho:'ID',Illinois:'IL',

/* ---- where you vote drives what you see ---- */
const ABBR = Object.fromEntries(Object.entries(ST).map(([n,a])=>[a,n]));
function stateOf(loc){
  if(!loc) return null;
  const part = String(loc).split(',').pop().trim();
  if(ST[part]) return ST[part];
  const up = part.toUpperCase();
  return ABBR[up] ? up : null;
}
const stateName = code => ABBR[code] || '';
const stateSlug = code => (ABBR[code]||'').toLowerCase().replace(/\s+/g,'-');
const myState   = () => stateOf(V && V.location);
const isNear    = row => {
  const m = myState(); if(!m) return false;
  return stateOf(row && row.profiles && row.profiles.location) === m;
};
/* pick the list a screen should show, and say so plainly when we fall back */
function scoped(key, mine, all){
  if(RO || !ONLINE) return {list:mine, note:''};
  const sc = SC[key] || 'all';
  if(sc==='mine') return {list:mine, note:''};
  if(all === null) return {list:[], note:'', loading:true};   // still fetching
  const everyone = all || [];
  if(sc==='near'){
    const n = everyone.filter(isNear);
    if(n.length) return {list:n, note:''};
    return {list:everyone, note:`Nobody in ${stateName(myState())} yet — showing everyone.`};
  }
  return {list:everyone, note:''};
}

function placeahead(input, onPick){
  if(!input || input.readOnly && !input.closest('.panel')) return;
  let box=null, timer=null, cursor=-1, items=[], skip=false;

  const close = ()=>{ if(box){ box.remove(); box=null; cursor=-1 } };
  const pick  = v => { input.value=v; close(); skip=true; input.dispatchEvent(new Event('input'));
                       if(onPick) setTimeout(onPick,50); };

  const show = ()=>{
    close();
    if(!items.length) return;
    box = document.createElement('div');
    box.className = 'talist';
    box.innerHTML = items.map((t,i)=>`<button type="button" data-i="${i}">${esc(t)}</button>`).join('')
      + '<small>Places from OpenStreetMap</small>';
    box.addEventListener('mousedown', e=>{
      const b = e.target.closest('button'); if(b) { e.preventDefault(); pick(items[+b.dataset.i]); }
    });
    input.parentNode.appendChild(box);
  };

  const label = o => {
    const a = o.address || {};
    const city = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
    const st = a.state ? (ST[a.state] || a.state) : '';
    if(city && st) return `${city}, ${st}`;
    if(st) return st;
    return (o.display_name||'').split(',').slice(0,2).join(',').trim() || null;
  };

  input.addEventListener('input', ()=>{
    if(input.readOnly) return;
    clearTimeout(timer);
    if(skip){ skip=false; return close(); }        // just picked one, do not re-open
    const q = input.value.trim();
    if(q.length < 2) return close();
    timer = setTimeout(async ()=>{
      try{
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1'
          + '&countrycodes=us&limit=6&q=' + encodeURIComponent(q));
        if(!r.ok) return close();
        const data = await r.json();
        items = [...new Set(data.map(label).filter(Boolean))].slice(0,6);
        if(input.value.trim().length >= 2) show();
      }catch(e){ close() }
    }, 320);
  });

  input.addEventListener('keydown', e=>{
    if(!box) return;
    const btns = [...box.querySelectorAll('button')];
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      cursor = (cursor + (e.key==='ArrowDown'?1:-1) + btns.length) % btns.length;
      btns.forEach((b,i)=>b.classList.toggle('on', i===cursor));
    } else if(e.key==='Enter' && cursor>=0){ e.preventDefault(); pick(items[cursor]); }
    else if(e.key==='Escape') close();
  });
  input.addEventListener('blur', ()=>setTimeout(close,120));
}

/* load a cache once, repaint once, and never spin forever */
function ensure(kind, screen){
  if(!ONLINE || G[kind]) return;
  const done = ()=>{ if(G[kind]===null) G[kind]=[]; if(current===screen) open_(screen, true) };
  const fail = e => { console.error(kind, e); LOADFAIL[kind] = (e && e.message) || 'could not load'; done() };
  try{ (kind==='people' ? loadPeople() : loadGlobal(kind)).then(done, fail) }
  catch(e){ fail(e) }
  setTimeout(()=>{ if(G[kind]===null){ LOADFAIL[kind]='the request timed out'; done() } }, 8000);
}

/* ---------------- guided position builder ----------------
   Claude asks; you answer; it turns YOUR answers into positions you approve.
   It never invents a position you did not express.                          */
async function standSheet(){
  const asked = [], said = [];
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox stand">
    <h3>Where do you stand?</h3>
    <p class="sheetmsg" id="stStep">A few questions about real trade-offs. Answer in your own words — there are no right answers, and nothing is published.</p>
    <div id="stBody"></div>
    <div class="sheetfoot">
      <button class="btn ghost" id="stClose">Close</button>
      <button class="btn" id="stGo">Start</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const body = $('stBody'), step = $('stStep'), go = $('stGo');
  const close = ()=>wrap.remove();
  $('stClose').onclick = close;
  wrap.onclick = e=>{ if(e.target===wrap) close() };

  const TOTAL = 5;
  let picked = [];

  async function nextQuestion(){
    go.disabled = true; go.textContent = 'Thinking…';
    const q = await ai('interview',
      `Ask question ${asked.length+1} of ${TOTAL}.` +
      (V && V.location ? ` They vote in ${V.location}.` : '') +
      (asked.length ? ` Do not repeat these: ${asked.join(' | ')}` : ''));
    go.disabled = false;
    if(!q){ close(); return; }
    asked.push(q);
    step.textContent = `Question ${asked.length} of ${TOTAL}`;
    body.innerHTML = `<p class="stq">${esc(q)}</p>
      <textarea class="inp msgbox" id="stAns" rows="3" placeholder="In your own words. Or skip it."></textarea>`;
    go.textContent = asked.length === TOTAL ? 'Done' : 'Next';
    $('stAns').focus();
    go.onclick = onAnswer;
  }

  async function onAnswer(){
    const a = ($('stAns') && $('stAns').value.trim()) || '';
    said.push({ q: asked[asked.length-1], a });
    if(asked.length < TOTAL) return nextQuestion();
    await distil();
  }

  async function distil(){
    const answered = said.filter(x => x.a.length > 1);
    if(!answered.length){ toast('Nothing to work with yet'); return close(); }
    step.textContent = 'Reading your answers';
    body.innerHTML = '<div class="spin"></div>';
    go.disabled = true; go.textContent = 'Working…';
    const raw = await ai('distil', answered.map(x => `Q: ${x.q}\nThey said: ${x.a}`).join('\n\n'));
    go.disabled = false;
    let out = [];
    try{ out = (JSON.parse(raw.replace(/^```json|```$/g,'').trim()).positions || []) }catch(e){ out = [] }
    if(!out.length){
      step.textContent = 'Nothing clear enough yet';
      body.innerHTML = `<p class="sheetmsg">Your answers did not land on a firm position — which is a fine answer. Try again another time, or add one by hand.</p>`;
      go.textContent = 'Close'; go.onclick = close; return;
    }
    picked = out.map((p,i) => ({...p, on:true, i}));
    step.textContent = 'From what you said. Untick anything that is not you.';
    body.innerHTML = `<div class="standlist">${picked.map(p=>`
      <label class="standrow">
        <input type="checkbox" data-p="${p.i}" checked>
        <span class="grow"><b>${esc(p.title)}</b><small>${esc(p.because||'')}</small></span>
        <span class="tag ${p.stance==='Support'?'b':''}">${esc(p.stance)}</span>
      </label>`).join('')}</div>`;
    body.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{ picked[+cb.dataset.p].on = cb.checked });
    go.textContent = 'Add these'; go.onclick = save;
  }

  async function save(){
    const keep = picked.filter(p => p.on);
    if(!keep.length) return close();
    go.disabled = true; go.textContent = 'Saving…';
    for(const p of keep){
      const stance = p.stance === 'Oppose' ? 'Oppose' : 'Support';
      if(!ONLINE){ const db = localDB(); db.issues.unshift({id:uid(), title:p.title, stance}); localSave(db); }
      else { const { error } = await sb.from('issues').insert({author:ME.id, title:p.title, stance});
             if(error){ toast(friendly(error)); break } }
    }
    G.issues = null; await load(); await loadGlobal('issues');
    close(); toast(`Added ${keep.length} position${keep.length===1?'':'s'}`); open_('issues');
  }

  go.onclick = nextQuestion;
}

/* comments hang off posts; fetch them for whatever set of posts is on screen */
async function attachComments(posts){
  if(!ONLINE || !posts || !posts.length) return;
  const ids = posts.map(p=>p.id);
  try{
    const { data } = await sb.from('comments')
      .select('*, profiles!comments_author_fkey(handle,name,photo_url)')
      .in('post_id', ids).order('created_at');
    posts.forEach(p => p.comments = (data||[]).filter(c => c.post_id === p.id));
  }catch(e){ posts.forEach(p => p.comments = p.comments || []) }
}

/* every message you are part of — row level security means only yours come back */
async function loadDMs(){
  if(!ONLINE || !ME){ DMS = []; DMUNREAD = 0; return }
  try{
    const { data } = await sb.from('messages')
      .select('*, sender_p:profiles!messages_sender_fkey(id,handle,name,photo_url),' +
              ' recipient_p:profiles!messages_recipient_fkey(id,handle,name,photo_url)')
      .order('created_at', {ascending:false}).limit(300);
    DMS = data || [];
    DMUNREAD = DMS.filter(m => m.recipient === ME.id && !m.read_at).length;
  }catch(e){ DMS = []; DMUNREAD = 0 }
}
/* one entry per person, newest first */
function threads(){
  const map = new Map();
  DMS.forEach(m => {
    const mine = m.sender === ME.id;
    const other = mine ? m.recipient_p : m.sender_p;
    if(!other) return;
    const key = other.id;
    if(!map.has(key)) map.set(key, { who:other, last:m, unread:0, msgs:[] });
    const t = map.get(key);
    t.msgs.push(m);
    if(!mine && !m.read_at) t.unread++;
  });
  return [...map.values()].map(t => ({...t, msgs:t.msgs.slice().reverse()}));
}

/* a conversation, as a sheet */
async function dmSheet(who){
  if(!await needAuth()) return;
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox dm">
    <div class="dmhead">
      <span class="whoav">${who.photo_url?`<img src="${who.photo_url}" alt="">`:esc(initials(who))}</span>
      <div class="grow"><b>${esc(who.name||who.handle)}</b><small>@${esc(who.handle)}</small></div>
      <button class="pclose" id="dmClose" style="display:grid">&#10005;</button>
    </div>
    <div class="dmthread" id="dmThread"></div>
    <div class="chatbar" style="margin-top:2px">
      <textarea id="dmText" rows="1" maxlength="2000" placeholder="Write to @${esc(who.handle)}"></textarea>
      <button class="sendbtn" id="dmSend" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
      </button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  $('dmClose').onclick = close;
  wrap.onclick = e=>{ if(e.target===wrap) close() };

  const paint = ()=>{
    const t = threads().find(x => x.who.id === who.id);
    const msgs = t ? t.msgs : [];
    const box = $('dmThread');
    box.innerHTML = msgs.length
      ? msgs.map(m => `<div class="dmmsg ${m.sender===ME.id?'mine':''}">
          <div class="dmbubble">${esc(m.text)}</div>
          <span class="dmwhen">${ago(m.created_at)}</span></div>`).join('')
      : `<p class="hint" style="margin:auto">No messages yet. Say something.</p>`;
    box.scrollTop = box.scrollHeight;
  };
  paint();

  /* mark what they sent you as read */
  const unread = DMS.filter(m => m.sender === who.id && m.recipient === ME.id && !m.read_at);
  if(unread.length){
    await sb.from('messages').update({ read_at:new Date().toISOString() })
      .eq('sender', who.id).eq('recipient', ME.id).is('read_at', null);
    unread.forEach(m => m.read_at = new Date().toISOString());
    DMUNREAD = DMS.filter(m => m.recipient === ME.id && !m.read_at).length;
    renderRail();
  }

  const t = $('dmText'), send = $('dmSend');
  t.focus();
  const grow = ()=>{ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,140)+'px';
                     send.disabled = !t.value.trim() };
  t.oninput = grow;
  const fire = async ()=>{
    const text = t.value.trim(); if(!text) return;
    send.disabled = true;
    const { error } = await sb.from('messages').insert({ sender:ME.id, recipient:who.id, text });
    if(error){ send.disabled=false; return toast(friendly(error)) }
    t.value=''; grow();
    await loadDMs(); paint();
  };
  send.onclick = fire;
  t.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); fire() } };
}

  'A decision your city or county just made, and what you think of it',
  'What you saw at a meeting other people did not go to',
  'A question you want your representative to answer',

/* every message can be pushed further — for, against, deeper, plainer */
const MSG_ACTIONS = {
  assistant: [['for','The case for'], ['against','The case against'], ['deeper','Go deeper'], ['simple','Put it simply']],
  user:      [['for','Make the case'], ['against','Argue the other side'], ['deeper','Go deeper']]
};
function actPrompt(kind, role, text){
  const q = (text||'').length > 240 ? text.slice(0,240) + '…' : (text||'');
  const it = role === 'user' ? `this: "${q}"` : 'that';
  if(kind === 'for')     return `Make the strongest case for ${it}. Who is helped, by how much, and what is the argument at its best?`;
  if(kind === 'against') return `Now the strongest honest case against ${it} — the version its smartest opponent would actually make, not a caricature. Then say where you think it holds up and where it does not.`;
  if(kind === 'deeper')  return `Go deeper on ${it}: the mechanics, who actually decides, what it costs, and where this usually goes wrong in practice.`;
  return `Put that more simply — as if explaining it to someone hearing about it for the first time.`;
}
const actionRow = (i, role) => `<div class="mact">${
  (MSG_ACTIONS[role]||[]).map(([k,label]) =>
    `<button data-mact="${k}" data-mi="${i}">${label}</button>`).join('')}</div>`;

const STARTERS = [
  'What are people on here taking positions on?',
  'Who else is in my state, and what do they care about?',
  'What should I ask my council member at the next meeting?',
  'Help me sharpen an argument I keep losing'
];
let CHAT = [], CHATKEY = null;
const chatKey = ()=> 'dai.chat.' + ((ME && ME.id) || 'signed-out');
/* load the conversation belonging to whoever is signed in right now */
function chatLoad(){
  const k = chatKey();
  if(CHATKEY === k) return;
  CHATKEY = k;
  try{ CHAT = JSON.parse(sessionStorage.getItem(k) || '[]') }catch(e){ CHAT = [] }
}
const chatSave = ()=>{ try{ sessionStorage.setItem(chatKey(), JSON.stringify(CHAT.slice(-40))) }catch(e){} };
/* signing in or out drops the conversation and forgets every stored one */
function chatReset(wipeAll){
  CHAT = []; CHATKEY = null;
  if(wipeAll){
    try{
      for(let i = sessionStorage.length - 1; i >= 0; i--){
        const k = sessionStorage.key(i);
        if(k && k.startsWith('dai.chat.')) sessionStorage.removeItem(k);
      }
    }catch(e){}
  }
}

        toast(e.message || 'That did not go through');
        CHAT.pop();                                   // let them try again cleanly
        const last = box.querySelector('.msg.me:last-of-type'); if(last) last.remove();
        t.value = text; grow();
      }
      chatSave();
      busy = false; grow();
      if(CHAT.length === 2) open_('compose', true);   // reveal the New chat button
    }

    box.addEventListener('click', e=>{
      const b = e.target.closest('[data-mact]'); if(!b || busy) return;
      const m = CHAT[+b.dataset.mi]; if(!m) return;
      ask(actPrompt(b.dataset.mact, m.role, m.content));
    });

    send.onclick = ()=>ask(t.value);
    t.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(t.value) } };
    document.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>ask(STARTERS[+b.dataset.starter]));
    document.querySelectorAll('[data-idea]').forEach(b=>b.onclick=()=>ask('Help me think about this: ' + IDEAS[+b.dataset.idea]));
    const nw=$('chNew');
    if(nw) nw.onclick=()=>{ CHAT=[]; chatSave(); open_('compose') };
  }
};

/* ------------------------------------------------------------------- issues */
S.issues = {
  sub(){ return RO ? `Where @${V.handle} stands` : 'Where you stand' },
  acts(){ return tabs('issues',[['all','Everyone'],['mine','Yours']]) },

    const own = RO || SC.issues==='mine' || !ONLINE;
    const tally = issueTally(SC.issues==='near'?'near':'all');
    const contested = tally.filter(t=>t.s+t.o>2).sort((a,b)=>Math.abs(a.s-a.o)/(a.s+a.o) - Math.abs(b.s-b.o)/(b.s+b.o)).slice(0,4);
    const common = tally.slice(0,6);
    const held = new Set(D.issues.map(i=>i.title.trim().toLowerCase()));

    return `<div class="split"><div class="main">
      ${GUEST() ? joinBar('Sign in to take a position.') : ''}
      ${(RO||GUEST())?'':`<div class="frow" style="justify-content:space-between">
        <button class="linkbtn" id="iStand">Not sure where you stand? Work it out →</button></div>
      <div class="frow">
        <input class="inp" id="iText" placeholder="Add an issue">
        <div class="seg" id="iSeg"><button class="on" data-v="Support">Support</button><button data-v="Oppose">Oppose</button></div>
        <button class="btn" id="iAdd">Add</button></div>`}
      ${note?`<p class="meta">${note}</p>`:''}
      ${loading ? '<div class="spin"></div>' : list.length?`<div class="list">${list.map(i=>{
        const a = ONLINE ? agree(i.title) : {s:0,o:0};
        const tot = a.s+a.o;
        return `<div class="item" data-id="${i.id}" style="display:block">
          ${!own && i.profiles ? who(i.profiles) : ''}
          <div style="display:flex;gap:12px;align-items:flex-start">
            <h3 class="grow">${esc(i.title)}</h3>
            <span class="tag ${i.stance==='Support'?'b':''}">${i.stance}</span>
          </div>
          ${tot>1?`<div style="margin-top:9px">${splitbar(a.s,a.o)}</div>`:''}
          <div class="rowacts">
            ${act('share','Share')}
            <button class="iconbtn" data-act="against">The case against</button>
            ${own&&!RO?act('del'):''}
          </div>
          <div class="ai" id="ai-${i.id}" hidden></div>
        </div>`}).join('')}</div>`
        :`<div class="empty"><b>No positions yet</b>${RO?'':'Say where you stand. Positions travel further than opinions.'}</div>`}
    </div>
    <aside class="side">
      ${common.length?`<div class="card"><h5>Most held</h5>
        ${common.map(t=>`<div class="row"><span style="flex:1">${esc(t.title)}</span>
          ${(!RO && !GUEST() && ONLINE && !held.has(t.title.toLowerCase()))
            ? `<button class="mini-btn" data-adopt="${esc(t.title)}">Take a side</button>`
            : `<b>${t.s+t.o}</b>`}</div>`).join('')}
      </div>`:''}
      ${contested.length?`<div class="card"><h5>Most divided</h5>
        ${contested.map(t=>`<div><div class="row"><span>${esc(t.title)}</span></div>${splitbar(t.s,t.o)}</div>`).join('')}
      </div>`:''}
    </aside></div>`;
  },
  init(){
    wireTabs(); ensure('issues','issues');
    const {list} = scoped('issues', D.issues, G.issues);
    let stance='Support';
    if(!RO && !GUEST()){
      const seg=$('iSeg'), t=$('iText');
      seg.onclick=e=>{ const b=e.target.closest('button'); if(!b) return;
        stance=b.dataset.v; [...seg.children].forEach(x=>x.classList.toggle('on',x===b)) };
      const add=async (title,st)=>{
        title=(title||t.value).trim(); if(!title) return;
        if(!await needAuth()) return;
        mutate({ local:db=>db.issues.unshift({id:uid(),title,stance:st||stance}),
          remote:async()=>(await sb.from('issues').insert({author:ME.id,title,stance:st||stance})).error, clears:['issues'] });
      };
      $('iAdd').onclick=()=>add(); t.onkeydown=e=>{ if(e.key==='Enter') add() };
      if($('iStand')) $('iStand').onclick = standSheet;
      document.querySelectorAll('[data-adopt]').forEach(b=>b.onclick=()=>{
        $('iText').value=b.dataset.adopt; $('iText').focus(); toast('Pick Support or Oppose, then Add');
      });
    }
    rows(list,(i,a,btn)=>{
      if(a==='share') return share(`${i.stance}: ${i.title}`, i.profiles && i.profiles.handle);
      if(a==='against') return suggest('ai-'+i.id, btn, 'against', `${i.stance} — ${i.title}`,
        { note:'Written by AI. Judge it for yourself.' });
      if(a==='del') return mutate({ local:db=>db.issues=db.issues.filter(x=>x.id!==i.id),
        remote:async()=>(await sb.from('issues').delete().eq('id',i.id)).error, clears:['issues'] });
    });
  }
};

S.endorsed = {
  sub(){ return 'Who is here' },
  acts(){ return tabs('endorsed',[['all','Everyone'],['mine','Following']]) },
  view(){
    if(!ONLINE) return `<div class="empty"><b>People show up once you are online</b>Connect the backend and everyone who joins appears here.</div>`;
    const all = G.people;
    const failed = LOADFAIL.people;

    const mineId = ME && ME.id;
    let people = (all||[]).filter(x=>x.id!==mineId);
    const sc = SC.endorsed;
    if(sc==='near')  people = people.filter(x=>isNear({profiles:x}));
    if(sc==='mine')  people = people.filter(x=>MYFOLLOWS.has(x.id));
    if(PSEARCH){
      const q = PSEARCH.toLowerCase();
      people = people.filter(x=>((x.name||'')+' '+(x.handle||'')+' '+(x.role||'')+' '+(x.location||'')).toLowerCase().includes(q));
    }
    const nearCount = (all||[]).filter(x=>x.id!==mineId && isNear({profiles:x})).length;
    const counts = id => ({
      posts:  (G.posts ||[]).filter(p=>p.author===id).length,
      stands: (G.issues||[]).filter(i=>i.author===id).length

    return `<div class="split"><div class="main">

        : people.length ? `<div class="grid">${people.map(x=>{
        const c = counts(x.id), following = MYFOLLOWS.has(x.id);
        return `<div class="person">
          <a class="pface" href="/${esc(x.handle)}">${x.photo_url?`<img src="${x.photo_url}" alt="">`:esc(initials(x))}</a>
          <div class="pmeta">
            <a href="/${esc(x.handle)}"><b>${esc(x.name||x.handle)}</b></a>
            <small>@${esc(x.handle)}</small>
          </div>
          ${x.role?`<p class="prole">${esc(x.role)}</p>`:''}
          ${x.location?`<span class="ploc">${esc(x.location)}</span>`:''}
          <div class="pstats">${c.stands} position${c.stands===1?'':'s'} · ${c.posts} post${c.posts===1?'':'s'}</div>
          ${ME ? `<div class="prow2">
                    <button class="btn ${following?'ghost':''}" data-follow="${x.id}">${following?'Following':'Follow'}</button>
                    <button class="btn ghost" data-dm="${x.id}">Message</button>
                  </div>`
               : `<a class="btn ghost pfollow" href="/">Sign in to follow</a>`}
        </div>`}).join('')}</div>`
        : `<div class="empty"><b>${PSEARCH?'Nobody by that name':'Nobody here yet'}</b>${PSEARCH?'Try another search.':'Share your page and this fills up.'}</div>`}
    </div>
    <aside class="side">
      ${ME ? (()=>{ const th = threads();
        return `<div class="card"><h5>Messages${DMUNREAD?` · ${DMUNREAD} new`:''}</h5>
          ${th.length ? th.slice(0,6).map(t=>`
            <button class="dmrow" data-dm="${t.who.id}">
              <span class="whoav sm">${t.who.photo_url?`<img src="${t.who.photo_url}" alt="">`:esc(initials(t.who))}</span>
              <span class="grow"><b>${esc(t.who.name||t.who.handle)}</b><small>${esc(t.last.text.slice(0,42))}</small></span>
              ${t.unread?`<span class="dot-new"></span>`:''}
            </button>`).join('')
          : '<span class="ainote">No messages yet. Say hello to someone.</span>'}
        </div>` })() : ''}
      <div class="card"><h5>The network</h5>
        <div class="row"><span>People</span><b>${(all||[]).length}</b></div>
        <div class="row"><span>In ${stateName(myState())||'your state'}</span><b>${nearCount}</b></div>
        <div class="row"><span>You follow</span><b>${MYFOLLOWS.size}</b></div>
        <div class="row"><span>Follow you</span><b>${D.followers}</b></div>
      </div>
      <div class="card"><h5>Grow it</h5>
        ${GUEST() ? `<button class="btn" data-go="profile">Create an account</button>`
                  : `<button class="btn" id="pInvite">Write an invitation</button>`}
        <span class="ainote">Sends to X, Threads, Bluesky, WhatsApp, Messages and the rest — or posts it to your feed.</span>
      </div>
      ${(all||[]).length ? `<div class="card"><h5>Newest here</h5>
        ${(all||[]).filter(x=>x.id!==mineId).slice(0,4).map(x=>personRow(x)).join('') || '<span class="ainote">Just you so far.</span>'}
      </div>`:''}
    </aside></div>`;
  },
  init(){
    wireTabs(); ensure('people','endorsed'); ensure('posts','endorsed'); ensure('issues','endorsed');
    const retry=$('pRetry');
    if(retry) retry.onclick=()=>{ delete LOADFAIL.people; G.people=null; ensure('people','endorsed'); open_('endorsed',true) };
    const q=$('pSearch');
    if(q){
      let t;
      q.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>{ PSEARCH=q.value.trim(); open_('endorsed',true);
        const el=$('pSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length) } },250) };
    }
    document.querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.dm;
      const p = (G.people||[]).find(x=>x.id===id) || (threads().find(t=>t.who.id===id)||{}).who;
      if(p) dmSheet(p);
    });
    document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=async ()=>{
      if(!await needAuth()) return;
      const id=b.dataset.follow, following=MYFOLLOWS.has(id);
      b.disabled=true;
      const { error } = following
        ? await sb.from('follows').delete().eq('follower',ME.id).eq('followee',id)
        : await sb.from('follows').insert({follower:ME.id, followee:id});
      b.disabled=false;
      if(error) return toast(friendly(error));
      following ? MYFOLLOWS.delete(id) : MYFOLLOWS.add(id);
      b.textContent = following ? 'Follow' : 'Following';
      b.classList.toggle('ghost', !following);
      setTimeout(()=>{ if(current==='endorsed') open_('endorsed',true) }, 600);
    });
    const inv=$('pInvite');
    if(inv) inv.onclick=inviteSheet;
  }
};

S.townhall = {
  sub(){ return RO ? `Events from @${V.handle}` : 'Show up in person' },
  acts(){ return tabs('townhall',[['all','Everyone'],['mine','Yours']]) },
  view(){
    const mine = RO || !ONLINE || SC.townhall==='mine';
    let {list, note, loading} = scoped('townhall', D.events, G.events);
    const today = new Date().toISOString().slice(0,10);
    const days = new Set(list.map(e=>e.date));
    if(CAL.pick) list = list.filter(e=>e.date===CAL.pick);

    const [cy,cm] = CAL.month.split('-').map(Number);
    const first = new Date(cy,cm-1,1), start = first.getDay(), len = new Date(cy,cm,0).getDate();
    const cells = [];
    for(let i=0;i<start;i++) cells.push('<button class="dim"></button>');
    for(let d=1;d<=len;d++){
      const iso = `${cy}-${String(cm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push(`<button data-day="${iso}" class="${days.has(iso)?'has':''}${CAL.pick===iso?' on':''}">${d}</button>`);
    }

    return `<div class="split"><div class="main">
      ${GUEST() ? joinBar('Sign in to add an event or RSVP.') : ''}
      ${(RO||GUEST())?'':`<div class="frow"><input class="inp" id="tTitle" placeholder="Event">
        <input class="inp" id="tDate" type="date" value="${CAL.pick||''}"></div>
      <div class="frow"><input class="inp" id="tPlace" placeholder="Where">
        <button class="linkbtn" id="tInvite" hidden>Write the invite</button>
        <button class="btn" id="tAdd">Add</button></div>
      <div class="ai" id="tAi" hidden></div>`}
      ${note?`<p class="meta">${note}</p>`:''}
      ${CAL.pick?`<p class="meta">Showing ${dfmt(CAL.pick)} · <button class="linkbtn" id="calClear">clear</button></p>`:''}
      ${loading ? '<div class="spin"></div>' : list.length?`<div class="list">${list.map(e=>`
        <div class="item" data-id="${e.id}">
          <div class="datechip" style="padding-top:2px">
            <i>${new Date(e.date+'T00:00').toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</i>
            <b>${+e.date.split('-')[2]}</b></div>
          <div class="grow">
            ${!mine && e.profiles ? who(e.profiles) : ''}
            <h3>${esc(e.title)}</h3>
            <small>${dfmt(e.date)}${e.place?' · '+esc(e.place):''}${e.going?' · '+e.going+' going':''}${e.date<today?' · past':''}</small>
            <div class="rowacts">${act('share','Share')}${(mine&&!RO)?act('del'):''}</div>
          </div>
          ${(ONLINE && !GUEST())?`<button class="tag ${e.rsvped?'b':''}" data-rsvp="${e.id}">${e.rsvped?'Going':'RSVP'}</button>`:''}
        </div>`).join('')}</div>`
        :`<div class="empty"><b>Nothing coming up</b>${mine?'Add something people can show up to.':'No events posted yet.'}</div>`}
    </div>
    <aside class="side">
      <div class="card">
        <div class="calhead">
          <button class="idnav" id="calPrev">&#8249;</button>
          <b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b>
          <button class="idnav" id="calNext">&#8250;</button>
        </div>
        <div class="cal">
          ${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}
          ${cells.join('')}
        </div>
      </div>
      ${(D.events||[]).filter(e=>e.rsvped).length?`<div class="card"><h5>You are going to</h5>
        ${D.events.filter(e=>e.rsvped).slice(0,4).map(e=>`<div class="row"><span>${esc(e.title)}</span><b>${dfmt(e.date).split(',')[1]||''}</b></div>`).join('')}
      </div>`:''}
    </aside></div>`;
  },
  init(){
    wireTabs();
    const mine = RO || !ONLINE || SC.townhall==='mine';
    let {list} = scoped('townhall', D.events, G.events);
    if(CAL.pick) list = list.filter(e=>e.date===CAL.pick);

    const shift = n => {
      const [y,m] = CAL.month.split('-').map(Number);
      const d = new Date(y, m-1+n, 1);
      CAL.month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      open_('townhall', true);
    };
    if($('calPrev')) $('calPrev').onclick=()=>shift(-1);
    if($('calNext')) $('calNext').onclick=()=>shift(1);
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
      CAL.pick = CAL.pick===b.dataset.day ? null : b.dataset.day;
      open_('townhall', true);
    });
    const cc=$('calClear'); if(cc) cc.onclick=()=>{ CAL.pick=null; open_('townhall',true) };

    if(!RO && !GUEST()){
      const T=$('tTitle'), Dt=$('tDate'), P=$('tPlace'), inv=$('tInvite');
      const canInvite = ()=>{ inv.hidden = !(T.value.trim() && Dt.value) };
      [T,Dt,P].forEach(el=>el.addEventListener('input',canInvite)); canInvite();
      inv.onclick = ()=> suggest('tAi', inv, 'invite',
        `Event: ${T.value.trim()}\nDate: ${Dt.value}\nPlace: ${P.value.trim()||'not given'}`,
        { apply:o=>share(o) , note:'Uses only what you typed.' });
      $('tAdd').onclick = async ()=>{
        const title=T.value.trim(), date=Dt.value, place=P.value.trim();
        if(!title||!date) return toast('Add a name and a date');
        if(!await needAuth()) return;
        mutate({ local:db=>db.events.push({id:uid(),title,date,place}),
          remote:async()=>(await sb.from('events').insert({author:ME.id,title,date,place})).error, clears:['events'] });
      };
    }
    document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=async ()=>{
      if(!await needAuth()) return;
      const e=list.find(x=>x.id===b.dataset.rsvp); if(!e) return;
      mutate({ remote:async()=>{ const q = e.rsvped
        ? await sb.from('rsvps').delete().eq('event_id',e.id).eq('user_id',ME.id)
        : await sb.from('rsvps').insert({event_id:e.id,user_id:ME.id});
        return q.error }, clears:['events'] });
    });
    rows(list,(e,a)=>{
      if(a==='share') return share(`${e.title} — ${dfmt(e.date)}${e.place?' at '+e.place:''}`, e.profiles && e.profiles.handle);
      if(a==='del') return mutate({ local:db=>db.events=db.events.filter(x=>x.id!==e.id),
        remote:async()=>(await sb.from('events').delete().eq('id',e.id)).error, clears:['events'] });
    });
  }
};

/* answer a question and it stays on screen with its result, rather than
   vanishing off the Answer tab the instant you touch it */
let JUSTVOTED = new Set();

/* who answers the way you do */
function pollAllies(){
  const mine = new Map();
  (G.polls || []).forEach(p=>{ if(p.voted) mine.set(p.id, p.voted) });
  if(!mine.size) return [];
  const by = new Map();
  (G.polls || []).forEach(p=>{
    const my = mine.get(p.id); if(!my) return;
    (p.votes || []).forEach(v=>{
      if(!v.u || (ME && v.u === ME.id)) return;
      const e = by.get(v.u) || {agree:0, total:0, id:v.u};
      e.total++; if(v.o === my) e.agree++;
      by.set(v.u, e);
    });
  });
  const people = G.people || [];
  return [...by.values()].filter(x => x.total >= 2)
    .map(x => ({...x, p: people.find(pp => pp.id === x.id)}))
    .filter(x => x.p)
    .sort((a,b)=> (b.agree/b.total) - (a.agree/a.total) || b.total - a.total).slice(0, 5);
}

function pollCard(p, opts){
  const os = (p.poll_options || []).slice().sort((a,b)=>(a.ord||0)-(b.ord||0));
  const tot = p.total || 0;
  const show = !!p.voted || PEEK.has(p.id) || (ME && p.author === ME.id) || RO || !ONLINE;
  const lead = show && tot ? Math.max(...os.map(o=>o.v || 0)) : -1;
  return `<article class="poll" data-poll="${p.id}">
    ${(opts && opts.who && p.profiles) ? who(p.profiles) : ''}
    <h3>${esc(p.question)}</h3>
    <small>${tot} ${tot===1?'answer':'answers'}${p.voted ? ' &middot; you answered'
      : show ? '' : ' &middot; pick one to see the result'}${
      p.created_at ? ` &middot; <span data-ts="${p.created_at}" data-noloc>${ago(p.created_at)}</span>` : ''}</small>
    <div class="pops">${os.map(o=>{
      const pc = tot ? Math.round((o.v || 0) / tot * 100) : 0;
      return `<button class="pop${p.voted===o.id?' mine':''}${show?' shown':''}${
          show && (o.v||0) === lead && tot ? ' lead' : ''}" data-opt="${o.id}">
        <span class="pfill" style="width:${show ? pc : 0}%"></span>
        <span class="ptext">${esc(o.text)}</span>
        ${show ? `<span class="ppc">${pc}%<i>${o.v || 0}</i></span>` : ''}
      </button>`}).join('')}</div>
    <div class="rowacts">
      ${act('share','Share')}
      ${(!show && !GUEST()) ? `<button class="iconbtn" data-peek="${p.id}">See the result</button>` : ''}
      ${(p.voted && !RO) ? `<button class="iconbtn" data-clear="${p.id}">Change my answer</button>` : ''}
      ${(ME && p.author === ME.id && !RO) ? act('del') : ''}
    </div>
  </article>`;
}

S.polls = {
  sub(){ return RO ? `Questions from @${V.handle}` : 'Ask the room, then listen to it' },
  acts(){
    const tb = RO ? [] : [['open','Answer'],['mine','Yours'],['all','Everyone']];
    return `${tb.length ? `<div class="seg tabs" data-tabs="polls">${tb.map(([v,l])=>
      `<button class="${(SC.polls||'open')===v?'on':''}" data-v="${v}">${l}</button>`).join('')}</div>` : ''}
      ${(RO||GUEST())?'':`<button class="btn ghost" id="pAsk">Ask</button>`}`;
  },
  view(){
    /* anything unexpected in SC.polls used to leave the screen blank */
    const mode = RO ? 'mine'
      : ['open','mine','all'].includes(SC.polls) ? SC.polls : (SC.polls = 'all');
    const all = (RO || !ONLINE) ? (D.polls || []) : (G.polls || []);
    const loading = !RO && ONLINE && G.polls === null;
    const unanswered = all.filter(p => !p.voted || JUSTVOTED.has(p.id));
    const answeredN = all.filter(p => p.voted).length;
    const busiest = [...all].filter(p=>p.total).sort((a,b)=>(b.total||0)-(a.total||0)).slice(0,4);
    const close = [...all].filter(p => (p.total||0) >= 3).map(p=>{
      const os = p.poll_options || [];
      const top = [...os].sort((a,b)=>(b.v||0)-(a.v||0));
      const gap = top.length > 1 ? ((top[0].v||0) - (top[1].v||0)) / (p.total||1) : 1;
      return {p, gap};
    }).sort((a,b)=>a.gap - b.gap).slice(0,3);
    const friends = pollAllies();

    /* the shelf of questions ready to go, at the top where it can be used */
    const shelf = (RO || GUEST()) ? '' : `<section class="shelf">
      <div class="shelfhead">
        <h4>Ready to ask</h4>
        <div class="topicbar">${PLIB.map(g=>
          `<button class="tchip${PTOPIC===g.t?' on':''}" data-plib="${esc(g.t)}">${esc(g.t)}</button>`).join('')}</div>

      <div class="shelfrow">${(PLIB.find(g=>g.t===PTOPIC) || PLIB[0]).items.map(it=>{

            asked ? 'Already asked' : 'Ask this'}</button>

    </section>`;

    let main = '';
    if(mode === 'open'){
      const list = unanswered;
      main = `${GUEST() ? joinBar('Sign in to answer, or ask your own.') : ''}
        ${shelf}
        ${loading ? skel(3)
          : list.length ? `<div class="polls">${list.map(p=>pollCard(p, {who:true})).join('')}</div>`
          : `<div class="empty"><b>${all.length ? 'You have answered everything' : 'No questions yet'}</b>${
              all.length ? 'Ask one from the shelf and see what the room says.'

    }

    if(mode === 'mine'){
      const list = D.polls || [];
      main = list.length ? `<div class="polls">${list.map(p=>pollCard(p, {who:false})).join('')}</div>`
        : `<div class="empty"><b>${RO?'No questions yet':'You have not asked anything'}</b>${
            RO ? 'Nothing here.' : 'Pick one from the list, or write your own.'}</div>`;
    }

    if(mode === 'all'){
      const list = [...all].sort((a,b)=>(b.total||0)-(a.total||0));
      main = `${GUEST() ? joinBar('Sign in to answer, or ask your own.') : ''}
        ${shelf}
        ${loading ? skel(3) : list.length
          ? `<div class="polls">${list.map(p=>pollCard(p, {who:true})).join('')}</div>`
          : `<div class="empty"><b>Nothing asked yet</b>Ask one from the shelf above.</div>`}`;
    }

    return `<div class="split"><div class="main">${main}</div>
    <aside class="side">
      ${(RO||GUEST())?'':`<div class="card"><h5>You</h5>

      </div>`:''}
      ${busiest.length?`<div class="card"><h5>Most answered</h5>
        ${busiest.map(p=>`<div class="row"><span style="flex:1">${esc(p.question)}</span>
          <b>${p.total}</b></div>`).join('')}
      </div>`:''}
      ${friends.length?`<div class="card"><h5>Answers like yours</h5>

          `<span class="tag ${f.agree/f.total>=0.7?'b':''}">${Math.round(f.agree/f.total*100)}%</span>`)).join('')}
      </div>`:''}

    rows(all, (p,a)=>{
      if(a==='share') return share(p.question, p.profiles && p.profiles.handle);
      if(a==='del') return mutate({ local:db=>db.polls = (db.polls||[]).filter(x=>x.id!==p.id),
        remote:async()=>(await sb.from('polls').delete().eq('id',p.id)).error, clears:['polls'] });
    });
  }
};

async function askPoll(question, options){
  question = String(question||'').trim();
  const opts = (options||[]).map(o=>String(o).trim()).filter(Boolean).slice(0,5);
  if(question.length < 5 || opts.length < 2) return toast('A question and at least two answers');
  if(!await needAuth()) return;
  await mutate({
    local: db => db.polls.unshift({id:uid(), question, total:0, voted:null,
      created_at:new Date().toISOString(),
      poll_options: opts.map((t,i)=>({id:uid(), text:t, v:0, ord:i}))}),
    remote: async ()=>{
      const ins = await sb.from('polls').insert({author:ME.id, question}).select().single();
      if(ins.error) return ins.error;
      return (await sb.from('poll_options')
        .insert(opts.map((t,i)=>({poll_id:ins.data.id, text:t, ord:i})))).error;
    }, clears:['polls'] });
  toast('Asked');
}

/* -------------------------------------------------------------------- reach
   Every number here is counted from rows in the database — no estimates, no
   modelling. The charts are hand-drawn SVG so there is no library to load and
   nothing to go stale. */
let RANGE = 30;
const DAY = 864e5;
const isoDay = d => new Date(d).toISOString().slice(0,10);
const dayList = n => [...Array(n)].map((_,i)=>{
  const d = new Date(Date.now() - (n - 1 - i) * DAY);
  return { iso: isoDay(d), d };
});
const fmtDay = iso => {
  const [y,m,dd] = iso.split('-').map(Number);
  return new Date(y, m-1, dd).toLocaleDateString(undefined, {month:'short', day:'numeric'});
};
const nice = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(n||0);

async function loadReach(force){
  if(!ONLINE || !ME) { G.reach = G.reach || null; return }
  if(G.reach && !force && Date.now() - G.reach.at < 60e3) return;
  const ok = r => (r && !r.error && r.data) ? r.data : [];
  try{
    const [posts, folls, shares, events, polls, issues] = await Promise.all([
      sb.from('posts').select('id,text,created_at,image_url').eq('author',ME.id).then(ok,()=>[]),
      sb.from('follows').select('follower,created_at').eq('followee',ME.id).then(ok,()=>[]),
      sb.from('shares').select('created_at').eq('profile_id',ME.id).then(ok,()=>[]),
      sb.from('events').select('id,title,date').eq('author',ME.id).then(ok,()=>[]),
      sb.from('polls').select('id,question,created_at').eq('author',ME.id).then(ok,()=>[]),
      sb.from('issues').select('id,title,stance,created_at').eq('author',ME.id).then(ok,()=>[])
    ]);
    const pid = posts.map(p=>p.id), eid = events.map(e=>e.id), qid = polls.map(p=>p.id);
    const [likes, cmts, rsvps, votes] = await Promise.all([
      pid.length ? sb.from('likes').select('post_id,user_id,created_at').in('post_id',pid).then(ok,()=>[]) : [],
      pid.length ? sb.from('comments').select('post_id,author,created_at').in('post_id',pid).then(ok,()=>[]) : [],
      eid.length ? sb.from('rsvps').select('event_id,user_id,created_at').in('event_id',eid).then(ok,()=>[]) : [],
      qid.length ? sb.from('poll_votes').select('poll_id,user_id,created_at').in('poll_id',qid).then(ok,()=>[]) : []
    ]);
    /* where the people who follow you are */
    let where = [];
    const fids = folls.map(f=>f.follower).filter(Boolean);
    if(fids.length){
      const pr = await sb.from('profiles').select('id,location').in('id', fids).then(ok,()=>[]);
      where = pr.map(p=>p.location).filter(Boolean);
    }
    G.reach = {posts, likes, cmts, folls, shares, rsvps, votes, events, polls, issues, where, at:Date.now()};
  }catch(e){ G.reach = G.reach || {posts:[],likes:[],cmts:[],folls:[],shares:[],rsvps:[],votes:[],
                                   events:[],polls:[],issues:[],where:[],at:Date.now()} }
}

/* ------------------------------------------------------------------ charts */
function sparkPath(vals, w, h){
  if(!vals.length) return '';
  const max = Math.max(1, ...vals);
  const step = vals.length > 1 ? w / (vals.length - 1) : w;
  return vals.map((v,i)=>`${i?'L':'M'}${(i*step).toFixed(1)} ${(h - (v/max)*h).toFixed(1)}`).join(' ');
}
function sparkline(vals, cls){
  const w = 120, h = 30;
  const p = sparkPath(vals, w, h);
  if(!p) return '';
  return `<svg class="spk ${cls||''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${p} L ${w} ${h} L 0 ${h} Z" class="spkfill"/>
    <path d="${p}" class="spkline"/></svg>`;
}

/* the main chart: what you put out, and what came back, day by day */
function areaChart(days, out, back){
  const W = 720, H = 190, PAD = 26;
  const n = days.length;
  const max = Math.max(2, ...back, ...out);
  const x = i => PAD + (n > 1 ? i * (W - PAD*2) / (n - 1) : 0);
  const y = v => H - 24 - (v / max) * (H - 46);
  const line = arr => arr.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const grid = [0, .5, 1].map(f=>{
    const v = Math.round(max * f);
    return `<line class="gl" x1="${PAD}" x2="${W-PAD}" y1="${y(v)}" y2="${y(v)}"/>
            <text class="gt" x="4" y="${y(v)+3.5}">${v}</text>`;
  }).join('');
  const bars = out.map((v,i)=>{
    if(!v) return '';
    const bw = Math.max(2.5, Math.min(12, (W - PAD*2) / n * 0.5));
    return `<rect class="cbar" x="${(x(i)-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw}"
      height="${(H - 24 - y(v)).toFixed(1)}" rx="${(bw/2.6).toFixed(1)}">
      <title>${fmtDay(days[i].iso)} — ${v} from you</title></rect>`;
  }).join('');
  const ticks = days.map((d,i)=>{
    const every = n > 45 ? 15 : n > 20 ? 7 : n > 8 ? 3 : 1;
    if(i % every && i !== n-1) return '';
    return `<text class="gt" x="${x(i)}" y="${H-6}" text-anchor="middle">${fmtDay(d.iso).replace(/^(\w+) /,'$1 ')}</text>`;
  }).join('');
  const dots = back.map((v,i)=> v ? `<circle class="cdot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6">
      <title>${fmtDay(days[i].iso)} — ${v} back</title></circle>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Activity over the last ${n} days">
    ${grid}${bars}
    <path class="carea" d="${line(back)} L ${x(n-1)} ${H-24} L ${x(0)} ${H-24} Z"/>
    <path class="cline" d="${line(back)}"/>
    ${dots}${ticks}
  </svg>`;
}

/* the mix of what came back */
function donut(parts){
  const total = parts.reduce((s,p)=>s+p.v, 0);
  const R = 54, C = 2 * Math.PI * R;
  let at = 0;
  const rings = parts.filter(p=>p.v).map((p,i)=>{
    const frac = p.v / total;
    const seg = `<circle class="dseg d${i}" r="${R}" cx="70" cy="70"
      stroke-dasharray="${(frac*C - 2).toFixed(1)} ${C}" stroke-dashoffset="${(-at*C).toFixed(1)}">
      <title>${p.k}: ${p.v}</title></circle>`;
    at += frac;
    return seg;
  }).join('');
  return `<div class="donutwrap">
    <svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Where engagement came from">
      <circle class="dbg" r="${R}" cx="70" cy="70"/>${rings}
      <text class="dnum" x="70" y="68" text-anchor="middle">${nice(total)}</text>
      <text class="dlab" x="70" y="86" text-anchor="middle">in return</text>
    </svg>
    <div class="dkeys">${parts.filter(p=>p.v).map((p,i)=>
      `<div class="dkey"><i class="d${i}"></i><span>${esc(p.k)}</span><b>${nice(p.v)}</b></div>`).join('')}</div>
  </div>`;
}

/* twelve weeks of showing up */
function streakGrid(active){
  const weeks = 12, cells = weeks * 7;
  const start = new Date(Date.now() - (cells - 1) * DAY);
  const cols = [];
  for(let wk = 0; wk < weeks; wk++){
    const col = [];
    for(let d = 0; d < 7; d++){
      const day = new Date(start.getTime() + (wk*7 + d) * DAY);
      const iso = isoDay(day);
      const n = active[iso] || 0;
      col.push(`<rect class="sq l${n === 0 ? 0 : n === 1 ? 1 : n < 4 ? 2 : 3}"
        x="${wk*13}" y="${d*13}" width="10" height="10" rx="2.5">
        <title>${fmtDay(iso)} — ${n ? n + (n===1?' thing':' things') : 'nothing'}</title></rect>`);
    }
    cols.push(col.join(''));
  }
  return `<svg class="grid12" viewBox="0 0 ${weeks*13 - 3} ${7*13 - 3}" role="img"
    aria-label="Twelve weeks of activity">${cols.join('')}</svg>`;
}
function hbars(rows, unit){
  const max = Math.max(1, ...rows.map(r=>r.v));
  return `<div class="hbars">${rows.map(r=>`<div class="hbar">
    <span class="hlab">${esc(r.k)}</span>
    <span class="htrack"><i style="width:${Math.round(r.v/max*100)}%"></i></span>
    <b>${nice(r.v)}${unit||''}</b></div>`).join('')}</div>`;
}

S.reach = {
  sub(){ return RO ? `@${V.handle} in numbers` : 'Counted, not estimated' },
  acts(){
    if(RO || GUEST()) return '';
    return `<div class="seg tabs" id="rgRange">${[[7,'7 days'],[30,'30 days'],[90,'90 days']]
      .map(([v,l])=>`<button class="${RANGE===v?'on':''}" data-r="${v}">${l}</button>`).join('')}</div>`;
  },
  view(){
    if(GUEST()) return `<div class="screen">${joinBar('Sign in to see how far your posts travel.')}</div>`;
    const R = G.reach;
    if(ONLINE && !RO && !R) return `<div class="screen">${skel(4)}</div>`;

    /* offline or another person's page: work from what is already loaded */
    const src = (R && !RO) ? R : {
      posts: D.posts || [], likes: [], cmts: [], folls: [], shares: [], rsvps: [], votes: [],
      events: D.events || [], polls: D.polls || [], issues: D.issues || [], where: []
    };
    const days = dayList(RANGE);
    const from = Date.now() - RANGE * DAY;
    const prevFrom = from - RANGE * DAY;
    const inRange = ts => ts && new Date(ts).getTime() >= from;
    const inPrev  = ts => ts && new Date(ts).getTime() >= prevFrom && new Date(ts).getTime() < from;

    /* everything that came back to you */
    const backEvents = [
      ...src.likes.map(x=>({t:x.created_at, k:'Likes'})),
      ...src.cmts .map(x=>({t:x.created_at, k:'Replies'})),
      ...src.folls.map(x=>({t:x.created_at, k:'Follows'})),
      ...src.shares.map(x=>({t:x.created_at, k:'Shares'})),
      ...src.rsvps.map(x=>({t:x.created_at, k:'RSVPs'})),
      ...src.votes.map(x=>({t:x.created_at, k:'Votes'}))
    ].filter(x=>x.t);
    const outEvents = [
      ...src.posts .map(x=>({t:x.created_at})),
      ...src.polls .map(x=>({t:x.created_at})),
      ...src.issues.map(x=>({t:x.created_at}))
    ].filter(x=>x.t);

    const perDay = (list) => {
      const m = {}; days.forEach(d=>m[d.iso] = 0);
      list.forEach(x=>{ const k = isoDay(x.t); if(k in m) m[k]++ });
      return days.map(d=>m[d.iso]);
    };
    const outSeries  = perDay(outEvents);
    const backSeries = perDay(backEvents);

    const now = {
      back: backEvents.filter(x=>inRange(x.t)).length,
      out:  outEvents.filter(x=>inRange(x.t)).length,
      foll: src.folls.filter(x=>inRange(x.created_at)).length,
      share:src.shares.filter(x=>inRange(x.created_at)).length
    };
    const was = {
      back: backEvents.filter(x=>inPrev(x.t)).length,
      out:  outEvents.filter(x=>inPrev(x.t)).length,
      foll: src.folls.filter(x=>inPrev(x.created_at)).length,
      share:src.shares.filter(x=>inPrev(x.created_at)).length
    };
    const delta = (a,b)=>{
      if(!b) return a ? {d:'up', t:'new'} : {d:'flat', t:'—'};
      const pc = Math.round((a - b) / b * 100);
      return {d: pc > 0 ? 'up' : pc < 0 ? 'down' : 'flat',
              t: (pc > 0 ? '+' : '') + pc + '%'};
    };

    const mix = [
      {k:'Likes',   v:src.likes .filter(x=>inRange(x.created_at)).length},
      {k:'Replies', v:src.cmts  .filter(x=>inRange(x.created_at)).length},
      {k:'Follows', v:src.folls .filter(x=>inRange(x.created_at)).length},
      {k:'Shares',  v:src.shares.filter(x=>inRange(x.created_at)).length},
      {k:'Votes',   v:src.votes .filter(x=>inRange(x.created_at)).length},
      {k:'RSVPs',   v:src.rsvps .filter(x=>inRange(x.created_at)).length}
    ].sort((a,b)=>b.v-a.v);

    /* how often you showed up, twelve weeks back */
    const active = {};
    outEvents.forEach(x=>{ const k = isoDay(x.t); active[k] = (active[k]||0) + 1 });
    const streak = (()=>{ let n = 0;
      for(let i = 0; ; i++){
        const k = isoDay(new Date(Date.now() - i*DAY));
        if(active[k]) n++; else if(i) break;
        if(i > 400) break;
      }
      return n; })();
    const activeDays = Object.keys(active).filter(k => k >= days[0].iso).length;

    /* which day of the week actually lands */
    const byDow = [0,0,0,0,0,0,0], postDow = [0,0,0,0,0,0,0];
    src.posts.forEach(p=>{ if(p.created_at) postDow[new Date(p.created_at).getDay()]++ });
    src.likes.concat(src.cmts).forEach(x=>{ if(x.created_at) byDow[new Date(x.created_at).getDay()]++ });
    const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const bestDow = byDow.indexOf(Math.max(...byDow));

    /* your best posts, by what came back */
    const perPost = {};
    src.likes.forEach(l=>{ perPost[l.post_id] = (perPost[l.post_id]||0) + 1 });
    src.cmts .forEach(c=>{ perPost[c.post_id] = (perPost[c.post_id]||0) + 2 });   /* a reply is worth more */
    const topPosts = [...src.posts].map(p=>({p, v: perPost[p.id] || 0}))
      .sort((a,b)=>b.v - a.v).filter(x=>x.v).slice(0,5);

    /* where your followers are */
    const places = {};
    src.where.forEach(loc=>{ const st = stateOf(loc); const k = st ? stateName(st) : loc.split(',').pop().trim();
      if(k) places[k] = (places[k]||0) + 1 });
    const placeRows = Object.entries(places).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v).slice(0,6);

    const nothing = !outEvents.length && !backEvents.length;
    const card = (label, val, d, spark) => `<div class="metric">
      <span class="mlab">${label}</span>
      <b class="mval">${nice(val)}</b>
      <span class="mdel ${d.d}">${d.t}</span>
      ${spark || ''}</div>`;

    return `<div class="split"><div class="main">
      <div class="metrics">
        ${card('Came back', now.back, delta(now.back, was.back), sparkline(backSeries))}
        ${card('You put out', now.out, delta(now.out, was.out), sparkline(outSeries, 'alt'))}
        ${card('New followers', now.foll, delta(now.foll, was.foll))}
        ${card('Shares', now.share, delta(now.share, was.share))}
      </div>

      ${nothing ? `<div class="empty"><b>Nothing to measure yet</b>Post something, take a position,
        ask a question — then this page has something to say.</div>` : `
      <div class="card"><h5>The last ${RANGE} days</h5>
        ${areaChart(days, outSeries, backSeries)}
        <div class="clegend">
          <span><i class="k1"></i>What came back</span>
          <span><i class="k2"></i>What you put out</span>
        </div>
      </div>

      ${mix.some(m=>m.v) ? `<div class="card"><h5>Where it came from</h5>${donut(mix)}</div>` : ''}

      <div class="card"><h5>Showing up</h5>
        ${streakGrid(active)}
        <div class="row"><span>Active days in the last ${RANGE}</span><b>${activeDays}</b></div>
        <div class="row"><span>Current run</span><b>${streak} day${streak===1?'':'s'}</b></div>
        ${byDow[bestDow] ? `<div class="row"><span>People answer most on</span>
          <b>${DOW[bestDow]}</b></div>` : ''}
      </div>

      ${topPosts.length ? `<div class="card"><h5>What travelled furthest</h5>
        ${topPosts.map(({p,v})=>`<button class="toppost" data-open="${p.id}">
          <span class="grow"><span class="tptext">${esc(trim60(p.text))}</span>
            <small>${ago(p.created_at)}</small></span>
          <b>${v}</b></button>`).join('')}
      </div>` : ''}`}
    </div>
    <aside class="side">
      <div class="stats">
        <button data-stat="shares"><b>${nice(src.shares.length || D.shares)}</b><span>Shares</span></button>
        <button data-stat="followers"><b>${nice(src.folls.length || D.followers)}</b><span>Followers</span></button>
        <button data-stat="likes"><b>${nice(src.likes.length)}</b><span>Likes</span></button>
        <button data-stat="votes"><b>${nice(src.votes.length)}</b><span>Votes</span></button>
      </div>
      ${placeRows.length ? `<div class="card"><h5>Where they are</h5>
        ${hbars(placeRows)}
      </div>` : ''}
      <div class="card"><h5>What you have built</h5>
        ${hbars([
          {k:'Posts', v:src.posts.length},
          {k:'Positions', v:src.issues.length},
          {k:'Questions', v:src.polls.length},
          {k:'Events', v:src.events.length}
        ].filter(r=>r.v))}
        ${!src.posts.length && !src.issues.length ? `<p class="hint" style="text-align:left">Nothing yet.</p>` : ''}
      </div>
      ${(!RO)?`<div class="card"><h5>Push it further</h5>
        <button class="mini-btn" id="rShare" style="align-self:flex-start">Share your page</button>
        <button class="mini-btn" id="rInvite" style="align-self:flex-start">Invite someone</button>
        <p class="hint" style="text-align:left;color:var(--dim)">Every number here is a row in the
          database. Nothing is estimated.</p>
      </div>`:''}
    </aside></div>`;
  },
  init(){
    if(GUEST()) return;
    if(ONLINE && !RO && !G.reach)
      loadReach().then(()=>{ if(current === 'reach') open_('reach', true) });
    const rg = $('rgRange');
    if(rg) rg.onclick = e=>{
      const b = e.target.closest('button'); if(!b) return;
      RANGE = +b.dataset.r; open_('reach', true);
    };
    const r = $('rShare');

    const inv = $('rInvite');
    if(inv) inv.onclick = inviteSheet;
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick = ()=>openPost(b.dataset.open));
    wireStats();
  }
};

function open_(id, quiet){
  const a = APPS.find(x=>x.id===id), s = S[id]; if(!a||!s) return;
  const first = current!==id;
  if(first && current === 'polls' && typeof JUSTVOTED !== 'undefined') JUSTVOTED.clear();
  /* a repaint should never throw you back to the top, and coming back to a
     screen should put you where you left it */
  const oldBody = panel.querySelector('.pbody');
  if(current) SCROLLS[current] = phone() ? (window.scrollY || 0)
                                         : (oldBody ? oldBody.scrollTop : 0);
  const keep = first ? (SCROLLS[id] || 0) : (phone() ? (window.scrollY || 0)
                                                     : (oldBody ? oldBody.scrollTop : 0));
  current = id;
  delete panel.dataset.edit;
  document.querySelectorAll('.app').forEach(el=>el.classList.toggle('on', el.dataset.id===id));
  const sub = typeof s.sub==='function' ? s.sub() : s.sub;
  const stamp = `<span class="stamp">Updated ${new Date().toLocaleTimeString(undefined,
    {hour:'numeric', minute:'2-digit'})}</span>`;
  panel.innerHTML = `<header class="phead">
      <span class="hicon">${icon(a)}</span>
      <div class="grow">${s.head?s.head():`<h2>${a.name}</h2><p>${sub}${stamp}</p>`}</div>
      <div class="acts">${s.acts?s.acts():''}<button class="pclose" id="pclose">&#10005;</button></div>
    </header>
    <div class="pbody">${s.view()}</div>`;
  if(id==='compose' || id==='townhall') panel.querySelector('.pbody').classList.add('chatbody');
  if(s.init) s.init();
  const body = panel.querySelector('.pbody');
  if(phone()){ if(keep) requestAnimationFrame(()=>window.scrollTo(0, keep));
               else if(first) window.scrollTo(0, 0); }
  else if(body && keep) body.scrollTop = keep;
  document.body.classList.add('open');
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open_(b.dataset.go));
  $('pclose').onclick = ()=>{ document.body.classList.remove('open'); current='';
    document.querySelectorAll('.app').forEach(x=>x.classList.remove('on')) };
  if(!quiet) renderRail();

  /* fill in everyone's content the first time a social screen opens */
  if(first && ONLINE && !RO){
    const kind = {feed:'posts', polls:'polls', townhall:'events'}[id];
    if(kind && !G[kind]) loadGlobal(kind).then(()=>{ if(current===id) open_(id,true) });
  }
}

rail.addEventListener('click', e=>{
  const b = e.target.closest('.app'); if(!b || b.dataset.more) return;
  if(b.dataset.id==='profile' && RO){ location.href = '/'; return; }  /* back to your own page */
  open_(b.dataset.id);
});

/* ---------------- live: the database tells us when anything changes -------- */
const REACH_TABLES = new Set(['posts','likes','comments','follows','shares','rsvps','poll_votes',
                              'polls','issues','events']);
const TABLE_KIND = {posts:'posts', likes:'posts', comments:'posts', saves:'saved', polls:'polls', poll_options:'polls',
                    poll_votes:'polls', events:'events', rsvps:'events', issues:'issues',
                    endorsements:'ends', profiles:null, messages:null, room_messages:'room'};
let liveTimer;
function goLive(){
  if(!ONLINE || !sb.channel) return;
  sb.channel('everything')
    .on('postgres_changes', {event:'*', schema:'public'}, payload => {
      if(payload.table === 'messages'){               /* the hub updates in place */
        loadDMs().then(()=>{ renderRail(); if(HUB) paintHub() });
        return;
      }
      if(payload.table === 'room_messages'){          /* the floor updates in place */
        loadRoom().then(()=>{
          if(current === 'townhall'){ paintRoom(); paintLiveFeed() }
          paintTicker();
        });
        return;
      }
      if(REACH_TABLES.has(payload.table)) G.reach = null;
      const kind = TABLE_KIND[payload.table];
      if(kind !== undefined) G[kind] = null;
      clearTimeout(liveTimer);
      liveTimer = setTimeout(refreshLive, 500);
    })
    .subscribe();
}
let FEEDTOP = '';                     /* newest story on screen, so we can count what arrives after */
async function refreshLive(){
  const typing = ['INPUT','TEXTAREA'].includes((document.activeElement||{}).tagName);
  const body = panel.querySelector('.pbody');
  const deep = !!(body && body.scrollTop > 180);
  await load();
  const kind = {feed:'posts', polls:'polls', townhall:'events', issues:'issues', endorsed:'ends'}[current];
  if(kind) await loadGlobal(kind);
  if(SC.feed === 'saved') await loadSaved();
  if(current === 'reach' && !G.reach) await loadReach();
  if(typing || deep){                 /* never yank the page out from under someone */
    renderRail(); paintTicker();
    if(current === 'feed') newPill();
    return;
  }
  render();
}
/* something arrived while you were reading — offer it rather than jumping */
function newPill(){
  const main = panel.querySelector('.split>.main'); if(!main) return;
  const n = (G.posts || []).filter(p => FEEDTOP && p.created_at > FEEDTOP
                                     && (!ME || p.author !== ME.id)).length;
  const old = $('newPill');
  if(!n){ if(old) old.remove(); return }
  const label = `${n} new post${n===1?'':'s'}`;
  if(old){ old.textContent = label; return }
  const b = document.createElement('button');
  b.className = 'newpill'; b.id = 'newPill'; b.textContent = label;
  b.onclick = ()=>{
    const body = panel.querySelector('.pbody');
    if(body) body.scrollTop = 0;
    open_('feed', true);
  };
  main.insertBefore(b, main.firstChild);
}

/* ====================================================================== theme
   Light by default, dark when the system asks for it, and one button to
   overrule either. The choice is remembered per browser. */
let THEME = (()=>{ try{ return localStorage.getItem('dai.theme') || 'auto' }catch(e){ return 'auto' } })();
const SUNSVG  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/></svg>';
const MOONSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2Z"/></svg>';
const prefersDark = ()=>{ try{ return matchMedia('(prefers-color-scheme:dark)').matches }catch(e){ return false } };
const themeNow = () => THEME === 'auto' ? (prefersDark() ? 'dark' : 'light') : THEME;

function applyTheme(){
  const t = themeNow();
  document.documentElement.dataset.theme = t;
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', t === 'dark' ? '#080b12' : '#ffffff');
  const b = $('tTheme');
  if(b){ b.innerHTML = t === 'dark' ? SUNSVG : MOONSVG;
         b.title = b.ariaLabel = t === 'dark' ? 'Light mode' : 'Dark mode'; }
}
function toggleTheme(){
  THEME = themeNow() === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem('dai.theme', THEME) }catch(e){}
  applyTheme();
}
try{ matchMedia('(prefers-color-scheme:dark)')
      .addEventListener('change', ()=>{ if(THEME==='auto') applyTheme() }) }catch(e){}

/* ============================================================ text that links
   @handles open profiles, #topics filter the feed. Escaped first, so nothing
   anyone types can become markup. */
function rich(t){
  return esc(t || '')
    /* real links, opened safely, shown without the scheme */
    .replace(/(^|[\s(\[])((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]])/gi, (m,a,url)=>{
      const href = /^www\./i.test(url) ? 'https://' + url : url;
      const show = url.replace(/^https?:\/\//i,'').replace(/\/$/,'');
      return `${a}<a class="wlink" href="${href}" target="_blank" rel="noopener noreferrer nofollow">${
        show.length > 46 ? show.slice(0,46) + '…' : show}</a>`;
    })
    .replace(/(^|[\s(\[])@([a-zA-Z0-9_]{2,20})\b/g,
      (m,a,h)=>`${a}<a class="mention" href="/${h.toLowerCase()}">@${h}</a>`)
    .replace(/(^|[\s(\[])#([a-zA-Z0-9_]{2,30})\b/g,
      (m,a,h)=>`${a}<button class="hash" data-tag="${h.toLowerCase()}">#${h}</button>`);
}

/* ------------------------------------------------------------------- muting
   Entirely on this device: no list of who you have muted leaves the browser. */
let MUTED = new Set((()=>{ try{ return JSON.parse(localStorage.getItem('dai.muted') || '[]') }
                           catch(e){ return [] } })());
const isMuted = h => !!h && MUTED.has(String(h).toLowerCase());
function saveMuted(){ try{ localStorage.setItem('dai.muted', JSON.stringify([...MUTED])) }catch(e){} }
function muteToggle(handle){
  const h = String(handle||'').toLowerCase(); if(!h) return;
  if(MUTED.has(h)){ MUTED.delete(h); toast('@'+h+' unmuted') }
  else { MUTED.add(h); toast('@'+h+' muted on this device') }
  saveMuted();
  G.saved = null;
  render();
}
const unmuted = rows => (rows || []).filter(r => !isMuted(r.profiles && r.profiles.handle));
function mutedSheet(){
  const list = [...MUTED];
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3>Muted</h3>
    ${list.length ? `<div class="menu">${list.map(h=>
      `<button data-un="${esc(h)}">@${esc(h)}<span style="margin-left:auto;color:var(--blue)">Unmute</span></button>`
      ).join('')}</div>`
    : `<p class="sheetmsg">You have not muted anyone. Muting hides someone from your feed on this
       device only — they are not told, and nothing is sent anywhere.</p>`}
    <div class="sheetfoot"><button class="btn ghost" id="muClose">Close</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('muClose').onclick = close;

}

/* resize on the way out: nobody needs a 12 megapixel photo in a feed */
function shrink(file, max, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => cb(b, c.toDataURL('image/jpeg', .86)), 'image/jpeg', .86);
    };
    img.onerror = ()=>toast('That image could not be read');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}
let QIMG = null;                                 /* photo waiting on the composer */
async function uploadPhoto(blob){
  const path = `${ME.id}/${Date.now()}.jpg`;
  const up = await sb.storage.from('media').upload(path, blob, {contentType:'image/jpeg', upsert:true});
  if(up.error){ toast(/bucket/i.test(up.error.message) ? 'Run the latest update.sql to turn on photos'
                                                      : up.error.message); return null }
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

let MYSAVES = new Set();
async function loadSaves(){
  if(!ONLINE || !ME){ MYSAVES = new Set(); return }
  const r = await sb.from('saves').select('post_id').eq('user_id', ME.id);
  MYSAVES = new Set(((r && r.data) || []).map(x => x.post_id));
}
async function loadSaved(){                      /* the posts themselves, for the Saved tab */
  if(!ONLINE || !ME){ G.saved = []; return }
  if(!MYSAVES.size){ G.saved = []; return }
  const r = await sb.from('posts')
    .select('*, profiles!posts_author_fkey(handle,name,photo_url,location)')
    .in('id', [...MYSAVES]).order('created_at', {ascending:false});
  G.saved = (r && r.data) || [];
  await decorate(G.saved); await attachComments(G.saved);
}
async function toggleSave(p){
  if(!await needAuth()) return;
  const on = MYSAVES.has(p.id);
  if(on) MYSAVES.delete(p.id); else MYSAVES.add(p.id);
  open_('feed', true);                           /* answer the tap straight away */
  const r = on ? await sb.from('saves').delete().eq('post_id',p.id).eq('user_id',ME.id)
               : await sb.from('saves').insert({post_id:p.id, user_id:ME.id});
  if(r.error){
    if(on) MYSAVES.add(p.id); else MYSAVES.delete(p.id);
    toast(/does not exist|schema cache/i.test(r.error.message)
      ? 'Run the latest update.sql to turn on saving' : friendly(r.error));
  }
  G.saved = null;
  if(current==='feed') open_('feed', true);
}

/* ============================================================ notifications
   Built from rows that already exist — no notification table to keep in sync.
   What you have already looked at is remembered in this browser. */
let NOTES = [], NOTEUNSEEN = 0;
const seenKey  = ()=> 'dai.seen.' + (ME ? ME.id : 'guest');
const lastSeen = ()=>{ try{ return localStorage.getItem(seenKey()) || '' }catch(e){ return '' } };
const trim60   = t => { t = String(t||'').replace(/\s+/g,' ').trim();
                        return t.length > 64 ? t.slice(0,64) + '…' : t };

async function loadNotes(){
  if(!ONLINE || !ME){ NOTES = []; NOTEUNSEEN = 0; return paintBell() }
  const ok = r => (r && !r.error && r.data) ? r.data : [];
  const out = [];
  try{
    const [posts, events, polls] = await Promise.all([
      sb.from('posts').select('id,text').eq('author',ME.id).then(ok, ()=>[]),
      sb.from('events').select('id,title').eq('author',ME.id).then(ok, ()=>[]),
      sb.from('polls').select('id,question').eq('author',ME.id).then(ok, ()=>[])
    ]);
    const pid = posts.map(x=>x.id), eid = events.map(x=>x.id), qid = polls.map(x=>x.id);
    const [likes, cmts, folls, rsv, votes] = await Promise.all([
      pid.length ? sb.from('likes').select('*').in('post_id',pid).neq('user_id',ME.id).then(ok,()=>[]) : [],
      pid.length ? sb.from('comments').select('*').in('post_id',pid).neq('author',ME.id).then(ok,()=>[]) : [],
      sb.from('follows').select('*').eq('followee',ME.id).then(ok,()=>[]),
      eid.length ? sb.from('rsvps').select('*').in('event_id',eid).neq('user_id',ME.id).then(ok,()=>[]) : [],
      qid.length ? sb.from('poll_votes').select('*').in('poll_id',qid).neq('user_id',ME.id).then(ok,()=>[]) : []
    ]);
    const ids = new Set();
    likes.forEach(r=>ids.add(r.user_id));  cmts.forEach(r=>ids.add(r.author));
    folls.forEach(r=>ids.add(r.follower)); rsv.forEach(r=>ids.add(r.user_id));
    votes.forEach(r=>ids.add(r.user_id));
    const who = new Map();
    if(ids.size){
      const pr = await sb.from('profiles').select('id,handle,name,photo_url').in('id',[...ids]).then(ok,()=>[]);
      pr.forEach(x=>who.set(x.id, x));
    }
    const find = (arr,id,key)=>{ const r = arr.find(x=>x.id===id); return r ? r[key] : '' };
    likes.forEach(r=>out.push({when:r.created_at, who:who.get(r.user_id), verb:'liked your post',
      what:trim60(find(posts,r.post_id,'text')), go:()=>openPost(r.post_id)}));
    cmts.forEach(r=>out.push({when:r.created_at, who:who.get(r.author), verb:'replied to your post',
      what:trim60(r.text), go:()=>openPost(r.post_id)}));
    folls.forEach(r=>out.push({when:r.created_at, who:who.get(r.follower), verb:'followed you',
      what:'', go:()=>{ const p = who.get(r.follower); if(p && p.handle) location.href = '/'+p.handle }}));
    rsv.forEach(r=>out.push({when:r.created_at, who:who.get(r.user_id), verb:'is going to',
      what:trim60(find(events,r.event_id,'title')), go:()=>open_('townhall')}));
    votes.forEach(r=>out.push({when:r.created_at, who:who.get(r.user_id), verb:'voted in',
      what:trim60(find(polls,r.poll_id,'question')), go:()=>open_('polls')}));
  }catch(e){ console.error('notes', e) }

  DMS.filter(m => m.recipient === ME.id).slice(0,25).forEach(m=>out.push({
    when:m.created_at, who:m.sender_p, verb:'sent you a message', what:trim60(m.text),
    unread:!m.read_at, go:()=>m.sender_p && dmSheet(m.sender_p)}));

  out.sort((a,b)=> new Date(b.when||0) - new Date(a.when||0));
  NOTES = out.filter(n=>n.who).slice(0,40);
  const seen = lastSeen();
  NOTEUNSEEN = NOTES.filter(n => n.unread || (n.when && (!seen || n.when > seen))).length;
  paintBell();
}
function paintBell(){
  const b = $('tBell'); if(!b) return;
  const old = b.querySelector('.badge'); if(old) old.remove();
  if(NOTEUNSEEN > 0){
    const s = document.createElement('span');
    s.className = 'badge'; s.textContent = NOTEUNSEEN > 99 ? '99+' : NOTEUNSEEN;
    b.appendChild(s);
  }
}
function openPost(id){
  OPENPOST = id;
  if(SC.feed === 'saved') SC.feed = 'all';
  if(ONLINE && !RO) loadGlobal('posts').then(()=>{ if(current==='feed') open_('feed', true) });
  open_('feed');
}
function notesSheet(){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3>Notifications</h3>
    ${!ME ? `<p class="sheetmsg">Sign in and this fills up with what people do on your page.</p>`
    : NOTES.length ? `<div class="notelist">${NOTES.map((n,i)=>`
        <button class="noterow" data-n="${i}">
          <span class="whoav">${n.who.photo_url?`<img src="${n.who.photo_url}" alt="">`:esc(initials(n.who))}</span>
          <span class="grow"><span class="notewhat"><b>${esc(n.who.name || '@'+n.who.handle)}</b>
            ${esc(n.verb)}${n.what?` &middot; ${esc(n.what)}`:''}</span>
            <small class="notewhen">${n.when?ago(n.when):''}</small></span>
          ${(n.unread || (n.when && n.when > lastSeen())) ? '<span class="notenew"></span>' : ''}
        </button>`).join('')}</div>`
    : `<p class="sheetmsg">Nothing yet. Likes, replies, follows, RSVPs and messages land here.</p>`}
    <div class="sheetfoot"><button class="btn ghost" id="ntClose">Close</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('ntClose').onclick = close;
  wrap.querySelectorAll('[data-n]').forEach(b=>b.onclick = ()=>{
    const n = NOTES[+b.dataset.n]; close(); if(n && n.go) n.go();
  });
  try{ localStorage.setItem(seenKey(), new Date().toISOString()) }catch(e){}
  NOTEUNSEEN = 0; paintBell();
}

function palRun(fn){ palClose(); fn() }
function palSources(q){
  const hit = t => !q || String(t||'').toLowerCase().includes(q);
  const items = [];

  APPS.forEach(a=>{ if(hit(a.name)) items.push({grp:'Screens', art:icon(a), title:a.name,

  const acts = [
    ['Write a post', 'Go to the feed and start typing', ()=>{ open_('feed');
      setTimeout(()=>{ const t = $('qText'); if(t){ t.focus(); t.scrollIntoView({block:'center'}) } }, 60) }],
    ...(V ? [['Invite someone', 'Share the invitation', ()=>inviteSheet()],
             ['Share my page', 'Hand out your link', ()=>share(shareLine(), V && V.handle)]] : []),
    ['Messages', 'Your conversations', ()=>msgHub()],
    ['Notifications', 'What people did on your page', ()=>notesSheet()],
    [themeNow()==='dark' ? 'Switch to light' : 'Switch to dark', 'Change the theme', ()=>toggleTheme()],
    ['Keyboard shortcuts', 'Every key that does something', ()=>keysSheet()]
  ];
  acts.forEach(([t,sub,fn])=>{ if(hit(t)) items.push({grp:'Do', art:PALICO.bolt, title:t, sub, kind:'',
    run:()=>palRun(fn)}); });

  (G.people||[]).forEach(p=>{
    if(!hit(p.name) && !hit(p.handle) && !hit(p.role) && !hit(p.location)) return;
    items.push({grp:'People', avatar:p, title:p.name || '@'+p.handle,
      sub:[p.role, p.location].filter(Boolean).join(' · ') || '@'+p.handle, kind:'',
      run:()=>palRun(()=>{ location.href = '/' + p.handle })});
  });

  if(q){
    const seen = new Set();
    (G.posts||[]).concat(D.posts||[]).forEach(p=>{
      if(seen.has(p.id) || !hit(p.text)) return; seen.add(p.id);
      items.push({grp:'Posts', art:PALICO.post, title:trim60(p.text),
        sub:'@' + ((p.profiles && p.profiles.handle) || (V && V.handle) || '') + ' · ' + ago(p.created_at),
        kind:'', run:()=>palRun(()=>openPost(p.id))});
    });
    const it = new Set();
    (G.issues||[]).forEach(i=>{
      const key = i.title.toLowerCase();
      if(it.has(key) || !hit(i.title)) return; it.add(key);
      const a = agree(i.title);
      items.push({grp:'Positions', art:PALICO.issue, title:i.title,
        sub:`${a.s} support · ${a.o} oppose`, kind:'', run:()=>palRun(()=>open_('issues'))});
    });
    (G.events||[]).forEach(e=>{
      if(!hit(e.title) && !hit(e.place)) return;
      items.push({grp:'Events', art:PALICO.event, title:e.title,
        sub:dfmt(e.date) + (e.place ? ' · ' + e.place : ''), kind:'',
        run:()=>palRun(()=>open_('townhall'))});
    });
    if(/^[a-z0-9_]{2,30}$/i.test(q))
      items.unshift({grp:'Do', art:PALICO.bolt, title:'#' + q.toLowerCase(),
        sub:'See every post on this topic', kind:'', run:()=>palRun(()=>openTag(q.toLowerCase()))});
  }
  return items.slice(0, 60);
}
function palFill(){
  const out = $('palOut'); if(!out) return;
  const q = ($('palIn').value || '').trim().toLowerCase();
  PAL.items = palSources(q);
  if(PAL.i >= PAL.items.length) PAL.i = 0;
  if(!PAL.items.length){ out.innerHTML = `<div class="palempty">Nothing matches “${esc(q)}”.</div>`; return }
  let html = '', grp = '';
  PAL.items.forEach((it,i)=>{
    if(it.grp !== grp){ grp = it.grp; html += `<div class="palgrp">${esc(grp)}</div>` }
    const art = it.avatar
      ? `<span class="whoav">${it.avatar.photo_url?`<img src="${it.avatar.photo_url}" alt="">`
                                                 :esc(initials(it.avatar))}</span>`
      : `<span class="palico">${it.art||''}</span>`;
    html += `<button class="palrow${i===PAL.i?' on':''}" data-i="${i}">${art}
      <span class="grow"><b>${esc(it.title)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span></button>`;
  });
  out.innerHTML = html;
  out.querySelectorAll('[data-i]').forEach(b=>b.onclick = ()=>{
    const it = PAL.items[+b.dataset.i]; if(it) it.run();
  });
  const on = out.querySelector('.palrow.on');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}
function palMove(d){
  if(!PAL.items.length) return;
  PAL.i = (PAL.i + d + PAL.items.length) % PAL.items.length;
  const out = $('palOut');
  out.querySelectorAll('.palrow').forEach((b,i)=>b.classList.toggle('on', i===PAL.i));
  const on = out.querySelector('.palrow.on');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}
function palClose(){ if(PAL.el){ PAL.el.remove(); PAL.el = null; PAL.i = 0 } }
function palOpen(seed){
  if(PAL.el){ $('palIn').focus(); return }
  const wrap = document.createElement('div');
  wrap.className = 'pal';
  wrap.innerHTML = `<div class="palbox">
    <input class="palin" id="palIn" placeholder="Search people, posts, positions, events…"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="palout" id="palOut"></div>
    <div class="palfoot"><span>&#8593;&#8595; move</span><span>&#8629; open</span>
      <span>esc close</span><span>? shortcuts</span></div>
  </div>`;
  document.body.appendChild(wrap);
  PAL.el = wrap; PAL.i = 0;
  wrap.onclick = e=>{ if(e.target===wrap) palClose() };
  const inp = $('palIn');
  if(seed) inp.value = seed;
  inp.oninput = ()=>{ PAL.i = 0; palFill() };
  inp.onkeydown = e=>{
    if(e.key === 'ArrowDown'){ e.preventDefault(); palMove(1) }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); palMove(-1) }
    else if(e.key === 'Enter'){ e.preventDefault(); const it = PAL.items[PAL.i]; if(it) it.run() }
    else if(e.key === 'Escape'){ e.preventDefault(); palClose() }
  };
  palFill();
  inp.focus();
  /* whatever we have not fetched yet, fetch now and repaint when it lands */
  const jobs = [loadPeople().catch(()=>{})];
  if(ONLINE && !RO) ['posts','issues','events'].forEach(k=>jobs.push(loadGlobal(k).catch(()=>{})));
  Promise.all(jobs).then(()=>{ if(PAL.el) palFill() });
}

/* ============================================================ typing @someone */
function mentionable(input){
  if(!input) return;
  let box = null, items = [], cur = 0;
  const close = ()=>{ if(box){ box.remove(); box = null; items = []; cur = 0 } };
  const word = ()=>{
    const upto = input.value.slice(0, input.selectionStart || 0);
    const m = upto.match(/(^|\s)@([a-zA-Z0-9_]{0,20})$/);
    return m ? m[2] : null;
  };
  const pick = p =>{
    const at = input.selectionStart || 0;
    const upto = input.value.slice(0, at).replace(/@([a-zA-Z0-9_]{0,20})$/, '@' + p.handle + ' ');
    input.value = upto + input.value.slice(at);
    close(); input.focus();
    input.selectionStart = input.selectionEnd = upto.length;
    input.dispatchEvent(new Event('input'));
  };
  const paint = ()=>{
    const w = word();
    if(w === null){ return close() }
    const q = w.toLowerCase();
    items = (G.people||[]).filter(p=>p.handle &&
      (!q || p.handle.toLowerCase().startsWith(q) || (p.name||'').toLowerCase().includes(q))).slice(0,5);
    if(!items.length) return close();
    if(!box){
      box = document.createElement('div');
      box.className = 'talist';
      box.addEventListener('mousedown', e=>{
        const b = e.target.closest('button');
        if(b){ e.preventDefault(); pick(items[+b.dataset.i]) }
      });
      (input.parentNode || document.body).appendChild(box);
    }
    if(cur >= items.length) cur = 0;
    box.innerHTML = items.map((p,i)=>
      `<button type="button" data-i="${i}" class="${i===cur?'on':''}">@${esc(p.handle)}${
        p.name?` &middot; ${esc(p.name)}`:''}</button>`).join('');
  };
  input.addEventListener('input', paint);
  input.addEventListener('blur', ()=>setTimeout(close, 140));
  input.addEventListener('keydown', e=>{
    if(!box) return;
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); cur = (cur + (e.key==='ArrowDown'?1:-1) + items.length) % items.length; paint();
    } else if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); pick(items[cur]) }
    else if(e.key === 'Escape') close();
  });
}

/* =========================================================== the keys themselves */
function topLayer(){
  return document.querySelector('.lbox') || (PAL.el ? PAL.el : null)
      || document.querySelector('.reader') || document.querySelector('.sheet')
      || document.querySelector('.hub');
}
document.addEventListener('keydown', e=>{
  const el = e.target || {};
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || '') || el.isContentEditable;

  if((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){
    e.preventDefault(); return PAL.el ? palClose() : palOpen();
  }
  if(e.key === 'Escape'){
    const top = topLayer();
    if(top){ if(top === PAL.el) palClose(); else if(top === HUB) closeHub(); else top.remove(); return }
    if(!typing && document.body.classList.contains('open') && $('pclose')) $('pclose').click();
    return;
  }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(PAL.el) return;

  if(e.key === '/'){ e.preventDefault(); return palOpen() }
  if(e.key === '?'){ e.preventDefault(); return keysSheet() }
  if(e.key >= '1' && e.key <= '9'){ const a = APPS[+e.key - 1]; if(a){ e.preventDefault(); open_(a.id) } return }
  if(e.key === '0'){ const a = APPS[9]; if(a){ e.preventDefault(); open_(a.id) } return }
  const k = e.key.toLowerCase();
  if(k === 'n'){ e.preventDefault(); open_('feed');
    setTimeout(()=>{ const t = $('qText'); if(t) t.focus() }, 60); return }
  if(k === 'm'){ e.preventDefault(); return msgHub() }
  if(k === 'i'){ e.preventDefault(); return notesSheet() }
  if(k === 'd'){ e.preventDefault(); return toggleTheme() }
});

/* ================================================================== the crawl
   What the newsroom would put on the bottom of the screen: whatever is
   actually happening on the network, in rotation, each one clickable. */
let TICKI = 0, TICKT = null;
const FRESH = 15 * 60e3;                       /* what counts as happening now */
const isFresh = ts => ts && Date.now() - new Date(ts).getTime() < FRESH;
function tickerLines(){
  const out = [];
  const wire = (NEWS || [])[0];
  if(wire) out.push({k:'Wire', live:isFresh(wire.when),
    t:`${wire.source ? wire.source + ': ' : ''}${trim60(wire.title)}`, go:()=>open_('today')});
  const posts = (G.posts || []).slice();
  if(posts.length){
    const p = posts[0];
    const nm = (p.profiles && (p.profiles.name || '@' + p.profiles.handle)) || 'Someone';
    out.push({k:'Latest', t:`${nm}: ${trim60(p.text)}`, live:isFresh(p.created_at),
              go:()=>openPost(p.id)});
    const today = posts.filter(x => Date.now() - new Date(x.created_at).getTime() < 864e5).length;
    if(today) out.push({k:'Today', t:`${today} new post${today===1?'':'s'} across the network`,
                        go:()=>{ SC.feed = 'all'; open_('feed') }});
  }
  const room = (G.room || []).slice(-1)[0];
  if(room) out.push({k:'On the floor', live:isFresh(room.created_at),
      t:`${room.bot ? BOTS[room.bot] ? BOTS[room.bot].name : room.bot
      : (room.profiles && (room.profiles.name || '@'+room.profiles.handle)) || 'Someone'}: ${trim60(room.text)}`,
      go:()=>open_('townhall')});
  const ev = (G.events || [])[0];
  if(ev) out.push({k:'Coming up', t:`${ev.title} · ${dfmt(ev.date)}${ev.place ? ' · ' + ev.place : ''}`,
                   go:()=>open_('townhall')});
  const hot = issueTally('all')[0];
  if(hot) out.push({k:'Trending', t:`${hot.title} — ${hot.s + hot.o} taking a position`,
                    go:()=>open_('issues')});
  const q = (G.polls || [])[0];
  if(q) out.push({k:'Poll', t:`${q.question} · ${q.total || 0} vote${q.total===1?'':'s'}`, go:()=>open_('polls')});
  const n = (G.people || []).length;
  if(n) out.push({k:'Network', t:`${n} ${n===1?'person':'people'} on democrat.ai`, go:()=>open_('endorsed')});
  return out.slice(0, 6);
}
function paintTicker(){
  const box = $('ticks'); if(!box) return;
  const lines = tickerLines();
  const tk = $('ticker');
  if(tk) tk.hidden = !lines.length;            /* nothing to report, no empty crawl */
  sizeMast();                                  /* the bar just changed height */
  if(!lines.length){ box.innerHTML = ''; clearInterval(TICKT); return }
  box.innerHTML = lines.map((l,i)=>
    `<button class="tick${i===0?' on':''}" data-t="${i}">${l.live
      ? `<span class="live"><i></i>Live</span>` : `<b>${esc(l.k)}</b>`}<span>${esc(l.t)}</span></button>`).join('');
  box.querySelectorAll('[data-t]').forEach(b=>b.onclick = ()=>{
    const l = lines[+b.dataset.t]; if(l && l.go) l.go();
  });
  TICKI = 0;
  clearInterval(TICKT);
  const still = (()=>{ try{ return matchMedia('(prefers-reduced-motion:reduce)').matches }catch(e){ return false } })();
  if(lines.length > 1 && !still) TICKT = setInterval(()=>{
    const items = box.querySelectorAll('.tick');
    if(items.length < 2) return;
    items[TICKI % items.length].classList.remove('on');
    TICKI = (TICKI + 1) % items.length;
    items[TICKI].classList.add('on');
  }, 6500);
}

/* ------------------------------------------------------- news furniture */
const newsTime = ts =>{
  const t = ago(ts);
  return t === 'now' ? 'Just now' : /^\d/.test(t) ? t + ' ago' : t;
};
function kicker(p, lead){
  const tag = tagsIn(p.text)[0];
  const place = (p.profiles && p.profiles.location) || (!p.profiles && V && V.location) || '';
  const fresh = Date.now() - new Date(p.created_at).getTime() < 20 * 60e3;
  const bits = [];
  if(fresh)     bits.push(`<span class="live"><i></i>Just in</span>`);
  else if(lead) bits.push(`<span class="live"><i></i>Latest</span>`);
  if(tag) bits.push(`<button class="kb" data-tag="${esc(tag)}">${esc(tag)}</button>`);
  if(!bits.length) bits.push(`<b>Update</b>`);
  if(place) bits.push(`<span class="place">${esc(place)}</span>`);
  return bits.join('<span class="sep">&middot;</span>');
}
function byline(p){
  const a = p.profiles;
  const src = a || (V || {});
  const name = a ? (a.name || '@' + a.handle) : ((V && (V.name || (V.handle && '@'+V.handle))) || 'You');
  const av = src.photo_url ? `<img src="${src.photo_url}" alt="">` : esc(initials(src));
  const inner = `<span class="whoav sm">${av}</span><b>${esc(name)}</b>
    <span class="sep">&middot;</span><span>${newsTime(p.created_at)}</span>`;
  return a && a.handle ? `<a class="byline" href="/${esc(a.handle)}">${inner}</a>`
                       : `<span class="byline">${inner}</span>`;
}

/* ============================================================== hover cards
   Point at anyone's name and their page comes to you. Desktop only, and only
   from what is already loaded — no extra request to open a card. */
let HOVERT = null, HCARD = null, HOVERFOR = '';
const finePointer = ()=>{ try{ return matchMedia('(hover:hover) and (pointer:fine)').matches }
                          catch(e){ return false } };
function personByHandle(h){
  h = String(h || '').toLowerCase();
  if(!h) return null;
  return (G.people || []).find(p => String(p.handle||'').toLowerCase() === h)
      || (V && String(V.handle||'').toLowerCase() === h ? V : null)
      || (ME && String(ME.handle||'').toLowerCase() === h ? ME : null);
}
function killCard(){
  clearTimeout(HOVERT);
  if(HCARD){ HCARD.remove(); HCARD = null; HOVERFOR = '' }
}
function showCard(el, p){
  killCard();
  HOVERFOR = p.handle;
  const posts = (G.posts || []).filter(x => x.author === p.id).length;
  const stands = (G.issues || []).filter(x => x.author === p.id).length;
  const mine = ME && p.id === ME.id;
  const c = document.createElement('div');
  c.className = 'pcard';
  c.innerHTML = `<div class="top">
      <span class="whoav">${p.photo_url ? `<img src="${p.photo_url}" alt="">` : esc(initials(p))}</span>
      <span class="grow"><b>${esc(p.name || '@'+p.handle)}</b><small>@${esc(p.handle)}</small></span>
    </div>
    ${p.role || p.location ? `<p>${esc([p.role, p.location].filter(Boolean).join(' · '))}</p>` : ''}
    <div class="row"><span><b>${stands}</b> position${stands===1?'':'s'}</span>
      <span><b>${posts}</b> post${posts===1?'':'s'}</span></div>
    <div class="acts2">
      <a class="btn ghost" href="/${esc(p.handle)}">View</a>
      ${(ME && !mine) ? `<button class="btn" data-hdm="${p.id}">Message</button>` : ''}
    </div>`;
  document.body.appendChild(c);
  HCARD = c;
  const r = el.getBoundingClientRect();
  const w = 270, h = c.offsetHeight || 170;
  let left = Math.min(Math.max(10, r.left), innerWidth - w - 10);
  let top  = r.bottom + 9;
  if(top + h > innerHeight - 10) top = Math.max(10, r.top - h - 9);
  c.style.left = left + 'px'; c.style.top = top + 'px';
  c.addEventListener('mouseleave', ()=>{ HOVERT = setTimeout(killCard, 180) });
  c.addEventListener('mouseenter', ()=>clearTimeout(HOVERT));
  const dm = c.querySelector('[data-hdm]');
  if(dm) dm.onclick = ()=>{ const who = p; killCard(); dmSheet(who) };
}
document.addEventListener('mouseover', e=>{
  if(!finePointer()) return;
  const a = e.target.closest && e.target.closest('a[href^="/"]');
  if(!a){ return }
  const seg = decodeURIComponent(a.getAttribute('href').replace(/^\/+/,'')).split('/')[0];
  if(!seg || RESERVED.has(seg)) return;
  if(seg === HOVERFOR) { clearTimeout(HOVERT); return }
  const p = personByHandle(seg);
  if(!p || !p.handle) return;
  clearTimeout(HOVERT);
  HOVERT = setTimeout(()=>showCard(a, p), 420);
  a.addEventListener('mouseleave', ()=>{ clearTimeout(HOVERT); HOVERT = setTimeout(killCard, 220) },
                     {once:true});
});
document.addEventListener('click', ()=>killCard(), true);

/* say it plainly when the network drops, and catch up when it comes back */
function netWatch(){
  const paint = ()=>{
    const off = typeof navigator !== 'undefined' && navigator.onLine === false;
    const chip = $('liveChip');
    if(chip){
      chip.classList.toggle('off', off);
      chip.lastChild.nodeValue = off ? 'Offline' : 'Live';
      chip.title = off ? 'No connection' : 'This page updates as things happen';
    }
    let el = document.getElementById('offline');
    if(!off){ if(el) el.remove(); return }
    if(el) return;
    el = document.createElement('div');
    el.id = 'offline'; el.className = 'offline';
    el.textContent = 'No connection — showing the last thing loaded';
    document.body.appendChild(el);
  };
  try{
    addEventListener('online', ()=>{ paint(); if(ONLINE) refreshLive() });
    addEventListener('offline', paint);
  }catch(e){}
  paint();
}

/* the masthead is one row on a desktop and two on a phone, and it disappears a
   row when the crawl has nothing to say. Measure it rather than assume. */
function sizeMast(){
  const m = document.querySelector('.mast'); if(!m) return;
  const h = Math.round(m.getBoundingClientRect().height);
  if(h > 20) document.documentElement.style.setProperty('--mast', h + 'px');
}
function watchMast(){
  sizeMast();
  try{ addEventListener('resize', sizeMast); addEventListener('orientationchange', sizeMast) }catch(e){}
  try{
    if(typeof ResizeObserver === 'function'){
      const m = document.querySelector('.mast');
      if(m) new ResizeObserver(sizeMast).observe(m);
    }
  }catch(e){}
  /* fonts landing late can change the height by a pixel or two */
  try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(sizeMast) }catch(e){}
  setTimeout(sizeMast, 300);
}

/* ================================================================= language
   The whole page, in any of these. Nothing is pre-translated: the text that
   is actually on screen gets sent for translation once, cached in this
   browser for ever, and applied. Second time you see a phrase it is instant. */
const LANGS = [
  ['en','English','English'],        ['es','Español','Spanish'],
  ['zh','中文','Simplified Chinese'], ['tl','Tagalog','Tagalog'],
  ['vi','Tiếng Việt','Vietnamese'],  ['ar','العربية','Arabic'],
  ['fr','Français','French'],        ['ko','한국어','Korean'],
  ['ru','Русский','Russian'],        ['pt','Português','Portuguese'],
  ['ht','Kreyòl','Haitian Creole'],  ['hi','हिन्दी','Hindi'],
  ['de','Deutsch','German'],         ['ja','日本語','Japanese'],
  ['it','Italiano','Italian'],       ['pl','Polski','Polish'],
  ['so','Soomaali','Somali'],        ['am','አማርኛ','Amharic'],
  ['uk','Українська','Ukrainian'],   ['fa','فارسی','Farsi']
];
const RTL = new Set(['ar','fa','he','ur']);
let LANG = (()=>{ try{ return localStorage.getItem('dai.lang') || 'en' }catch(e){ return 'en' } })();
let TCACHE = {}, TBUSY = false, TTIMER = null, TAPPLY = false, TOLD = false;

const langRow = code => LANGS.find(l => l[0] === code) || LANGS[0];
function loadTCache(){
  try{ TCACHE = JSON.parse(localStorage.getItem('dai.tr.' + LANG) || '{}') }catch(e){ TCACHE = {} }
}
function saveTCache(){
  try{
    const keys = Object.keys(TCACHE);
    if(keys.length > 4000) keys.slice(0, keys.length - 3000).forEach(k => delete TCACHE[k]);
    localStorage.setItem('dai.tr.' + LANG, JSON.stringify(TCACHE));
  }catch(e){}
}

/* what on this page is actually language */
const SKIP_TAGS = /^(SCRIPT|STYLE|TEXTAREA|INPUT|SVG|PATH|CIRCLE|RECT|CODE|KBD)$/;
function sayable(n){
  const p = n.parentElement;
  if(!p || SKIP_TAGS.test(p.tagName)) return false;
  if(p.hasAttribute && p.hasAttribute('data-ts')) return false;   /* clocks tick, leave them */
  if(p.closest('[data-noloc]')) return false;
  const s = (n.__src || n.nodeValue || '').trim();
  if(s.length < 2 || s.length > 400) return false;
  if(!/[A-Za-z]{2}/.test(s)) return false;          /* numbers, times, handles */
  if(/^[@#]/.test(s)) return false;
  if(/^https?:\/\//.test(s)) return false;
  return true;
}
function sayableNodes(){
  const out = [];
  try{
    const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
    while(w.nextNode()){ const n = w.currentNode; if(sayable(n)) out.push(n) }
  }catch(e){}
  return out;
}
const holders = ()=> [...document.querySelectorAll('[placeholder]')]
  .filter(el => !el.closest('[data-noloc]') && (el.__srcPh || el.getAttribute('placeholder') || '').length > 2);

function applyTranslations(){
  TAPPLY = true;
  try{
    sayableNodes().forEach(n=>{
      const src = n.__src || (n.__src = n.nodeValue.trim());
      const to = TCACHE[src];
      if(to && n.nodeValue.trim() !== to) n.nodeValue = n.nodeValue.replace(src, to);
    });
    holders().forEach(el=>{
      const src = el.__srcPh || (el.__srcPh = el.getAttribute('placeholder'));
      const to = TCACHE[src];
      if(to && el.getAttribute('placeholder') !== to) el.setAttribute('placeholder', to);
    });
  }catch(e){}
  TAPPLY = false;
}

async function translatePage(){
  if(LANG === 'en') return;
  applyTranslations();                      /* whatever we already know, right now */
  if(TBUSY) return;
  const need = new Set();
  sayableNodes().forEach(n=>{ const s = n.__src || n.nodeValue.trim(); if(!TCACHE[s]) need.add(s) });
  holders().forEach(el=>{ const s = el.__srcPh || el.getAttribute('placeholder'); if(s && !TCACHE[s]) need.add(s) });
  if(!need.size) return;

  const batch = [...need].slice(0, 70);
  TBUSY = true;
  const chip = $('tLang'); if(chip) chip.classList.add('working');
  let got = null;
  try{ got = await ai('translate', JSON.stringify(batch), { lang: langRow(LANG)[2] }) }catch(e){}
  TBUSY = false;
  if(chip) chip.classList.remove('working');

  let list = null;
  if(got){
    try{
      const a = got.indexOf('['), b = got.lastIndexOf(']');
      if(a >= 0 && b > a) list = JSON.parse(got.slice(a, b + 1));
    }catch(e){}
  }
  if(!Array.isArray(list) || list.length !== batch.length){
    if(!TOLD){ TOLD = true;
      toast(got ? 'The translator got confused — staying in English'
                : 'Translation needs the AI key on Vercel'); }
    return;
  }
  batch.forEach((src, i)=>{ if(typeof list[i] === 'string' && list[i].trim()) TCACHE[src] = list[i].trim() });
  saveTCache();
  applyTranslations();
  if(need.size > batch.length) scheduleTranslate(200);   /* more to do */
}
function scheduleTranslate(wait){
  if(LANG === 'en') return;
  clearTimeout(TTIMER);
  TTIMER = setTimeout(translatePage, wait || 260);
}
function watchLanguage(){
  try{
    new MutationObserver(()=>{ if(!TAPPLY) scheduleTranslate() })
      .observe(document.body, {childList:true, subtree:true});
  }catch(e){}
}
function setLang(code){
  LANG = code;
  try{ localStorage.setItem('dai.lang', code) }catch(e){}
  document.documentElement.lang = code;
  document.documentElement.dir = RTL.has(code) ? 'rtl' : 'ltr';
  TOLD = false;
  loadTCache();
  const chip = $('tLang');
  if(chip) chip.dataset.code = code === 'en' ? '' : code.toUpperCase();
  if(code === 'en'){ location.reload(); return }   /* the cleanest way back to the original */
  translatePage();
}
function langSheet(){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox" data-noloc>
    <h3>Language</h3>
    <div class="langgrid">${LANGS.map(([code,name])=>
      `<button class="langbtn${code===LANG?' on':''}" data-lang="${code}">${esc(name)}
        ${code===LANG?'<span>&#10003;</span>':''}</button>`).join('')}</div>
    <p class="readnote">Everything on screen is translated as you read, then remembered on this
      device. Names, handles and links are left alone.</p>
    <div class="sheetfoot"><button class="btn ghost" id="lgClose">Close</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('lgClose').onclick = close;
  wrap.querySelectorAll('[data-lang]').forEach(b=>b.onclick = ()=>{ const c = b.dataset.lang; close(); setLang(c) });
}

function wireTopbar(){
  const s = $('tSearch'), b = $('tBell'), t = $('tTheme'), g = $('tLang');
  if(s) s.onclick = ()=>palOpen();
  if(b) b.onclick = ()=>notesSheet();
  if(t) t.onclick = ()=>toggleTheme();
  if(g) g.onclick = ()=>langSheet();
  applyTheme();
  paintBell();
  paintTicker();
  netWatch();
  watchMast();
  if(LANG !== 'en'){
    document.documentElement.lang = LANG;
    document.documentElement.dir = RTL.has(LANG) ? 'rtl' : 'ltr';
    const g2 = $('tLang'); if(g2) g2.dataset.code = LANG.toUpperCase();
    loadTCache();
  }
  watchLanguage();
  scheduleTranslate(400);
}

/* --------------------------------------------------------------------- boot */
(async function boot(){
  wireTopbar();
  renderRail();
  panel.innerHTML = '<div class="spin"></div>';
  if(ONLINE){
    sb.auth.onAuthStateChange(async evt=>{
      if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'){
        chatReset(evt==='SIGNED_OUT');          /* never carry a conversation across accounts */
        Object.keys(G).forEach(k=>G[k]=null);
        MYFOLLOWS = new Set(); MYFOLLOWERS = new Set();
        await load(); render();
      }
    });
  } else { const m=$('mode'); m.hidden=false; m.textContent='Local mode'; }
  await load();
  goLive();
  wireWatch();
  loadNews().then(()=>{ paintTicker(); if(current === 'townhall') paintLiveFeed() });
  if(ONLINE){
    if(myState()) SC.feed = 'near';        /* the others have tabs of their own */
    await Promise.all([loadGlobal('issues'), loadGlobal('events'), loadRoom()]);
    joinFloor();
  }
  render();
})();

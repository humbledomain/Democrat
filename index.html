.clegend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.clegend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.clegend .k1{background:var(--blue)}.clegend .k2{background:rgba(120,130,160,.5)}

.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;flex:none;transform:rotate(-90deg)}
.donut .dbg{fill:none;stroke:var(--soft);stroke-width:15}
.dseg{fill:none;stroke-width:15;stroke-linecap:butt;transition:stroke-dasharray .6s ease}
.dseg.d0{stroke:var(--blue)}.dseg.d1{stroke:#5B8DEF}.dseg.d2{stroke:#7C3AED}
.dseg.d3{stroke:#16A34A}.dseg.d4{stroke:#B45309}.dseg.d5{stroke:#0E7490}
.dnum,.dlab{transform:rotate(90deg);transform-origin:70px 70px}
.dnum{font-size:24px;font-weight:700;fill:var(--ink);letter-spacing:-.02em}
.dlab{font-size:10px;font-weight:700;fill:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.dkeys{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px}
.dkey{display:flex;align-items:center;gap:9px;font-size:13px}
.dkey i{width:9px;height:9px;border-radius:3px;flex:none}
.dkey i.d0{background:var(--blue)}.dkey i.d1{background:#5B8DEF}.dkey i.d2{background:#7C3AED}
.dkey i.d3{background:#16A34A}.dkey i.d4{background:#B45309}.dkey i.d5{background:#0E7490}
.dkey span{flex:1;color:var(--ink2)}
.dkey b{font-weight:700}

.grid12{width:100%;max-width:420px;height:auto;display:block}
.grid12 .sq{fill:var(--soft)}
.grid12 .l1{fill:rgba(10,63,214,.28)}
.grid12 .l2{fill:rgba(10,63,214,.55)}
.grid12 .l3{fill:var(--blue)}

.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:flex;align-items:center;gap:10px;font-size:13px}
.hlab{flex:0 0 34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.htrack{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.htrack i{display:block;height:100%;border-radius:99px;background:var(--blue);
  transition:width .5s cubic-bezier(.2,.9,.25,1)}
.hbar b{font-weight:700;font-size:12.5px;min-width:26px;text-align:right}

.toppost{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;cursor:pointer;
  text-align:left;font-family:inherit;color:inherit;padding:9px 4px;border-top:1px solid var(--line);
  border-radius:8px}
.toppost:first-of-type{border-top:0}
.toppost:hover{background:var(--soft)}
.toppost .grow{min-width:0;flex:1}
.tptext{display:block;font-size:13.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.toppost small{font-size:11.5px;color:var(--muted)}
.toppost b{font-size:15px;font-weight:700;color:var(--blue);flex:none}
@media (max-width:900px){
  .mval{font-size:25px}
  .metric{min-height:94px}
  .donut{width:118px;height:118px}
  .grid12{max-width:none}
}

/* ------------------------------------------------------------------- polls */
.shelf{display:flex;flex-direction:column;gap:10px;padding-bottom:16px;margin-bottom:4px;
  border-bottom:1px solid var(--line)}
.shelfhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.shelfhead h4{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim);flex:none}
.shelfhead .topicbar{flex:1;min-width:0;padding-bottom:0}
.shelfrow{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
.shelfrow::-webkit-scrollbar{display:none}
.askcard{flex:0 0 clamp(212px,24vw,258px);background:var(--soft);border-radius:15px;padding:12px 13px;
  display:flex;flex-direction:column;gap:6px}
.askcard b{font-size:14px;font-weight:620;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.askcard small{font-size:12px;line-height:1.4;color:var(--ink2);flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.askopts{display:flex;flex-wrap:wrap;gap:4px}
.askopts span{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--dim);
  background:var(--card);border-radius:5px;padding:2px 7px}
.askcard .sbtn{width:100%;text-align:center}
.askcard .sbtn[disabled]{opacity:.5;cursor:default}
.polls{display:flex;flex-direction:column}
.poll{padding:16px 0;border-top:1px solid var(--line)}
.poll:first-child{border-top:0}
.poll h3{font-size:16.5px;font-weight:620;letter-spacing:-.015em;line-height:1.35}
.poll>small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.pops{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.pop{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:1px solid transparent;
  background:var(--soft);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14.5px;
  font-weight:540;color:inherit;cursor:pointer;text-align:left;overflow:hidden;
  transition:border-color .15s,background .15s}
.pop:hover{border-color:rgba(10,63,214,.35)}
.pop.shown{cursor:default}
.pop.shown:hover{border-color:transparent}
.pfill{position:absolute;left:0;top:0;bottom:0;background:rgba(10,63,214,.13);width:0;
  transition:width .55s cubic-bezier(.2,.9,.25,1);border-radius:12px 0 0 12px}
.pop.lead .pfill{background:rgba(10,63,214,.22)}
.pop.mine{border-color:var(--blue)}
.pop.mine .pfill{background:rgba(10,63,214,.26)}
.ptext{position:relative;flex:1;min-width:0}
.ppc{position:relative;font-size:13px;font-weight:800;color:var(--ink3);flex:none;text-align:right}
.ppc i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:var(--muted)}
.poll .rowacts{margin-top:10px}
@media (max-width:900px){
  .poll h3{font-size:16px}
  .pop{padding:13px 14px;font-size:15px}
}

/* ------------------------------------------------------------------- today */
.topicbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.topicbar::-webkit-scrollbar{display:none}
.tchip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:99px;
  padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:640;color:var(--ink3);cursor:pointer;
  white-space:nowrap;flex:none;transition:background .14s,color .14s}
.tchip i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--dim)}
.tchip:hover{color:var(--blue)}
.tchip.on{background:var(--blue);color:#fff}
.tchip.on i{color:rgba(255,255,255,.72)}
.storylist{display:flex;flex-direction:column}
.story{padding:15px 0;border-top:1px solid var(--line)}
.story.big{padding:2px 0 15px;border-top:0}
.hl{display:block;font-size:16px;line-height:1.34;font-weight:620;letter-spacing:-.018em;color:inherit;
  text-decoration:none}
.hl:hover{color:var(--blue)}
.story.big .hl{font-size:clamp(21px,2.2vw,28px);line-height:1.18;letter-spacing:-.032em;font-weight:690}
.dek{font-size:14.5px;line-height:1.5;color:var(--ink2);margin-top:9px;max-width:64ch}
.story{display:flex;gap:14px;align-items:flex-start}
.story .grow{flex:1;min-width:0}
.story.big{display:block}
.thumb-s{width:96px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft);
  border:1px solid var(--line)}
.hero{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:12px;display:block;
  background:var(--soft);border:1px solid var(--line)}

/* the reader: a story opens here, not in another tab */
.reader{position:fixed;inset:0;z-index:88;background:rgba(8,20,45,.42);backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);display:flex;justify-content:center;align-items:flex-start;
  padding:5vh 20px 20px;animation:fade .18s ease}
.readbox{width:100%;max-width:720px;max-height:90vh;max-height:90dvh;background:var(--card);
  border-radius:22px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(8,26,72,.55);animation:rise .28s cubic-bezier(.2,.9,.25,1) both}
.readtop{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
  flex:none}
.readtop .kick{margin:0;flex:1;min-width:0}
.readbody{overflow-y:auto;padding:20px 24px 8px;flex:1;min-height:0}
.readbody h1{font-size:clamp(22px,2.4vw,30px);line-height:1.18;letter-spacing:-.03em;font-weight:690;
  margin-bottom:10px}
.readbody .dek{font-size:16px;line-height:1.55;color:var(--ink2);max-width:none}
.readimg{width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-bottom:16px;display:block;
  background:var(--soft)}
.readsrc{display:block;margin-top:16px;text-align:center;text-decoration:none}
.readnote{font-size:11.5px;color:var(--dim);text-align:center;margin:10px 0 4px;line-height:1.5}
.readfoot{display:flex;gap:8px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.readfoot .btn{flex:1;min-width:120px}
@media (max-width:900px){
  .reader{padding:0;align-items:flex-end}
  .readbox{max-width:none;border-radius:20px 20px 0 0;max-height:94dvh}
  .readbody{padding:16px 16px 4px}
  .readbody h1{font-size:23px}
  .thumb-s{width:78px;height:60px}
  .readfoot .btn{min-width:0;font-size:12.5px;padding:11px 8px}
}
.story .rowacts{margin-top:7px}
.story .kick{margin-bottom:7px}

/* ------------------------------------------------------- loading and motion */
.sk .skline{height:11px;border-radius:6px;margin:7px 0;
  background:linear-gradient(90deg,var(--soft) 25%,rgba(140,160,200,.16) 37%,var(--soft) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite}
.sk .w30{width:30%}.sk .w90{width:90%}.sk .w70{width:70%}.sk .w50{width:50%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.iconbtn.pop svg{animation:pip .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes pip{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.newpill{position:sticky;top:0;z-index:6;align-self:center;border:0;border-radius:99px;padding:9px 18px;
  background:var(--blue);color:#fff;font-family:inherit;font-size:13px;font-weight:640;cursor:pointer;
  box-shadow:0 12px 26px -12px rgba(10,63,214,.9);animation:drop .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.pcard{position:fixed;z-index:70;width:270px;background:var(--card);border-radius:16px;padding:14px;
  box-shadow:0 20px 50px -18px rgba(8,26,72,.45), 0 0 0 1px var(--line);
  display:flex;flex-direction:column;gap:9px;animation:fade .14s ease;pointer-events:auto}
.pcard .top{display:flex;align-items:center;gap:10px}
.pcard .whoav{width:42px;height:42px;font-size:16px}
.pcard b{font-size:14.5px;font-weight:660;display:block}
.pcard small{font-size:12.5px;color:var(--muted);display:block}
.pcard p{font-size:13px;line-height:1.45;color:var(--ink2)}
.pcard .row{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.pcard .row b{font-size:12.5px;color:var(--ink);display:inline}
.pcard .acts2{display:flex;gap:7px}
.pcard .acts2 .btn{flex:1;padding:8px;font-size:12.5px}
.pbody>.split,.pbody>.screen{max-width:1280px}
.offline{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + 16px);z-index:75;
  background:rgba(12,18,34,.94);color:#fff;font-size:12.5px;font-weight:560;padding:9px 16px;
  border-radius:99px;max-width:88vw;text-align:center;animation:drop .3s cubic-bezier(.2,.9,.25,1) both}
.tbtn[data-code]:not([data-code=""])::after{content:attr(data-code);position:absolute;bottom:-1px;right:-2px;
  font-size:8.5px;font-weight:800;letter-spacing:.02em;background:var(--blue);color:#fff;
  border-radius:5px;padding:0 3px;line-height:1.5;box-shadow:0 0 0 2px var(--bg)}
.tbtn.working svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.langgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:52vh;overflow-y:auto}
.langbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;
  background:var(--soft);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14px;
  font-weight:560;color:inherit;cursor:pointer;text-align:left}
.langbtn:hover{color:var(--blue)}
.langbtn.on{background:var(--blue);color:#fff}
.langbtn span{font-weight:800}
.moregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.moretile{display:flex;align-items:center;gap:10px;border:0;background:var(--soft);border-radius:14px;
  padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;color:inherit;cursor:pointer;
  text-align:left}
.moretile .tile{width:30px;height:30px}
@media (prefers-reduced-motion:reduce){.rings,.glow,.dot::after{animation:none}
  .skline{animation:none}.newpill{animation:none}
  .live i{animation:none}.tick{transition:none}}
</style>

async function ai(task, input, extra){

}
/* the model writes plain prose with the odd list — render that properly, escape everything first */
function md(t){
  let x = esc(t);
  x = x.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  x = x.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const lines = x.split('\n');
  let out = '', list = null, para = [];
  const flushP = ()=>{ if(para.length){ out += '<p>'+para.join('<br>')+'</p>'; para=[] } };
  const flushL = ()=>{ if(list){ out += `<${list.tag}>${list.items.map(i=>'<li>'+i+'</li>').join('')}</${list.tag}>`; list=null } };
  for(const raw of lines){
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(bullet || number){
      flushP();
      const tag = bullet ? 'ul' : 'ol';
      if(!list || list.tag !== tag){ flushL(); list = {tag, items:[]} }
      list.items.push((bullet||number)[1]);
    } else if(!line.trim()){
      flushP(); flushL();
    } else {
      flushL(); para.push(line);
    }
  }
  flushP(); flushL();
  return out || '<p></p>';
}

/* attach like counts, vote counts and rsvp counts to any set of rows */
async function decorate(posts, polls, events){
  if(!ONLINE) return;
  const jobs = [];
  const pids = (posts||[]).map(p=>p.id);
  if(pids.length) jobs.push(sb.from('likes').select('post_id,user_id').in('post_id',pids).then(({data})=>{
    posts.forEach(p=>{
      const mine=(data||[]).filter(l=>l.post_id===p.id);
      p.likes=mine.length; p.liked=!!(ME&&mine.some(l=>l.user_id===ME.id));
    });
  }));
  const qids = (polls||[]).map(p=>p.id);
  if(qids.length) jobs.push(sb.from('poll_votes').select('poll_id,option_id,user_id').in('poll_id',qids).then(({data})=>{
    polls.forEach(p=>{
      (p.poll_options||[]).sort((a,b)=>a.ord-b.ord);
      const vs=(data||[]).filter(v=>v.poll_id===p.id);
      p.total=vs.length;
      p.votes = vs.map(v=>({u:v.user_id, o:v.option_id}));
      (p.poll_options||[]).forEach(o=>o.v=vs.filter(v=>v.option_id===o.id).length);
      p.voted = ME ? ((vs.find(v=>v.user_id===ME.id)||{}).option_id || null) : null;
    });
  }));
  const eids = (events||[]).map(e=>e.id);
  if(eids.length) jobs.push(sb.from('rsvps').select('event_id,user_id').in('event_id',eids).then(({data})=>{
    events.forEach(e=>{
      const mine=(data||[]).filter(r=>r.event_id===e.id);
      e.going=mine.length; e.rsvped=!!(ME&&mine.some(r=>r.user_id===ME.id));
    });
  }));
  await Promise.all(jobs);
}

/* everyone's content, loaded the first time a screen asks for it */
async function loadGlobal(kind){
  if(!ONLINE || G[kind]) return;
  try{ await loadGlobalInner(kind) }
  catch(e){ console.error(kind,e); G[kind]=[]; LOADFAIL[kind]=(e&&e.message)||'could not load'; }
}
async function loadGlobalInner(kind){
  if(kind==='posts'){
    const { data } = await sb.from('posts')
      .select('*, profiles!posts_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(FEEDLIMIT);
    G.posts = data||[]; await decorate(G.posts); await attachComments(G.posts);
  }
  if(kind==='polls'){
    const { data } = await sb.from('polls')
      .select('*, poll_options(*), profiles!polls_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(40);
    G.polls = data||[]; await decorate(null,G.polls);
  }
  if(kind==='events'){
    const today = new Date().toISOString().slice(0,10);
    const { data } = await sb.from('events')
      .select('*, profiles!events_author_fkey(handle,name,photo_url,location)')
      .gte('date',today).order('date').limit(40);
    G.events = data||[]; await decorate(null,null,G.events);
  }
  if(kind==='issues'){
    const { data } = await sb.from('issues')
      .select('*, profiles!issues_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(400);
    G.issues = data||[];
  }
  if(kind==='ends'){
    const { data } = await sb.from('endorsements')
      .select('*, profiles!endorsements_author_fkey(handle,name,photo_url,location)')
      .order('created_at',{ascending:false}).limit(200);
    G.ends = data||[];
  }
}
function agree(title){
  const t=(title||'').trim().toLowerCase();
  const rows=(G.issues||[]).filter(i=>i.title.trim().toLowerCase()===t);
  return {s:rows.filter(r=>r.stance==='Support').length, o:rows.filter(r=>r.stance==='Oppose').length};
}

/* every write goes through here: save, reload, repaint */
async function mutate(fn){
  try{
    if(!ONLINE){ const db=localDB(); fn.local && fn.local(db); localSave(db); }
    else { const err = await fn.remote(); if(err){ toast(friendly(err)); return } }
  }catch(e){ toast('Something went wrong'); return }
  if(fn.clears) fn.clears.forEach(k=>G[k]=null);
  await load(); if(fn.clears) await Promise.all(fn.clears.map(loadGlobal));
  render();
}
function friendly(e){
  const m=(e.message||'').toLowerCase();
  if(m.includes('duplicate') && m.includes('handle')) return 'That handle is taken';
  if(m.includes('handle_format')) return 'Handles are 2-20 letters, numbers or _';
  if(m.includes('row-level security')) return 'Sign in first';
  return e.message || 'Something went wrong';
}

/* one sheet, used by every Share button and by Invite */
function shareSheet({title, text, url, editable, canPost}){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3>${esc(title)}</h3>
    ${editable
      ? `<textarea class="inp msgbox" id="shText" rows="3">${esc(text)}</textarea>`
      : `<p class="sheetmsg">${esc(text)}</p>`}
    <div class="urlrow"><span id="shUrl">${esc(url.replace(/^https?:\/\//,''))}</span>
      <button class="mini-btn" id="shCopy">Copy</button></div>
    <div class="nets">${NETS.map((n,i)=>`
      <button class="net" data-net="${i}" title="${n[0]}" aria-label="${n[0]}" style="--brand:${n[1]}">
        <svg viewBox="0 0 24 24" fill="currentColor">${n[2]}</svg></button>`).join('')}</div>
    <div class="sheetfoot">
      ${canPost ? `<button class="btn" id="shPost">Post it to my feed</button>` : ''}
      ${navigator.share ? `<button class="btn ghost" id="shMore">More…</button>` : ''}
      <button class="btn ghost" id="shClose">Close</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const msg = ()=> (editable ? ($('shText').value.trim() || text) : text);
  const close = ()=>wrap.remove();

  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('shClose').onclick = close;
  $('shCopy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(msg()+'\n'+url); toast('Copied'); logShare() }
    catch(e){ toast(url) }
  };
  wrap.querySelectorAll('[data-net]').forEach(b=>b.onclick=()=>{
    const enc = {t:encodeURIComponent(msg()), u:encodeURIComponent(url)};
    window.open(NETS[+b.dataset.net][3](enc), '_blank', 'noopener,width=620,height=640');
    logShare();
  });
  const more = $('shMore');
  if(more) more.onclick = async ()=>{
    try{ await navigator.share({text:msg(), url}); logShare() }catch(e){}
  };
  const post = $('shPost');
  if(post) post.onclick = async ()=>{
    if(!await needAuth()) return;
    const text = (msg()+'\n'+url).slice(0,1000);
    post.disabled = true;
    await mutate({ local:db=>db.posts.unshift({id:uid(),text,created_at:new Date().toISOString(),likes:0,liked:false}),
      remote:async()=>(await sb.from('posts').insert({author:ME.id,text})).error, clears:['posts'] });
    logShare(); close(); toast('Posted'); open_('feed');
  };
}

const ST = {Alabama:'AL',Alaska:'AK',Arizona:'AZ',Arkansas:'AR',California:'CA',Colorado:'CO',Connecticut:'CT',
 Delaware:'DE','District of Columbia':'DC',Florida:'FL',Georgia:'GA',Hawaii:'HI',Idaho:'ID',Illinois:'IL',
 Indiana:'IN',Iowa:'IA',Kansas:'KS',Kentucky:'KY',Louisiana:'LA',Maine:'ME',Maryland:'MD',Massachusetts:'MA',
 Michigan:'MI',Minnesota:'MN',Mississippi:'MS',Missouri:'MO',Montana:'MT',Nebraska:'NE',Nevada:'NV',
 'New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM','New York':'NY','North Carolina':'NC','North Dakota':'ND',
 Ohio:'OH',Oklahoma:'OK',Oregon:'OR',Pennsylvania:'PA','Rhode Island':'RI','South Carolina':'SC','South Dakota':'SD',
 Tennessee:'TN',Texas:'TX',Utah:'UT',Vermont:'VT',Virginia:'VA',Washington:'WA','West Virginia':'WV',
 Wisconsin:'WI',Wyoming:'WY'};

/* ---- where you vote drives what you see ---- */
const ABBR = Object.fromEntries(Object.entries(ST).map(([n,a])=>[a,n]));
function stateOf(loc){
  if(!loc) return null;
  const part = String(loc).split(',').pop().trim();
  if(ST[part]) return ST[part];
  const up = part.toUpperCase();
  return ABBR[up] ? up : null;
}
const stateName = code => ABBR[code] || '';
const stateSlug = code => (ABBR[code]||'').toLowerCase().replace(/\s+/g,'-');
const myState   = () => stateOf(V && V.location);
const isNear    = row => {
  const m = myState(); if(!m) return false;
  return stateOf(row && row.profiles && row.profiles.location) === m;
};
/* pick the list a screen should show, and say so plainly when we fall back */
function scoped(key, mine, all){
  if(RO || !ONLINE) return {list:mine, note:''};
  const sc = SC[key] || 'all';
  if(sc==='mine') return {list:mine, note:''};
  if(sc==='saved'){
    if(!ME) return {list:[], note:''};
    if(G.saved === null) return {list:[], note:'', loading:true};
    return {list:G.saved, note:G.saved.length ? '' : ''};
  }
  if(sc==='follow'){
    if(!ME) return {list:[], note:''};
    if(all === null) return {list:[], note:'', loading:true};
    const f = (all||[]).filter(r => MYFOLLOWS.has(r.author));
    return {list:f, note:f.length ? '' : 'Nobody you follow has posted yet.'};
  }
  if(all === null) return {list:[], note:'', loading:true};   // still fetching
  const everyone = all || [];
  if(sc==='near'){
    const n = everyone.filter(isNear);
    if(n.length) return {list:n, note:''};
    return {list:everyone, note:`Nobody in ${stateName(myState())} yet — showing everyone.`};
  }
  return {list:everyone, note:''};
}

function placeahead(input, onPick){
  if(!input || input.readOnly && !input.closest('.panel')) return;
  let box=null, timer=null, cursor=-1, items=[], skip=false;

  const close = ()=>{ if(box){ box.remove(); box=null; cursor=-1 } };
  const pick  = v => { input.value=v; close(); skip=true; input.dispatchEvent(new Event('input'));
                       if(onPick) setTimeout(onPick,50); };

  const show = ()=>{
    close();
    if(!items.length) return;
    box = document.createElement('div');
    box.className = 'talist';
    box.innerHTML = items.map((t,i)=>`<button type="button" data-i="${i}">${esc(t)}</button>`).join('')
      + '<small>Places from OpenStreetMap</small>';
    box.addEventListener('mousedown', e=>{
      const b = e.target.closest('button'); if(b) { e.preventDefault(); pick(items[+b.dataset.i]); }
    });
    input.parentNode.appendChild(box);
  };

  const label = o => {
    const a = o.address || {};
    const city = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
    const st = a.state ? (ST[a.state] || a.state) : '';
    if(city && st) return `${city}, ${st}`;
    if(st) return st;
    return (o.display_name||'').split(',').slice(0,2).join(',').trim() || null;
  };

  input.addEventListener('input', ()=>{
    if(input.readOnly) return;
    clearTimeout(timer);
    if(skip){ skip=false; return close(); }        // just picked one, do not re-open
    const q = input.value.trim();
    if(q.length < 2) return close();
    timer = setTimeout(async ()=>{
      try{
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1'
          + '&countrycodes=us&limit=6&q=' + encodeURIComponent(q));
        if(!r.ok) return close();
        const data = await r.json();
        items = [...new Set(data.map(label).filter(Boolean))].slice(0,6);
        if(input.value.trim().length >= 2) show();
      }catch(e){ close() }
    }, 320);
  });

  input.addEventListener('keydown', e=>{
    if(!box) return;
    const btns = [...box.querySelectorAll('button')];
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      cursor = (cursor + (e.key==='ArrowDown'?1:-1) + btns.length) % btns.length;
      btns.forEach((b,i)=>b.classList.toggle('on', i===cursor));
    } else if(e.key==='Enter' && cursor>=0){ e.preventDefault(); pick(items[cursor]); }
    else if(e.key==='Escape') close();
  });
  input.addEventListener('blur', ()=>setTimeout(close,120));
}

function shareLine(){
  const who  = V.name || (V.handle ? '@'+V.handle : 'I');
  const what = [V.role, V.location].filter(Boolean).join(' · ');
  const mine = V.issues || D.issues;
  const n    = (D.issues||[]).length;
  const bits = [];
  bits.push(what ? `${who} — ${what}` : `${who} on democrat.si`);
  if(n) bits.push(`${n} position${n===1?'':'s'} on the record.`);
  bits.push('Positions, posts, events and ballot in one place.');
  return bits.join(' ');
}

/* ---------------- shared: people, caches, tallies ---------------- */
const LOADFAIL = {};

async function loadPeople(){
  if(!ONLINE || G.people) return;
  const { data, error } = await sb.from('profiles')
    .select('id,handle,name,photo_url,location,role,created_at')
    .not('handle','is',null).order('created_at',{ascending:false}).limit(60);
  if(error) throw error;
  G.people = data || [];
}

/* load a cache once, repaint once, and never spin forever */
function ensure(kind, screen){
  if(!ONLINE || G[kind]) return;
  const done = ()=>{ if(G[kind]===null) G[kind]=[]; if(current===screen) open_(screen, true) };
  const fail = e => { console.error(kind, e); LOADFAIL[kind] = (e && e.message) || 'could not load'; done() };
  try{ (kind==='people' ? loadPeople() : loadGlobal(kind)).then(done, fail) }
  catch(e){ fail(e) }
  setTimeout(()=>{ if(G[kind]===null){ LOADFAIL[kind]='the request timed out'; done() } }, 8000);
}

/* the most held positions, and how they split */
function issueTally(scope){
  const src = (G.issues||[]).filter(i => scope==='near' ? isNear(i) : true);
  const m = {};
  src.forEach(i=>{
    const k = (i.title||'').trim().toLowerCase(); if(!k) return;
    m[k] = m[k] || {title:i.title.trim(), s:0, o:0};
    m[k][i.stance==='Support'?'s':'o']++;
  });
  return Object.values(m).sort((a,b)=>(b.s+b.o)-(a.s+a.o));
}
function splitbar(s0,o0){
  const t=s0+o0||1;
  return `<div class="splitbar"><i class="s" style="width:${s0/t*100}%"></i><i class="o" style="width:${o0/t*100}%"></i></div>
    <div class="legend"><span>${s0} support</span><span>${o0} oppose</span></div>`;
}

/* ---------------- guided position builder ----------------
   Claude asks; you answer; it turns YOUR answers into positions you approve.
   It never invents a position you did not express.                          */
async function standSheet(){
  const asked = [], said = [];
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox stand">
    <h3>Where do you stand?</h3>
    <p class="sheetmsg" id="stStep">A few questions about real trade-offs. Answer in your own words — there are no right answers, and nothing is published.</p>
    <div id="stBody"></div>
    <div class="sheetfoot">
      <button class="btn ghost" id="stClose">Close</button>
      <button class="btn" id="stGo">Start</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const body = $('stBody'), step = $('stStep'), go = $('stGo');
  const close = ()=>wrap.remove();
  $('stClose').onclick = close;
  wrap.onclick = e=>{ if(e.target===wrap) close() };

  const TOTAL = 5;
  let picked = [];

  async function nextQuestion(){
    go.disabled = true; go.textContent = 'Thinking…';
    const q = await ai('interview',
      `Ask question ${asked.length+1} of ${TOTAL}.` +
      (V && V.location ? ` They vote in ${V.location}.` : '') +
      (asked.length ? ` Do not repeat these: ${asked.join(' | ')}` : ''));
    go.disabled = false;
    if(!q){ close(); return; }
    asked.push(q);
    step.textContent = `Question ${asked.length} of ${TOTAL}`;
    body.innerHTML = `<p class="stq">${esc(q)}</p>
      <textarea class="inp msgbox" id="stAns" rows="3" placeholder="In your own words. Or skip it."></textarea>`;
    go.textContent = asked.length === TOTAL ? 'Done' : 'Next';
    $('stAns').focus();
    go.onclick = onAnswer;
  }

  async function onAnswer(){
    const a = ($('stAns') && $('stAns').value.trim()) || '';
    said.push({ q: asked[asked.length-1], a });
    if(asked.length < TOTAL) return nextQuestion();
    await distil();
  }

  async function distil(){
    const answered = said.filter(x => x.a.length > 1);
    if(!answered.length){ toast('Nothing to work with yet'); return close(); }
    step.textContent = 'Reading your answers';
    body.innerHTML = '<div class="spin"></div>';
    go.disabled = true; go.textContent = 'Working…';
    const raw = await ai('distil', answered.map(x => `Q: ${x.q}\nThey said: ${x.a}`).join('\n\n'));
    go.disabled = false;
    let out = [];
    try{ out = (JSON.parse(raw.replace(/^```json|```$/g,'').trim()).positions || []) }catch(e){ out = [] }
    if(!out.length){
      step.textContent = 'Nothing clear enough yet';
      body.innerHTML = `<p class="sheetmsg">Your answers did not land on a firm position — which is a fine answer. Try again another time, or add one by hand.</p>`;
      go.textContent = 'Close'; go.onclick = close; return;
    }
    picked = out.map((p,i) => ({...p, on:true, i}));
    step.textContent = 'From what you said. Untick anything that is not you.';
    body.innerHTML = `<div class="standlist">${picked.map(p=>`
      <label class="standrow">
        <input type="checkbox" data-p="${p.i}" checked>
        <span class="grow"><b>${esc(p.title)}</b><small>${esc(p.because||'')}</small></span>
        <span class="tag ${p.stance==='Support'?'b':''}">${esc(p.stance)}</span>
      </label>`).join('')}</div>`;
    body.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{ picked[+cb.dataset.p].on = cb.checked });
    go.textContent = 'Add these'; go.onclick = save;
  }

  async function save(){
    const keep = picked.filter(p => p.on);
    if(!keep.length) return close();
    go.disabled = true; go.textContent = 'Saving…';
    for(const p of keep){
      const stance = p.stance === 'Oppose' ? 'Oppose' : 'Support';
      if(!ONLINE){ const db = localDB(); db.issues.unshift({id:uid(), title:p.title, stance}); localSave(db); }
      else { const { error } = await sb.from('issues').insert({author:ME.id, title:p.title, stance});
             if(error){ toast(friendly(error)); break } }
    }
    G.issues = null; await load(); await loadGlobal('issues');
    close(); toast(`Added ${keep.length} position${keep.length===1?'':'s'}`); open_('issues');
  }

  go.onclick = nextQuestion;
}

/* comments hang off posts; fetch them for whatever set of posts is on screen */
async function attachComments(posts){
  if(!ONLINE || !posts || !posts.length) return;
  const ids = posts.map(p=>p.id);
  try{
    const { data } = await sb.from('comments')
      .select('*, profiles!comments_author_fkey(handle,name,photo_url)')
      .in('post_id', ids).order('created_at');
    posts.forEach(p => p.comments = (data||[]).filter(c => c.post_id === p.id));
  }catch(e){ posts.forEach(p => p.comments = p.comments || []) }
}

/* every message you are part of — row level security means only yours come back */
async function loadDMs(){
  if(!ONLINE || !ME){ DMS = []; DMUNREAD = 0; return }
  try{
    const { data } = await sb.from('messages')
      .select('*, sender_p:profiles!messages_sender_fkey(id,handle,name,photo_url),' +
              ' recipient_p:profiles!messages_recipient_fkey(id,handle,name,photo_url)')
      .order('created_at', {ascending:false}).limit(300);
    DMS = data || [];
    DMUNREAD = DMS.filter(m => m.recipient === ME.id && !m.read_at).length;
  }catch(e){ DMS = []; DMUNREAD = 0 }
}
/* one entry per person, newest first */
function threads(){
  const map = new Map();
  DMS.forEach(m => {
    const mine = m.sender === ME.id;
    const other = mine ? m.recipient_p : m.sender_p;
    if(!other) return;
    const key = other.id;
    if(!map.has(key)) map.set(key, { who:other, last:m, unread:0, msgs:[] });
    const t = map.get(key);
    t.msgs.push(m);
    if(!mine && !m.read_at) t.unread++;
  });
  return [...map.values()].map(t => ({...t, msgs:t.msgs.slice().reverse()}));
}

                          catch(e){ return [] } })());
const savePins = ()=>{ try{ localStorage.setItem('dai.pins', JSON.stringify([...PINS])) }catch(e){} };

const dayLabel = ts =>{
  const d = new Date(ts), t = new Date();
  const same = (a,b)=> a.toDateString() === b.toDateString();
  if(same(d,t)) return 'Today';
  const y = new Date(t.getTime() - 864e5);
  if(same(d,y)) return 'Yesterday';
  const week = Date.now() - d.getTime() < 6 * 864e5;
  return d.toLocaleDateString(undefined, week ? {weekday:'long'}
    : {month:'long', day:'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric'});
};
const clockOf = ts => new Date(ts).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
const hereNow = id => (HERE || []).some(p => p && p.handle && p.id !== (ME||{}).id
  && ((G.people||[]).find(x=>x.handle === p.handle)||{}).id === id);

/* highlight what you searched for, on top of the usual linking */
function markHits(html, q){
  if(!q) return html;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  /* walk tags and text separately, so nothing inside an attribute is touched */
  return html.replace(/(<[^>]*>)|([^<]+)/g,
    (m, tag, txt)=> tag ? tag : txt.replace(re, '<mark>$1</mark>'));
}

function hubThreads(){
  const q = HUBFIND.trim().toLowerCase();
  let list = threads();
  if(q) list = list.filter(t =>
    (t.who.name || '').toLowerCase().includes(q) ||
    (t.who.handle || '').toLowerCase().includes(q) ||
    t.msgs.some(m => (m.text || '').toLowerCase().includes(q)));
  if(HUBFILTER === 'unread') list = list.filter(t => t.unread);
  if(HUBFILTER === 'pinned') list = list.filter(t => PINS.has(t.who.id));
  return list.sort((a,b)=>{
    const pa = PINS.has(a.who.id) ? 1 : 0, pb = PINS.has(b.who.id) ? 1 : 0;
    if(pa !== pb) return pb - pa;
    return new Date((b.last||{}).created_at || 0) - new Date((a.last||{}).created_at || 0);
  });
}

function paintHub(){
  if(!HUB) return;
  const list = $('hubList'); if(list) list.innerHTML = hubListHTML();
  const pane = $('hubPane');
  if(pane){
    const box0 = $('hubMsgs');
    const stick = !box0 || box0.scrollTop + box0.clientHeight >= box0.scrollHeight - 60;
    pane.innerHTML = hubPaneHTML();
    const box = $('hubMsgs');
    if(box && stick) box.scrollTop = box.scrollHeight;
  }
  HUB.classList.toggle('inthread', !!HUBWITH);
  const c = $('hubCount');
  if(c) c.textContent = DMUNREAD ? `${DMUNREAD} unread` : '';
  HUB.querySelectorAll('[data-filter]').forEach(b=>
    b.classList.toggle('on', b.dataset.filter === HUBFILTER));
  paintHubMedia();
  wireHub();
}
function paintHubMedia(){
  const box = $('hubMedia'); if(!box) return;
  box.hidden = !HUBIMG;
  box.innerHTML = HUBIMG ? `<span class="thumbwrap"><img class="thumb" src="${HUBIMG.url}" alt="">
    <button class="thumbx" id="hubDrop" aria-label="Remove photo">&#10005;</button></span>
    <span class="meta">Photo ready to send</span>` : '';
  const d = $('hubDrop');
  if(d) d.onclick = ()=>{ HUBIMG = null; paintHubMedia();
    const s = $('hubSend'), t = $('hubText'); if(s && t) s.disabled = !t.value.trim() };
}

function wireHub(){
  if(!HUB) return;
  HUB.querySelectorAll('[data-thread]').forEach(b=>b.onclick = ()=> openThread(b.dataset.thread));
  HUB.querySelectorAll('[data-pin]').forEach(b=>b.onclick = e=>{
    e.stopPropagation();
    const id = b.dataset.pin;
    if(PINS.has(id)) PINS.delete(id); else PINS.add(id);
    savePins(); paintHub();
  });
  HUB.querySelectorAll('[data-filter]').forEach(b=>b.onclick = ()=>{
    HUBFILTER = b.dataset.filter; paintHub();
  });
  const pin = $('hubPin');
  if(pin) pin.onclick = ()=>{
    if(PINS.has(HUBWITH)) PINS.delete(HUBWITH); else PINS.add(HUBWITH);
    savePins(); paintHub();
  };
  HUB.querySelectorAll('[data-copy]').forEach(b=>b.onclick = async ()=>{
    const m = DMS.find(x => String(x.id) === b.dataset.copy);
    try{ await navigator.clipboard.writeText((m && m.text) || ''); toast('Copied') }
    catch(e){ toast('Could not copy') }
  });
  HUB.querySelectorAll('[data-del]').forEach(b=>b.onclick = async ()=>{
    const id = b.dataset.del;
    DMS = DMS.filter(x => String(x.id) !== String(id));
    paintHub();
    const r = await sb.from('messages').delete().eq('id', id);
    if(r.error) toast(/policy|row-level/i.test(r.error.message)
      ? 'Run the latest update.sql to delete messages' : friendly(r.error));
    await loadDMs(); paintHub();
  });

  const t = $('hubText'), send = $('hubSend'), photo = $('hubPhoto'), file = $('hubFile');
  if(photo && file){
    photo.onclick = ()=>file.click();
    file.onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      shrink(f, 1400, (blob, url)=>{ HUBIMG = {blob, url}; paintHubMedia();
        if(send) send.disabled = false });
      file.value = '';
    };
  }
  if(t){
    const grow = ()=>{ t.style.height = 'auto';
      t.style.height = Math.min(t.scrollHeight, 150) + 'px';
      send.disabled = !t.value.trim() && !HUBIMG };
    t.oninput = grow; grow();
    mentionable(t);
    send.onclick = sendHub;
    t.onkeydown = e=>{
      if(e.key === 'Enter' && !e.shiftKey && !document.querySelector('.talist')){
        e.preventDefault(); sendHub();
      }
    };
    if(!phone()) t.focus();
  }
}

async function openThread(id){
  HUBWITH = id;
  HUBIMG = null;
  paintHub();
  if(!ONLINE || !ME) return;
  const unread = DMS.filter(m => m.sender === id && m.recipient === ME.id && !m.read_at);
  if(!unread.length) return;
  try{
    await sb.from('messages').update({read_at:new Date().toISOString()})
      .eq('sender', id).eq('recipient', ME.id).is('read_at', null);
    unread.forEach(m => m.read_at = new Date().toISOString());
    DMUNREAD = DMS.filter(m => m.recipient === ME.id && !m.read_at).length;
    renderRail();
    const c = $('hubCount'); if(c) c.textContent = DMUNREAD ? `${DMUNREAD} unread` : '';
    const l = $('hubList'); if(l){ l.innerHTML = hubListHTML(); wireHub() }
  }catch(e){}
}

async function sendHub(){
  const t = $('hubText'); if(!t || !HUBWITH) return;
  const text = t.value.trim();
  if(!text && !HUBIMG) return;
  if(!await needAuth()) return;
  const img = HUBIMG;
  t.value = ''; t.style.height = 'auto'; HUBIMG = null;
  const send = $('hubSend'); if(send) send.disabled = true;

  const tmp = 'tmp' + uid();
  const me = {id:ME.id, handle:ME.handle, name:ME.name, photo_url:ME.photo_url};
  const other = (threads().find(x=>x.who.id === HUBWITH) || {}).who
    || (G.people || []).find(p=>p.id === HUBWITH) || {id:HUBWITH};
  DMS.unshift({id:tmp, sender:ME.id, recipient:HUBWITH, text, image_url:img ? img.url : null,
               created_at:new Date().toISOString(), read_at:null, sender_p:me, recipient_p:other});
  HUBSENDING++;
  paintHub();

  let image_url = null;
  if(img){
    image_url = await uploadPhoto(img.blob);
    if(!image_url && !text){
      DMS = DMS.filter(m => m.id !== tmp); HUBSENDING--; paintHub(); return;
    }
  }
  const row = {sender:ME.id, recipient:HUBWITH, text: text || '\u{1F4F7}'};
  if(image_url) row.image_url = image_url;
  const r = await sb.from('messages').insert(row);
  HUBSENDING--;
  if(r.error){
    DMS = DMS.filter(m => m.id !== tmp);
    toast(/image_url/.test(r.error.message || '')
      ? 'Run the latest update.sql to send photos' : friendly(r.error));
  }
  await loadDMs(); paintHub(); renderRail();
}

/* every message can be pushed further — for, against, deeper, plainer */
const MSG_ACTIONS = {
  assistant: [['for','+','The case for'], ['against','\u2212','The case against'],
              ['deeper','Deep','Go deeper'], ['simple','Simple','Put it simply'],
              ['post','Post','Put this in your feed'], ['share','Share','Send it somewhere']],
  user:      []
};
const MSG_PLAIN = new Set(['post','share']);   /* these do not ask another question */
function actPrompt(kind, role, text){
  const q = (text||'').length > 240 ? text.slice(0,240) + '…' : (text||'');
  const it = role === 'user' ? `this: "${q}"` : 'that';
  if(kind === 'for')     return `Make the strongest case for ${it}. Who is helped, by how much, and what is the argument at its best?`;
  if(kind === 'against') return `Now the strongest honest case against ${it} — the version its smartest opponent would actually make, not a caricature. Then say where you think it holds up and where it does not.`;
  if(kind === 'deeper')  return `Go deeper on ${it}: the mechanics, who actually decides, what it costs, and where this usually goes wrong in practice.`;
  return `Put that more simply — as if explaining it to someone hearing about it for the first time.`;
}
const actionRow = (i, role) => {
  const set = MSG_ACTIONS[role] || [];
  if(!set.length) return '';
  return `<div class="mact">${set.map(([k,label,title]) =>
    `<button data-mact="${k}" data-mi="${i}" title="${title}" aria-label="${title}"
      class="${k==='for'||k==='against'?'sym':''}${MSG_PLAIN.has(k)?' keep':''}">${label}</button>`).join('')}</div>`;
};

  CHAT = []; CHATKEY = null;

    try{
      for(let i = sessionStorage.length - 1; i >= 0; i--){
        const k = sessionStorage.key(i);
        if(k && k.startsWith('dai.chat.')) sessionStorage.removeItem(k);

    }catch(e){}
  }
}

    const bubbles = CHAT.map((m,i) => m.role==='user'
      ? `<div class="msg me" data-i="${i}"><div class="bubble">${esc(m.content)}</div></div>`
      : `<div class="msg ai" data-i="${i}"><div class="say">${md(m.content)}${
           m.used && m.used.length
             ? `<div class="lookedat">Read ${[...new Set(m.used)].map(u=>TOOLNAME[u]||u).join(', ')} on this site</div>`
             : ''}${actionRow(i,'assistant')}</div></div>`
    ).join('');

    return `<div class="split"><div class="main chat">
      <div class="msgs" id="chMsgs">
        ${CHAT.length ? bubbles : `
          <div class="chatintro">
            <span class="introdot"></span>
            <h3>What are you working out?</h3>
            <p>Think out loud about something local or national. Nothing here is posted anywhere.</p>
            <div class="starters">
              ${STARTERS.map((t,i)=>`<button class="starter" data-starter="${i}">${esc(t)}</button>`).join('')}
            </div>
          </div>`}
      </div>
      <div class="chatbar">
        <textarea id="chText" rows="1" placeholder="Ask anything about politics" maxlength="4000"></textarea>
        <button class="sendbtn" id="chSend" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </div>
    </div>
    <aside class="side">
      <div class="card"><h5>Talk about</h5>
        <div class="topics">${TOPICS.map((t,i)=>
          `<button class="topic" data-topic="${i}" title="${esc(t[1])}">${esc(t[0])}</button>`).join('')}</div>
      </div>
      ${D.posts.length?`<div class="card"><h5>Your last posts</h5>
        ${D.posts.slice(0,3).map(p=>`<div style="font-size:13px;line-height:1.5;color:var(--ink2)">${esc(p.text.slice(0,90))}${p.text.length>90?'…':''}</div>`).join('')}
        <button class="mini-btn" data-go="feed" style="align-self:flex-start">Open Feed</button>
      </div>`:`<div class="card"><h5>When you are ready</h5>
        <button class="mini-btn" data-go="feed" style="text-align:left">Post something to your feed</button>
      </div>`}
    </aside></div>`;
  },
  init(){
    chatLoad();
    if(GUEST()) return;
    const box=$('chMsgs'), t=$('chText'), send=$('chSend');
    let busy = false;
    const bottom = ()=>{ box.scrollTop = box.scrollHeight };
    bottom();

    const grow = ()=>{ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,180)+'px';
                       send.disabled = !t.value.trim() || busy };
    t.oninput = grow; grow(); t.focus();

    const bubble = (role, text) => {
      const div = document.createElement('div');
      const i = CHAT.length - 1;
      div.className = 'msg ' + (role==='user'?'me':'ai');
      div.dataset.i = i;
      div.innerHTML = role==='user'
        ? `<div class="bubble">${esc(text)}</div>`
        : `<div class="say">${md(text)}${actionRow(i,'assistant')}</div>`;
      const intro = box.querySelector('.chatintro'); if(intro) intro.remove();
      box.appendChild(div); bottom();
      return div;
    };

    async function ask(text){
      if(busy || !text.trim()) return;
      busy = true; send.disabled = true;
      CHAT.push({role:'user', content:text.trim()});
      bubble('user', text.trim());
      t.value=''; grow();

      const wait = document.createElement('div');
      wait.className = 'msg ai';
      wait.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
      box.appendChild(wait); bottom();

      try{
        const { text:reply, used } = await aiChat(CHAT);
        wait.remove();
        if(!reply){
          toast('That came back empty — try asking it again');
          CHAT.pop();
          const orphan = box.querySelector('.msg.me:last-of-type'); if(orphan) orphan.remove();
          t.value = text; grow();
        }
        if(reply){
          CHAT.push({role:'assistant', content:reply, used});
          const el = bubble('assistant', reply);
          if(used && used.length){
            const seen = [...new Set(used)].map(u=>TOOLNAME[u]||u);
            const note = document.createElement('div');
            note.className = 'lookedat';
            note.textContent = 'Read ' + seen.join(', ') + ' on this site';
            el.querySelector('.say').appendChild(note);
          }
        }

      }catch(e){
        wait.remove();
        toast(e.message || 'That did not go through');
        CHAT.pop();                                   // let them try again cleanly
        const last = box.querySelector('.msg.me:last-of-type'); if(last) last.remove();
        t.value = text; grow();
      }
      chatSave();
      busy = false; grow();
      /* reveal the New chat button once — but never while there is text in the box,
         or the repaint throws away what the person is holding */
      if(CHAT.length && !$('chNew') && !t.value.trim()) open_('compose', true);
    }

    box.addEventListener('click', e=>{
      const b = e.target.closest('[data-mact]'); if(!b) return;
      const m = CHAT[+b.dataset.mi]; if(!m) return;
      const k = b.dataset.mact;
      if(k === 'post'){                       /* your feed, in your own words if you want */
        PREFILL.feed = String(m.content || '').trim() + '\n\n';
        return open_('feed');
      }
      if(k === 'share') return shareSheet({ title:'Share this',
        text: String(m.content || '').trim().slice(0, 600),
        url: publicUrl(V && V.handle), editable:true, canPost:!RO && !GUEST() });
      if(busy) return;
      ask(actPrompt(k, m.role, m.content));
    });

    send.onclick = ()=>ask(t.value);
    t.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(t.value) } };
    document.querySelectorAll('[data-starter]').forEach(b=>b.onclick=()=>ask(STARTERS[+b.dataset.starter]));
    document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>ask(TOPICS[+b.dataset.topic][1]));
    const nw=$('chNew');
    if(nw) nw.onclick=()=>{ CHAT=[]; chatSave(); open_('compose') };
  }
};

const LIBCOUNT = LIB.reduce((n,g)=>n + g.items.length, 0);
const libFind = q => { const k = String(q||'').trim().toLowerCase();
  for(const g of LIB) for(const it of g.items) if(it.q.toLowerCase() === k) return {...it, topic:g.t};
  return null; };
let LIBTOPIC = LIB[0].t, LIBSEARCH = '';

/* what I personally hold, kept apart from whichever profile is on screen */
let MYSTANCE = new Map();
function stanceKey(t){ return String(t||'').trim().toLowerCase() }
async function loadMine(){
  MYSTANCE = new Map();
  if(!ONLINE){
    (localDB().issues || []).forEach(i => MYSTANCE.set(stanceKey(i.title), {id:i.id, stance:i.stance}));
    return;
  }
  if(!ME) return;
  const r = await sb.from('issues').select('id,title,stance').eq('author', ME.id);
  ((r && r.data) || []).forEach(i => MYSTANCE.set(stanceKey(i.title), {id:i.id, stance:i.stance}));
}
const myStance = t => (MYSTANCE.get(stanceKey(t)) || {}).stance || '';

/* one tap sets, changes or clears where you stand */
async function setStance(title, stance){
  title = String(title||'').trim();
  if(!title) return;
  if(!await needAuth()) return;
  const key = stanceKey(title);
  const cur = MYSTANCE.get(key);
  const clearing = cur && cur.stance === stance;

  if(clearing) MYSTANCE.delete(key);
  else MYSTANCE.set(key, {id: cur ? cur.id : 'pending', stance});
  if(current === 'issues') open_('issues', true);          /* answer the tap at once */

  if(!ONLINE){
    const db = localDB();
    db.issues = (db.issues || []).filter(i => stanceKey(i.title) !== key);
    if(!clearing) db.issues.unshift({id:uid(), title, stance, created_at:new Date().toISOString()});
    localSave(db);
    await load(); render();
    return;
  }
  try{
    if(cur && cur.id !== 'pending') await sb.from('issues').delete().eq('id', cur.id);
    if(!clearing){
      const ins = await sb.from('issues').insert({author:ME.id, title, stance}).select().single();
      if(ins.error) throw ins.error;
      MYSTANCE.set(key, {id:ins.data.id, stance});
    }
  }catch(e){ toast(friendly(e)); await loadMine() }
  G.issues = null;
  await load(); await loadGlobal('issues');
  render();
}

/* people whose positions line up with yours */
function allies(){
  if(!MYSTANCE.size) return [];
  const by = new Map();
  (G.issues || []).forEach(i=>{
    if(!i.profiles || !i.author || (ME && i.author === ME.id)) return;
    const mine = MYSTANCE.get(stanceKey(i.title));
    if(!mine) return;
    const e = by.get(i.author) || {agree:0, total:0, p:i.profiles};
    e.total++; if(mine.stance === i.stance) e.agree++;
    by.set(i.author, e);
  });
  return [...by.values()].filter(x => x.total >= 2)
    .sort((a,b)=> (b.agree/b.total) - (a.agree/a.total) || b.total - a.total).slice(0, 5);
}

function stanceRow(it, topic){
  const a = ONLINE ? agree(it.q) : {s:0, o:0};
  const tot = a.s + a.o;
  const mine = myStance(it.q);
  return `<div class="stance" data-q="${esc(it.q)}">
    <div class="grow">
      <b>${esc(it.q)}</b>
      <small>${esc(it.w)}</small>
      <div class="srow">
        <span class="lvl">${esc(it.lv)}</span>
        ${topic ? `<span class="lvl topic">${esc(topic)}</span>` : ''}
        ${tot ? `<span class="scount">${a.s} support &middot; ${a.o} oppose</span>`
              : `<span class="scount">Nobody here yet</span>`}
      </div>
      ${tot ? splitbar(a.s, a.o) : ''}
    </div>
    <div class="sbtns">
      <button class="sbtn yes${mine==='Support'?' on':''}" data-side="Support"
        aria-pressed="${mine==='Support'}">Support</button>
      <button class="sbtn no${mine==='Oppose'?' on':''}" data-side="Oppose"
        aria-pressed="${mine==='Oppose'}">Oppose</button>
      <button class="sbtn why" data-why="${esc(it.q)}" title="The strongest case against">?</button>
    </div>
    <div class="ai" id="why-${esc(it.q).replace(/[^a-z0-9]+/gi,'').slice(0,24)}" hidden></div>
  </div>`;
}

S.issues = {
  sub(){ return RO ? `Where @${V.handle} stands`
    : `${MYSTANCE.size} of ${LIBCOUNT} taken &middot; and anything else you add` },
  acts(){
    if(RO || !ONLINE && false) return '';
    const tb = RO ? [] : [['browse','Browse'],['mine','Yours'],['all','Everyone']];

    /* ---------------- browse the library ---------------- */

      const q = LIBSEARCH.trim().toLowerCase();

            ${esc(g.t)}${taken?`<i>${taken}</i>`:''}</button>`}).join('')}</div>
        <input class="inp" id="libFind" placeholder="Search every position" value="${esc(LIBSEARCH)}">

    }

    /* ---------------- your own positions ---------------- */
    if(mode === 'mine'){
      const list = D.issues || [];
      main = `${GUEST() ? joinBar('Sign in to take a position.') : ''}
        ${list.length ? `<div class="stances">${list.map(i=>{
          const known = libFind(i.title);
          const a = ONLINE ? agree(i.title) : {s:0,o:0};
          const tot = a.s + a.o;
          return `<div class="stance" data-id="${i.id}" data-q="${esc(i.title)}">
            <div class="grow">
              <b>${esc(i.title)}</b>
              ${known ? `<small>${esc(known.w)}</small>` : ''}
              <div class="srow">
                ${known ? `<span class="lvl">${esc(known.lv)}</span>` : `<span class="lvl own">Your words</span>`}
                ${tot ? `<span class="scount">${a.s} support &middot; ${a.o} oppose</span>` : ''}
              </div>
              ${tot ? splitbar(a.s, a.o) : ''}
              <div class="rowacts">
                ${act('share','Share')}
                <button class="iconbtn" data-act="against">The case against</button>
                ${RO?'':act('del')}
              </div>
              <div class="ai" id="ai-${i.id}" hidden></div>
            </div>
            <div class="sbtns">
              ${RO ? `<span class="sbtn ${i.stance==='Support'?'yes on':'no on'}">${i.stance}</span>`
                   : `<button class="sbtn yes${i.stance==='Support'?' on':''}" data-side="Support">Support</button>
                      <button class="sbtn no${i.stance==='Oppose'?' on':''}" data-side="Oppose">Oppose</button>`}
            </div>
          </div>`}).join('')}</div>`
        : `<div class="empty"><b>${RO?'No positions yet':'You have not taken a side yet'}</b>${
            RO ? 'Nothing on the record here.' : 'Browse the library, or write your own.'}</div>`}`;
    }

    /* ---------------- what everyone holds ---------------- */
    if(mode === 'all'){
      const rows = tally.slice(0, 40);
      main = `${rows.length ? `<div class="stances">${rows.map(t=>{
        const known = libFind(t.title);
        const mine = myStance(t.title);
        return `<div class="stance" data-q="${esc(t.title)}">
          <div class="grow">
            <b>${esc(t.title)}</b>
            ${known ? `<small>${esc(known.w)}</small>` : ''}
            <div class="srow">
              ${known ? `<span class="lvl">${esc(known.lv)}</span>` : `<span class="lvl own">Someone's words</span>`}
              <span class="scount">${t.s} support &middot; ${t.o} oppose</span>
            </div>
            ${splitbar(t.s, t.o)}
          </div>
          ${(RO||GUEST())?'':`<div class="sbtns">
            <button class="sbtn yes${mine==='Support'?' on':''}" data-side="Support">Support</button>
            <button class="sbtn no${mine==='Oppose'?' on':''}" data-side="Oppose">Oppose</button>
          </div>`}
        </div>`}).join('')}</div>`
      : `<div class="empty"><b>Nothing on the board yet</b>Take the first position and it shows up here.</div>`}`;
    }

    return `<div class="split"><div class="main">${main}</div>
    <aside class="side">
      ${(RO||GUEST())?'':`<div class="card"><h5>Where you stand</h5>
        <div class="row"><span>Positions taken</span><b>${MYSTANCE.size}</b></div>
        <div class="row"><span>From the library</span><b>${
          [...MYSTANCE.keys()].filter(k => libFind(k)).length} of ${LIBCOUNT}</b></div>
        <div class="bar"><i style="width:${Math.min(100, Math.round(
          [...MYSTANCE.keys()].filter(k=>libFind(k)).length / LIBCOUNT * 100))}%"></i></div>
        <button class="mini-btn" id="iStand" style="align-self:flex-start">Not sure? Work it out</button>
      </div>`}
      ${friends.length?`<div class="card"><h5>You agree with</h5>
        ${friends.map(f=>personRow(f.p,
          `<span class="tag ${f.agree/f.total>=0.7?'b':''}">${Math.round(f.agree/f.total*100)}%</span>`)).join('')}
        <p class="hint" style="text-align:left;color:var(--dim)">Measured only on positions you have both taken.</p>

let NEWS = null, NEWSAT = 0, NEWSFAIL = '', NEWSSRC = [], NEWSN = 18, TOPIC = '';
const PREFILL = { feed:'', room:'' };

const TOPICMAP = [
  ['Healthcare',   ['health care','healthcare','medicaid','medicare','affordable care','obamacare',
                    'insulin','hospital','premiums','uninsured','prescription']],
  ['Reproductive rights', ['abortion','roe','reproductive','ivf','contraception','planned parenthood']],
  ['Voting rights',['voting','voter','ballot','election','gerrymander','redistrict','turnout',
                    'registration','poll worker','early vote']],
  ['Immigration',  ['immigra','border','asylum','deportation','detention',' ice ','visa','refugee','daca']],
  ['Climate',      ['climate','emissions','clean energy','solar','wind power','fossil','drilling',
                    'heat wave','wildfire','flood']],
  ['Labor',        ['union','strike','worker','wages','labor','minimum wage','organizing','layoff']],
  ['Guns',         ['gun','firearm','shooting','assault weapon','background check']],
  ['Courts',       ['supreme court','appeals court','judge','justice department','ruling','lawsuit',
                    'indict','attorney general','doj']],
  ['Cost of living',['inflation','prices','grocer','rent ','tariff','cost of living','economy',
                    'jobs report','wallet','affordab']],
  ['Housing',      ['housing','homeless','zoning','eviction','mortgage','rent control']],
  ['Education',    ['school','teacher','student','university','curriculum','book ban','tuition']],
  ['Democracy',    ['democracy','authoritarian','press freedom','january 6','disinformation',
                    'rule of law','norms','oversight']],
  ['Congress',     ['congress','senate','house of representatives','shutdown','filibuster','speaker',
                    'appropriations','subpoena']],
  ['LGBTQ+ rights',['lgbtq','transgender','trans ','marriage equality','gender-affirming']],
  ['Money in politics',['super pac','dark money','lobby','donor','campaign finance','citizens united']]
];

/* a feed can always sneak markup past the server, so clean it here as well.
   DOMParser gives an inert document: no script runs, no image loads. */
function plain(t){
  let x = String(t || '');
  for(let i = 0; i < 2; i++){
    let next = x;
    try{ next = new DOMParser().parseFromString(x, 'text/html').documentElement.textContent || '' }
    catch(e){ next = x.replace(/<[^>]*>/g, ' ') }
    next = next.replace(/<[^>]*>/g, ' ');
    if(next === x) break;
    x = next;
  }
  return x.replace(/\s+/g, ' ').trim();
}
const hay = it => (String(it.title||'') + ' ' + String(it.summary||'')).toLowerCase();
function topicsOf(it){
  const t = ' ' + hay(it) + ' ';
  return TOPICMAP.filter(([, words]) => words.some(w => t.includes(w))).map(([name]) => name);
}
function topicCounts(items){
  const n = new Map();
  (items||[]).forEach(it => topicsOf(it).forEach(t => n.set(t, (n.get(t)||0) + 1)));
  return [...n.entries()].sort((a,b)=>b[1]-a[1]);
}
const wordsFor = name => (TOPICMAP.find(t=>t[0]===name) || [null,[]])[1];
function matchesTopic(text, name){
  const t = ' ' + String(text||'').toLowerCase() + ' ';
  return wordsFor(name).some(w => t.includes(w));
}

async function loadNews(force){
  if(!force && NEWS && Date.now() - NEWSAT < 240e3) return;
  try{
    const r = await fetch('/api/news', {headers:{'accept':'application/json'}});
    if(r.status === 404 || r.status === 501) throw new Error('not deployed');
    if(!r.ok) throw new Error('the wire did not answer');
    const d = await r.json();
    NEWS = (Array.isArray(d.items) ? d.items : []).map(it => ({
      ...it, title: plain(it.title), summary: plain(it.summary)
    })).filter(it => it.title);
    NEWSSRC = d.sources || [];
    NEWSAT = Date.now(); NEWSFAIL = '';
  }catch(e){
    if(!NEWS) NEWS = [];
    NEWSFAIL = /not deployed/.test(e.message)
      ? 'The wire is not switched on yet — upload api/news.js and redeploy.'
      : 'Could not reach the wire just now.';
  }
}

/* anything with a data-ts keeps its own clock */
function tickTimes(){
  document.querySelectorAll('[data-ts]').forEach(el=>{
    if(!el.hasAttribute('data-noloc')) el.setAttribute('data-noloc','');
    const ts = el.getAttribute('data-ts'); if(!ts) return;
    const t = el.getAttribute('data-tsfmt') === 'news' ? newsWhen(ts) : ago(ts);
    if(el.textContent !== t) el.textContent = t;
  });
}
try{ setInterval(()=>{ if(!document.hidden) tickTimes() }, 30e3) }catch(e){}

const newsWhen = ts =>{
  if(!ts) return '';
  const s = (Date.now() - new Date(ts).getTime()) / 1e3;
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric'});
};
const NEWSFRESH = 45 * 60e3;

        : !list.length ? `<div class="empty"><b>Nothing on ${esc(TOPIC)} today</b>Pick another topic, or see everything.</div>`
        : `${story(lead, true)}<div class="storylist">${rest.map(it=>story(it)).join('')}</div>
           ${(TOPIC ? all.filter(it=>topicsOf(it).includes(TOPIC)) : all).length > NEWSN
             ? `<button class="mini-btn" id="tdMore" style="align-self:center">More stories</button>` : ''}`}
    </div>
    <aside class="side">
      <div class="card"><h5>Today, in a paragraph</h5>
        <div id="tdBrief" class="briefout">A short read on what the day adds up to.</div>
        <button class="mini-btn" id="tdBriefGo" style="align-self:flex-start">Write it</button>
      </div>
      ${stands.length ? `<div class="card"><h5>${TOPIC ? esc(TOPIC)+' here' : 'Where people here stand'}</h5>
        ${stands.map(h=>`<div><div class="row"><span>${esc(h.title)}</span><b>${h.s+h.o}</b></div>
          ${splitbar(h.s,h.o)}</div>`).join('')}
        <button class="mini-btn" data-go="issues" style="align-self:flex-start">Open Issues</button>
      </div>` : ''}
      ${posts.length ? `<div class="card"><h5>People here are saying</h5>
        ${posts.map(p=>`<button class="qpost" data-open="${p.id}" style="text-align:left;border:0;background:none;
            font-family:inherit;cursor:pointer;width:100%">
          <p>${esc(trim60(p.text))}</p>
          <small>@${esc((p.profiles&&p.profiles.handle)||'')} · ${ago(p.created_at)}</small></button>`).join('')}
      </div>` : ''}
      ${NEWSSRC.length ? `<div class="card"><h5>Sources</h5>
        <p class="hint" style="text-align:left">${esc(NEWSSRC.join(' · '))}</p>
        <p class="hint" style="text-align:left;color:var(--dim)">Headlines are linked, never rewritten.
          Opinions on this page are ours; the reporting is theirs.</p>
      </div>` : ''}
    </aside></div>`;
  },
  init(){
    ensure('posts','today');
    ensure('issues','today');
    if(NEWS === null) loadNews().then(()=>{ if(current==='today'){ open_('today', true); paintTicker() } });
    const r = $('tdRefresh');
    if(r) r.onclick = async ()=>{
      r.disabled = true; r.textContent = 'Checking…';
      await loadNews(true);
      if(current==='today') open_('today', true);
      paintTicker();
    };
    const more = $('tdMore');
    if(more) more.onclick = ()=>{ NEWSN += 18; open_('today', true) };
    document.querySelectorAll('[data-topic]').forEach(b=>b.onclick = ()=>{
      TOPIC = b.dataset.topic; NEWSN = 18; open_('today', true);
    });
    document.querySelectorAll('[data-read]').forEach(b=>b.onclick = e=>{
      if(e.metaKey || e.ctrlKey || e.shiftKey) return;   /* let a real new tab happen */
      e.preventDefault(); readerOpen(b.dataset.read);
    });
    document.querySelectorAll('[data-post]').forEach(b=>b.onclick = ()=>{
      const it = (NEWS||[]).find(x=>x.link === b.dataset.post); if(!it) return;
      const tag = (topicsOf(it)[0] || '').replace(/[^a-z0-9]+/gi,'').toLowerCase();
      PREFILL.feed = `${it.title}\n${it.link}${tag?`\n#${tag}`:''}\n\n`;
      open_('feed');
    });
    document.querySelectorAll('[data-floor]').forEach(b=>b.onclick = ()=>{
      const it = (NEWS||[]).find(x=>x.link === b.dataset.floor); if(!it) return;
      PREFILL.room = `${it.title} — ${it.link}\n@desk what should we make of this?`;
      open_('townhall');
    });
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick = ()=>openPost(b.dataset.open));

    const go = $('tdBriefGo');
    if(go) go.onclick = async ()=>{
      const heads = (TOPIC ? (NEWS||[]).filter(it=>topicsOf(it).includes(TOPIC)) : (NEWS||[])).slice(0,14);
      if(!heads.length) return toast('Nothing on the wire to read yet');
      const text = heads.map(it=>`${it.source}: ${it.title}${it.summary?` — ${it.summary}`:''}`).join('\n');
      const out = $('tdBrief');
      go.disabled = true; go.textContent = 'Reading…';
      const said = await ai('today', text, {topic:TOPIC || ''});
      go.disabled = false; go.textContent = 'Write it again';
      if(said) out.innerHTML = md(said);
    };
  }
};

/* ---------------------------------------------------------------- town hall
   The floor: one room everyone is in, live. Five voices from the desk can be
   pulled in by name — they read the room and the database before they speak. */
const BOTS = {
  desk:      {name:'The Desk',      letter:'D', color:'#0A3FD6', tag:'Anchor',
              blurb:'What just happened on the network'},
  organizer: {name:'The Organizer', letter:'O', color:'#16A34A', tag:'Field',
              blurb:'Turns talk into a plan for this week'},
  analyst:   {name:'The Analyst',   letter:'A', color:'#7C3AED', tag:'Numbers',
              blurb:'What the numbers actually say'},
  historian: {name:'The Historian', letter:'H', color:'#B45309', tag:'Context',
              blurb:'Where we have seen this before'},
  skeptic:   {name:'The Skeptic',   letter:'S', color:'#0E7490', tag:'Pressure',
              blurb:'Tests our arguments before they do'}
};
const BOTKEYS = Object.keys(BOTS);
let ROOMBUSY = null, ROOMCH = null, HERE = [];

async function loadRoom(){
  if(!ONLINE){ G.room = []; return }
  try{
    const { data, error } = await sb.from('room_messages')
      .select('*, profiles!room_messages_author_fkey(handle,name,photo_url,location)')
      .order('created_at', {ascending:false}).limit(120);
    if(error) throw error;
    G.room = (data || []).slice().reverse();
  }catch(e){ G.room = []; LOADFAIL.room = (e && e.message) || 'could not load' }
}

/* who is on the floor right now — best effort, the room works without it */
function joinFloor(){
  if(!ONLINE || ROOMCH || !sb.channel) return;
  try{
    const key = (ME && ME.id) || 'guest';
    ROOMCH = sb.channel('floor', {config:{presence:{key}}});
    if(ROOMCH.on) ROOMCH.on('presence', {event:'sync'}, ()=>{
      try{
        const st = ROOMCH.presenceState ? ROOMCH.presenceState() : {};
        HERE = Object.values(st).map(v => (v && v[0]) || {}).filter(x => x.handle);
        if(current === 'townhall') paintHere();
      }catch(e){}
    });
    ROOMCH.subscribe(async status => {
      if(status === 'SUBSCRIBED' && ME && ROOMCH.track)
        try{ await ROOMCH.track({handle:ME.handle, name:ME.name, photo_url:ME.photo_url}) }catch(e){}
    });
  }catch(e){ ROOMCH = null }
}
function paintHere(){
  const el = $('here'); if(!el) return;
  const n = HERE.length;
  el.innerHTML = n
    ? `${HERE.slice(0,6).map(p=>`<span class="whoav sm" title="@${esc(p.handle||'')}">${
        p.photo_url ? `<img src="${p.photo_url}" alt="">` : esc(initials(p))}</span>`).join('')}
       <span class="herecount">${n} here now</span>`
    : `<span class="herecount">The floor is open</span>`;
}

/* everything happening on the site and on the wire, newest first */
function liveFeed(){
  const out = [];
  const nm = p => (p && (p.name || (p.handle && '@' + p.handle))) || 'Someone';
  unmuted(G.posts || []).slice(0, 14).forEach(p => out.push({
    t:p.created_at, k:'Posted', who:nm(p.profiles), text:trim60(p.text), go:()=>openPost(p.id) }));
  (G.issues || []).slice(0, 12).forEach(i => out.push({
    t:i.created_at, k:i.stance === 'Support' ? 'Supports' : 'Opposes', who:nm(i.profiles),
    text:i.title, go:()=>open_('issues') }));
  (G.room || []).slice(-12).forEach(m => out.push({
    t:m.created_at, k:'On the floor', who:botOf(m) ? botOf(m).name : nm(m.profiles),
    text:trim60(m.text), go:null }));
  (G.polls || []).slice(0, 6).forEach(q => out.push({
    t:q.created_at, k:'Asked', who:nm(q.profiles), text:trim60(q.question), go:()=>open_('polls') }));
  (G.people || []).slice(0, 8).forEach(p => { if(p.created_at) out.push({
    t:p.created_at, k:'Joined', who:nm(p), text:'', go:()=>{ location.href = '/' + p.handle } }) });
  (NEWS || []).slice(0, 10).forEach(n => { if(n.when) out.push({
    t:n.when, k:n.source || 'Wire', wire:true, text:n.title, go:()=>readerOpen(n.link) }) });
  return out.filter(x => x.t).sort((a,b)=> new Date(b.t) - new Date(a.t)).slice(0, 16);
}
function liveFeedHTML(){
  const rows = liveFeed();
  if(!rows.length) return `<p class="hint" style="text-align:left">Nothing has happened yet today.</p>`;
  return rows.map((r,i)=>`<button class="lrow${r.wire?' wire':''}" data-live="${i}">
      <span class="lwhen" data-ts="${esc(r.t)}">${esc(ago(r.t))}</span>
      <span class="grow"><b>${esc(r.k)}</b>${r.who?`<span class="lwho">${esc(r.who)}</span>`:''}
        ${r.text?`<span class="ltext">${esc(r.text)}</span>`:''}</span>
    </button>`).join('');
}
function paintLiveFeed(){
  const box = $('lfeed'); if(!box) return;
  const rows = liveFeed();
  box.innerHTML = liveFeedHTML();
  box.querySelectorAll('[data-live]').forEach(b=>b.onclick = ()=>{
    const r = rows[+b.dataset.live]; if(r && r.go) r.go();
  });
}

const botOf = m => m.bot && BOTS[m.bot] ? BOTS[m.bot] : null;
function roomHTML(){
  const msgs = (G.room || []).filter(m => m.bot || !isMuted(m.profiles && m.profiles.handle));
  if(!msgs.length && !ROOMBUSY)
    return `<div class="empty"><b>Nobody has spoken yet</b>Say something, or ask the desk what is happening.</div>`;
  let last = '';
  const rows = msgs.map(m=>{
    const b = botOf(m);
    const mine = !b && ME && m.author === ME.id;
    const nm = b ? b.name : (m.profiles && (m.profiles.name || '@' + m.profiles.handle)) || 'Someone';
    const run = last === (b ? 'bot:'+m.bot : 'me:'+m.author);   /* same speaker again */
    last = b ? 'bot:'+m.bot : 'me:'+m.author;
    const av = b
      ? `<span class="whoav sm bot" style="background:${b.color}">${b.letter}</span>`
      : `<span class="whoav sm">${m.profiles && m.profiles.photo_url
          ? `<img src="${m.profiles.photo_url}" alt="">` : esc(initials(m.profiles || {}))}</span>`;
    return `<div class="rmsg${b?' isbot':''}${mine?' mine':''}${run?' run':''}" data-rid="${m.id}">
      ${run ? '<span class="rgutter"></span>' : av}
      <div class="grow">
        ${run ? '' : `<div class="rwho">
          ${b ? `<b style="color:${b.color}">${esc(nm)}</b><span class="bottag">${esc(b.tag)}</span>`
              : `${m.profiles && m.profiles.handle
                   ? `<a class="rname" href="/${esc(m.profiles.handle)}"><b>${esc(nm)}</b></a>`
                   : `<b>${esc(nm)}</b>`}`}
          <span class="rtime" data-ts="${m.created_at}">${ago(m.created_at)}</span>
          ${(ME && m.author === ME.id) ? `<button class="rdel" data-rdel="${m.id}" aria-label="Delete">&#10005;</button>` : ''}
        </div>`}
        <div class="rtext"${b?` style="border-color:${b.color}"`:''}>${b ? md(m.text) : rich(m.text)}</div>
      </div></div>`;
  }).join('');
  const busy = ROOMBUSY && BOTS[ROOMBUSY]
    ? `<div class="rmsg isbot"><span class="whoav sm bot" style="background:${BOTS[ROOMBUSY].color}">${
        BOTS[ROOMBUSY].letter}</span><div class="grow">
        <div class="rwho"><b style="color:${BOTS[ROOMBUSY].color}">${esc(BOTS[ROOMBUSY].name)}</b>
          <span class="rtime">is writing</span></div>
        <div class="typing"><i></i><i></i><i></i></div></div></div>` : '';
  return rows + busy;
}
function paintRoom(){
  if(!ONLINE) return;                       /* local mode has no shared room to paint */
  const box = $('roomMsgs'); if(!box) return;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
  box.innerHTML = roomHTML();
  box.querySelectorAll('[data-rdel]').forEach(b=>b.onclick = async ()=>{
    const { error } = await sb.from('room_messages').delete().eq('id', b.dataset.rdel);
    if(error) return toast(friendly(error));
    await loadRoom(); paintRoom();
  });
  if(stick) box.scrollTop = box.scrollHeight;
}

async function sayRoom(){
  const t = $('roomText'); if(!t) return;
  const text = t.value.trim(); if(!text) return;
  if(!await needAuth()) return;
  t.value = ''; t.style.height = 'auto';
  const send = $('roomSend'); if(send) send.disabled = true;
  const { error } = await sb.from('room_messages').insert({author:ME.id, text:text.slice(0,2000)});
  if(error) return toast(/does not exist|schema cache/i.test(error.message)
    ? 'Run the latest update.sql to open the floor' : friendly(error));
  await loadRoom(); paintRoom();
  const hit = text.match(/@(desk|organizer|analyst|historian|skeptic)\b/i);
  if(hit) summon(hit[1].toLowerCase(), text);
}

/* pull a voice from the desk into the room */
async function summon(key, ask){
  const b = BOTS[key]; if(!b) return;
  if(!await needAuth()) return;
  if(ROOMBUSY) return toast(BOTS[ROOMBUSY].name + ' is still writing');
  ROOMBUSY = key; paintRoom();
  const transcript = (G.room || []).slice(-18).map(m=>{
    const who_ = botOf(m) ? botOf(m).name
      : (m.profiles && (m.profiles.name || '@' + m.profiles.handle)) || 'Someone';
    return `${who_}: ${m.text}`;
  }).join('\n');
  let text = null;
  try{ text = await ai('room', transcript || '(the room is quiet)',
                       {bot:key, ask:ask || '', context:meContext()}) }catch(e){}
  ROOMBUSY = null;
  if(!text){ paintRoom(); return toast('The desk is quiet — check the AI key on Vercel') }
  const { error } = await sb.from('room_messages')
    .insert({author:ME.id, bot:key, text:String(text).slice(0,2000)});
  if(error) toast(friendly(error));
  await loadRoom(); paintRoom();
}

S.townhall = {
  sub(){ return RO ? `Events from @${V.handle}`
    : `${ONLINE?'<span class="live"><i></i>On air</span> ':''}One room, everyone in it` },
  acts(){ return `${(RO||GUEST()||!ONLINE)?'':`<button class="btn ghost" id="thAsk">Ask the desk</button>`}` },
  view(){

    const evs = ((RO || !ONLINE) ? D.events : (G.events || D.events) || []).filter(e=>e.date >= today);
    const days = new Set(evs.map(e=>e.date));

      </div>
      <div class="roommsgs" id="roomMsgs">${ONLINE ? roomHTML()

        <textarea id="roomText" rows="1" maxlength="2000" placeholder="Say something to the room. @desk to bring in the anchor"></textarea>
        <button class="sendbtn" id="roomSend" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </div>`}
    </div>
    <aside class="side">
      <div class="card"><h5><span class="live"><i></i>Live</span> Right now</h5>

          <button class="btn" id="tAdd" style="margin-left:auto">Add</button></div>
        <div class="ai" id="tAi" hidden></div>
      </div>`}
      <div class="card">
        <div class="calhead">
          <button class="idnav" id="calPrev">&#8249;</button>
          <b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b>
          <button class="idnav" id="calNext">&#8250;</button>
        </div>
        <div class="cal">
          ${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}
          ${cells.join('')}
        </div>
        ${CAL.pick?`<button class="linkbtn" id="calClear" style="align-self:flex-start">Clear ${dfmt(CAL.pick)}</button>`:''}

        ${shown.length ? shown.slice(0,6).map(e=>`
          <div class="next" data-id="${e.id}">
            <div class="datechip">
              <i>${new Date(e.date+'T00:00').toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</i>
              <b>${+e.date.split('-')[2]}</b></div>
            <div class="grow"><b>${esc(e.title)}</b>
              <small>${e.place?esc(e.place)+' · ':''}${e.going?e.going+' going':'be the first'}</small>

            </div>

          </div>`).join('')
        : `<p class="hint" style="text-align:left">Nothing on the calendar yet.</p>`}

    if(!RO && !GUEST() && $('tTitle')){

      $('tAdd').onclick = async ()=>{

        if(!title||!date) return toast('Add a name and a date');
        if(!await needAuth()) return;
        mutate({ local:db=>db.events.push({id:uid(),title,date,place}),
          remote:async()=>(await sb.from('events').insert({author:ME.id,title,date,place})).error,
          clears:['events'] });
      };
    }
    const evs = ((RO || !ONLINE) ? D.events : (G.events || D.events) || []);
    document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=async ()=>{
      if(!await needAuth()) return;

        : await sb.from('rsvps').insert({event_id:e.id,user_id:ME.id});

                                   e.profiles && e.profiles.handle);

        remote:async()=>(await sb.from('events').delete().eq('id',e.id)).error, clears:['events'] });
    });
  }

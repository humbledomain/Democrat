}catch(e){}</script>

<style>
:root{
  --blue:#0A3FD6; --ink:#0b0d12; --muted:#6b7488;
  --line:rgba(10,32,90,.10); --soft:rgba(10,32,90,.05);
  --tile:clamp(34px,2.6vw,40px); --pad:clamp(20px,3.2vw,44px);
  /* surfaces and text tones, so the whole app can turn dark in one place */
  --bg:#fff; --card:#fff; --panelbg:rgba(255,255,255,.9); --raise:rgba(255,255,255,.78);
  --ink2:#39415a; --ink3:#28304a; --dim:#8b93a8; --ph:#9aa3b8; --faint:#c9d2e6;
  --gutter:clamp(20px,2.4vw,40px); --mast:58px; --live:#E5352B; --tabs:0px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --blue:#4585ff; --ink:#e9edf6; --muted:#8e98b0;
  --line:rgba(150,180,255,.16); --soft:rgba(150,180,255,.08);
  --bg:#080b12; --card:#111621; --panelbg:rgba(15,20,31,.88); --raise:rgba(18,24,36,.82);
  --ink2:#c3cbdd; --ink3:#dbe2f0; --dim:#7d879e; --ph:#69738c; --faint:#39415a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);min-height:100svh;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}

.field{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
.rings{position:absolute;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-radial-gradient(circle at center,rgba(10,32,90,0) 0,rgba(10,32,90,.02) 26px,rgba(10,32,90,0) 58px);
  animation:breathe 26s ease-in-out infinite;will-change:transform}
.glow{position:absolute;inset:-25%;background:radial-gradient(38% 38% at 22% 30%,rgba(10,63,214,.05),transparent 70%);
  filter:blur(30px);animation:drift 44s ease-in-out infinite alternate}
.vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 40%,var(--bg) 92%)}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.16) rotate(4deg)}}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0)}100%{transform:translate3d(3%,2%,0) scale(1.08)}}

/* the masthead: one bar across the top, the way a news front page opens */
.mast{position:fixed;top:0;left:0;right:0;height:var(--mast);z-index:8;display:flex;align-items:center;
  gap:clamp(12px,1.8vw,26px);padding:0 var(--pad);background:var(--bg);border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:clamp(9px,1vw,14px);text-decoration:none;color:inherit;flex:none}
.dot{width:clamp(13px,1.35vw,19px);aspect-ratio:1;border-radius:50%;background:var(--blue);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,63,214,.26)}70%{box-shadow:0 0 0 22px rgba(10,63,214,0)}100%{box-shadow:0 0 0 0 rgba(10,63,214,0)}}
.word{font-size:clamp(16px,1.7vw,24px);font-weight:590;letter-spacing:-.028em}
.word .tld{color:var(--blue)}

.stage{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-columns:auto minmax(0,1fr);
  gap:clamp(22px,3vw,52px);
  padding:calc(var(--mast) + clamp(14px,2.4vh,26px)) var(--pad) clamp(28px,4vh,48px)}
.rail{display:flex;flex-direction:column;min-width:0}
.nav{display:flex;flex-direction:column;gap:1px}
.rail.settled .app{animation:none;opacity:1;transform:none}
.app{display:flex;align-items:center;gap:11px;background:none;border:0;width:100%;
  padding:6px 14px 6px 6px;border-radius:14px;position:relative;cursor:pointer;text-align:left;
  -webkit-tap-highlight-color:transparent;transition:background .16s;
  opacity:0;transform:translateY(8px);animation:pop .45s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.app:hover{background:var(--soft)}
.app.on{background:var(--soft)}
.tile{width:var(--tile);height:var(--tile);display:block;position:relative;flex:none;
  transition:transform .22s cubic-bezier(.2,.9,.25,1),filter .18s}
.tile svg{width:100%;height:100%;display:block}
.app:hover .tile{transform:scale(1.04)}
.app:active .tile{transform:scale(.92);filter:brightness(.88);transition-duration:.09s}
.app:focus-visible{outline:none;background:var(--soft)}
.app:focus-visible .tile{filter:drop-shadow(0 0 3px rgba(10,63,214,.9))}
.label{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;line-height:1.2;
  letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.app.on .label{font-weight:700}
.app.on::before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--blue)}
.app.more{display:none}          /* only a phone needs it: the desktop shows all ten */
.livedot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;
  animation:livepulse 1.9s ease-in-out infinite}
.badge{position:absolute;top:-3px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;
  box-shadow:0 0 0 2.5px var(--bg)}

/* the foot of the nav: one primary action and who you are */
.navfoot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;
  flex-direction:column;gap:8px}
.navpost{border:0;border-radius:14px;padding:12px 16px;font-family:inherit;font-size:14.5px;font-weight:640;
  background:var(--blue);color:#fff;cursor:pointer;width:100%;
  box-shadow:0 10px 22px -14px rgba(10,63,214,.95);transition:transform .16s,box-shadow .16s,opacity .16s}
.navpost:hover{transform:translateY(-1px);box-shadow:0 14px 26px -14px rgba(10,63,214,1)}
.navpost:active{transform:translateY(0)}
.acct{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;cursor:pointer;
  padding:7px 8px;border-radius:14px;text-align:left;font-family:inherit;transition:background .16s}
.acct:hover{background:var(--soft)}
.acct .grow{min-width:0;flex:1}
.acct b{display:block;font-size:13.5px;font-weight:640;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.acct .whoav{width:32px;height:32px;font-size:12.5px}
.acct .chev{color:var(--faint);font-size:15px;flex:none}
.menu{display:flex;flex-direction:column;gap:1px;margin:-6px 0}
.menu button{display:flex;align-items:center;gap:11px;border:0;background:none;font-family:inherit;
  font-size:14.5px;color:inherit;text-align:left;padding:12px 10px;border-radius:12px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu button.warn{color:var(--live)}

.panel{background:var(--panelbg);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:26px;
  box-shadow:0 18px 48px -20px rgba(8,26,72,.20);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.phead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);flex:none}
.hicon{width:34px;height:34px;flex:none;display:block}
.hicon svg{width:100%;height:100%;display:block}
.phead h2{font-size:17px;font-weight:640;letter-spacing:-.022em}
.phead p{font-size:12.5px;color:var(--muted);margin-top:1px}
.phead .grow{flex:1;min-width:0}
.acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.pclose{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--soft);
  color:var(--ink3);font-size:14px;display:none;place-items:center}
.pbody{padding:clamp(18px,3vh,30px) 20px;overflow:auto;flex:1;min-height:0;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* ---- wide, two-column screens ---- */
.screen{max-width:none;margin:0;display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) clamp(240px,26%,320px);gap:clamp(18px,2.2vw,30px);
  align-items:start}
.split>.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.split>.side{display:flex;flex-direction:column;gap:17px;position:sticky;top:0;
  border-left:1px solid var(--line);padding-left:clamp(16px,1.8vw,26px)}
@media (max-width:900px){ .split{grid-template-columns:1fr}
  .split>.side{position:static;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:18px} }
.card{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:11px}
.card + .card{padding-top:17px;border-top:1px solid var(--line)}
.card h5{font-size:11.5px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.card .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13.5px}
.mini-btn{border:0;background:var(--soft);color:var(--ink3);border-radius:9px;padding:6px 10px;font-size:12.5px;
  font-weight:560;cursor:pointer}
.mini-btn:hover{background:rgba(10,63,214,.1);color:var(--blue)}
.who-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.who-row:first-of-type{border-top:0}
.who-row .whoav{width:32px;height:32px;font-size:12px}
.who-row .grow{min-width:0}
.who-row b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-row small{font-size:12px;color:var(--muted)}
/* split bar for agreement */
.splitbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft)}
.splitbar i{display:block;height:100%}
.splitbar .s{background:var(--blue)}
.splitbar .o{background:var(--faint)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal span{font-size:9.5px;color:var(--muted);text-align:center;padding-bottom:3px}
.cal button{aspect-ratio:1;border:0;background:none;border-radius:8px;font-size:12px;cursor:pointer;color:var(--ink2)}
.cal button.dim{color:var(--faint);cursor:default}
.cal button.has{background:rgba(10,63,214,.12);color:var(--blue);font-weight:660}
.cal button.on{background:var(--blue);color:#fff}
.calhead{display:flex;align-items:center;justify-content:space-between}
.calhead b{font-size:13px;font-weight:620}
/* sparkline */
.spark{display:flex;align-items:flex-end;gap:3px;height:64px}
.spark i{flex:1;background:rgba(10,63,214,.25);border-radius:3px 3px 0 0;min-height:2px}
.spark i.on{background:var(--blue)}
.ring{display:flex;align-items:center;gap:13px}
.ring svg{flex:none}
.ring b{font-size:22px;font-weight:660;letter-spacing:-.02em;display:block}
.ring small{font-size:12px;color:var(--muted)}
/* quick composer at the top of the feed */
.quick{display:flex;gap:11px;align-items:flex-start;border:1px solid transparent;border-radius:16px;
  padding:13px 15px;flex-wrap:wrap;background:var(--soft);transition:background .15s,border-color .15s}
.quick:focus-within{background:var(--card);border-color:rgba(10,63,214,.35)}
.quick textarea{flex:1;min-width:min(240px,60%);border:0;resize:none;font-size:15px;line-height:1.5;
  min-height:26px;max-height:160px;background:none}
.quick textarea:focus{outline:none}
.gift{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.gift:first-of-type{border-top:0}

.btn{border:0;border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:590;background:var(--blue);
  color:#fff;cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink3)}
.iconbtn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;
  padding:5px 8px;border-radius:8px;display:inline-flex;align-items:center;gap:5px;transition:.15s;
  text-decoration:none}
.iconbtn:hover{background:var(--soft);color:var(--ink)}
.iconbtn.on{color:var(--blue);font-weight:640}
.inp,.ta{width:100%;border:1px solid transparent;border-radius:13px;background:var(--soft);padding:12px 14px;
  font-size:14.5px;line-height:1.5;transition:background .15s,border-color .15s}
.inp::placeholder,.ta::placeholder{color:var(--ph)}
.inp:focus,.ta:focus{outline:none;border-color:rgba(10,63,214,.45);background:var(--card)}
.ta{resize:none;min-height:96px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow .inp[type=date],.frow .inp[type=number]{max-width:190px;flex:0 1 190px}
.frow .inp{flex:1}
.seg{display:flex;background:var(--soft);border-radius:11px;padding:3px;flex:none}
.seg button{border:0;background:none;cursor:pointer;font-size:13px;font-weight:560;color:var(--muted);
  padding:7px 13px;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(8,26,72,.12)}

.list{display:flex;flex-direction:column}
.item{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item h3{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.item p{font-size:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.item small,.meta{font-size:12.5px;color:var(--muted)}
.rowacts{display:flex;gap:2px;margin-top:8px;margin-left:-8px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:640;padding:4px 9px;border-radius:99px;background:var(--soft);
  color:var(--ink2);flex:none;border:0;font-family:inherit}
button.tag{cursor:pointer}
.tag.b{background:rgba(10,63,214,.1);color:var(--blue)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;line-height:1.55;padding:46px 10px}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:620;margin-bottom:5px}
.bar{height:7px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--blue);transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-radius:14px;overflow:hidden;
  background:var(--soft)}
.stats>div,.stats>button{padding:15px 6px;text-align:center;border-left:1px solid var(--line);
  border-top:0;border-right:0;border-bottom:0;background:none;font-family:inherit;color:inherit;
  cursor:pointer;transition:background .14s}
.stats>button:hover{background:rgba(10,63,214,.07)}
.stats>button:active{background:rgba(10,63,214,.12)}
.stats>div:first-child,.stats>button:first-child{border-left:0}
.stats b{display:block;font-size:21px;font-weight:660;letter-spacing:-.02em}
.stats span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  display:block;margin-top:2px}
.hint{font-size:12.5px;color:var(--muted);text-align:center}

.pbody.pf{display:flex;align-items:center;justify-content:center}
.pfwrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;
  gap:clamp(13px,2.2vh,20px);text-align:center}
.pfav{--s:clamp(100px,14vh,132px);width:var(--s);height:var(--s);border-radius:50%;position:relative;
  border:0;padding:0;cursor:pointer;background:rgba(10,63,214,.05);box-shadow:inset 0 0 0 2px rgba(10,63,214,.15);
  transition:transform .2s,box-shadow .2s}
.pfav[disabled]{cursor:default}
.pfav:not([disabled]):hover{transform:scale(1.02);box-shadow:inset 0 0 0 2px rgba(10,63,214,.32)}
.pfav:not([disabled]):active{transform:scale(.97)}
.pfin{position:absolute;inset:0;border-radius:50%;overflow:hidden}
.pfin img{width:100%;height:100%;object-fit:cover;display:block}
.pfcam{position:absolute;right:1%;bottom:1%;width:31%;height:31%;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.pfcam svg{width:54%;height:54%}
.pfname{border:0;background:none;font-size:19px;font-weight:640;letter-spacing:-.024em;padding:3px 8px;
  margin:-3px -8px;border-radius:9px;width:100%;max-width:300px}
.pfname::placeholder{color:var(--ph);font-weight:500}
.pfhandle{display:flex;align-items:center;font-size:12.5px;color:var(--muted)}
.pfhandle input{border:0;background:none;font-size:12.5px;color:var(--muted);padding:2px 5px;margin:-2px -5px;
  border-radius:7px;width:150px}
.pfname:focus,.pfhandle input:focus{outline:none;background:rgba(10,63,214,.06)}
.panel[data-edit="1"] .pfname,.panel[data-edit="1"] .pfhandle input{background:var(--soft)}
.pfbio{width:100%;border:1px solid transparent;border-radius:14px;background:var(--soft);font-size:14.5px;
  line-height:1.5;padding:12px 14px;resize:none;text-align:center}
.pfbio::placeholder{color:var(--ph)}
.pfbio:focus{outline:none;border-color:rgba(10,63,214,.5)}
.pfbio[readonly]{border-color:transparent;background:none}

/* profile page layout */
.pbody.pf{display:block;padding:clamp(16px,2.4vh,26px) var(--gutter) clamp(20px,3vh,30px)}
.pgrid{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:clamp(20px,2.4vw,34px);
  align-items:start;max-width:1100px;margin:0 auto}
.pcolL{display:flex;flex-direction:column;gap:13px;position:sticky;top:0}
.pcolR{display:flex;flex-direction:column;gap:22px;min-width:0}
.photo{width:100%;aspect-ratio:1;border-radius:22px;position:relative;border:0;padding:0;overflow:hidden;
  background:rgba(10,63,214,.05);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:block;
  transition:box-shadow .2s}
.photo[disabled]{cursor:default}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo:not([disabled]):hover{box-shadow:inset 0 0 0 2px rgba(10,63,214,.35)}
.photo .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--blue);opacity:.5}
.photo .ph svg{width:34%;height:34%}
.photo .cam{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:var(--blue);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(8,26,72,.3)}
.photo .cam svg{width:17px;height:17px}
.pfield{border:0;background:none;font-size:14.5px;padding:7px 9px;margin:0 -9px;border-radius:9px;width:calc(100% + 18px);
  line-height:1.45}
.pfield::placeholder{color:var(--ph)}
.pfield:focus{outline:none;background:rgba(10,63,214,.06)}
.panel[data-edit="1"] .pfield{background:var(--soft)}
.panel:not([data-edit="1"]) .pfield:placeholder-shown{display:none}
.pfield.role{font-weight:640;font-size:16px;letter-spacing:-.015em}
.pfield.loc{color:var(--muted);font-size:13.5px;margin-top:-6px}
.pfield.bio{resize:none;line-height:1.55}
.pfield.link{color:var(--blue);font-size:13.5px}
.pflink{display:block;text-align:center;text-decoration:none;padding:11px;border-radius:12px;background:var(--soft);
  color:var(--blue);font-size:13.5px;font-weight:590;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow{display:flex;gap:8px}
.prow>*{flex:1}
.sec{display:flex;flex-direction:column;gap:2px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.sechead h4{font-size:11.5px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:13px;font-weight:540;padding:7px 12px;border-radius:99px;background:var(--soft);color:var(--ink3)}
.stand{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.stand:first-child{border-top:0}
.stand span{flex:1;font-size:14.5px;min-width:0}
.qpost{padding:12px 0;border-top:1px solid var(--line)}
.qpost:first-child{border-top:0}
.qpost p{font-size:14px;line-height:1.5}
.qpost small{font-size:12px;color:var(--muted)}
.next{display:flex;gap:12px;align-items:center;padding:13px 15px;border:1px solid transparent;
  border-radius:14px;background:var(--soft)}
.next b{display:block;font-size:14.5px;font-weight:600}
.next small{font-size:12.5px;color:var(--muted)}
.datechip{flex:none;width:46px;text-align:center}
.datechip i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--blue)}
.datechip b{font-size:20px;font-weight:660;line-height:1.05;letter-spacing:-.02em}
.start{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.start button{border:1px solid transparent;background:var(--soft);border-radius:14px;padding:14px;text-align:left;
  cursor:pointer;transition:.15s}
.start button:hover{border-color:rgba(10,63,214,.4);background:rgba(10,63,214,.03)}
.start b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.start small{font-size:12.5px;color:var(--muted);line-height:1.4}
@media (max-width:860px){
  .pgrid{grid-template-columns:1fr}
  .pcolL{position:static}
  .photo{max-width:260px;margin:0 auto}
}

/* header tabs */
.acts .tabs{margin-right:2px}
.acts .seg button{padding:6px 11px;font-size:12.5px}
@media (max-width:700px){
  .phead{flex-wrap:wrap}
  .acts{width:100%;margin-left:0;overflow-x:auto;padding-bottom:2px}
}
/* compose */

.blink{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.blink span{color:var(--muted);display:inline-flex;opacity:0;transition:opacity .15s}
.blink:hover h3{color:var(--blue)}
.blink:hover span{opacity:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.person{border:1px solid transparent;border-radius:18px;padding:16px;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:7px;background:var(--soft);height:100%;
  transition:border-color .15s,transform .15s,background .15s}
.person:hover{border-color:rgba(10,63,214,.3);transform:translateY(-2px)}
.pface{width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;
  font-size:19px;font-weight:650;overflow:hidden;text-decoration:none;flex:none}
.pface img{width:100%;height:100%;object-fit:cover}
.pmeta a{text-decoration:none;color:inherit}
.pmeta b{font-size:14.5px;font-weight:620;letter-spacing:-.01em;display:block}
.pmeta a:hover b{color:var(--blue)}
.pmeta small{font-size:12.5px;color:var(--muted)}
.prole{font-size:13px;line-height:1.4;color:var(--ink2)}
.ploc{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink3)}
.pstats{font-size:11.5px;color:var(--muted)}
.pfollow{width:100%;margin-top:auto;padding-top:8px;text-align:center;text-decoration:none;display:block}


/* the first thing anyone sees */
.gate{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;
  min-height:min(70vh,600px);margin:-12px 0}
.halo{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.halo i{position:absolute;left:0;top:0;width:min(46vmin,420px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(10,63,214,.30);transform:translate(-50%,-50%) scale(.25);opacity:0;
  animation:ripple 16s cubic-bezier(.25,.5,.4,1) infinite}
@keyframes ripple{
  0%{transform:translate(-50%,-50%) scale(.22);opacity:0}
  12%{opacity:.32}
  100%{transform:translate(-50%,-50%) scale(2.6);opacity:0}
}
.aurora{position:absolute;inset:-20%;pointer-events:none;
  background:radial-gradient(34% 34% at 30% 34%,rgba(10,63,214,.10),transparent 70%),
             radial-gradient(30% 30% at 72% 66%,rgba(10,63,214,.07),transparent 70%);
  filter:blur(26px);animation:swim 30s ease-in-out infinite alternate}
@keyframes swim{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(3%,2%,0) scale(1.1)}}

.gatecard{position:relative;z-index:1;width:100%;max-width:392px;display:flex;flex-direction:column;
  gap:12px;text-align:center;padding:clamp(30px,4.4vw,44px) clamp(24px,3.6vw,38px) clamp(22px,3vw,30px);
  border:0;border-radius:30px;background:var(--raise);
  backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);
  box-shadow:0 1px 2px rgba(8,26,72,.04), 0 40px 90px -40px rgba(8,26,72,.45);
  animation:rise .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.gatedot{width:38px;height:38px;border-radius:50%;background:var(--blue);margin:0 auto 6px;position:relative;
  box-shadow:0 6px 18px -6px rgba(10,63,214,.7)}
.gatedot::after{content:"";position:absolute;inset:0;border-radius:50%;
  animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
.gatecard h2{font-size:clamp(26px,3.2vw,34px);font-weight:620;letter-spacing:-.035em;margin-bottom:6px}
.gtabs{align-self:center;margin-bottom:8px;background:rgba(10,32,90,.06)}
.gtabs button{padding:9px 22px;font-size:13.5px}
.inp.big{padding:15px 17px;font-size:15.5px;border-radius:15px;text-align:left;background:var(--panelbg)}
.btn.big{padding:15px;font-size:15px;border-radius:15px;margin-top:4px;
  box-shadow:0 10px 24px -12px rgba(10,63,214,.9);transition:transform .18s,box-shadow .18s,opacity .15s}
.btn.big:hover{transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(10,63,214,.95)}
.btn.big:active{transform:translateY(0)}
.gatecard .linkbtn{margin:2px auto 0;font-weight:520;color:var(--muted)}
.gatecard .linkbtn:hover{color:var(--blue);background:none}
@media (prefers-reduced-motion:reduce){ .halo i,.aurora,.gatecard{animation:none} .halo i{opacity:.12} }


/* chat */
.pbody.chatbody{overflow:hidden;display:flex;flex-direction:column}
.pbody.chatbody .split{flex:1;min-height:0}
.chat{display:flex;flex-direction:column;height:100%;min-height:0;gap:14px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding:8px 8px 10px 2px;scroll-behavior:smooth}
.msg{display:flex;gap:11px;animation:rise .3s ease both;max-width:100%}
.msg.me{justify-content:flex-end}
.msg.me .bubble{background:var(--blue);color:#fff;padding:11px 15px;border-radius:18px 18px 5px 18px;
  font-size:14px;line-height:1.5;max-width:min(80%,480px);white-space:pre-wrap;word-wrap:break-word}
.say{flex:1;min-width:0;font-size:14px;line-height:1.62;color:var(--ink);max-width:620px}
.say p{margin:0 0 10px}
.say p:last-child{margin-bottom:0}
.say ul,.say ol{margin:0 0 10px;padding-left:19px;display:flex;flex-direction:column;gap:6px}
.say li{line-height:1.6}
.say li::marker{color:var(--dim)}
.say strong{font-weight:640}
.say code{background:rgba(10,32,90,.07);padding:2px 6px;border-radius:6px;font-size:13.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.typing{display:flex;gap:5px;align-items:center;padding:9px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chatbar{display:flex;gap:9px;align-items:flex-end;border:1px solid transparent;border-radius:22px;
  padding:7px 7px 7px 18px;background:var(--soft);transition:border-color .18s,box-shadow .18s,background .18s;flex:none}
.chatbar:focus-within{border-color:rgba(10,63,214,.4);box-shadow:0 0 0 4px rgba(10,63,214,.07);
  background:var(--card)}
.chatbar textarea{flex:1;border:0;resize:none;font-size:15px;line-height:1.55;padding:9px 0;max-height:170px;
  background:none}
.chatbar textarea:focus{outline:none}
.sendbtn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--blue);color:#fff;
  cursor:pointer;display:grid;place-items:center;transition:opacity .15s,transform .15s}
.sendbtn svg{width:17px;height:17px}
.sendbtn:disabled{opacity:.22;cursor:default}
.sendbtn:not(:disabled):hover{transform:translateY(-1px)}
.chatintro{margin:auto;text-align:center;max-width:540px;display:flex;flex-direction:column;align-items:center;
  gap:9px;padding:24px 10px}
.introdot{width:32px;height:32px;border-radius:50%;background:var(--blue);position:relative;margin-bottom:4px}
.introdot::after{content:"";position:absolute;inset:0;border-radius:50%;
  animation:pulse 6s cubic-bezier(.25,.6,.3,1) infinite}
.chatintro h3{font-size:21px;font-weight:640;letter-spacing:-.028em}
.chatintro p{font-size:13.5px;color:var(--muted);line-height:1.55;margin-bottom:10px}
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px;width:100%}
.starter{border:1px solid transparent;background:var(--soft);border-radius:15px;padding:14px 16px;text-align:left;
  font-size:13.5px;line-height:1.45;color:var(--ink3);cursor:pointer;transition:.15s}
.starter:hover{border-color:rgba(10,63,214,.4);background:rgba(10,63,214,.03);color:var(--blue)}

/* share + invite sheet */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(8,20,45,.34);backdrop-filter:blur(4px);
  display:grid;place-items:center;padding:22px;animation:fade .2s ease}
.sheetbox{background:var(--card);border-radius:26px;padding:26px 26px 22px;width:100%;max-width:440px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 40px 90px -30px rgba(8,26,72,.5);
  animation:rise .3s cubic-bezier(.2,.9,.25,1) both;max-height:92vh;overflow-y:auto}
.sheetbox h3{font-size:19px;font-weight:640;letter-spacing:-.025em}
.sheetmsg{font-size:14.5px;line-height:1.55;color:var(--ink2)}
.msgbox{font-size:14.5px;line-height:1.55;resize:none;min-height:92px}
.urlrow{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;
  font-size:12.5px;color:var(--muted)}
.urlrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:2px 0}
.net{width:42px;height:42px;border:0;border-radius:50%;background:var(--brand);color:#fff;cursor:pointer;
  display:grid;place-items:center;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 6px -2px rgba(8,26,72,.4)}
.net svg{width:19px;height:19px}
.net:hover{transform:translateY(-2px) scale(1.06);box-shadow:0 8px 16px -6px rgba(8,26,72,.5)}
.net:active{transform:scale(.94)}
.sheetfoot{display:flex;gap:8px;flex-wrap:wrap}
.sheetfoot .btn{flex:1;min-width:110px}

.joinbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:15px 18px;border-radius:16px;
  background:rgba(10,63,214,.05);border:1px solid rgba(10,63,214,.14)}
.joinbar span{flex:1;font-size:14px;color:var(--ink3);min-width:180px}
.joinbar .btn{flex:none}.topics{display:flex;flex-wrap:wrap;gap:6px}
.topic{border:1px solid transparent;background:var(--soft);color:var(--ink2);border-radius:99px;padding:6px 12px;
  font-size:12.5px;font-weight:540;cursor:pointer;transition:.14s}
.topic:hover{border-color:rgba(10,63,214,.42);color:var(--blue);background:rgba(10,63,214,.04)}
.mact{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.mact button{border:1px solid transparent;background:var(--soft);color:var(--dim);border-radius:7px;
  padding:2px 8px;font-size:11px;font-weight:560;line-height:1.7;cursor:pointer;transition:.14s;white-space:nowrap}
.mact button.sym{min-width:24px;padding:2px 0;font-size:13px;text-align:center}
.mact button:hover{border-color:rgba(10,63,214,.4);color:var(--blue);background:rgba(10,63,214,.05)}.thread{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px;align-items:flex-start}
.whoav.sm{width:28px;height:28px;font-size:11px;text-decoration:none}
.cmt b{font-size:13px;font-weight:640;margin-right:6px}
.cmt span{font-size:13.5px;line-height:1.5;color:var(--ink2)}
.cmt small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.cmt .cdel{font-size:11.5px;padding:0;margin:0;color:var(--muted)}
.cbox{display:flex;gap:8px}
.cbox .inp{flex:1;padding:9px 13px;font-size:14px;border-radius:11px}
.prow2{display:flex;gap:6px;width:100%;margin-top:auto;padding-top:8px}
.prow2 .btn{flex:1;padding:8px 6px;font-size:12.5px}
.dmrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;cursor:pointer;
  padding:8px 0;border-top:1px solid var(--line);text-align:left}
.dmrow:first-of-type{border-top:0}
.dmrow b{display:block;font-size:13.5px;font-weight:600}
.dmrow small{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot-new{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.sheetbox.dm{max-width:460px;height:min(72vh,640px);height:min(72dvh,640px)}
.dmhead{display:flex;align-items:center;gap:11px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.dmhead b{font-size:15px;font-weight:640;display:block}
.dmhead small{font-size:12.5px;color:var(--muted)}
.dmthread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px}
.dmmsg{display:flex;flex-direction:column;align-items:flex-start;max-width:82%}
.dmmsg.mine{align-self:flex-end;align-items:flex-end}
.dmbubble{padding:10px 14px;border-radius:16px 16px 16px 5px;background:rgba(10,32,90,.06);font-size:14px;
  line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.dmmsg.mine .dmbubble{background:var(--blue);color:#fff;border-radius:16px 16px 5px 16px}
.dmwhen{font-size:11px;color:var(--muted);margin-top:3px}
.lookedat{margin-top:9px;font-size:11.5px;color:var(--dim);letter-spacing:.01em}
.briefout{font-size:13px;line-height:1.55;color:var(--ink2)}
.briefout p{margin:0 0 8px}
.briefout ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:6px}
.sheetbox.stand{max-width:480px}
.stq{font-size:16px;line-height:1.45;font-weight:590;letter-spacing:-.015em;margin-bottom:12px}
.standlist{display:flex;flex-direction:column;gap:2px;max-height:44vh;overflow-y:auto}
.standrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--line);
  cursor:pointer;text-align:left}
.standrow:first-child{border-top:0}
.standrow input{width:17px;height:17px;accent-color:var(--blue);flex:none}
.standrow b{display:block;font-size:14px;font-weight:600}
.standrow small{font-size:12.5px;color:var(--muted)}

/* social + AI */
.tahead{position:relative}
.talist{position:absolute;left:-9px;right:-9px;top:calc(100% + 5px);background:var(--card);border:1px solid var(--line);
  border-radius:13px;box-shadow:0 14px 32px -14px rgba(8,26,72,.35);z-index:40;overflow:hidden;max-height:250px;
  overflow-y:auto;animation:fade .16s ease}
.talist button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 13px;
  font-size:13.5px;cursor:pointer;color:var(--ink)}
.talist button:hover,.talist button.on{background:rgba(10,63,214,.08)}
.talist small{display:block;padding:7px 13px;color:var(--muted);font-size:10.5px;border-top:1px solid var(--line)}

.tabs{align-self:flex-start}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;text-decoration:none;color:inherit}
.whoav{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:650;
  display:grid;place-items:center;overflow:hidden;flex:none}
.whoav img{width:100%;height:100%;object-fit:cover}
.who b{font-size:13.5px;font-weight:600}
.who span{font-size:12.5px;color:var(--muted)}
.who:hover b{text-decoration:underline}
.opt{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;
  cursor:pointer;padding:0 0 5px;font-size:14px;text-align:left}
.opt b{font-weight:640;font-size:13px}
.opt.on{font-weight:640}
.linkbtn{border:0;background:none;color:var(--blue);font-size:12.5px;font-weight:590;cursor:pointer;
  padding:5px 8px;margin-left:-8px;border-radius:8px}
.linkbtn:hover{background:rgba(10,63,214,.07)}
.linkbtn:disabled{opacity:.5;cursor:default}
.ai{border:0;background:rgba(10,63,214,.05);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:11px;animation:fade .25s ease}
.ai[hidden]{display:none}
.ai p{font-size:14px;line-height:1.55;white-space:pre-wrap}
.aiacts{display:flex;gap:8px}
.ainote{font-size:11.5px;color:var(--muted)}
.divide{height:1px;background:var(--line);margin:4px 0}
.sect{font-size:11.5px;font-weight:660;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}

.auth{max-width:330px;margin:auto;text-align:center;display:flex;flex-direction:column;gap:13px;padding:34px 0}
.auth h3{font-size:19px;font-weight:640;letter-spacing:-.024em}
.auth p{font-size:13.5px;color:var(--muted);line-height:1.55}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);z-index:60;background:rgba(12,18,34,.93);
  color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:11px;opacity:0;pointer-events:none;
  transition:.26s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.mode{position:fixed;left:var(--pad);bottom:14px;z-index:5;font-size:11.5px;font-weight:600;
  color:var(--muted);background:var(--soft);padding:5px 11px;border-radius:99px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--soft);border-top-color:var(--blue);
  animation:sp .7s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  .stage{height:100svh;min-height:0;gap:0}
  /* one surface: the rail and the content are two regions of the same app,
     divided by a single line that the header rule runs into */
  .rail{width:clamp(178px,15vw,224px);padding-right:var(--gutter);border-right:1px solid var(--line);
    justify-content:flex-start;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .stage>.rail{padding-top:2px}
  .panel{height:100%;min-height:0;background:none;border:0;border-radius:0;box-shadow:none;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  .phead{padding:15px var(--gutter) 15px var(--gutter)}
  .pbody{overflow-y:auto;overscroll-behavior:contain;
    padding:clamp(16px,2.4vh,26px) var(--gutter) clamp(20px,3vh,30px)}
  .split{max-height:100%}
  .split>.side{max-height:100%;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:none}
  .split>.side::-webkit-scrollbar{display:none}
}
@media (max-width:900px){
  /* ---- a phone gets a real app shell: bar on top, tabs on the bottom ---- */
  :root{--tile:26px;--mast:88px;--tabs:calc(56px + env(safe-area-inset-bottom,0px))}
  /* the bar sizes itself and JS writes the real height back into --mast */
  .mast{flex-wrap:wrap;height:auto;min-height:52px;padding:0 14px;align-content:flex-start;row-gap:0}
  .mast .mark{height:52px;display:flex;align-items:center}
  .topbar{height:52px}
  .ticker{order:3;flex:0 0 100%;width:100%;height:36px;border-top:1px solid var(--line);gap:10px}
  .tick{font-size:12.5px}
  .tick b{font-size:9.5px}

  .stage{display:block;height:auto;min-height:0;padding:calc(var(--mast) + 6px) 0 calc(var(--tabs) + 4px)}

  /* the rail becomes the tab bar */
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:30;width:auto;height:var(--tabs);
    display:flex;align-items:stretch;padding:0 4px env(safe-area-inset-bottom,0px);gap:0;overflow:visible;
    background:var(--panelbg);backdrop-filter:blur(18px) saturate(1.5);
    -webkit-backdrop-filter:blur(18px) saturate(1.5);border-top:1px solid var(--line)}
  .nav{display:flex;flex:1;flex-direction:row;align-items:stretch;gap:0}
  .app{flex:1;flex-direction:column;justify-content:center;gap:3px;padding:7px 2px 6px;border-radius:12px;
    text-align:center;animation:none;opacity:1;transform:none}
  .app:hover{background:none}
  .app.on{background:none}
  .app.on::before{display:none}
  .app.on .tile{transform:translateY(-1px)}
  .label{font-size:10px;font-weight:600;flex:none;width:100%;text-align:center;letter-spacing:-.01em}
  .app.on .label{font-weight:800;color:var(--blue)}
  .badge{top:-4px;right:calc(50% - 18px);min-width:16px;height:16px;font-size:9.5px}
  .livedot{position:absolute;top:6px;right:calc(50% - 16px)}
  /* the five that do not fit live behind More */
  .app[data-id="issues"],.app[data-id="ballot"],.app[data-id="polls"],
  .app[data-id="fundraise"],.app[data-id="reach"],.app[data-id="endorsed"]{display:none}
  .app[data-id="today"]{order:1}.app[data-id="feed"]{order:2}
  .app[data-id="townhall"]{order:3}.app[data-id="compose"]{order:4}
  .app[data-id="profile"]{order:5}
  .app.more{display:flex;order:6}

  /* one thumb-sized way to post */
  .navfoot{position:fixed;right:14px;bottom:calc(var(--tabs) + 12px);z-index:29;margin:0;padding:0;
    border:0;width:auto;flex-direction:row}
  .acct{display:none}
  .navpost{width:auto;border-radius:99px;padding:14px 20px;font-size:14px;
    box-shadow:0 12px 26px -10px rgba(10,63,214,.85)}

  /* the panel is simply the page now */
  .panel{position:static;height:auto;min-height:calc(100dvh - var(--mast) - var(--tabs) - 10px);
    z-index:1;border-radius:0;border:0;background:none;box-shadow:none;transform:none;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  .pclose{display:none}
  .mode{display:none}
}

/* ---------------- phones ---------------- */
@media (max-width:900px){
  /* iOS zooms the page whenever a field is smaller than 16px */
  .inp,.ta,.canvas,.chatbar textarea,.quick textarea,.pfname,.pfhandle input,.pfbio,.pfield,.msgbox,
  input,textarea,select{font-size:16px}
  .pfhandle input,.pfield.loc{font-size:15px}

  .pbody{padding:14px 16px 20px;overflow:visible}
  .gate{min-height:min(58vh,500px);margin:0}
  .gatecard{padding:clamp(24px,6vw,34px) clamp(20px,5vw,26px) 22px}
  .phead{padding:12px 16px;gap:11px;position:sticky;top:calc(var(--mast) - 1px);z-index:7;
    background:var(--bg);border-bottom:1px solid var(--line)}
  .phead h2{font-size:16px}
  .acts{gap:6px}
  .acts .btn{padding:9px 13px}
  .acts .seg button{padding:7px 10px;font-size:12px}

  /* thumbs need something to hit */
  .tag{padding:8px 13px}
  .iconbtn{padding:9px 10px;min-height:40px}
  .rowacts{gap:0;margin-left:-10px}
  .net{width:46px;height:46px}
  .btn{padding:11px 16px}
  .linkbtn{padding:8px 10px;margin-left:-10px}
  .newpill{top:calc(var(--mast) + 46px)}
  .story.big .hl{font-size:23px}
  .topicbar{position:sticky;top:calc(var(--mast) + 54px);z-index:6;background:var(--bg);padding:8px 0}
  .dek{font-size:14px}

  /* one scroller per screen: the page. Composers stick above the tabs. */
  .pbody.chatbody{overflow:visible;display:block}
  .pbody.chatbody .split{display:block}
  .chat{height:auto;min-height:0}
  .msgs{overflow:visible;max-height:none;min-height:40vh;padding-right:0}
  .room{height:auto}
  .roommsgs{overflow:visible;max-height:none;min-height:44vh}
  .chatbar{position:sticky;bottom:calc(var(--tabs) + 8px);z-index:8;background:var(--card);
    box-shadow:0 -6px 18px -12px rgba(8,26,72,.5), 0 0 0 1px var(--line)}
  .bots{position:sticky;bottom:calc(var(--tabs) + 62px);z-index:8;padding:6px 0;
    background:linear-gradient(var(--bg),var(--bg) 70%,transparent)}
  .quick{position:sticky;top:calc(var(--mast) + 54px);z-index:6}

  .split{gap:20px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .person{padding:13px;border-radius:16px}
  .pface{width:48px;height:48px;font-size:17px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats>div:nth-child(3),.stats>button:nth-child(3){border-left:0}
  .stats>div:nth-child(n+3),.stats>button:nth-child(n+3){border-top:1px solid var(--line)}
  .quick{flex-wrap:wrap}
  .quick textarea{min-width:60%}
  .quick .btn{margin-left:auto}

  /* chat fills the sheet, composer stays above the keyboard */
  .chat{gap:10px}
  .msgs{gap:16px;padding-right:0}
  .msg.me .bubble{max-width:86%}
  .say{font-size:14.5px}
  .chatbar{padding:6px 6px 6px 14px;border-radius:20px}
  .chatintro{padding:14px 4px}
  .chatintro h3{font-size:18px}
  .starters{grid-template-columns:1fr;gap:8px}
  .starter{padding:12px 14px}

  /* sheets sit at the bottom, where the thumb is */
  .sheet{padding:0;align-items:end}
  .sheetbox{max-width:none;border-radius:22px 22px 0 0;max-height:90vh;max-height:90dvh;
    padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px))}
  .sheetfoot .btn{min-width:0}
  .talist{left:0;right:0}
}
@media (max-width:420px){
  .rail{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .pgrid{gap:16px}
  .datechip{width:42px}
  .sechead h4{font-size:11px}
}


/* ------------------------------------------------------- dark: the few spots
   that carry their own colour rather than a variable */
html[data-theme="dark"] .rings{background:repeating-radial-gradient(circle at center,
  rgba(120,160,255,0) 0,rgba(120,160,255,.045) 26px,rgba(120,160,255,0) 58px)}
html[data-theme="dark"] .glow{background:radial-gradient(38% 38% at 22% 30%,rgba(40,100,255,.20),transparent 70%)}
html[data-theme="dark"] .vignette{background:radial-gradient(circle at 50% 45%,rgba(8,11,18,0) 40%,var(--bg) 92%)}
html[data-theme="dark"] .halo i{border-color:rgba(90,150,255,.34)}
html[data-theme="dark"] .aurora{background:radial-gradient(34% 34% at 30% 34%,rgba(60,120,255,.20),transparent 70%),
  radial-gradient(30% 30% at 72% 66%,rgba(60,120,255,.13),transparent 70%)}
html[data-theme="dark"] .dmbubble{background:rgba(150,180,255,.11)}
html[data-theme="dark"] .say code{background:rgba(150,180,255,.13)}
html[data-theme="dark"] .gtabs{background:rgba(150,180,255,.09)}
html[data-theme="dark"] .sheet,html[data-theme="dark"] .pal{background:rgba(2,5,12,.62)}
html[data-theme="dark"] .toast{background:rgba(233,237,246,.95);color:#0b0d12}
html[data-theme="dark"] .seg button.on{box-shadow:0 1px 2px rgba(0,0,0,.55)}
html[data-theme="dark"] .ai{background:rgba(69,133,255,.09);border-color:rgba(69,133,255,.30)}
html[data-theme="dark"] .joinbar{background:rgba(69,133,255,.10);border-color:rgba(69,133,255,.28)}
html[data-theme="dark"] .tag.b,html[data-theme="dark"] .cal button.has,
html[data-theme="dark"] .filterchip{background:rgba(69,133,255,.17);color:#9dbaff}
html[data-theme="dark"] .mini-btn:hover,html[data-theme="dark"] .linkbtn:hover,
html[data-theme="dark"] .talist button:hover,html[data-theme="dark"] .talist button.on,
html[data-theme="dark"] .palrow.on,html[data-theme="dark"] .palrow:hover{background:rgba(69,133,255,.15)}
html[data-theme="dark"] .pfav,html[data-theme="dark"] .photo{background:rgba(69,133,255,.09)}
html[data-theme="dark"] .start button:hover,html[data-theme="dark"] .starter:hover,
html[data-theme="dark"] .topic:hover,html[data-theme="dark"] .mact button:hover{background:rgba(69,133,255,.10)}
html[data-theme="dark"] .pfname:focus,html[data-theme="dark"] .pfhandle input:focus,
html[data-theme="dark"] .pfield:focus{background:rgba(69,133,255,.12)}
html[data-theme="dark"] .panel{box-shadow:0 18px 48px -20px rgba(0,0,0,.7)}
html[data-theme="dark"] .spin{border-color:var(--soft);border-top-color:var(--blue)}

/* ------------------------------------------------------------------ top bar */
.topbar{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}
.ticker{flex:1;min-width:0;display:flex;align-items:center;gap:clamp(10px,1.2vw,16px);height:100%}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.11em;
  color:var(--live);flex:none;text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;
  animation:livepulse 1.9s ease-in-out infinite}
@keyframes livepulse{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(229,53,43,.45)}
  50%{opacity:.5;box-shadow:0 0 0 6px rgba(229,53,43,0)}}
.ticks{position:relative;flex:1;min-width:0;height:100%;overflow:hidden}
.tick{position:absolute;inset:0;display:flex;align-items:center;gap:9px;min-width:0;border:0;background:none;
  font-family:inherit;font-size:13px;color:var(--ink);text-align:left;cursor:pointer;padding:0;
  opacity:0;transform:translateY(7px);transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.tick.on{opacity:1;transform:none;pointer-events:auto}
.tick b{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);flex:none}
.tick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tick:hover span{text-decoration:underline}

/* section heads, kickers and bylines: the news furniture */
.phead h2{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.phead h2::after{content:"";display:block;width:30px;height:3px;border-radius:2px;background:var(--blue);
  margin:6px 0 0}
.stamp{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  margin-left:9px;white-space:nowrap}
.kick{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10.5px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:7px;line-height:1.4}
.kick .kb{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
.kick .kb:hover{text-decoration:underline}
.kick .sep{color:var(--faint);font-weight:700}
.kick .place{color:var(--dim);font-weight:700}
.kick .live{margin-right:1px}
.byline{display:flex;align-items:center;gap:7px;margin-top:9px;text-decoration:none;color:var(--dim);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.byline b{font-weight:800;color:var(--ink2)}
.byline .sep{color:var(--faint)}
.byline .whoav{width:22px;height:22px;font-size:9.5px}
.byline:hover b{text-decoration:underline}
.item.lead p{font-size:clamp(17px,1.5vw,20px);line-height:1.34;font-weight:520;letter-spacing:-.02em}
.item.lead .pimg{max-height:300px}
.tbtn{height:36px;width:36px;border-radius:99px;border:0;background:none;color:var(--muted);
  cursor:pointer;display:grid;place-items:center;position:relative;transition:background .15s,color .15s;flex:none;
  -webkit-tap-highlight-color:transparent}
.tbtn:hover{background:var(--soft);color:var(--blue)}
.tbtn svg{width:17px;height:17px}
.tbtn .badge{top:-5px;right:-5px}
.tbtn.wide{width:auto;padding:0 11px 0 12px;gap:8px;display:flex;align-items:center;color:var(--muted);

.kbd{font-size:10.5px;font-weight:660;background:var(--soft);border-radius:5px;padding:2px 5px;
  color:var(--muted);line-height:1.5}

/* --------------------------------------------------------- command palette */
.pal{position:fixed;inset:0;z-index:90;background:rgba(8,20,45,.34);backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;
  padding:11vh 20px 20px;animation:fade .16s ease}
.palbox{width:100%;max-width:560px;background:var(--card);border:0;border-radius:20px;
  box-shadow:0 40px 90px -30px rgba(8,26,72,.5);overflow:hidden;display:flex;flex-direction:column;
  max-height:74vh;max-height:74dvh;animation:rise .22s cubic-bezier(.2,.9,.25,1) both}
.palin{border:0;background:none;padding:16px 20px;font-size:16px;width:100%;border-bottom:1px solid var(--line);
  font-weight:500}
.palin:focus{outline:none}
.palout{overflow-y:auto;padding:6px;flex:1;min-height:0}
.palgrp{font-size:10.5px;font-weight:660;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  padding:10px 12px 5px}
.palrow{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;cursor:pointer;
  padding:9px 12px;border-radius:12px;text-align:left;color:inherit;text-decoration:none;font-family:inherit}
.palrow.on,.palrow:hover{background:rgba(10,63,214,.08)}
.palrow .grow{min-width:0;flex:1}
.palrow b{font-size:13.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palrow small{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.palico{width:26px;height:26px;flex:none;border-radius:7px;overflow:hidden;display:grid;place-items:center}
.palico svg{width:100%;height:100%;display:block}
.palkind{font-size:10.5px;font-weight:640;color:var(--dim);flex:none;letter-spacing:.04em}
.palfoot{display:flex;gap:16px;padding:9px 15px;border-top:1px solid var(--line);font-size:11px;
  color:var(--muted);flex:none;flex-wrap:wrap}
.palempty{padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px}

/* --------------------------------------------------------- notifications */
.notelist{display:flex;flex-direction:column;max-height:min(58vh,520px);overflow-y:auto;margin:-4px 0}
.noterow{display:flex;gap:11px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;
  padding:11px 6px;border-top:1px solid var(--line);cursor:pointer;color:inherit;border-radius:10px;
  font-family:inherit;position:relative}
.noterow:first-child{border-top:0}
.noterow:hover{background:var(--soft)}
.noterow .grow{min-width:0;flex:1}
.notewhat{font-size:13.5px;line-height:1.45}
.notewhat b{font-weight:640}
.notewhen{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}
.notenew{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none;margin-top:7px}

/* ------------------------------------------------------- photos and reading */
.pimg{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin-top:10px;display:block;
  cursor:zoom-in;background:var(--soft);border:1px solid var(--line)}
.lbox{position:fixed;inset:0;z-index:95;background:rgba(4,7,14,.9);display:grid;place-items:center;padding:20px;
  animation:fade .18s ease;cursor:zoom-out}
.lbox img{max-width:100%;max-height:92vh;border-radius:12px;display:block;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.quick{position:relative}
.qmedia{display:flex;align-items:center;gap:9px;flex-wrap:wrap;width:100%}
#qPhoto{align-self:center;color:var(--muted)}
#qPhoto:hover{color:var(--blue)}
.thumbwrap{position:relative;display:inline-block;flex:none}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;display:block;border:1px solid var(--line)}
.thumbx{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;
  background:var(--ink);color:var(--bg);font-size:11px;cursor:pointer;display:grid;place-items:center;line-height:1}
.wlink{color:var(--blue);text-decoration:none;word-break:break-word}
.wlink:hover{text-decoration:underline}
.qcount{font-size:11.5px;font-weight:700;color:var(--dim);align-self:center;min-width:12px;text-align:right}
.qcount.hot{color:var(--live)}
.mention,.hash{color:var(--blue);font-weight:560;text-decoration:none;background:none;border:0;padding:0;
  font-size:inherit;font-family:inherit;cursor:pointer;line-height:inherit}
.mention:hover,.hash:hover{text-decoration:underline}
.filterchip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:620;padding:7px 13px;
  border-radius:99px;background:rgba(10,63,214,.1);color:var(--blue);border:0;cursor:pointer;align-self:flex-start;
  font-family:inherit}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;font-size:13.5px}
.keys kbd{justify-self:start;font:inherit;font-size:11.5px;font-weight:640;border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;background:var(--soft);white-space:nowrap}

@media (max-width:900px){
  .topbar{gap:2px}
  .tbtn.wide span:not(.kbd){display:none}
  .tbtn.wide .kbd{display:none}
  .tbtn.wide{width:36px;padding:0}
  .pal{padding:0;align-items:flex-end}
  .palbox{max-width:none;border-radius:20px 20px 0 0;max-height:88dvh;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .palfoot{display:none}
  .pimg{max-height:340px}
}


/* ------------------------------------------------------------- the floor */
.room{display:flex;flex-direction:column;min-height:0;gap:12px;height:100%}
.roomtop{display:flex;align-items:center;gap:12px;justify-content:space-between;flex:none;
  padding-bottom:10px;border-bottom:1px solid var(--line)}
.here{display:flex;align-items:center;min-width:0}
.here .whoav{width:24px;height:24px;font-size:10px;margin-right:-7px;box-shadow:0 0 0 2px var(--bg)}
.herecount{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
  margin-left:16px;white-space:nowrap}
.here .whoav + .herecount{margin-left:18px}
.roommsgs{flex:1;min-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  padding:2px 4px 6px 0;scroll-behavior:smooth}
.rmsg{display:flex;gap:10px;align-items:flex-start;animation:fade .22s ease}
.rmsg.run{margin-top:-9px}
.rgutter{width:28px;flex:none}
.rmsg .whoav.sm{width:28px;height:28px;font-size:11px}
.rmsg .grow{min-width:0;flex:1}
.rwho{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.rwho b{font-size:12.5px;font-weight:800}
.rname{text-decoration:none;color:inherit}
.rname:hover b{text-decoration:underline}
.bottag{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  background:var(--soft);padding:2px 6px;border-radius:4px}
.rtime{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.rdel{border:0;background:none;color:var(--faint);font-size:10px;cursor:pointer;padding:0 3px;
  opacity:0;transition:opacity .14s}
.rmsg:hover .rdel{opacity:1}
.rdel:hover{color:var(--live)}
.rtext{font-size:14px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.rtext p{margin:0 0 7px}
.rtext p:last-child{margin:0}
.rtext ul,.rtext ol{margin:4px 0 7px;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.rtext strong{font-weight:640}
.rmsg.isbot .rtext{background:var(--soft);border-radius:0 12px 12px 0;padding:10px 14px;
  border-left:3px solid var(--blue)}
.whoav.bot{font-weight:800;letter-spacing:.02em}
.bots{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.botchip{display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;background:var(--soft);
  border-radius:99px;padding:4px 13px 4px 4px;font-family:inherit;font-size:12px;font-weight:600;
  color:var(--ink2);cursor:pointer;transition:.14s}
.botchip:hover{border-color:rgba(10,63,214,.35);color:var(--blue)}
.botchip .whoav{width:22px;height:22px;font-size:10px}
@media (max-width:900px){
  .room{height:auto}
  .botchip{font-size:11.5px;padding:5px 12px 5px 4px}
  .botchip .whoav{width:20px;height:20px;font-size:9.5px}
}

/* ------------------------------------------------------------------- today */
.topicbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;
  -webkit-overflow-scrolling:touch}
.topicbar::-webkit-scrollbar{display:none}
.tchip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--soft);border-radius:99px;
  padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:640;color:var(--ink3);cursor:pointer;
  white-space:nowrap;flex:none;transition:background .14s,color .14s}
.tchip i{font-style:normal;font-size:10.5px;font-weight:800;color:var(--dim)}
.tchip:hover{color:var(--blue)}
.tchip.on{background:var(--blue);color:#fff}
.tchip.on i{color:rgba(255,255,255,.72)}
.storylist{display:flex;flex-direction:column}
.story{padding:15px 0;border-top:1px solid var(--line)}
.story.big{padding:2px 0 15px;border-top:0}
.hl{display:block;font-size:16px;line-height:1.34;font-weight:620;letter-spacing:-.018em;color:inherit;
  text-decoration:none}
.hl:hover{color:var(--blue)}
.story.big .hl{font-size:clamp(21px,2.2vw,28px);line-height:1.18;letter-spacing:-.032em;font-weight:690}
.dek{font-size:14.5px;line-height:1.5;color:var(--ink2);margin-top:9px;max-width:64ch}
.story{display:flex;gap:14px;align-items:flex-start}
.story .grow{flex:1;min-width:0}
.story.big{display:block}
.thumb-s{width:96px;height:72px;border-radius:10px;object-fit:cover;flex:none;background:var(--soft);
  border:1px solid var(--line)}
.hero{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:12px;display:block;
  background:var(--soft);border:1px solid var(--line)}

/* the reader: a story opens here, not in another tab */
.reader{position:fixed;inset:0;z-index:88;background:rgba(8,20,45,.42);backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);display:flex;justify-content:center;align-items:flex-start;
  padding:5vh 20px 20px;animation:fade .18s ease}
.readbox{width:100%;max-width:720px;max-height:90vh;max-height:90dvh;background:var(--card);
  border-radius:22px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 90px -30px rgba(8,26,72,.55);animation:rise .28s cubic-bezier(.2,.9,.25,1) both}
.readtop{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);
  flex:none}
.readtop .kick{margin:0;flex:1;min-width:0}
.readbody{overflow-y:auto;padding:20px 24px 8px;flex:1;min-height:0}
.readbody h1{font-size:clamp(22px,2.4vw,30px);line-height:1.18;letter-spacing:-.03em;font-weight:690;
  margin-bottom:10px}
.readbody .dek{font-size:16px;line-height:1.55;color:var(--ink2);max-width:none}
.readimg{width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-bottom:16px;display:block;
  background:var(--soft)}
.readsrc{display:block;margin-top:16px;text-align:center;text-decoration:none}
.readnote{font-size:11.5px;color:var(--dim);text-align:center;margin:10px 0 4px;line-height:1.5}
.readfoot{display:flex;gap:8px;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.readfoot .btn{flex:1;min-width:120px}
@media (max-width:900px){
  .reader{padding:0;align-items:flex-end}
  .readbox{max-width:none;border-radius:20px 20px 0 0;max-height:94dvh}
  .readbody{padding:16px 16px 4px}
  .readbody h1{font-size:23px}
  .thumb-s{width:78px;height:60px}
  .readfoot .btn{min-width:0;font-size:12.5px;padding:11px 8px}
}
.story .rowacts{margin-top:7px}
.story .kick{margin-bottom:7px}

.sk .skline{height:11px;border-radius:6px;margin:7px 0;
  background:linear-gradient(90deg,var(--soft) 25%,rgba(140,160,200,.16) 37%,var(--soft) 63%);

.sk .w30{width:30%}.sk .w90{width:90%}.sk .w70{width:70%}.sk .w50{width:50%}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.iconbtn.pop svg{animation:pip .34s cubic-bezier(.2,1.4,.4,1)}
@keyframes pip{0%{transform:scale(1)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
.newpill{position:sticky;top:0;z-index:6;align-self:center;border:0;border-radius:99px;padding:9px 18px;

  box-shadow:0 20px 50px -18px rgba(8,26,72,.45), 0 0 0 1px var(--line);

.pcard small{font-size:12.5px;color:var(--muted);display:block}
.pcard p{font-size:13px;line-height:1.45;color:var(--ink2)}

.pcard .row b{font-size:12.5px;color:var(--ink);display:inline}
.pcard .acts2{display:flex;gap:7px}
.pcard .acts2 .btn{flex:1;padding:8px;font-size:12.5px}
.pbody>.split,.pbody>.screen{max-width:1280px}
.offline{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabs) + 16px);z-index:75;

.moregrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.moretile{display:flex;align-items:center;gap:10px;border:0;background:var(--soft);border-radius:14px;
  padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;color:inherit;cursor:pointer;
  text-align:left}
.moretile .tile{width:30px;height:30px}

  .skline{animation:none}.newpill{animation:none}
  .live i{animation:none}.tick{transition:none}}

function ago(ts){
  const s = (Date.now() - new Date(ts).getTime())/1e3;
  if(s<60) return 'now';
  if(s<3600) return Math.floor(s/60)+'m';
  if(s<86400) return Math.floor(s/3600)+'h';
  if(s<604800) return Math.floor(s/86400)+'d';
  return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function crop(file,size,cb){
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(img.width,img.height), c=document.createElement('canvas');
      c.width=c.height=size;
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      c.toBlob(b=>cb(b, c.toDataURL('image/jpeg',.88)), 'image/jpeg', .88);
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

let AI_OK = true;                       // flips false the first time the endpoint is missing
async function ai(task, input, extra){
  if(!AI_OK) return null;
  try{
    const r = await fetch('/api/ai', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(Object.assign({task, input}, extra || {}))
    });
    if(r.status===404 || r.status===501){ AI_OK=false; toast('AI is not switched on yet'); return null; }
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ toast(d.error==='upstream' ? 'AI service is busy' : 'That did not work'); return null; }
    return (d.text||'').trim() || null;
  }catch(e){ AI_OK=false; toast('AI is not reachable here'); return null; }
}
/* the model writes plain prose with the odd list — render that properly, escape everything first */
function md(t){
  let x = esc(t);
  x = x.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  x = x.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  const lines = x.split('\n');
  let out = '', list = null, para = [];
  const flushP = ()=>{ if(para.length){ out += '<p>'+para.join('<br>')+'</p>'; para=[] } };
  const flushL = ()=>{ if(list){ out += `<${list.tag}>${list.items.map(i=>'<li>'+i+'</li>').join('')}</${list.tag}>`; list=null } };
  for(const raw of lines){
    const line = raw.trimEnd();
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    const number = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(bullet || number){
      flushP();
      const tag = bullet ? 'ul' : 'ol';
      if(!list || list.tag !== tag){ flushL(); list = {tag, items:[]} }
      list.items.push((bullet||number)[1]);
    } else if(!line.trim()){
      flushP(); flushL();
    } else {
      flushL(); para.push(line);
    }
  }
  flushP(); flushL();
  return out || '<p></p>';
}

function meContext(){

  bits.push(`Handle: @${V.handle||'not set'}${V.name?` (${V.name})`:''}`);
  if(V.location) bits.push(`Votes in: ${V.location}`);

  if(D.posts.length) bits.push(`They have written ${D.posts.length} post${D.posts.length===1?'':'s'}. Most recent: "${D.posts[0].text.slice(0,140)}"`);
  bits.push('Use this to make answers concrete. Never repeat it back to them as a summary.');
  return bits.join('\n');
}

/* one shared pattern: ask, show, let the person accept or ignore. Never overwrite silently. */
async function suggest(boxId, btn, task, input, opts){
  const box = $(boxId); if(!box) return;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Thinking…';
  const out = await ai(task, input);
  btn.disabled = false; btn.textContent = label;
  if(!out) return;
  box.hidden = false;
  box.innerHTML = `<p>${esc(out)}</p>
    <div class="aiacts">
      ${opts && opts.apply ? '<button class="btn" data-use>Use it</button>' : ''}
      <button class="btn ghost" data-hide>${opts && opts.apply ? 'Keep mine' : 'Close'}</button>
    </div>
    ${opts && opts.note ? `<span class="ainote">${opts.note}</span>` : ''}`;
  box.querySelector('[data-hide]').onclick = ()=>{ box.hidden = true; box.innerHTML=''; };
  const use = box.querySelector('[data-use]');
  if(use) use.onclick = ()=>{ opts.apply(out); box.hidden = true; box.innerHTML=''; };
}

/* attach like counts, vote counts and rsvp counts to any set of rows */
async function decorate(posts, polls, events){
  if(!ONLINE) return;
  const jobs = [];
  const pids = (posts||[]).map(p=>p.id);
  if(pids.length) jobs.push(sb.from('likes').select('post_id,user_id').in('post_id',pids).then(({data})=>{
    posts.forEach(p=>{
      const mine=(data||[]).filter(l=>l.post_id===p.id);
      p.likes=mine.length; p.liked=!!(ME&&mine.some(l=>l.user_id===ME.id));
    });
  }));
  const qids = (polls||[]).map(p=>p.id);
  if(qids.length) jobs.push(sb.from('poll_votes').select('poll_id,option_id,user_id').in('poll_id',qids).then(({data})=>{
    polls.forEach(p=>{
      (p.poll_options||[]).sort((a,b)=>a.ord-b.ord);
      const vs=(data||[]).filter(v=>v.poll_id===p.id);
      p.total=vs.length;
      (p.poll_options||[]).forEach(o=>o.v=vs.filter(v=>v.option_id===o.id).length);
      p.voted = ME ? ((vs.find(v=>v.user_id===ME.id)||{}).option_id || null) : null;
    });
  }));
  const eids = (events||[]).map(e=>e.id);
  if(eids.length) jobs.push(sb.from('rsvps').select('event_id,user_id').in('event_id',eids).then(({data})=>{
    events.forEach(e=>{
      const mine=(data||[]).filter(r=>r.event_id===e.id);
      e.going=mine.length; e.rsvped=!!(ME&&mine.some(r=>r.user_id===ME.id));
    });
  }));
  await Promise.all(jobs);
}

function logShare(){
  if(ONLINE && V) sb.from('shares').insert({profile_id:V.id}).then(()=>{});
  if(!ONLINE){ const db=localDB(); db.shares=(db.shares||0)+1; localSave(db); D.shares=db.shares; }

/* one sheet, used by every Share button and by Invite */
function shareSheet({title, text, url, editable, canPost}){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3>${esc(title)}</h3>
    ${editable
      ? `<textarea class="inp msgbox" id="shText" rows="3">${esc(text)}</textarea>`
      : `<p class="sheetmsg">${esc(text)}</p>`}
    <div class="urlrow"><span id="shUrl">${esc(url.replace(/^https?:\/\//,''))}</span>
      <button class="mini-btn" id="shCopy">Copy</button></div>
    <div class="nets">${NETS.map((n,i)=>`
      <button class="net" data-net="${i}" title="${n[0]}" aria-label="${n[0]}" style="--brand:${n[1]}">
        <svg viewBox="0 0 24 24" fill="currentColor">${n[2]}</svg></button>`).join('')}</div>
    <div class="sheetfoot">
      ${canPost ? `<button class="btn" id="shPost">Post it to my feed</button>` : ''}
      ${navigator.share ? `<button class="btn ghost" id="shMore">More…</button>` : ''}
      <button class="btn ghost" id="shClose">Close</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const msg = ()=> (editable ? ($('shText').value.trim() || text) : text);
  const close = ()=>wrap.remove();

  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('shClose').onclick = close;
  $('shCopy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(msg()+'\n'+url); toast('Copied'); logShare() }
    catch(e){ toast(url) }
  };
  wrap.querySelectorAll('[data-net]').forEach(b=>b.onclick=()=>{
    const enc = {t:encodeURIComponent(msg()), u:encodeURIComponent(url)};
    window.open(NETS[+b.dataset.net][3](enc), '_blank', 'noopener,width=620,height=640');
    logShare();
  });
  const more = $('shMore');
  if(more) more.onclick = async ()=>{
    try{ await navigator.share({text:msg(), url}); logShare() }catch(e){}
  };
  const post = $('shPost');
  if(post) post.onclick = async ()=>{
    if(!await needAuth()) return;
    const text = (msg()+'\n'+url).slice(0,1000);
    post.disabled = true;
    await mutate({ local:db=>db.posts.unshift({id:uid(),text,created_at:new Date().toISOString(),likes:0,liked:false}),
      remote:async()=>(await sb.from('posts').insert({author:ME.id,text})).error, clears:['posts'] });
    logShare(); close(); toast('Posted'); open_('feed');
  };
}

function share(text, handle){
  const who = handle || (V && V.handle);
  shareSheet({ title:'Share', text, url:publicUrl(who) });
}

/* the invitation is a written message, not a bare link */
function inviteSheet(){
  const me   = (ME && (ME.name || ME.handle)) || '';
  const here = myState() ? ` in ${stateName(myState())}` : '';
  const text = (me ? `${me} is on democrat.si. ` : '')
    + `It is one page for where you stand, what you post, the events you turn up to and your ballot`
    + `${here}. Free, and it takes a minute.`;
  shareSheet({ title:'Invite someone', text, url:publicUrl(ME && ME.handle), editable:true, canPost:true });
}

function wireTabs(){
  document.querySelectorAll('[data-tabs]').forEach(el=>{
    el.onclick = async e=>{

      SC[el.dataset.tabs]=b.dataset.v;
      const kind = {feed:'posts',polls:'polls',townhall:'events',issues:'issues',endorsed:'ends'}[el.dataset.tabs];
      if(b.dataset.v!=='mine' && kind) await loadGlobal(kind);
      open_(current, true);
    };
  });
}

/* ---- where you vote drives what you see ---- */
const ABBR = Object.fromEntries(Object.entries(ST).map(([n,a])=>[a,n]));
function stateOf(loc){
  if(!loc) return null;
  const part = String(loc).split(',').pop().trim();
  if(ST[part]) return ST[part];
  const up = part.toUpperCase();
  return ABBR[up] ? up : null;
}
const stateName = code => ABBR[code] || '';
const stateSlug = code => (ABBR[code]||'').toLowerCase().replace(/\s+/g,'-');
const myState   = () => stateOf(V && V.location);
const isNear    = row => {
  const m = myState(); if(!m) return false;
  return stateOf(row && row.profiles && row.profiles.location) === m;
};
/* pick the list a screen should show, and say so plainly when we fall back */
function scoped(key, mine, all){
  if(RO || !ONLINE) return {list:mine, note:''};
  const sc = SC[key] || 'all';
  if(sc==='mine') return {list:mine, note:''};
  if(sc==='saved'){
    if(!ME) return {list:[], note:''};
    if(G.saved === null) return {list:[], note:'', loading:true};
    return {list:G.saved, note:G.saved.length ? '' : ''};
  }
  if(sc==='follow'){
    if(!ME) return {list:[], note:''};
    if(all === null) return {list:[], note:'', loading:true};
    const f = (all||[]).filter(r => MYFOLLOWS.has(r.author));
    return {list:f, note:f.length ? '' : 'Nobody you follow has posted yet.'};
  }
  if(all === null) return {list:[], note:'', loading:true};   // still fetching
  const everyone = all || [];
  if(sc==='near'){
    const n = everyone.filter(isNear);
    if(n.length) return {list:n, note:''};
    return {list:everyone, note:`Nobody in ${stateName(myState())} yet — showing everyone.`};
  }
  return {list:everyone, note:''};
}

function placeahead(input, onPick){
  if(!input || input.readOnly && !input.closest('.panel')) return;
  let box=null, timer=null, cursor=-1, items=[], skip=false;

  const close = ()=>{ if(box){ box.remove(); box=null; cursor=-1 } };
  const pick  = v => { input.value=v; close(); skip=true; input.dispatchEvent(new Event('input'));
                       if(onPick) setTimeout(onPick,50); };

  const show = ()=>{
    close();
    if(!items.length) return;
    box = document.createElement('div');
    box.className = 'talist';
    box.innerHTML = items.map((t,i)=>`<button type="button" data-i="${i}">${esc(t)}</button>`).join('')
      + '<small>Places from OpenStreetMap</small>';
    box.addEventListener('mousedown', e=>{
      const b = e.target.closest('button'); if(b) { e.preventDefault(); pick(items[+b.dataset.i]); }
    });
    input.parentNode.appendChild(box);
  };

  const label = o => {
    const a = o.address || {};
    const city = a.city || a.town || a.village || a.hamlet || a.municipality || a.county;
    const st = a.state ? (ST[a.state] || a.state) : '';
    if(city && st) return `${city}, ${st}`;
    if(st) return st;
    return (o.display_name||'').split(',').slice(0,2).join(',').trim() || null;
  };

  input.addEventListener('input', ()=>{
    if(input.readOnly) return;
    clearTimeout(timer);
    if(skip){ skip=false; return close(); }        // just picked one, do not re-open
    const q = input.value.trim();
    if(q.length < 2) return close();
    timer = setTimeout(async ()=>{
      try{
        const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1'
          + '&countrycodes=us&limit=6&q=' + encodeURIComponent(q));
        if(!r.ok) return close();
        const data = await r.json();
        items = [...new Set(data.map(label).filter(Boolean))].slice(0,6);
        if(input.value.trim().length >= 2) show();
      }catch(e){ close() }
    }, 320);
  });

  input.addEventListener('keydown', e=>{
    if(!box) return;
    const btns = [...box.querySelectorAll('button')];
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      cursor = (cursor + (e.key==='ArrowDown'?1:-1) + btns.length) % btns.length;
      btns.forEach((b,i)=>b.classList.toggle('on', i===cursor));
    } else if(e.key==='Enter' && cursor>=0){ e.preventDefault(); pick(items[cursor]); }
    else if(e.key==='Escape') close();
  });
  input.addEventListener('blur', ()=>setTimeout(close,120));
}

/* load a cache once, repaint once, and never spin forever */
function ensure(kind, screen){
  if(!ONLINE || G[kind]) return;
  const done = ()=>{ if(G[kind]===null) G[kind]=[]; if(current===screen) open_(screen, true) };
  const fail = e => { console.error(kind, e); LOADFAIL[kind] = (e && e.message) || 'could not load'; done() };
  try{ (kind==='people' ? loadPeople() : loadGlobal(kind)).then(done, fail) }
  catch(e){ fail(e) }
  setTimeout(()=>{ if(G[kind]===null){ LOADFAIL[kind]='the request timed out'; done() } }, 8000);
}

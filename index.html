/* ---------------- guided position builder ----------------
   Claude asks; you answer; it turns YOUR answers into positions you approve.
   It never invents a position you did not express.                          */
async function standSheet(){
  const asked = [], said = [];
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox stand">
    <h3>Where do you stand?</h3>
    <p class="sheetmsg" id="stStep">A few questions about real trade-offs. Answer in your own words — there are no right answers, and nothing is published.</p>
    <div id="stBody"></div>
    <div class="sheetfoot">
      <button class="btn ghost" id="stClose">Close</button>
      <button class="btn" id="stGo">Start</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const body = $('stBody'), step = $('stStep'), go = $('stGo');
  const close = ()=>wrap.remove();
  $('stClose').onclick = close;
  wrap.onclick = e=>{ if(e.target===wrap) close() };

  const TOTAL = 5;
  let picked = [];

  async function nextQuestion(){
    go.disabled = true; go.textContent = 'Thinking…';
    const q = await ai('interview',
      `Ask question ${asked.length+1} of ${TOTAL}.` +
      (V && V.location ? ` They vote in ${V.location}.` : '') +
      (asked.length ? ` Do not repeat these: ${asked.join(' | ')}` : ''));
    go.disabled = false;
    if(!q){ close(); return; }
    asked.push(q);
    step.textContent = `Question ${asked.length} of ${TOTAL}`;
    body.innerHTML = `<p class="stq">${esc(q)}</p>
      <textarea class="inp msgbox" id="stAns" rows="3" placeholder="In your own words. Or skip it."></textarea>`;
    go.textContent = asked.length === TOTAL ? 'Done' : 'Next';
    $('stAns').focus();
    go.onclick = onAnswer;
  }

  async function onAnswer(){
    const a = ($('stAns') && $('stAns').value.trim()) || '';
    said.push({ q: asked[asked.length-1], a });
    if(asked.length < TOTAL) return nextQuestion();
    await distil();
  }

  async function distil(){
    const answered = said.filter(x => x.a.length > 1);
    if(!answered.length){ toast('Nothing to work with yet'); return close(); }
    step.textContent = 'Reading your answers';
    body.innerHTML = '<div class="spin"></div>';
    go.disabled = true; go.textContent = 'Working…';
    const raw = await ai('distil', answered.map(x => `Q: ${x.q}\nThey said: ${x.a}`).join('\n\n'));
    go.disabled = false;
    let out = [];
    try{ out = (JSON.parse(raw.replace(/^```json|```$/g,'').trim()).positions || []) }catch(e){ out = [] }
    if(!out.length){
      step.textContent = 'Nothing clear enough yet';
      body.innerHTML = `<p class="sheetmsg">Your answers did not land on a firm position — which is a fine answer. Try again another time, or add one by hand.</p>`;
      go.textContent = 'Close'; go.onclick = close; return;
    }
    picked = out.map((p,i) => ({...p, on:true, i}));
    step.textContent = 'From what you said. Untick anything that is not you.';
    body.innerHTML = `<div class="standlist">${picked.map(p=>`
      <label class="standrow">
        <input type="checkbox" data-p="${p.i}" checked>
        <span class="grow"><b>${esc(p.title)}</b><small>${esc(p.because||'')}</small></span>
        <span class="tag ${p.stance==='Support'?'b':''}">${esc(p.stance)}</span>
      </label>`).join('')}</div>`;
    body.querySelectorAll('[data-p]').forEach(cb=>cb.onchange=()=>{ picked[+cb.dataset.p].on = cb.checked });
    go.textContent = 'Add these'; go.onclick = save;
  }

  async function save(){
    const keep = picked.filter(p => p.on);
    if(!keep.length) return close();
    go.disabled = true; go.textContent = 'Saving…';
    for(const p of keep){
      const stance = p.stance === 'Oppose' ? 'Oppose' : 'Support';
      if(!ONLINE){ const db = localDB(); db.issues.unshift({id:uid(), title:p.title, stance}); localSave(db); }
      else { const { error } = await sb.from('issues').insert({author:ME.id, title:p.title, stance});
             if(error){ toast(friendly(error)); break } }
    }
    G.issues = null; await load(); await loadGlobal('issues');
    close(); toast(`Added ${keep.length} position${keep.length===1?'':'s'}`); open_('issues');
  }

  go.onclick = nextQuestion;
}

/* one entry per person, newest first */
function threads(){
  const map = new Map();
  DMS.forEach(m => {
    const mine = m.sender === ME.id;
    const other = mine ? m.recipient_p : m.sender_p;
    if(!other) return;
    const key = other.id;
    if(!map.has(key)) map.set(key, { who:other, last:m, unread:0, msgs:[] });
    const t = map.get(key);
    t.msgs.push(m);
    if(!mine && !m.read_at) t.unread++;
  });
  return [...map.values()].map(t => ({...t, msgs:t.msgs.slice().reverse()}));
}

        polls.map(p=>`QUESTION by @${p.profiles&&p.profiles.handle}: ${p.question} — ${p.total||0} votes`).join('\n'),

      bgo.disabled = false; bgo.textContent = 'Write it again';
      if(brief) out.innerHTML = md(brief);

    const sc0 = unmuted(scoped('feed', D.posts, G.posts).list);
    const list = TAG ? sc0.filter(p => tagsIn(p.text).includes(TAG)) : sc0;

    /* replies */
    document.querySelectorAll('[data-csend]').forEach(b=>b.onclick = async ()=>{
      const id = b.dataset.csend, box = $('c-'+id), text = box && box.value.trim();
      if(!text) return;
      if(!await needAuth()) return;
      b.disabled = true;
      const { error } = await sb.from('comments').insert({ post_id:id, author:ME.id, text });
      if(error){ b.disabled=false; return toast(friendly(error)) }
      G.posts = null; await load(); await loadGlobal('posts'); open_('feed', true);
    });
    document.querySelectorAll('[data-cdel]').forEach(b=>b.onclick = async ()=>{
      const { error } = await sb.from('comments').delete().eq('id', b.dataset.cdel);
      if(error) return toast(friendly(error));
      G.posts = null; await load(); await loadGlobal('posts'); open_('feed', true);
    });
    const ci = document.querySelector('.cbox .inp');
    if(ci){ ci.focus(); ci.onkeydown = e=>{ if(e.key==='Enter'){
      const btn = ci.parentNode.querySelector('[data-csend]'); if(btn) btn.click() } }; }

    rows(list, async (p,a,btn)=>{
      if(a==='talk'){ OPENPOST = OPENPOST===p.id ? null : p.id; return open_('feed', true) }
      if(a==='save') return toggleSave(p);
      if(a==='more') return postMenu(p);
      if(a==='analyse') return suggest('an-'+p.id, btn, 'analyse', p.text,
        { note:'A reading of the post, not a fact check.' });
      if(a==='share') return share(p.text, p.profiles && p.profiles.handle);
      if(a==='del') return mutate({ local:db=>db.posts=db.posts.filter(x=>x.id!==p.id),
        remote:async()=>(await sb.from('posts').delete().eq('id',p.id)).error, clears:['posts'] });
      if(!await needAuth()) return;
      /* answer the tap immediately, then tell the database */
      const was = !!p.liked;
      const paint = ()=>{
        btn.classList.toggle('on', !!p.liked);
        btn.innerHTML = ico[p.liked ? 'liked' : 'like'] + (p.likes ? `<span>${p.likes}</span>` : '');
        btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
      };
      p.liked = !was; p.likes = Math.max(0, (p.likes || 0) + (was ? -1 : 1));
      paint();
      const mirror = (G.posts||[]).concat(D.posts||[], G.saved||[]).filter(x=>x.id===p.id && x!==p);
      mirror.forEach(x=>{ x.liked = p.liked; x.likes = p.likes });
      if(!ONLINE){ const db = localDB(); const x = db.posts.find(y=>y.id===p.id);
                   if(x){ x.liked = p.liked; x.likes = p.likes; localSave(db) } return }
      const r = was ? await sb.from('likes').delete().eq('post_id',p.id).eq('user_id',ME.id)
                    : await sb.from('likes').insert({post_id:p.id, user_id:ME.id});
      if(r.error){
        p.liked = was; p.likes = Math.max(0, (p.likes || 0) + (was ? 1 : -1));
        mirror.forEach(x=>{ x.liked = p.liked; x.likes = p.likes });
        paint(); toast(friendly(r.error));
      }
    });
  }
};

/* ------------------------------------------------------------------ compose */
/* every message can be pushed further — for, against, deeper, plainer */
const MSG_ACTIONS = {
  assistant: [['for','+','The case for'], ['against','\u2212','The case against'],
              ['deeper','Deep','Go deeper'], ['simple','Simple','Put it simply']],
  user:      []
};
function actPrompt(kind, role, text){
  const q = (text||'').length > 240 ? text.slice(0,240) + '…' : (text||'');
  const it = role === 'user' ? `this: "${q}"` : 'that';
  if(kind === 'for')     return `Make the strongest case for ${it}. Who is helped, by how much, and what is the argument at its best?`;
  if(kind === 'against') return `Now the strongest honest case against ${it} — the version its smartest opponent would actually make, not a caricature. Then say where you think it holds up and where it does not.`;
  if(kind === 'deeper')  return `Go deeper on ${it}: the mechanics, who actually decides, what it costs, and where this usually goes wrong in practice.`;
  return `Put that more simply — as if explaining it to someone hearing about it for the first time.`;
}
const actionRow = (i, role) => {
  const set = MSG_ACTIONS[role] || [];
  if(!set.length) return '';
  return `<div class="mact">${set.map(([k,label,title]) =>
    `<button data-mact="${k}" data-mi="${i}" title="${title}" aria-label="${title}"
      class="${k==='for'||k==='against'?'sym':''}">${label}</button>`).join('')}</div>`;
};

/* Clicking one of these does not paste the label into the box — it opens the
   conversation with a specific question worth answering. */
const TOPICS = [
  ['Rent',        'Break down what actually sets rent where I live — land, zoning, interest rates, who owns the buildings — and which of those a city council can genuinely change.'],
  ['Your ballot', 'Explain who actually runs an election in my county, which offices on the ballot decide things people feel day to day, and which ones nobody pays attention to but should.'],
  ['Wages',       'Why did wages stop tracking productivity, and which policies would actually reverse it rather than just sounding good?'],
  ['Hospital bills','Walk me through why an American hospital bill looks the way it does — who takes a cut at each step, and where the money would go instead under a different system.'],
  ['Climate',     'Which climate policies actually move emissions at the scale that matters, and which are mostly there to make us feel like something is happening?'],
  ['Local money', 'How does money actually reach a local race — who gives it, through what, and what does it buy that a voter would notice?'],
  ['Schools',     'Where does school funding actually come from where I live, and why does that formula produce the gaps it does?'],
  ['Guns',        'What do the strongest gun laws in the country actually do, what do they not touch, and what does the evidence say about which ones matter?'],
  ['Immigration', 'Separate what is federal from what is local in immigration, and tell me honestly where the Democratic position is strong and where it is unsettled.'],
  ['Courts',      'Explain how much of what I care about is decided by courts rather than legislatures now, and what follows from that.']
];

const STARTERS = [
  'What are people on here taking positions on?',
  'Who else is in my state, and what do they care about?',
  'What should I ask my council member at the next meeting?',
  'Help me sharpen an argument I keep losing'
];
let CHAT = [], CHATKEY = null;
const chatKey = ()=> 'dai.chat.' + ((ME && ME.id) || 'signed-out');
/* load the conversation belonging to whoever is signed in right now */
function chatLoad(){
  const k = chatKey();
  if(CHATKEY === k) return;
  CHATKEY = k;
  try{ CHAT = JSON.parse(sessionStorage.getItem(k) || '[]') }catch(e){ CHAT = [] }
}
const chatSave = ()=>{ try{ sessionStorage.setItem(chatKey(), JSON.stringify(CHAT.slice(-40))) }catch(e){} };
/* signing in or out drops the conversation and forgets every stored one */
function chatReset(wipeAll){
  CHAT = []; CHATKEY = null;
  if(wipeAll){
    try{
      for(let i = sessionStorage.length - 1; i >= 0; i--){
        const k = sessionStorage.key(i);
        if(k && k.startsWith('dai.chat.')) sessionStorage.removeItem(k);
      }
    }catch(e){}
  }
}

S.compose = {
  sub:'Think it through',
  acts(){ chatLoad(); return CHAT.length ? `<button class="btn ghost" id="chNew">New chat</button>` : '' },
  view(){
    chatLoad();
    if(GUEST()) return `<div class="chatintro" style="margin:auto">
      <span class="introdot"></span>
      <h3>Chat is for members</h3>
      <p>Make an account and think through anything political, privately.</p>
      <button class="btn" data-go="profile">Create an account</button>
    </div>`;
    const bubbles = CHAT.map((m,i) => m.role==='user'
      ? `<div class="msg me" data-i="${i}"><div class="bubble">${esc(m.content)}</div></div>`
      : `<div class="msg ai" data-i="${i}"><div class="say">${md(m.content)}${
           m.used && m.used.length
             ? `<div class="lookedat">Read ${[...new Set(m.used)].map(u=>TOOLNAME[u]||u).join(', ')} on this site</div>`
             : ''}${actionRow(i,'assistant')}</div></div>`
    ).join('');

    return `<div class="split"><div class="main chat">
      <div class="msgs" id="chMsgs">
        ${CHAT.length ? bubbles : `
          <div class="chatintro">
            <span class="introdot"></span>
            <h3>What are you working out?</h3>
            <p>Think out loud about something local or national. Nothing here is posted anywhere.</p>
            <div class="starters">
              ${STARTERS.map((t,i)=>`<button class="starter" data-starter="${i}">${esc(t)}</button>`).join('')}
            </div>
          </div>`}
      </div>
      <div class="chatbar">
        <textarea id="chText" rows="1" placeholder="Ask anything about politics" maxlength="4000"></textarea>
        <button class="sendbtn" id="chSend" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </div>
    </div>
    <aside class="side">
      <div class="card"><h5>Talk about</h5>
        <div class="topics">${TOPICS.map((t,i)=>
          `<button class="topic" data-topic="${i}" title="${esc(t[1])}">${esc(t[0])}</button>`).join('')}</div>
      </div>
      ${D.posts.length?`<div class="card"><h5>Your last posts</h5>
        ${D.posts.slice(0,3).map(p=>`<div style="font-size:13px;line-height:1.5;color:var(--ink2)">${esc(p.text.slice(0,90))}${p.text.length>90?'…':''}</div>`).join('')}
        <button class="mini-btn" data-go="feed" style="align-self:flex-start">Open Feed</button>
      </div>`:`<div class="card"><h5>When you are ready</h5>
        <button class="mini-btn" data-go="feed" style="text-align:left">Post something to your feed</button>
      </div>`}
    </aside></div>`;
  },
  init(){
    chatLoad();
    if(GUEST()) return;
    const box=$('chMsgs'), t=$('chText'), send=$('chSend');
    let busy = false;
    const bottom = ()=>{ box.scrollTop = box.scrollHeight };
    bottom();

    const grow = ()=>{ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,180)+'px';
                       send.disabled = !t.value.trim() || busy };
    t.oninput = grow; grow(); t.focus();

    const bubble = (role, text) => {
      const div = document.createElement('div');
      const i = CHAT.length - 1;
      div.className = 'msg ' + (role==='user'?'me':'ai');
      div.dataset.i = i;
      div.innerHTML = role==='user'
        ? `<div class="bubble">${esc(text)}</div>`
        : `<div class="say">${md(text)}${actionRow(i,'assistant')}</div>`;
      const intro = box.querySelector('.chatintro'); if(intro) intro.remove();
      box.appendChild(div); bottom();
      return div;
    };

    async function ask(text){
      if(busy || !text.trim()) return;
      busy = true; send.disabled = true;
      CHAT.push({role:'user', content:text.trim()});
      bubble('user', text.trim());
      t.value=''; grow();

      const wait = document.createElement('div');
      wait.className = 'msg ai';
      wait.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
      box.appendChild(wait); bottom();

      try{
        const { text:reply, used } = await aiChat(CHAT);
        wait.remove();
        if(!reply){
          toast('That came back empty — try asking it again');
          CHAT.pop();
          const orphan = box.querySelector('.msg.me:last-of-type'); if(orphan) orphan.remove();
          t.value = text; grow();
        }
        if(reply){
          CHAT.push({role:'assistant', content:reply, used});
          const el = bubble('assistant', reply);
          if(used && used.length){
            const seen = [...new Set(used)].map(u=>TOOLNAME[u]||u);
            const note = document.createElement('div');
            note.className = 'lookedat';
            note.textContent = 'Read ' + seen.join(', ') + ' on this site';
            el.querySelector('.say').appendChild(note);
          }
        }

      }catch(e){
        wait.remove();
        toast(e.message || 'That did not go through');
        CHAT.pop();                                   // let them try again cleanly
        const last = box.querySelector('.msg.me:last-of-type'); if(last) last.remove();
        t.value = text; grow();
      }
      chatSave();
      busy = false; grow();
      /* reveal the New chat button once — but never while there is text in the box,
         or the repaint throws away what the person is holding */
      if(CHAT.length && !$('chNew') && !t.value.trim()) open_('compose', true);
    }

    box.addEventListener('click', e=>{
      const b = e.target.closest('[data-mact]'); if(!b || busy) return;
      const m = CHAT[+b.dataset.mi]; if(!m) return;
      ask(actPrompt(b.dataset.mact, m.role, m.content));
    });

    send.onclick = ()=>ask(t.value);

/* -------------------------------------------------------------------- today
   The front page: the wire on the left, what it means here on the right.
   Headlines come from /api/news, which merges a handful of politics feeds.
   Topics are worked out from the headlines themselves, then matched against
   what people on this site have posted and taken positions on. */
let NEWS = null, NEWSAT = 0, NEWSFAIL = '', NEWSSRC = [], NEWSN = 18, TOPIC = '';
const PREFILL = { feed:'', room:'' };

const TOPICMAP = [
  ['Healthcare',   ['health care','healthcare','medicaid','medicare','affordable care','obamacare',
                    'insulin','hospital','premiums','uninsured','prescription']],
  ['Reproductive rights', ['abortion','roe','reproductive','ivf','contraception','planned parenthood']],
  ['Voting rights',['voting','voter','ballot','election','gerrymander','redistrict','turnout',
                    'registration','poll worker','early vote']],
  ['Immigration',  ['immigra','border','asylum','deportation','detention',' ice ','visa','refugee','daca']],
  ['Climate',      ['climate','emissions','clean energy','solar','wind power','fossil','drilling',
                    'heat wave','wildfire','flood']],
  ['Labor',        ['union','strike','worker','wages','labor','minimum wage','organizing','layoff']],
  ['Guns',         ['gun','firearm','shooting','assault weapon','background check']],
  ['Courts',       ['supreme court','appeals court','judge','justice department','ruling','lawsuit',
                    'indict','attorney general','doj']],
  ['Cost of living',['inflation','prices','grocer','rent ','tariff','cost of living','economy',
                    'jobs report','wallet','affordab']],
  ['Housing',      ['housing','homeless','zoning','eviction','mortgage','rent control']],
  ['Education',    ['school','teacher','student','university','curriculum','book ban','tuition']],
  ['Democracy',    ['democracy','authoritarian','press freedom','january 6','disinformation',
                    'rule of law','norms','oversight']],
  ['Congress',     ['congress','senate','house of representatives','shutdown','filibuster','speaker',
                    'appropriations','subpoena']],
  ['LGBTQ+ rights',['lgbtq','transgender','trans ','marriage equality','gender-affirming']],
  ['Money in politics',['super pac','dark money','lobby','donor','campaign finance','citizens united']]
];

const hay = it => (String(it.title||'') + ' ' + String(it.summary||'')).toLowerCase();
function topicsOf(it){
  const t = ' ' + hay(it) + ' ';
  return TOPICMAP.filter(([, words]) => words.some(w => t.includes(w))).map(([name]) => name);
}
function topicCounts(items){
  const n = new Map();
  (items||[]).forEach(it => topicsOf(it).forEach(t => n.set(t, (n.get(t)||0) + 1)));
  return [...n.entries()].sort((a,b)=>b[1]-a[1]);
}
const wordsFor = name => (TOPICMAP.find(t=>t[0]===name) || [null,[]])[1];
function matchesTopic(text, name){
  const t = ' ' + String(text||'').toLowerCase() + ' ';
  return wordsFor(name).some(w => t.includes(w));
}

async function loadNews(force){
  if(!force && NEWS && Date.now() - NEWSAT < 240e3) return;
  try{
    const r = await fetch('/api/news', {headers:{'accept':'application/json'}});
    if(r.status === 404 || r.status === 501) throw new Error('not deployed');
    if(!r.ok) throw new Error('the wire did not answer');
    const d = await r.json();
    NEWS = Array.isArray(d.items) ? d.items : [];
    NEWSSRC = d.sources || [];
    NEWSAT = Date.now(); NEWSFAIL = '';
  }catch(e){
    if(!NEWS) NEWS = [];
    NEWSFAIL = /not deployed/.test(e.message)
      ? 'The wire is not switched on yet — upload api/news.js and redeploy.'
      : 'Could not reach the wire just now.';
  }
}

const newsWhen = ts =>{
  if(!ts) return '';
  const s = (Date.now() - new Date(ts).getTime()) / 1e3;
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  return new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric'});
};
const NEWSFRESH = 45 * 60e3;

/* who follows whom — fetched when asked for, never guessed at */
/* every number on a page goes somewhere */
function wireStats(){
  document.querySelectorAll('[data-stat]').forEach(b=>b.onclick = ()=>{
    const k = b.dataset.stat;
    if(k === 'followers') return peopleSheet(RO ? `Following @${V.handle}` : 'Following you', 'followers');
    if(k === 'following') return peopleSheet(RO ? `@${V.handle} follows` : 'You follow', 'following');
    if(k === 'posts' || k === 'likes'){ if(!RO) SC.feed = 'mine'; return open_('feed') }
    if(k === 'votes')     return open_('polls');
    if(k === 'shares')    return share(shareLine(), V && V.handle);
  });
}

async function peopleSheet(title, kind){
  const wrap = document.createElement('div');
  wrap.className = 'sheet';
  wrap.innerHTML = `<div class="sheetbox">
    <h3>${esc(title)}</h3>
    <div id="plList"><div class="spin"></div></div>
    <div class="sheetfoot"><button class="btn ghost" id="plClose">Close</button></div>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.onclick = e=>{ if(e.target===wrap) close() };
  $('plClose').onclick = close;

  const box = $('plList');
  if(!ONLINE || !V){ box.innerHTML = `<p class="sheetmsg">Nobody yet.</p>`; return }
  try{
    const col = kind === 'followers' ? 'followee' : 'follower';
    const get = kind === 'followers' ? 'follower' : 'followee';
    const r = await sb.from('follows').select(get).eq(col, V.id).limit(200);
    const ids = ((r && r.data) || []).map(x => x[get]).filter(Boolean);
    if(!ids.length){
      box.innerHTML = `<p class="sheetmsg">${kind === 'followers'
        ? 'Nobody is following this page yet.' : 'Not following anyone yet.'}</p>`;
      return;
    }
    const pr = await sb.from('profiles').select('id,handle,name,photo_url,location,role')
      .in('id', ids).not('handle','is',null);
    const people = (pr && pr.data) || [];
    box.innerHTML = people.length
      ? people.map(p => personRow(p, (ME && p.id !== ME.id)
          ? `<button class="mini-btn" data-pdm="${p.id}">Message</button>` : '')).join('')
      : `<p class="sheetmsg">Those accounts have not finished setting up yet.</p>`;
    box.querySelectorAll('[data-pdm]').forEach(b=>b.onclick = ()=>{
      const who = people.find(x => x.id === b.dataset.pdm); close(); if(who) dmSheet(who);
    });
  }catch(e){ box.innerHTML = `<p class="sheetmsg">That list could not be loaded.</p>` }
}

/* a story opens here, on top of the site, and closes back to it */

  wrap.className = 'reader';
  wrap.innerHTML = `<div class="readbox" role="dialog" aria-label="Story">

    </header>
    <div class="readbody">
      ${it.image ? `<img class="readimg" src="${esc(it.image)}" alt="" onerror="this.remove()">` : ''}
      <h1>${esc(it.title)}</h1>
      ${it.summary ? `<p class="dek">${esc(it.summary)}</p>` : ''}
      <div class="ai" id="rdAi" hidden></div>

        Read the full story at ${esc(it.source || 'the source')}</a>
      <p class="readnote">Reported and published by ${esc(it.source || 'the source')}.
        democrat.ai links to the story, it does not reprint it.</p>
    </div>
    <footer class="readfoot">
      <button class="btn ghost" id="rdWhy">Why it matters</button>
      ${(RO||GUEST())?'':`<button class="btn ghost" id="rdPost">Post about this</button>
      <button class="btn ghost" id="rdFloor">To the floor</button>`}
    </footer>
  </div>`;
  document.body.appendChild(wrap);
  const close = ()=>wrap.remove();
  wrap.onclick = e=>{ if(e.target === wrap) close() };
  $('rdClose').onclick = close;
  const why = $('rdWhy');
  if(why) why.onclick = ()=> suggest('rdAi', why, 'story',
    `${it.source}: ${it.title}${it.summary ? '\n' + it.summary : ''}`,
    { note:'Read from the headline and summary only.' });
  const post = $('rdPost');
  if(post) post.onclick = ()=>{
    const tag = (topicsOf(it)[0] || '').replace(/[^a-z0-9]+/gi,'').toLowerCase();
    PREFILL.feed = `${it.title}\n${it.link}${tag?`\n#${tag}`:''}\n\n`;
    close(); open_('feed');
  };
  const floor = $('rdFloor');
  if(floor) floor.onclick = ()=>{
    PREFILL.room = `${it.title} — ${it.link}\n@desk what should we make of this?`;
    close(); open_('townhall');
  };
}

    return `<div class="split"><div class="main">
      ${counts.length ? `<div class="topicbar">
        <button class="tchip${TOPIC?'':' on'}" data-topic="">All</button>
        ${counts.slice(0,9).map(([t,n])=>`<button class="tchip${TOPIC===t?' on':''}" data-topic="${esc(t)}">
          ${esc(t)}<i>${n}</i></button>`).join('')}
      </div>` : ''}

      ${NEWS === null ? skel(5)
        : !all.length ? `<div class="empty"><b>${NEWSFAIL ? 'The wire is quiet' : 'Nothing on the wire'}</b>${
            esc(NEWSFAIL || 'No headlines came back. Try again in a minute.')}</div>`
        : !list.length ? `<div class="empty"><b>Nothing on ${esc(TOPIC)} today</b>Pick another topic, or see everything.</div>`
        : `${story(lead, true)}<div class="storylist">${rest.map(it=>story(it)).join('')}</div>
           ${(TOPIC ? all.filter(it=>topicsOf(it).includes(TOPIC)) : all).length > NEWSN
             ? `<button class="mini-btn" id="tdMore" style="align-self:center">More stories</button>` : ''}`}
    </div>
    <aside class="side">
      <div class="card"><h5>Today, in a paragraph</h5>
        <div id="tdBrief" class="briefout">A short read on what the day adds up to.</div>
        <button class="mini-btn" id="tdBriefGo" style="align-self:flex-start">Write it</button>
      </div>
      ${stands.length ? `<div class="card"><h5>${TOPIC ? esc(TOPIC)+' here' : 'Where people here stand'}</h5>
        ${stands.map(h=>`<div><div class="row"><span>${esc(h.title)}</span><b>${h.s+h.o}</b></div>
          ${splitbar(h.s,h.o)}</div>`).join('')}
        <button class="mini-btn" data-go="issues" style="align-self:flex-start">Open Issues</button>
      </div>` : ''}
      ${posts.length ? `<div class="card"><h5>People here are saying</h5>
        ${posts.map(p=>`<button class="qpost" data-open="${p.id}" style="text-align:left;border:0;background:none;
            font-family:inherit;cursor:pointer;width:100%">
          <p>${esc(trim60(p.text))}</p>
          <small>@${esc((p.profiles&&p.profiles.handle)||'')} · ${ago(p.created_at)}</small></button>`).join('')}
      </div>` : ''}
      ${NEWSSRC.length ? `<div class="card"><h5>Sources</h5>
        <p class="hint" style="text-align:left">${esc(NEWSSRC.join(' · '))}</p>
        <p class="hint" style="text-align:left;color:var(--dim)">Headlines are linked, never rewritten.
          Opinions on this page are ours; the reporting is theirs.</p>
      </div>` : ''}
    </aside></div>`;
  },
  init(){
    ensure('posts','today');
    ensure('issues','today');
    if(NEWS === null) loadNews().then(()=>{ if(current==='today'){ open_('today', true); paintTicker() } });
    const r = $('tdRefresh');
    if(r) r.onclick = async ()=>{
      r.disabled = true; r.textContent = 'Checking…';
      await loadNews(true);
      if(current==='today') open_('today', true);
      paintTicker();
    };
    const more = $('tdMore');
    if(more) more.onclick = ()=>{ NEWSN += 18; open_('today', true) };
    document.querySelectorAll('[data-topic]').forEach(b=>b.onclick = ()=>{
      TOPIC = b.dataset.topic; NEWSN = 18; open_('today', true);
    });
    document.querySelectorAll('[data-read]').forEach(b=>b.onclick = e=>{
      if(e.metaKey || e.ctrlKey || e.shiftKey) return;   /* let a real new tab happen */
      e.preventDefault(); readerOpen(b.dataset.read);
    });
    document.querySelectorAll('[data-post]').forEach(b=>b.onclick = ()=>{
      const it = (NEWS||[]).find(x=>x.link === b.dataset.post); if(!it) return;
      const tag = (topicsOf(it)[0] || '').replace(/[^a-z0-9]+/gi,'').toLowerCase();
      PREFILL.feed = `${it.title}\n${it.link}${tag?`\n#${tag}`:''}\n\n`;
      open_('feed');
    });
    document.querySelectorAll('[data-floor]').forEach(b=>b.onclick = ()=>{
      const it = (NEWS||[]).find(x=>x.link === b.dataset.floor); if(!it) return;
      PREFILL.room = `${it.title} — ${it.link}\n@desk what should we make of this?`;
      open_('townhall');
    });
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick = ()=>openPost(b.dataset.open));

    const go = $('tdBriefGo');
    if(go) go.onclick = async ()=>{
      const heads = (TOPIC ? (NEWS||[]).filter(it=>topicsOf(it).includes(TOPIC)) : (NEWS||[])).slice(0,14);
      if(!heads.length) return toast('Nothing on the wire to read yet');
      const text = heads.map(it=>`${it.source}: ${it.title}${it.summary?` — ${it.summary}`:''}`).join('\n');
      const out = $('tdBrief');
      go.disabled = true; go.textContent = 'Reading…';
      const said = await ai('today', text, {topic:TOPIC || ''});
      go.disabled = false; go.textContent = 'Write it again';
      if(said) out.innerHTML = md(said);
    };
  }
};

/* ---------------------------------------------------------------- town hall
   The floor: one room everyone is in, live. Five voices from the desk can be
   pulled in by name — they read the room and the database before they speak. */
const BOTS = {
  desk:      {name:'The Desk',      letter:'D', color:'#0A3FD6', tag:'Anchor',
              blurb:'What just happened on the network'},
  organizer: {name:'The Organizer', letter:'O', color:'#16A34A', tag:'Field',
              blurb:'Turns talk into a plan for this week'},
  analyst:   {name:'The Analyst',   letter:'A', color:'#7C3AED', tag:'Numbers',
              blurb:'What the numbers actually say'},
  historian: {name:'The Historian', letter:'H', color:'#B45309', tag:'Context',
              blurb:'Where we have seen this before'},
  skeptic:   {name:'The Skeptic',   letter:'S', color:'#0E7490', tag:'Pressure',
              blurb:'Tests our arguments before they do'}
};
const BOTKEYS = Object.keys(BOTS);
let ROOMBUSY = null, ROOMCH = null, HERE = [];

async function loadRoom(){
  if(!ONLINE){ G.room = []; return }
  try{
    const { data, error } = await sb.from('room_messages')
      .select('*, profiles!room_messages_author_fkey(handle,name,photo_url,location)')
      .order('created_at', {ascending:false}).limit(120);
    if(error) throw error;
    G.room = (data || []).slice().reverse();
  }catch(e){ G.room = []; LOADFAIL.room = (e && e.message) || 'could not load' }
}

/* who is on the floor right now — best effort, the room works without it */
function joinFloor(){
  if(!ONLINE || ROOMCH || !sb.channel) return;
  try{
    const key = (ME && ME.id) || 'guest';
    ROOMCH = sb.channel('floor', {config:{presence:{key}}});
    if(ROOMCH.on) ROOMCH.on('presence', {event:'sync'}, ()=>{
      try{
        const st = ROOMCH.presenceState ? ROOMCH.presenceState() : {};
        HERE = Object.values(st).map(v => (v && v[0]) || {}).filter(x => x.handle);
        if(current === 'townhall') paintHere();
      }catch(e){}
    });
    ROOMCH.subscribe(async status => {
      if(status === 'SUBSCRIBED' && ME && ROOMCH.track)
        try{ await ROOMCH.track({handle:ME.handle, name:ME.name, photo_url:ME.photo_url}) }catch(e){}
    });
  }catch(e){ ROOMCH = null }
}
function paintHere(){
  const el = $('here'); if(!el) return;
  const n = HERE.length;
  el.innerHTML = n
    ? `${HERE.slice(0,6).map(p=>`<span class="whoav sm" title="@${esc(p.handle||'')}">${
        p.photo_url ? `<img src="${p.photo_url}" alt="">` : esc(initials(p))}</span>`).join('')}
       <span class="herecount">${n} here now</span>`
    : `<span class="herecount">The floor is open</span>`;
}

const botOf = m => m.bot && BOTS[m.bot] ? BOTS[m.bot] : null;
function roomHTML(){
  const msgs = (G.room || []).filter(m => m.bot || !isMuted(m.profiles && m.profiles.handle));
  if(!msgs.length && !ROOMBUSY)
    return `<div class="empty"><b>Nobody has spoken yet</b>Say something, or ask the desk what is happening.</div>`;
  let last = '';
  const rows = msgs.map(m=>{
    const b = botOf(m);
    const mine = !b && ME && m.author === ME.id;
    const nm = b ? b.name : (m.profiles && (m.profiles.name || '@' + m.profiles.handle)) || 'Someone';
    const run = last === (b ? 'bot:'+m.bot : 'me:'+m.author);   /* same speaker again */
    last = b ? 'bot:'+m.bot : 'me:'+m.author;
    const av = b
      ? `<span class="whoav sm bot" style="background:${b.color}">${b.letter}</span>`
      : `<span class="whoav sm">${m.profiles && m.profiles.photo_url
          ? `<img src="${m.profiles.photo_url}" alt="">` : esc(initials(m.profiles || {}))}</span>`;
    return `<div class="rmsg${b?' isbot':''}${mine?' mine':''}${run?' run':''}" data-rid="${m.id}">
      ${run ? '<span class="rgutter"></span>' : av}
      <div class="grow">
        ${run ? '' : `<div class="rwho">
          ${b ? `<b style="color:${b.color}">${esc(nm)}</b><span class="bottag">${esc(b.tag)}</span>`
              : `${m.profiles && m.profiles.handle
                   ? `<a class="rname" href="/${esc(m.profiles.handle)}"><b>${esc(nm)}</b></a>`
                   : `<b>${esc(nm)}</b>`}`}
          <span class="rtime">${ago(m.created_at)}</span>
          ${(ME && m.author === ME.id) ? `<button class="rdel" data-rdel="${m.id}" aria-label="Delete">&#10005;</button>` : ''}
        </div>`}
        <div class="rtext"${b?` style="border-color:${b.color}"`:''}>${b ? md(m.text) : rich(m.text)}</div>
      </div></div>`;
  }).join('');
  const busy = ROOMBUSY && BOTS[ROOMBUSY]
    ? `<div class="rmsg isbot"><span class="whoav sm bot" style="background:${BOTS[ROOMBUSY].color}">${
        BOTS[ROOMBUSY].letter}</span><div class="grow">
        <div class="rwho"><b style="color:${BOTS[ROOMBUSY].color}">${esc(BOTS[ROOMBUSY].name)}</b>
          <span class="rtime">is writing</span></div>
        <div class="typing"><i></i><i></i><i></i></div></div></div>` : '';
  return rows + busy;
}
function paintRoom(){
  if(!ONLINE) return;                       /* local mode has no shared room to paint */
  const box = $('roomMsgs'); if(!box) return;
  const stick = box.scrollTop + box.clientHeight >= box.scrollHeight - 60;
  box.innerHTML = roomHTML();
  box.querySelectorAll('[data-rdel]').forEach(b=>b.onclick = async ()=>{
    const { error } = await sb.from('room_messages').delete().eq('id', b.dataset.rdel);
    if(error) return toast(friendly(error));
    await loadRoom(); paintRoom();
  });
  if(stick) box.scrollTop = box.scrollHeight;
}

async function sayRoom(){
  const t = $('roomText'); if(!t) return;
  const text = t.value.trim(); if(!text) return;
  if(!await needAuth()) return;
  t.value = ''; t.style.height = 'auto';
  const send = $('roomSend'); if(send) send.disabled = true;
  const { error } = await sb.from('room_messages').insert({author:ME.id, text:text.slice(0,2000)});
  if(error) return toast(/does not exist|schema cache/i.test(error.message)
    ? 'Run the latest update.sql to open the floor' : friendly(error));
  await loadRoom(); paintRoom();
  const hit = text.match(/@(desk|organizer|analyst|historian|skeptic)\b/i);
  if(hit) summon(hit[1].toLowerCase(), text);
}

/* pull a voice from the desk into the room */
async function summon(key, ask){
  const b = BOTS[key]; if(!b) return;
  if(!await needAuth()) return;
  if(ROOMBUSY) return toast(BOTS[ROOMBUSY].name + ' is still writing');
  ROOMBUSY = key; paintRoom();
  const transcript = (G.room || []).slice(-18).map(m=>{
    const who_ = botOf(m) ? botOf(m).name
      : (m.profiles && (m.profiles.name || '@' + m.profiles.handle)) || 'Someone';
    return `${who_}: ${m.text}`;
  }).join('\n');
  let text = null;
  try{ text = await ai('room', transcript || '(the room is quiet)',
                       {bot:key, ask:ask || '', context:meContext()}) }catch(e){}
  ROOMBUSY = null;
  if(!text){ paintRoom(); return toast('The desk is quiet — check the AI key on Vercel') }
  const { error } = await sb.from('room_messages')
    .insert({author:ME.id, bot:key, text:String(text).slice(0,2000)});
  if(error) toast(friendly(error));
  await loadRoom(); paintRoom();
}

S.townhall = {
  sub(){ return RO ? `Events from @${V.handle}`
    : `${ONLINE?'<span class="live"><i></i>On air</span> ':''}One room, everyone in it` },
  acts(){ return `${(RO||GUEST()||!ONLINE)?'':`<button class="btn ghost" id="thAsk">Ask the desk</button>`}` },
  view(){
    const today = new Date().toISOString().slice(0,10);
    const evs = ((RO || !ONLINE) ? D.events : (G.events || D.events) || []).filter(e=>e.date >= today);
    const days = new Set(evs.map(e=>e.date));
    const [cy,cm] = CAL.month.split('-').map(Number);
    const first = new Date(cy,cm-1,1), start = first.getDay(), len = new Date(cy,cm,0).getDate();
    const cells = [];
    for(let i=0;i<start;i++) cells.push('<button class="dim"></button>');
    for(let d=1;d<=len;d++){
      const iso = `${cy}-${String(cm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      cells.push(`<button data-day="${iso}" class="${days.has(iso)?'has':''}${CAL.pick===iso?' on':''}">${d}</button>`);
    }
    const shown = CAL.pick ? evs.filter(e=>e.date===CAL.pick) : evs;

    return `<div class="split"><div class="main room">
      ${GUEST() ? joinBar('Sign in to take the floor.') : ''}
      <div class="roomtop">
        <div class="here" id="here"><span class="herecount">The floor is open</span></div>
        <span class="meta">${(G.room||[]).length} message${(G.room||[]).length===1?'':'s'}</span>
      </div>
      <div class="roommsgs" id="roomMsgs">${ONLINE ? roomHTML()
        : `<div class="empty"><b>The floor opens with the backend</b>Add your Supabase keys and everyone lands in the same room.</div>`}</div>
      ${(RO||GUEST()||!ONLINE)?'':`
      <div class="bots">${BOTKEYS.map(k=>`<button class="botchip" data-bot="${k}" title="${esc(BOTS[k].blurb)}">
          <span class="whoav sm bot" style="background:${BOTS[k].color}">${BOTS[k].letter}</span>
          ${esc(BOTS[k].name)}</button>`).join('')}</div>
      <div class="chatbar">
        <textarea id="roomText" rows="1" maxlength="2000" placeholder="Say something to the room. @desk to bring in the anchor"></textarea>
        <button class="sendbtn" id="roomSend" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </div>`}
    </div>
    <aside class="side">
      ${(RO||GUEST())?'':`<div class="card"><h5>Put something on the calendar</h5>
        <input class="inp" id="tTitle" placeholder="Event">
        <input class="inp" id="tDate" type="date" value="${CAL.pick||''}">
        <input class="inp" id="tPlace" placeholder="Where">
        <div class="frow"><button class="linkbtn" id="tInvite" hidden>Write the invite</button>
          <button class="btn" id="tAdd" style="margin-left:auto">Add</button></div>
        <div class="ai" id="tAi" hidden></div>
      </div>`}
      <div class="card">
        <div class="calhead">
          <button class="idnav" id="calPrev">&#8249;</button>
          <b>${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b>
          <button class="idnav" id="calNext">&#8250;</button>
        </div>
        <div class="cal">
          ${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}
          ${cells.join('')}
        </div>
        ${CAL.pick?`<button class="linkbtn" id="calClear" style="align-self:flex-start">Clear ${dfmt(CAL.pick)}</button>`:''}
      </div>
      <div class="card"><h5>Coming up</h5>
        ${shown.length ? shown.slice(0,6).map(e=>`
          <div class="next" data-id="${e.id}">
            <div class="datechip">
              <i>${new Date(e.date+'T00:00').toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</i>
              <b>${+e.date.split('-')[2]}</b></div>
            <div class="grow"><b>${esc(e.title)}</b>
              <small>${e.place?esc(e.place)+' · ':''}${e.going?e.going+' going':'be the first'}</small>
              <div class="rowacts">${act('share','Share')}${(ME && e.author===ME.id && !RO)?act('del'):''}</div>
            </div>
            ${(ONLINE && !GUEST())?`<button class="tag ${e.rsvped?'b':''}" data-rsvp="${e.id}">${e.rsvped?'Going':'RSVP'}</button>`:''}
          </div>`).join('')
        : `<p class="hint" style="text-align:left">Nothing on the calendar yet.</p>`}
      </div>
    </aside></div>`;
  },
  init(){
    ensure('events','townhall');
    joinFloor(); paintHere();
    if(ONLINE && G.room === null)
      loadRoom().then(()=>{ if(current==='townhall'){ paintRoom();
        const t = $('here'); if(t) paintHere(); } });
    const box = $('roomMsgs'); if(box) box.scrollTop = box.scrollHeight;
    paintRoom();

    const t = $('roomText'), send = $('roomSend');
    if(t){
      mentionable(t);
      if(PREFILL.room){ t.value = PREFILL.room; PREFILL.room = '' }
      const grow = ()=>{ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,150)+'px';
                         send.disabled = !t.value.trim() };
      t.oninput = grow; grow();
      send.onclick = sayRoom;
      t.addEventListener('keydown', e=>{
        if(e.key==='Enter' && !e.shiftKey && !document.querySelector('.talist')){ e.preventDefault(); sayRoom() }
      });
    }
    document.querySelectorAll('[data-bot]').forEach(b=>b.onclick = ()=>summon(b.dataset.bot, ''));
    const ask = $('thAsk'); if(ask) ask.onclick = ()=>summon('desk', '');

    const shift = n => {
      const [y,m] = CAL.month.split('-').map(Number);
      const d = new Date(y, m-1+n, 1);
      CAL.month = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      open_('townhall', true);
    };
    if($('calPrev')) $('calPrev').onclick=()=>shift(-1);
    if($('calNext')) $('calNext').onclick=()=>shift(1);
    document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{
      CAL.pick = CAL.pick===b.dataset.day ? null : b.dataset.day;
      open_('townhall', true);
    });
    const cc=$('calClear'); if(cc) cc.onclick=()=>{ CAL.pick=null; open_('townhall',true) };

    if(!RO && !GUEST() && $('tTitle')){
      const T=$('tTitle'), Dt=$('tDate'), P=$('tPlace'), inv=$('tInvite');
      const canInvite = ()=>{ inv.hidden = !(T.value.trim() && Dt.value) };
      [T,Dt,P].forEach(el=>el.addEventListener('input',canInvite)); canInvite();
      inv.onclick = ()=> suggest('tAi', inv, 'invite',
        `Event: ${T.value.trim()}\nDate: ${Dt.value}\nPlace: ${P.value.trim()||'not given'}`,
        { apply:o=>share(o) , note:'Uses only what you typed.' });
      $('tAdd').onclick = async ()=>{
        const title=T.value.trim(), date=Dt.value, place=P.value.trim();
        if(!title||!date) return toast('Add a name and a date');
        if(!await needAuth()) return;
        mutate({ local:db=>db.events.push({id:uid(),title,date,place}),
          remote:async()=>(await sb.from('events').insert({author:ME.id,title,date,place})).error,
          clears:['events'] });
      };
    }
    const evs = ((RO || !ONLINE) ? D.events : (G.events || D.events) || []);
    document.querySelectorAll('[data-rsvp]').forEach(b=>b.onclick=async ()=>{
      if(!await needAuth()) return;
      const e=evs.find(x=>x.id===b.dataset.rsvp); if(!e) return;
      mutate({ remote:async()=>{ const q = e.rsvped
        ? await sb.from('rsvps').delete().eq('event_id',e.id).eq('user_id',ME.id)
        : await sb.from('rsvps').insert({event_id:e.id,user_id:ME.id});
        return q.error }, clears:['events'] });
    });
    rows(evs,(e,a)=>{
      if(a==='share') return share(`${e.title} — ${dfmt(e.date)}${e.place?' at '+e.place:''}`,
                                   e.profiles && e.profiles.handle);
      if(a==='del') return mutate({ local:db=>db.events=db.events.filter(x=>x.id!==e.id),
        remote:async()=>(await sb.from('events').delete().eq('id',e.id)).error, clears:['events'] });
    });
  }
};

/* -------------------------------------------------------------------- polls */
S.polls = {
  sub(){ return RO ? `Questions from @${V.handle}` : 'Ask, then listen' },
  acts(){ return tabs('polls',[['all','Everyone'],['mine','Yours']]) },
  view(){
    const mine = RO || !ONLINE || SC.polls==='mine';
    const {list, note, loading} = scoped('polls', D.polls, G.polls);
    const answered = list.filter(p=>p.voted).length;
    const busiest = [...list].sort((a,b)=>(b.total||0)-(a.total||0)).slice(0,3).filter(p=>p.total);

    return `<div class="split"><div class="main">
      ${note?`<p class="meta">${note}</p>`:''}
      ${loading ? '<div class="spin"></div>' : list.length? list.map(p=>{
        const opts=p.poll_options||[];
        return `<div class="item" data-poll="${p.id}" style="display:block">
          ${!mine && p.profiles ? who(p.profiles) : ''}
          <h3>${esc(p.question)}</h3>
          <small>${p.total||0} vote${p.total===1?'':'s'}${p.voted?'':' · tap to vote'}</small>
          <div style="margin-top:10px">${opts.map(o=>`
            <div style="margin-bottom:9px">
              <button class="opt${p.voted===o.id?' on':''}" data-opt="${o.id}">
                <span>${esc(o.text)}</span>${p.voted?`<b>${p.total?Math.round(o.v/p.total*100):0}%</b>`:''}</button>
              <div class="bar"><i style="width:${p.total&&p.voted?o.v/p.total*100:0}%"></i></div>
            </div>`).join('')}</div>
          <div class="rowacts">${act('share','Share')}${(mine&&!RO)?act('del'):''}</div>
        </div>`}).join('')
        :`<div class="empty"><b>No questions yet</b>${mine?'One good question travels further than ten posts.':'Nobody has asked anything yet.'}</div>`}
    </div>
    <aside class="side">
      ${GUEST() ? joinBar('Sign in to ask a question or vote.') : ''}
      ${(RO||GUEST())?'':`<div class="card">
        <h5>Ask a question</h5>
        <input class="inp" id="pQ" placeholder="Your question">
        <div class="ai" id="pAi" hidden></div>
        <input class="inp" id="pA" placeholder="Option 1">
        <input class="inp" id="pB" placeholder="Option 2">
        <input class="inp" id="pC" placeholder="Option 3 (optional)">
        <input class="inp" id="pD" placeholder="Option 4 (optional)">
        <div class="row">
          <button class="linkbtn" id="pCheck" hidden>Check my wording</button>
          <button class="btn" id="pAdd" style="margin-left:auto">Post</button>
        </div>
      </div>`}
      ${busiest.length?`<div class="card"><h5>Most answered</h5>
        ${busiest.map(p=>`<div class="row"><span style="flex:1">${esc(p.question)}</span><b>${p.total}</b></div>`).join('')}
      </div>`:''}
      ${!RO&&list.length?`<div class="card"><h5>You</h5>
        <div class="row"><span>Answered</span><b>${answered} of ${list.length}</b></div>
        <div class="row"><span>Asked</span><b>${D.polls.length}</b></div>
      </div>`:''}
    </aside></div>`;
  },
  init(){
    wireTabs();
    if(SC.polls !== 'mine') ensure('polls','polls');
    const {list} = scoped('polls', D.polls, G.polls);
    if(!RO && !GUEST()){
      const Q=$('pQ'), chk=$('pCheck');
      Q.oninput=()=>{ chk.hidden = Q.value.trim().length<12 };
      chk.onclick=()=>suggest('pAi',chk,'neutral',Q.value,{apply:o=>{Q.value=o}});
      $('pAdd').onclick=async ()=>{
        const q=Q.value.trim();
        const opts=[$('pA'),$('pB'),$('pC'),$('pD')].map(el=>el.value.trim()).filter(Boolean);
        if(!q||opts.length<2) return toast('Add a question and at least two options');
        if(!await needAuth()) return;
        mutate({
          local:db=>db.polls.unshift({id:uid(),question:q,total:0,voted:null,
            poll_options:opts.map((t,i)=>({id:uid(),text:t,v:0,ord:i}))}),
          remote:async()=>{
            const ins=await sb.from('polls').insert({author:ME.id,question:q}).select().single();
            if(ins.error) return ins.error;
            return (await sb.from('poll_options').insert(opts.map((t,i)=>({poll_id:ins.data.id,text:t,ord:i})))).error;
          }, clears:['polls'] });
      };
    }
    document.querySelectorAll('[data-poll]').forEach(el=>{
      const p=list.find(x=>x.id===el.dataset.poll); if(!p) return;
      el.addEventListener('click', async e=>{
        const o=e.target.closest('[data-opt]'), b=e.target.closest('[data-act]');
        if(b && b.dataset.act==='share') return share(p.question, p.profiles && p.profiles.handle);
        if(b && b.dataset.act==='del') return mutate({ local:db=>db.polls=db.polls.filter(x=>x.id!==p.id),
          remote:async()=>(await sb.from('polls').delete().eq('id',p.id)).error, clears:['polls'] });
        if(o && !p.voted){
          if(!await needAuth()) return;
          const oid=o.dataset.opt;
          mutate({ local:db=>{ const q=db.polls.find(x=>x.id===p.id);
              q.poll_options.find(x=>x.id===oid).v++; q.total=(q.total||0)+1; q.voted=oid },
            remote:async()=>(await sb.from('poll_votes').insert({poll_id:p.id,option_id:oid,user_id:ME.id})).error,
            clears:['polls'] });
        }
      });
    });
  }
};

  init(){
    if(RO || GUEST()) return;
    let t;

      if(!ONLINE){ const db=localDB(); Object.assign(db.profile,patch); localSave(db); Object.assign(V,patch) }

        .then(({error})=>{ error?toast(friendly(error)):Object.assign(V,patch) });

    $('fGoal').oninput = e=>put({goal:Number(e.target.value)||0});
    $('fLink').oninput = e=>put({donate_link:e.target.value.trim()});

        remote:async()=>(await sb.from('gifts').insert({author:ME.id,amount})).error });

S.reach = {
  sub(){ return RO ? `@${V.handle} in numbers` : 'What is actually working' },
  view(){
    if(GUEST()) return `<div class="screen">${joinBar('Sign in to see how far your posts travel.')}</div>`;
    const likes = D.posts.reduce((s,p)=>s+(p.likes||0),0),
          votes = D.polls.reduce((s,p)=>s+(p.total||0),0),
          going = D.events.reduce((s,e)=>s+(e.going||0),0),
          top   = [...D.posts].sort((a,b)=>(b.likes||0)-(a.likes||0))[0],
          poll  = [...D.polls].sort((a,b)=>(b.total||0)-(a.total||0))[0];

    /* real activity: your posts per day over the last fortnight */
    const days = [...Array(14)].map((_,i)=>{
      const d = new Date(); d.setDate(d.getDate()-(13-i));
      const iso = d.toISOString().slice(0,10);
      return {iso, n: D.posts.filter(p=>(p.created_at||'').slice(0,10)===iso).length,
              label: d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
    });
    const peak = Math.max(1, ...days.map(d=>d.n));
    const nothing = !D.posts.length && !D.polls.length && !D.events.length;

    return `<div class="split"><div class="main">
      <div class="stats">
        <button data-stat="shares"><b>${D.shares}</b><span>Shares</span></button>
        <button data-stat="followers"><b>${D.followers}</b><span>Followers</span></button>
        <button data-stat="likes"><b>${likes}</b><span>Likes</span></button>
        <button data-stat="votes"><b>${votes}</b><span>Votes cast</span></button>
      </div>
      <div class="card">
        <h5>Your posting, last 14 days</h5>
        <div class="spark">${days.map(d=>`<i class="${d.n?'on':''}" style="height:${d.n/peak*100}%" title="${d.label}: ${d.n}"></i>`).join('')}</div>
        <div class="legend"><span>${days[0].label}</span><span>${D.posts.filter(p=>(p.created_at||'')>=days[0].iso).length} posts</span><span>${days[13].label}</span></div>
      </div>
      ${nothing?`<div class="empty"><b>Nothing to measure yet</b>Post something, then come back.</div>`:`
        ${top&&top.likes?`<div class="item"><div class="grow"><small>Most liked post</small><p>${esc(top.text)}</p>
          <div class="rowacts"><span class="iconbtn" style="pointer-events:none">${top.likes} likes</span></div></div></div>`:''}
        ${poll&&poll.total?`<div class="item"><div class="grow"><small>Most answered question</small><p>${esc(poll.question)}</p>
          <div class="rowacts"><span class="iconbtn" style="pointer-events:none">${poll.total} votes</span></div></div></div>`:''}`}
    </div>
    <aside class="side">
      <div class="card"><h5>What you have built</h5>
        <div class="row"><span>Posts</span><b>${D.posts.length}</b></div>
        <div class="row"><span>Positions</span><b>${D.issues.length}</b></div>
        <div class="row"><span>Questions asked</span><b>${D.polls.length}</b></div>
        <div class="row"><span>Events</span><b>${D.events.length}</b></div>
        <div class="row"><span>RSVPs received</span><b>${going}</b></div>
      </div>
      ${!RO?`<div class="card"><h5>Reach further</h5>
        <button class="mini-btn" id="rShare" style="text-align:left">Share your page</button>
        <button class="mini-btn" data-go="polls" style="text-align:left">Ask a question</button>
        <button class="mini-btn" data-go="issues" style="text-align:left">Take a position</button>
        <span class="ainote">Shares are counted whether or not the person signs up.</span>
      </div>`:''}
    </aside></div>`;
  },
  init(){
    const r=$('rShare');
    if(r) r.onclick=()=>share(V.name?`${V.name} on democrat.ai`:'democrat.ai');
    wireStats();
  }
};

/* wire the action buttons inside any list */
function rows(list, fn){
  document.querySelectorAll('[data-id]').forEach(el=>{
    const item = (list||[]).find(x=>String(x.id)===el.dataset.id); if(!item) return;
    el.addEventListener('click', e=>{ const b=e.target.closest('[data-act]'); if(b) fn(item,b.dataset.act,b) });

}

/* the feed badge counts what you have not seen, not what you have written */
const feedSeenKey = ()=> 'dai.feedseen.' + (ME ? ME.id : 'guest');
function feedUnseen(){
  if(!ONLINE) return 0;
  let seen = ''; try{ seen = localStorage.getItem(feedSeenKey()) || '' }catch(e){}
  if(!seen) return 0;
  return (G.posts || []).filter(p => (!ME || p.author !== ME.id) && p.created_at > seen).length;
}
function markFeedSeen(){
  try{ localStorage.setItem(feedSeenKey(), new Date().toISOString()) }catch(e){}
}

  if(current) SCROLLS[current] = phone() ? (window.scrollY || 0)
                                         : (oldBody ? oldBody.scrollTop : 0);

                                                     : (oldBody ? oldBody.scrollTop : 0));

  if(id==='compose' || id==='townhall') panel.querySelector('.pbody').classList.add('chatbody');
  if(s.init) s.init();
  const body = panel.querySelector('.pbody');
  if(phone()){ if(keep) requestAnimationFrame(()=>window.scrollTo(0, keep));
               else if(first) window.scrollTo(0, 0); }
  else if(body && keep) body.scrollTop = keep;
  document.body.classList.add('open');
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>open_(b.dataset.go));
  $('pclose').onclick = ()=>{ document.body.classList.remove('open'); current='';
    document.querySelectorAll('.app').forEach(x=>x.classList.remove('on')) };

  if(!ONLINE || !sb.channel) return;

    .on('postgres_changes', {event:'*', schema:'public'}, payload => {

        loadRoom().then(()=>{ if(current === 'townhall') paintRoom(); paintTicker() });

    .replace(/(^|[\s(\[])((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]])/gi, (m,a,url)=>{
      const href = /^www\./i.test(url) ? 'https://' + url : url;

      return `${a}<a class="wlink" href="${href}" target="_blank" rel="noopener noreferrer nofollow">${

/* resize on the way out: nobody needs a 12 megapixel photo in a feed */
function shrink(file, max, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => cb(b, c.toDataURL('image/jpeg', .86)), 'image/jpeg', .86);
    };
    img.onerror = ()=>toast('That image could not be read');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

  if(up.error){ toast(/bucket/i.test(up.error.message) ? 'Run the latest update.sql to turn on photos'
                                                      : up.error.message); return null }
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}

/* ============================================================ notifications
   Built from rows that already exist — no notification table to keep in sync.
   What you have already looked at is remembered in this browser. */
let NOTES = [], NOTEUNSEEN = 0;
const seenKey  = ()=> 'dai.seen.' + (ME ? ME.id : 'guest');
const lastSeen = ()=>{ try{ return localStorage.getItem(seenKey()) || '' }catch(e){ return '' } };
const trim60   = t => { t = String(t||'').replace(/\s+/g,' ').trim();
                        return t.length > 64 ? t.slice(0,64) + '…' : t };

async function loadNotes(){
  if(!ONLINE || !ME){ NOTES = []; NOTEUNSEEN = 0; return paintBell() }
  const ok = r => (r && !r.error && r.data) ? r.data : [];
  const out = [];
  try{
    const [posts, events, polls] = await Promise.all([
      sb.from('posts').select('id,text').eq('author',ME.id).then(ok, ()=>[]),
      sb.from('events').select('id,title').eq('author',ME.id).then(ok, ()=>[]),
      sb.from('polls').select('id,question').eq('author',ME.id).then(ok, ()=>[])
    ]);
    const pid = posts.map(x=>x.id), eid = events.map(x=>x.id), qid = polls.map(x=>x.id);
    const [likes, cmts, folls, rsv, votes] = await Promise.all([
      pid.length ? sb.from('likes').select('*').in('post_id',pid).neq('user_id',ME.id).then(ok,()=>[]) : [],
      pid.length ? sb.from('comments').select('*').in('post_id',pid).neq('author',ME.id).then(ok,()=>[]) : [],
      sb.from('follows').select('*').eq('followee',ME.id).then(ok,()=>[]),
      eid.length ? sb.from('rsvps').select('*').in('event_id',eid).neq('user_id',ME.id).then(ok,()=>[]) : [],
      qid.length ? sb.from('poll_votes').select('*').in('poll_id',qid).neq('user_id',ME.id).then(ok,()=>[]) : []
    ]);
    const ids = new Set();
    likes.forEach(r=>ids.add(r.user_id));  cmts.forEach(r=>ids.add(r.author));
    folls.forEach(r=>ids.add(r.follower)); rsv.forEach(r=>ids.add(r.user_id));
    votes.forEach(r=>ids.add(r.user_id));
    const who = new Map();
    if(ids.size){
      const pr = await sb.from('profiles').select('id,handle,name,photo_url').in('id',[...ids]).then(ok,()=>[]);
      pr.forEach(x=>who.set(x.id, x));
    }
    const find = (arr,id,key)=>{ const r = arr.find(x=>x.id===id); return r ? r[key] : '' };
    likes.forEach(r=>out.push({when:r.created_at, who:who.get(r.user_id), verb:'liked your post',
      what:trim60(find(posts,r.post_id,'text')), go:()=>openPost(r.post_id)}));
    cmts.forEach(r=>out.push({when:r.created_at, who:who.get(r.author), verb:'replied to your post',
      what:trim60(r.text), go:()=>openPost(r.post_id)}));
    folls.forEach(r=>out.push({when:r.created_at, who:who.get(r.follower), verb:'followed you',
      what:'', go:()=>{ const p = who.get(r.follower); if(p && p.handle) location.href = '/'+p.handle }}));
    rsv.forEach(r=>out.push({when:r.created_at, who:who.get(r.user_id), verb:'is going to',
      what:trim60(find(events,r.event_id,'title')), go:()=>open_('townhall')}));
    votes.forEach(r=>out.push({when:r.created_at, who:who.get(r.user_id), verb:'voted in',
      what:trim60(find(polls,r.poll_id,'question')), go:()=>open_('polls')}));
  }catch(e){ console.error('notes', e) }

  DMS.filter(m => m.recipient === ME.id).slice(0,25).forEach(m=>out.push({
    when:m.created_at, who:m.sender_p, verb:'sent you a message', what:trim60(m.text),
    unread:!m.read_at, go:()=>m.sender_p && dmSheet(m.sender_p)}));

  out.sort((a,b)=> new Date(b.when||0) - new Date(a.when||0));
  NOTES = out.filter(n=>n.who).slice(0,40);
  const seen = lastSeen();
  NOTEUNSEEN = NOTES.filter(n => n.unread || (n.when && (!seen || n.when > seen))).length;
  paintBell();
}

  const hit = t => !q || String(t||'').toLowerCase().includes(q);
  const items = [];

  APPS.forEach(a=>{ if(hit(a.name)) items.push({grp:'Screens', art:icon(a), title:a.name,
    sub:(typeof S[a.id].sub === 'function' ? '' : S[a.id].sub) || 'Open', kind:'',
    run:()=>palRun(()=>open_(a.id))}); });

  const acts = [
    ['Write a post', 'Go to the feed and start typing', ()=>{ open_('feed');
      setTimeout(()=>{ const t = $('qText'); if(t){ t.focus(); t.scrollIntoView({block:'center'}) } }, 60) }],
    ...(V ? [['Invite someone', 'Share the invitation', ()=>inviteSheet()],
             ['Share my page', 'Hand out your link', ()=>share(shareLine(), V && V.handle)]] : []),
    ['Notifications', 'What people did on your page', ()=>notesSheet()],
    [themeNow()==='dark' ? 'Switch to light' : 'Switch to dark', 'Change the theme', ()=>toggleTheme()],
    ['Keyboard shortcuts', 'Every key that does something', ()=>keysSheet()]
  ];
  acts.forEach(([t,sub,fn])=>{ if(hit(t)) items.push({grp:'Do', art:PALICO.bolt, title:t, sub, kind:'',
    run:()=>palRun(fn)}); });

  (G.people||[]).forEach(p=>{
    if(!hit(p.name) && !hit(p.handle) && !hit(p.role) && !hit(p.location)) return;
    items.push({grp:'People', avatar:p, title:p.name || '@'+p.handle,
      sub:[p.role, p.location].filter(Boolean).join(' · ') || '@'+p.handle, kind:'',
      run:()=>palRun(()=>{ location.href = '/' + p.handle })});
  });

  if(q){
    const seen = new Set();
    (G.posts||[]).concat(D.posts||[]).forEach(p=>{
      if(seen.has(p.id) || !hit(p.text)) return; seen.add(p.id);
      items.push({grp:'Posts', art:PALICO.post, title:trim60(p.text),
        sub:'@' + ((p.profiles && p.profiles.handle) || (V && V.handle) || '') + ' · ' + ago(p.created_at),
        kind:'', run:()=>palRun(()=>openPost(p.id))});
    });
    const it = new Set();
    (G.issues||[]).forEach(i=>{
      const key = i.title.toLowerCase();
      if(it.has(key) || !hit(i.title)) return; it.add(key);
      const a = agree(i.title);
      items.push({grp:'Positions', art:PALICO.issue, title:i.title,
        sub:`${a.s} support · ${a.o} oppose`, kind:'', run:()=>palRun(()=>open_('issues'))});
    });
    (G.events||[]).forEach(e=>{
      if(!hit(e.title) && !hit(e.place)) return;
      items.push({grp:'Events', art:PALICO.event, title:e.title,
        sub:dfmt(e.date) + (e.place ? ' · ' + e.place : ''), kind:'',
        run:()=>palRun(()=>open_('townhall'))});
    });
    if(/^[a-z0-9_]{2,30}$/i.test(q))
      items.unshift({grp:'Do', art:PALICO.bolt, title:'#' + q.toLowerCase(),
        sub:'See every post on this topic', kind:'', run:()=>palRun(()=>openTag(q.toLowerCase()))});
  }
  return items.slice(0, 60);
}
function palFill(){
  const out = $('palOut'); if(!out) return;
  const q = ($('palIn').value || '').trim().toLowerCase();
  PAL.items = palSources(q);
  if(PAL.i >= PAL.items.length) PAL.i = 0;
  if(!PAL.items.length){ out.innerHTML = `<div class="palempty">Nothing matches “${esc(q)}”.</div>`; return }
  let html = '', grp = '';
  PAL.items.forEach((it,i)=>{
    if(it.grp !== grp){ grp = it.grp; html += `<div class="palgrp">${esc(grp)}</div>` }
    const art = it.avatar
      ? `<span class="whoav">${it.avatar.photo_url?`<img src="${it.avatar.photo_url}" alt="">`
                                                 :esc(initials(it.avatar))}</span>`
      : `<span class="palico">${it.art||''}</span>`;
    html += `<button class="palrow${i===PAL.i?' on':''}" data-i="${i}">${art}
      <span class="grow"><b>${esc(it.title)}</b>${it.sub?`<small>${esc(it.sub)}</small>`:''}</span></button>`;
  });
  out.innerHTML = html;
  out.querySelectorAll('[data-i]').forEach(b=>b.onclick = ()=>{
    const it = PAL.items[+b.dataset.i]; if(it) it.run();
  });
  const on = out.querySelector('.palrow.on');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}
function palMove(d){
  if(!PAL.items.length) return;
  PAL.i = (PAL.i + d + PAL.items.length) % PAL.items.length;
  const out = $('palOut');
  out.querySelectorAll('.palrow').forEach((b,i)=>b.classList.toggle('on', i===PAL.i));
  const on = out.querySelector('.palrow.on');
  if(on && on.scrollIntoView) on.scrollIntoView({block:'nearest'});
}
function palClose(){ if(PAL.el){ PAL.el.remove(); PAL.el = null; PAL.i = 0 } }
function palOpen(seed){
  if(PAL.el){ $('palIn').focus(); return }
  const wrap = document.createElement('div');
  wrap.className = 'pal';
  wrap.innerHTML = `<div class="palbox">
    <input class="palin" id="palIn" placeholder="Search people, posts, positions, events…"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="palout" id="palOut"></div>
    <div class="palfoot"><span>&#8593;&#8595; move</span><span>&#8629; open</span>
      <span>esc close</span><span>? shortcuts</span></div>
  </div>`;
  document.body.appendChild(wrap);
  PAL.el = wrap; PAL.i = 0;
  wrap.onclick = e=>{ if(e.target===wrap) palClose() };
  const inp = $('palIn');
  if(seed) inp.value = seed;
  inp.oninput = ()=>{ PAL.i = 0; palFill() };
  inp.onkeydown = e=>{
    if(e.key === 'ArrowDown'){ e.preventDefault(); palMove(1) }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); palMove(-1) }
    else if(e.key === 'Enter'){ e.preventDefault(); const it = PAL.items[PAL.i]; if(it) it.run() }
    else if(e.key === 'Escape'){ e.preventDefault(); palClose() }
  };
  palFill();
  inp.focus();
  /* whatever we have not fetched yet, fetch now and repaint when it lands */
  const jobs = [loadPeople().catch(()=>{})];
  if(ONLINE && !RO) ['posts','issues','events'].forEach(k=>jobs.push(loadGlobal(k).catch(()=>{})));
  Promise.all(jobs).then(()=>{ if(PAL.el) palFill() });
}

/* ============================================================ shortcut sheet */
function keysSheet(){
  const rows = [
    ['&#8984; K <i>or</i> /', 'Search everything'],
    ['1 &ndash; 9, 0', 'Jump to a screen'],
    ['N', 'Write a post'],
    ['M', 'Notifications'],
    ['D', 'Light or dark'],
    ['?', 'This list'],
    ['Esc', 'Close what is open']
  ];
